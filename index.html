/* -------------------------------------------------------------- SLUČKA --- */
let prevYaw=0, prevPitch=0, lastT=performance.now(), _runShown=false;
let _fAvg=16, _fPrev=performance.now(), _fN=0;
function loop(now){
  try{ krok(now); }
  catch(e){                       // radšej ukončiť kolo než zamrznúť na čiernej obrazovke
    console.error(e);
    if(game.screen==="play"){ try{ endRound("chyba"); }catch(e2){ game.screen="menu"; try{renderMenu();}catch(e3){} } }
  }
  requestAnimationFrame(loop);
}
function krok(now){
  const raw=(now-lastT)/1000; lastT=now;
  const dt=Math.min(0.05,raw);          // fyzika ostáva stabilná aj pri zaseknutí
  const dtCas=Math.min(0.30,raw);       // odpočet kola musí ísť reálnym časom
  game._dtCas=dtCas;
  game.dt=dt; game.t+=dt;
  // ak hra nestíha 60 snímok, radšej zníži rozlíšenie, než by sekala
  if(game.screen==="play"){
    _fAvg=_fAvg*0.94+(now-_fPrev)*0.06; _fPrev=now;
    if(++_fN>90){ _fN=0;
      if(_fAvg>21 && QUAL>0.62){ QUAL=Math.max(0.62,QUAL-0.16); resize(); }
      else if(_fAvg<12.5 && QUAL<1){ QUAL=Math.min(1,QUAL+0.12); resize(); }
    }
  }

  if(game.screen==="play"){
    // klávesnicové rozhliadanie
    const kSpeed=game.fov*0.85*dt;
    if(keys.ArrowLeft||keys.KeyA) game.yaw-=kSpeed;
    if(keys.ArrowRight||keys.KeyD) game.yaw+=kSpeed;
    if(keys.ArrowUp||keys.KeyW) game.pitch=clamp(game.pitch+kSpeed*0.7,-16,42);
    if(keys.ArrowDown||keys.KeyS) game.pitch=clamp(game.pitch-kSpeed*0.7,-16,42);
    if(keys.Equal||keys.NumpadAdd) game.fovT=clamp(game.fovT*0.97,FOV_MIN,FOV_MAX);
    if(keys.Minus||keys.NumpadSubtract) game.fovT=clamp(game.fovT*1.03,FOV_MIN,FOV_MAX);
    game.focusing = game.focusing || !!keys.KeyF;
    // na tablete nie je Shift — rovnaký účinok musí mať dotykové tlačidlo STÁŤ
    game.holding = !!(keys.ShiftLeft||keys.ShiftRight||game.steadyBtn);
    // nahromadený pohyb sa rozloží do viacerých snímok — inak je otáčanie trhané
    { const k=1-Math.exp(-55*dt), ax=game.panX*k, ay=game.panY*k;
      game.yaw += ax; game.pitch = clamp(game.pitch+ay,-16,42);
      game.panX -= ax; game.panY -= ay;
      if(Math.abs(game.panX)<1e-4) game.panX=0;
      if(Math.abs(game.panY)<1e-4) game.panY=0; }
    game.yaw=(game.yaw+360)%360;

    // zoom plynulo
    game.fov = lerp(game.fov, game.fovT, 1-Math.pow(0.000002,dt));

    // uhlová rýchlosť (na plašenie + rozmazanie pohybom)
    const dy=Math.abs(angDiff(game.yaw,prevYaw)), dp=Math.abs(game.pitch-prevPitch);
    const inst=Math.min(400,Math.hypot(dy,dp)/Math.max(dt,0.001));
    game.angSpeed=lerp(game.angSpeed,inst,0.25);
    prevYaw=game.yaw; prevPitch=game.pitch;

    // dych a trasenie
    if(game.holding && game.breath>0){ game.breath=Math.max(0,game.breath-dt*0.30); }
    else game.breath=Math.min(1,game.breath+dt*0.16);
    const steady = (game.holding&&game.breath>0)?0.18:1;
    const amp = 0.026*steady*(game.mod.shake===undefined?1:game.mod.shake);
    game.shakeDeg = amp;
    const f=focalPx();
    game.shakeX = (Math.sin(game.t*1.9)*0.6+Math.sin(game.t*4.3+1.2)*0.4)*amp*D2R*f;
    game.shakeY = (Math.sin(game.t*2.4+0.7)*0.6+Math.sin(game.t*5.1)*0.4)*amp*D2R*f*0.8;

    // autofocus
    if(game.focusing){
      // cieľ = najbližšie zviera v strede záberu, inak zem v strede
      let best=null,bd=1e9;
      const rad=Math.min(W,H)*(0.13+0.10*(1-game.fov/FOV_MAX))*(game.mod.afRange||1);   // pri veľkom priblížení hľadá širšie
      for(const a of game.animals){
        const p=project(a.ang,a.d,a.hgt); if(!p) continue;
        const hh=p.ppm*vys(a);
        // ostrí na telo aj na nohy — vzdialené zviera je len malý pásik
        const dd=Math.hypot(p.x-W/2, clamp(CYV, a.sp.hang?p.y:p.y-hh, a.sp.hang?p.y+hh:p.y)-CYV);
        if(dd<rad && dd<bd){ bd=dd; best=a; }
      }
      if(best) game.afHold=best;                                   // raz zachytené zviera sa drží
      else if(game.afHold && game.animals.indexOf(game.afHold)>=0 && game.afHold.alpha>0.3) best=game.afHold;
      let target;
      if(best) target=best.d;
      else {
        const ang=(game.pitch);
        target = ang<-0.15? clamp(CAM_H/Math.tan(-ang*D2R),3,400) : 400;
      }
      game.focusT=target;
      const rate = game.mod.afSpeed||2.6;
      const nf = game.focus + (game.focusT-game.focus)*(1-Math.pow(0.02,dt*rate));
      if(Math.abs(nf-game.focusT)<Math.abs(game.focus-game.focusT)) game.focus=nf;
      const rel=Math.abs(game.focus-game.focusT)/Math.max(1,game.focusT);
      const wasLock=game.afLock;
      game.afLock = rel<0.03?1:0;
      // po zaostrení sa zaostrí presne — inak je aj „zaostrený" obraz pri 300 mm mäkký
      if(game.afLock>0.7) game.focus=game.focusT;
      if(game.afLock>0.7 && wasLock<0.7) zaostreneSnd();
    } else { game.afLock=Math.max(0,game.afLock-dt*3); game.afHold=null; }

    updateAnimals(dt);
    updateThreat(dt);

    // čas dňa plynie počas expedície
    if(game.timed && game.roundLen>0){
      const post=1-clamp(game.timeLeft/game.roundLen,0,1);
      game.dayT = game.dayStartT + (1-game.dayStartT)*post;
    }
    // vietor sa pomaly otáča a občas sa preklopí
    game.windT-=dt;
    if(game.windT<=0){ game.windCiel=(game.wind+rnd(-120,120)+360)%360; game.windS=rnd(0.25,1); game.windT=rnd(25,55); }
    if(game.windCiel!==undefined){ const dw=angDiff(game.windCiel,game.wind); game.wind=(game.wind+clamp(dw,-14,14)*dt+360)%360; }
    if(game.flashCd>0) game.flashCd-=dt;
    if(game.presunCd>0) game.presunCd-=dt;
    // nočné videnie sa zapne samo, keď sa zotmie (a hráč ho má v batohu)
    if(game.mod.nv && !game.nvManual) game.nv = denny().svet<0.42;

    // vytrvalosť: pomaly klesá, zadržaný dych ju berie rýchlejšie
    {
      const drain = 100/(game.roundLen*1.18) * ((game.holding&&game.breath>0)?2.8:1);
      game.stam -= drain*dtCas;
      if(game.stam<14){ if(game.water>0) useItem("voda"); else if(game.food>0) useItem("jedlo"); }
      if(game.stam<=0){ game.stam=0;
        toast(TX("Došli ti sily — vraciaš sa do tábora.","You are exhausted — heading back to camp."),"","");
        endRound("stam"); }
    }
    if(game.timed && game.screen==="play"){
      game.timeLeft-=dtCas;
      if(game.timeLeft<=0){ game.timeLeft=0; endRound("cas"); }
    }
  }

  // vykreslenie
  if(game.screen==="play"){
    renderScene();
    // fotka sa odoberá z čistej scény — ešte pred rámom hľadáčika a údajmi
    if(game.pendingShot){ game.pendingShot=false; finishShot(); }
    const runOn=!!(game.threat&&game.threat.phase==="warn");
    if(runOn!==_runShown){ _runShown=runOn;
      document.getElementById("tRun").classList.toggle("on",runOn);
      document.getElementById("tStay").classList.toggle("on",runOn); }
    const vf=drawViewfinder();
    drawHUD(vf);
    if(game.flash>0){
      ctx.fillStyle="rgba(255,255,255,"+(game.flash*0.5)+")"; ctx.fillRect(0,0,W,H);
      game.flash=Math.max(0,game.flash-dt*5);
    }
  } else {
    ctx.fillStyle="#0b0d0c"; ctx.fillRect(0,0,W,H);
  }

  if(toastT>0){ toastT-=dt; if(toastT<=0) toastEl.style.opacity="0"; }
}

function defaultProfile(){
  return { char:"adam", money:600, xp:0,
           gear:{lens:0,body:0,card:0,hide:0,night:0,tripod:0,bino:0,pack:0},
           stock:{voda:1,jedlo:1,lekárnička:0,pach:0},
           pack:["voda"], spot:"plan", len:"str", zac:"svitanie", diff:"s", job:null, done:0 };
}
function overJob(j){
  return (j && SP[j.sp] && typeof j.n==="number" && typeof j.pay==="number") ? j : null;
}
// Doplní chýbajúce polia a zahodí nezmyselné — starý alebo poškodený uložený
// postup sa tak dá vždy načítať a hra sa nezasekne na „Pokračovať".
function opravProfil(p){
  const d=defaultProfile();
  if(typeof p!=="object"||!p) return d;
  p.char = charById(p.char).id;
  p.money = Number.isFinite(p.money)? p.money : d.money;
  p.xp    = Number.isFinite(p.xp)? p.xp : 0;
  p.done  = Number.isFinite(p.done)? p.done : 0;
  p.gear  = Object.assign({}, d.gear, p.gear||{});
  for(const k in d.gear){ const max=GEAR[k].lv.length-1;
    p.gear[k]=clamp(Math.round(p.gear[k]||0),0,max); }
  p.stock = Object.assign({}, d.stock, p.stock||{});
  p.pack  = Array.isArray(p.pack)? p.pack.filter(x=>itemById(x)) : d.pack.slice();
  if(!spotById(p.spot) || spotById(p.spot).id!==p.spot) p.spot=d.spot;
  if(["kr","str","dl"].indexOf(p.len)<0) p.len=d.len;
  if(["svitanie","podvecer"].indexOf(p.zac)<0) p.zac=d.zac;
  if(["l","s","t"].indexOf(p.diff)<0) p.diff=d.diff;
  p.job  = overJob(p.job);
  p.jobs = Array.isArray(p.jobs)? p.jobs.map(overJob).filter(Boolean) : null;
  if(p.jobs && !p.jobs.length) p.jobs=null;
  return p;
}
let _profilOK=false;   // len za behu — do uloženého súboru sa nesmie dostať
function P(){
  if(!mem.profile) mem.profile=defaultProfile();
  if(!_profilOK){ mem.profile=opravProfil(mem.profile); _profilOK=true; }
  return mem.profile;
}

function packUsed(){ return P().pack.reduce((a,id)=>a+(itemById(id)?itemById(id).slots:0),0); }
function has(id){ return P().pack.indexOf(id)>=0; }

const LENS_FOV=[6.9,5.2,4.15,3.45];
const CARD_N=[24,36,52,76];
const OBTIAZ={
  l:{nm:()=>TX("Objaviteľ","Explorer"),      dist:0.78, att:0.60, warn: 3, trest:0.25, odm:1.25, pred:1.5},
  s:{nm:()=>TX("Fotograf","Photographer"),   dist:1.00, att:1.00, warn: 0, trest:0.50, odm:1.60, pred:1.0},
  t:{nm:()=>TX("Dokumentarista","Documentarian"), dist:1.25, att:1.50, warn:-2, trest:1.00, odm:2.00, pred:0.7}
};
function bezp(pole,i,def){ const k=clamp(Math.round(i)||0,0,pole.length-1); const v=pole[k]; return (v===undefined||v===null)?def:v; }
function buildMods(){
  const p=P(), c=charById(p.char), m=Object.assign(
    {xpMul:1,firstMul:2,apMul:1,afRange:1,radar:false,spawnMul:1,attMul:1,warnBonus:0}, c.mod);
  const O=OBTIAZ[p.diff]||OBTIAZ.s;
  m.dist=O.dist; m.attMul*=O.att; m.warnBonus+=O.warn;
  m.trest=O.trest; m.odmena=O.odm; m.predCool=O.pred; m.obt=O;
  m.fovMin = bezp(LENS_FOV,p.gear.lens,6.9);
  m.spot = spotById(p.spot);
  m.afSpeed = bezp([2.6,4.2,6.0],p.gear.body,2.6);
  m.shots = Math.max(6, Math.round(bezp(CARD_N,p.gear.card,24) * (has("karta")?1.5:1) * ({kr:0.62,str:1,dl:1.42}[p.len]||1)));
  m.shake = has("statív") ? (p.gear.tripod>=2?0.20:0.32) : 1;
  if(has("stan")) m.attMul*=0.5;
  if(has("oblečenie")) m.attMul*=0.8;
  if(p.gear.hide>=1) m.attMul*=0.9;
  if(has("ďalekohľad")) m.radar=true;
  m.medkit = has("lekárnička");
  m.nv = has("videnie");
  m.pach = has("pach");
  m.water = has("voda"); m.food = has("jedlo");
  m.apMul = m.apMul * (p.gear.body>=2?0.8:1);
  return m;
}

// POZOR: zadanie sa ukladá do prehliadača cez JSON, preto v ňom NESMIE byť funkcia —
// text sa skladá až pri vykreslení podľa uloženého čísla druhu úlohy (kind).
function jobText(j){
  if(!j || !SP[j.sp]) return "";
  const s=SP[j.sp], nm = LANG==="sk"? s.sk : s.en;
  if(j.kind===1) return TX(`Televízia: ${j.n} kvalitné fotky — ${nm}`, `TV crew: ${j.n} quality photos — ${nm}`);
  if(j.kind===2) return TX(`National Geographic: jedna veľká fotka — ${nm}`, `National Geographic: one great photo — ${nm}`);
  return TX(`Časopis Príroda: ${j.n} ${j.n<5?"fotky":"fotiek"} — ${nm}`, `Nature magazine: ${j.n} photos — ${nm}`);
}
function genJobs(){
  const sp=spotById(P().spot);
  // zadávať len druhy, ktoré sa na mieste naozaj bežne ukážu
  let pool=SPECIES.filter(x=>(sp.weights[x.id]||0)>=0.55);
  if(pool.length<3) pool=SPECIES.filter(x=>(sp.weights[x.id]||0)>0);
  if(!pool.length) return [];
  const out=[];
  for(const k of [0,1,2]){
    const cand=pool.filter(x=>x.rar===(k===0?0:k===1?1:Math.min(3,2+(Math.random()<0.3?1:0))));
    const s=pick(cand.length?cand:pool);
    if(k===0){ const n=ri(3,5); out.push({kind:0, sp:s.id, n, min:0, pay:Math.round(s.base*n*3.2+180)}); }
    else if(k===1){ const n=2; out.push({kind:1, sp:s.id, n, min:Math.round(s.base*0.55), pay:Math.round(s.base*n*4.5+400)}); }
    else out.push({kind:2, sp:s.id, n:1, min:Math.round(s.base*0.8), pay:Math.round(s.base*7+900)});
  }
  return out;
}

function gearLine(k){
  const p=P(), g=GEAR[k], lv=p.gear[k], next=g.lv[lv+1];
  const r=rankOf(p.xp);
  let right;
  if(!next) right=`<span class="ok">${TX("naplno vylepšené","fully upgraded")}</span>`;
  else if(next.rank>r) right=`<span class="lock">${TX("od hodnosti","from rank")} ${RANKS[next.rank].nm()}</span>`;
  else if(p.money<next.cost) right=`<span class="lock">${eur(next.cost)}</span>`;
  else right=`<button class="btn sm gold" data-buy="${k}">${next.nm()} · ${eur(next.cost)}</button>`;
  return `<div class="line"><span class="ic">${g.icon}</span>
    <span class="nm">${g.nm()}</span>
    <span class="cur">${g.lv[lv].nm()}</span>
    <span class="rt">${right}</span></div>`;
}

// presun na iné miesto v tej istej lokalite — stojí čas aj sily, ale zmení zvieratá
function presun(){
  if(game.screen!=="play"||game.threat) return;
  if(game.presunCd>0){ toast(TX("Ešte si sa nerozkukal","Give it a moment first"),"",""); return; }

function useItem(kind){
  if(game.screen!=="play") return;
  if(kind==="voda" && game.water<=0 && game.food<=0){
    toast(TX("Nemáš už čo piť ani jesť","Nothing left to drink or eat"),"",
          TX("Vodu a jedlo si zbaľ do batoha pred odchodom z tábora.",
             "Pack water and food in your backpack before leaving camp.")); return;
  }
  if(kind==="voda" && game.water<=0 && game.food>0) kind="jedlo";
  if(kind==="jedlo" && game.food<=0 && game.water>0) kind="voda";
  if(kind==="voda" && game.water>0){
    game.water--; game.stam=Math.min(100,game.stam+45);
    zasobyNaTlacidle();
    ton({f:520,f2:840,d:0.18,t:"sine",v:0.09,fmt:1400,fmtQ:4,a:0.01,drz:0.3});
    ton({f:300,f2:520,d:0.14,t:"triangle",v:0.05,od:0.09});
    toast(TX("Napil si sa","You drank"),"+45 "+TX("vytrvalosti","stamina"),"");
  } else if(kind==="jedlo" && game.food>0){
    game.food--; game.stam=Math.min(100,game.stam+30);
    zasobyNaTlacidle();
    ton({f:420,f2:600,d:0.16,t:"triangle",v:0.08,fmt:1100,fmtQ:3,a:0.01,drz:0.35});
    toast(TX("Najedol si sa","You ate"),"+30 "+TX("vytrvalosti","stamina"),"");
  }
}
function endRound(reason){
  if(game.screen!=="play") return;
  game.screen="results";
  if(document.pointerLockElement) document.exitPointerLock();
  hintEl.classList.remove("on");
  document.getElementById("lang").classList.remove("hraje");
  document.getElementById("otoc").classList.remove("on");
  ["tRun","tStay"].forEach(id=>{const e=document.getElementById(id); if(e) e.classList.remove("on");});
  _runShown=false;

  const p=P(), m=game.mod||{};
  const base=Math.round(game.score*0.26*(m.odmena||1));
  let jobPay=0, jobFail=false, jobTxt="", jobHave=game.jobCount, jobNeed=0;
  if(p.job){
    jobNeed=p.job.n;
    if(game.jobCount>=p.job.n){ jobPay=p.job.pay; p.done=(p.done||0)+1; }
    else { jobFail=true; jobPay=Math.round(p.job.pay*(game.jobCount/p.job.n)*0.5); }
  }
  const xp=Math.round((game.score*0.25+jobPay*0.04)*(m.xpMul||1)*(0.7+0.3*(m.odmena||1)));
  const before=rankOf(p.xp);
  p.money+=base+jobPay; p.xp+=xp;
  const after=rankOf(p.xp);

  // spotrebný materiál sa minie a ak dôjde, vypadne z batoha
  const used=[];
  const spend=(id,spent)=>{
    if(!has(id)||!spent) return;
    p.stock[id]=Math.max(0,(p.stock[id]||0)-1); used.push(id);
    if((p.stock[id]||0)<=0) p.pack=p.pack.filter(x=>x!==id);
  };
  spend("voda", m.water && game.water<2);
  spend("jedlo", m.food && game.food<1);
  spend("lekárnička", m.medkit && !game.medkit);
  spend("pach", m.pach);

  game.rez={base,jobPay,jobFail,job:p.job?Object.assign({},p.job):null,jobHave,jobNeed,xp,used,
            rankUp: after>before? after : 0, reason};
  if(after>before){ beep(523,0.16,"sine",0.15); setTimeout(()=>beep(659,0.16,"sine",0.15),150);
    setTimeout(()=>beep(784,0.28,"sine",0.16),300); }
  p.job=null; p.jobs=null; p.reroll=0;
  save();
  renderResults();
}

/* ---- PRENOS POSTUPU MEDZI ZARIADENIAMI --------------------------------
   Postup (peniaze, vybavenie, album) žije v pamäti prehliadača, nie v súbore.
   Preto ho vieme zabaliť do krátkeho kódu a preniesť inam. Miniatúry fotiek
   sa do kódu nedávajú — sú to desiatky kB a kód by sa nedal prilepiť. */
function zbalPostup(){
  const alb={};
  for(const k in mem.album){ const a=mem.album[k]; if(a) alb[k]={pts:a.pts,t:a.t||0}; }
  const data={v:1, profile:mem.profile||null, album:alb, best:mem.best||0};
  const txt=JSON.stringify(data);
  // unescape(encodeURIComponent(...)) spraví z UTF-8 bajty, ktoré btoa zvládne
  return btoa(unescape(encodeURIComponent(txt))).replace(/=+$/,"");
}
function rozbalPostup(kod){
  const c=(kod||"").replace(/\s+/g,"");
  if(!c) throw new Error("prazdny");
  const txt=decodeURIComponent(escape(atob(c)));
  const d=JSON.parse(txt);
  if(!d || typeof d!=="object" || !d.profile) throw new Error("tvar");
  return d;
}
function pouziPostup(d){
  mem.profile=d.profile;
  mem.best=d.best||0;
  if(!mem.album || typeof mem.album!=="object") mem.album={};
  for(const k in (d.album||{})){
    const nov=d.album[k], stary=mem.album[k];
    // fotku, ktorú tu už máme, si necháme — kód ju neobsahuje
    if(!stary || (stary.pts||0) < (nov.pts||0)) mem.album[k]={pts:nov.pts, img:(stary&&stary.img)||null, t:nov.t||0};
  }
  _profilOK=false;
  save();
}

     ${odkaz?`<p style="color:#a8bfa0;margin-top:8px">${TX("Odkaz si pošli do druhého zariadenia (správou, mailom) a otvor ho — postup sa načíta sám.",

   </div>`:`
   <div class="card"><p>${TX("V tomto prehliadači zatiaľ žiadny postup nie je.","There is no saved progress in this browser yet.")}</p></div>`}
   <div class="card"><h2>2. ${TX("Sem vlož z iného zariadenia","Paste one from another device")}</h2>
     <textarea id="pVstup" placeholder="${TX("Sem prilep kód…","Paste the code here…")}" style="width:100%;height:88px;

       font-family:monospace;font-size:11px"></textarea>
     <div class="row" style="margin-top:8px">
       <button class="btn gold" id="bNacitaj">${TX("Načítať postup","Load progress")}</button>
     </div>
     <p id="pStav" style="margin-top:8px"></p>
   </div>
   <div class="row"><button class="btn" id="bBackPren">${t("back")}</button></div>`;
  show(sPren);
  const stav=(txt,ok)=>{ const e=document.getElementById("pStav");
    if(e){ e.textContent=txt; e.style.color=ok?"#9fd48a":"#e2a06a"; } };
  const kopiruj=(txt,btn)=>{
    const hot=()=>{ const b=document.getElementById(btn); if(b) b.textContent=TX("Skopírované ✓","Copied ✓"); };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(hot,()=>{});
    } else { const ta=document.getElementById("pKod");
      if(ta){ ta.value=txt; ta.select(); try{document.execCommand("copy");hot();}catch(e){} ta.value=kod; } }
  };
  on("bKopKod",()=>kopiruj(kod,"bKopKod"));
  on("bKopOdk",()=>kopiruj(odkaz,"bKopOdk"));
  on("bNacitaj",()=>{
    const v=(document.getElementById("pVstup")||{}).value||"";
    let d; try{ d=rozbalPostup(v); }
    catch(e){ stav(TX("Kód sa nepodarilo prečítať — skopíruj ho prosím celý.",

    pouziPostup(d);
    stav(TX("Hotovo — postup je načítaný.","Done — progress loaded."),true);
    setTimeout(()=>{ try{ renderCamp(); }catch(e){ renderMenu(); } },700);
  });
  on("bBackPren",renderMenu);
}
// postup poslaný odkazom: .../#k=<kod>
function skusOdkaz(){
  const h=location.hash||"";
  if(h.indexOf("#k=")!==0) return false;
  let d; try{ d=rozbalPostup(decodeURIComponent(h.slice(3))); }catch(e){ return false; }
  const md=mem.profile? (mem.profile.money||0) : 0;
  const nd=d.profile.money||0;
  if(mem.profile && !confirm(TX("Odkaz nesie uložený postup ("+eur(nd)+"). V tomto prehliadači už postup je ("+eur(md)+"). Nahradiť ho?",
                                "This link carries saved progress ("+eur(nd)+"). This browser already has progress ("+eur(md)+"). Replace it?"))){
    history.replaceState(null,"",location.pathname); return false; }
  pouziPostup(d);
  history.replaceState(null,"",location.pathname);
  return true;
}

  show(sMenu);

function renderPack(){
  const p=P(), used=packUsed(), cap=packSlots();
  let h=`<h1>${TX("BATOH","BACKPACK")}</h1>${hdr()}
   <div class="card"><h2>${TX("Miesto","Space")}: ${used} / ${cap} ${TX("slotov","slots")}</h2>
   <p class="fact">${TX("Fotoaparát a objektív nesie vždy. Do batoha sa zmestí len časť — vyber podľa toho, kam ideš.",
                       "The camera and lens always come along. Only some things fit in the pack — choose for the trip ahead.")}</p></div>
   <div class="card">`;
  for(const i of ITEMS){
    const owned = i.buy ? (p.stock[i.id]||0)>0 : (i.need? i.need(p) : true);
    const inPack = has(i.id);
    const fits = used - (inPack?i.slots:0) + i.slots <= cap;
    let btn;
    if(!owned) btn=`<span class="lock">${i.buy?TX("kúp v obchode","buy in shop"):TX("treba vybavenie","needs equipment")}</span>`;
    else if(inPack) btn=`<button class="btn sm" data-tog="${i.id}">${TX("Vybrať","Remove")}</button>`;
    else if(!fits) btn=`<span class="lock">${TX("nezmestí sa","doesn't fit")}</span>`;
    else btn=`<button class="btn sm gold" data-tog="${i.id}">${TX("Zbaliť","Pack")}</button>`;
    h+=`<div class="line${inPack?" act":""}"><span class="ic">${i.icon}</span>
      <span class="nm">${i.nm()} <small style="color:#7f9a78">(${i.slots} ${i.slots===1?TX("slot","slot"):TX("sloty","slots")})</small><br>
      <small style="color:#93ab8b">${i.desc()}</small></span>
      <span class="cur">${i.buy?TX("zásoba","stock")+": "+(p.stock[i.id]||0):""}</span>
      <span class="rt">${btn}</span></div>`;
  }
  h+=`</div><div class="row"><button class="btn" id="bBackPack">${TX("Späť do tábora","Back to camp")}</button></div>`;
  sPack.innerHTML=h; show(sPack);
  sPack.querySelectorAll("[data-tog]").forEach(e=>e.onclick=()=>{
    const id=e.dataset.tog, k=p.pack.indexOf(id);

}

    : [["✈️",TX("Let do Nairobi","Flight to Nairobi")],["🚙",TX("Džíp cez savanu","Jeep across the savanna")],["🥾",TX("Pešo k úkrytu","On foot to the hide")]];
  sTrav.innerHTML=`<h1>${TX("NA CESTE","ON THE WAY")}</h1><div class="sub">${sp.nm()}</div>
    <div class="card"><div id="trav"></div>
    <div class="tprog"><i id="tp"></i></div></div>`;
  show(sTrav);
  const box=document.getElementById("trav"), bar=document.getElementById("tp");
  let i=0;
  const step=()=>{
    if(i<legs.length){
      const d=document.createElement("div"); d.className="leg";
      d.innerHTML=`<span class="lIc">${legs[i][0]}</span><span>${legs[i][1]}</span>`;
      box.appendChild(d);
      bar.style.width=Math.round((i+1)/legs.length*100)+"%";
      beep(520+i*90,0.1,"sine",0.09);
      i++; setTimeout(step,620);
    } else setTimeout(startExpedition,520);
  };
  step();
}

/* ---- ALBUM ------------------------------------------------------------ */
// "3. 8. 2026 o 18:42" / "3 Aug 2026, 18:42"
function datumCas(ms){
  if(!ms) return "";
  const d=new Date(ms);
  if(isNaN(d.getTime())) return "";
  const dv=n=>(n<10?"0":"")+n;
  const cas=dv(d.getHours())+":"+dv(d.getMinutes());
  if(LANG==="sk") return d.getDate()+". "+(d.getMonth()+1)+". "+d.getFullYear()+" o "+cas;
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate()+" "+M[d.getMonth()]+" "+d.getFullYear()+", "+cas;
}
function renderAlbum(){
  const total=SPECIES.length, found=SPECIES.filter(s=>mem.album[s.id]).length;
  let html=`<h1>${t("albumT")}</h1><div class="sub">${found} ${t("albumS")} ${total} ${t("found")}</div>`;
  for(const c of COUNTRIES){
    const zoz=SPECIES.filter(x=>x.land===c.id);
    if(!zoz.length) continue;
    const m=zoz.filter(x=>mem.album[x.id]).length;
    html+=`<div class="card"><h2>${c.nm()} <small style="color:#7f9a78">· ${m}/${zoz.length}</small></h2><div class="grid">`;
    for(const s of zoz){
      const a=mem.album[s.id];
      const nm = LANG==="sk"? s.sk:s.en, other = LANG==="sk"? s.en:s.sk;
      if(a){
        const dt=datumCas(a.t);
        const obr = a.img? `<img src="${a.img}">`
                         : `<div class="sil" style="opacity:.5">${s.icon}</div>`;
        html+=`<div class="ph">${obr}<div class="nm">${nm}</div><div class="en">${other}</div>
          <div class="pt">${a.pts} ${t("pts")}</div>
          ${dt?`<div class="dt">${dt}</div>`:""}
          <div class="fb">${t("rare")[s.rar]}</div></div>`;
      }
      else   html+=`<div class="ph locked"><div class="sil">${s.icon}</div><div class="nm">? ? ?</div><div class="en">${t("rare")[s.rar]}</div></div>`;
    }
    html+=`</div></div>`;
  }
  for(const s of SPECIES){
    if(!mem.album[s.id]) continue;
    const f = LANG==="sk"? s.fsk:s.fen;
    html+=`<div class="card"><h2>${LANG==="sk"?s.sk:s.en} · <i>${LANG==="sk"?s.en:s.sk}</i></h2>
      <p class="fact"><b>${t("lat")}:</b> <i>${s.lat}</i><br>
      <b>${t("live")}:</b> ${f.live}<br><b>${t("eat")}:</b> ${f.eat}<br>
      <b>${t("intr")}:</b> ${f.intr}<br><b>${t("stat")}:</b> ${f.stat}<br>
      <b>${t("bestp")}:</b> ${mem.album[s.id].pts} ${t("pts")}${
        datumCas(mem.album[s.id].t)? " · "+TX("odfotené","taken")+" "+datumCas(mem.album[s.id].t) : ""
      }</p></div>`;
  }
  html+=`<div class="row"><button class="btn" id="bBackAlb">${t("back")}</button></div>`;
  sAlbum.innerHTML=html; show(sAlbum);
  on("bBackAlb",()=>{ if(mem.profile) renderCamp(); else renderMenu(); });
}

/* ---- VÝSLEDKY --------------------------------------------------------- */
function renderResults(){
  const p=P(), rez=game.rez||{};
  const ph=[...game.photos].sort((a,b)=>b.pts-a.pts);
  let html=`<h1>${t("resT")}</h1><div class="tot">${game.score} ${t("pts")}</div>
    <div class="sub" style="margin-top:8px">${spotById(p.spot).nm()}</div>
    <div class="card"><h2>${TX("Vyúčtovanie","Payout")}</h2>
      <div class="line"><span class="nm">${TX("Za fotky","For photos")}</span><span class="rt gold2">${eur(rez.base||0)}</span></div>
      ${rez.jobPay?`<div class="line"><span class="nm">${TX("Splnené zadanie","Assignment complete")} — ${jobText(rez.job)}</span><span class="rt gold2">${eur(rez.jobPay)}</span></div>`:""}
      ${rez.jobFail?`<div class="line"><span class="nm">${TX("Zadanie čiastočne","Assignment partly done")} — ${jobText(rez.job)} (${rez.jobHave}/${rez.jobNeed})</span><span class="rt lock">—</span></div>`:""}
      <div class="line"><span class="nm"><b>${TX("Spolu","Total")}</b></span><span class="rt gold2"><b>${eur((rez.base||0)+(rez.jobPay||0))}</b></span></div>
      <div class="line"><span class="nm">${TX("Skúsenosti","Experience")}</span><span class="rt">+${rez.xp||0} XP</span></div>
      ${rez.rankUp?`<div class="line"><span class="nm"><b style="color:#ffd97a">${TX("POVÝŠENIE","PROMOTION")}: ${RANKS[rez.rankUp].nm()}</b></span><span class="rt"></span></div>`:""}
      ${rez.used&&rez.used.length?`<div class="line"><span class="nm">${TX("Spotrebované","Used up")}: ${rez.used.map(i=>itemById(i)?itemById(i).nm():i).join(", ")}</span><span class="rt"></span></div>`:""}
    </div>`;
  if(!ph.length) html+=`<div class="card"><p>${t("noPhoto")}</p></div>`;
  else{
    html+=`<div class="card"><h2>${t("best")}</h2><div class="grid">`;
    for(const q of ph.slice(0,12)){
      const s=SP[q.id], nm=LANG==="sk"?s.sk:s.en;
      html+=`<div class="ph"><img src="${q.img}"><div class="nm">${nm}</div><div class="pt">${q.pts} ${t("pts")}</div><div class="fb">${
        (q.kval>1.55?"★★★":q.kval>0.95?"★★☆":q.kval>0.55?"★☆☆":"☆☆☆")+" · "+q.fb}</div></div>`;
    }
    html+=`</div></div>`;
  }
  html+=`<div class="row"><button class="btn gold" id="bCamp">${TX("SPÄŤ DO TÁBORA","BACK TO CAMP")}</button>
        <button class="btn" id="bAlb2">${t("album")}</button></div>`;
  sRes.innerHTML=html; show(sRes);
  on("bCamp",renderCamp); on("bAlb2",renderAlbum);
}

{ const ok=document.getElementById("bOtocOk");

  e.textContent = n>0? "💧"+n : "💧";

function setLang(l){
  LANG=l;
  document.getElementById("bSK").classList.toggle("act",l==="sk");
  document.getElementById("bEN").classList.toggle("act",l==="en");
  document.documentElement.lang=l;
  const cur=ALLSCR.find(s=>s.classList.contains("on"));
  if(cur===sMenu) renderMenu(); else if(cur===sChar) renderChars();
  else if(cur===sCamp) renderCamp(); else if(cur===sShop) renderShop();
  else if(cur===sPack) renderPack(); else if(cur===sMap) renderMap();
  else if(cur===sAlbum) renderAlbum(); else if(cur===sRes) renderResults();
  hintEl.textContent=t("clickPlay"); popisTlacidiel(); skontrolujOtocenie();
}
