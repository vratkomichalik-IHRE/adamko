ka potrebuje aj 200 km²",eat:"Jelene, srny a diviaky — najčastejšie choré a slabé kusy",intr:"Vytie počuť aj na desať kilometrov a každý vlk zavýja v inej výške, takže svorka znie oveľa väčšia, než naozaj je. Od roku 2021 je u nás chránený po celý rok.",stat:"Málo dotknutý"},fen:{live:"Large forests of northern and eastern Slovakia; a pack needs up to 200 km²",eat:"Red deer, roe deer and wild boar — usually the sick and the weak",intr:"A howl carries ten kilometres, and every wolf howls at a different pitch so the pack sounds far bigger than it is. Since 2021 it has been protected in Slovakia all year round.",stat:"Least concern"}},{id:"rys",draw:"rys",land:"slovensko",h:.72,rar:3,base:470,minD:45,maxD:150,shy:1.8,group:[1,1],speed:1.2,pred:!0,sk:"Rys ostrovid",en:"Eurasian Lynx",lat:"Lynx lynx",icon:"🐈",fsk:{live:"Husté karpatské lesy so skalami — na Slovensku ich je asi tristo",eat:"Srny a jelenčatá, zajace, tetrovy — číha a skočí z niekoľkých metrov",intr:"Čierne štetiny na ušiach mu pomáhajú počuť — bez nich je nedoslýchavý. Jednu srnu jedáva aj týždeň a medzitým ju zahrabáva do lístia.",stat:"Málo dotknutý"},fen:{live:"Dense rocky Carpathian forest — around three hundred live in Slovakia",eat:"Roe deer and fawns, hares, grouse — it stalks and pounces from a few metres",intr:"The black tufts on its ears help it hear; without them it is half deaf. It feeds off one roe deer for a week, burying it in leaves in between.",stat:"Least concern"}},{id:"kamzik",draw:"kamzik",land:"slovensko",h:.82,rar:2,base:285,minD:40,maxD:160,shy:1.45,group:[3,8],speed:1.2,sk:"Kamzík vrchovský tatranský",en:"Tatra Chamois",lat:"Rupicapra rupicapra tatrica",icon:"🐐",fsk:{live:"Bralá a kosodrevina Vysokých a Belianskych Tatier — nikde inde na svete",eat:"Tráva, byliny, machy a lišajníky spomedzi skál",intr:"Žije len v Tatrách a je to náš jediný veľký endemit. Po kolmej stene beží rýchlejšie, ako človek ide po chodníku, a preskočí až šesť metrov. V roku 1999 ich ostalo len okolo dvesto, dnes ich je vyše tisíc štyristo.",stat:"Ohrozený"},fen:{live:"Crags and dwarf pine of the High and Belianske Tatras — nowhere else on Earth",eat:"Grass, herbs, mosses and lichens from among the rocks",intr:"It lives only in the Tatras and is Slovakia's only large endemic animal. It runs up a sheer wall faster than a person walks a path and leaps six metres. In 1999 barely two hundred were left; today there are over fourteen hundred.",stat:"Endangered"}},{id:"svist",draw:"svist",land:"slovensko",h:.54,rar:1,base:115,minD:14,maxD:60,shy:1.3,group:[1,3],speed:.9,sk:"Svišť vrchovský tatranský",en:"Tatra Marmot",lat:"Marmota marmota latirostris",icon:"🐹",fsk:{live:"Alpínske lúky Tatier nad hranicou lesa, v norách hlbokých aj sedem metrov",eat:"Tráva a horské byliny — na jeseň je dvakrát ťažší ako na jar",intr:"Zimu prespí sedem mesiacov pod snehom a srdce mu spomalí až na päť úderov za minútu. Keď zbadá orla, postaví sa na zadné a zapíska tak prenikavo, že to počuť cez celú dolinu.",stat:"Ohrozený"},fen:{live:"Alpine meadows above the treeline, in burrows up to seven metres deep",eat:"Grass and mountain herbs — by autumn it weighs twice what it did in spring",intr:"It sleeps seven months under the snow with its heart down to five beats a minute. When it spots an eagle it stands up on its hind legs and whistles so shrilly the whole valley hears it.",stat:"Endangered"}},{id:"orolskalny",draw:"orolskalny",land:"slovensko",h:2.2,rar:2,base:300,minD:35,maxD:150,shy:1.55,group:[1,2],speed:1.3,arb:[8,22],sk:"Orol skalný",en:"Golden Eagle",lat:"Aquila chrysaetos",icon:"🦅",fsk:{live:"Skalné steny Tatier a Nízkych Tatier — na Slovensku hniezdi okolo 80 párov",eat:"Svište, zajace, tetrovy, mladé srnčatá; v zime aj zdochliny",intr:"Rozpätie krídel má vyše dva metre a v termike krúži hodiny bez jediného mávnutia. Zrak má niekoľkokrát ostrejší než človek — svišťa zbadá z dvoch kilometrov.",stat:"Málo dotknutý"},fen:{live:"Cliff faces of the Tatras and Low Tatras — around 80 pairs nest in Slovakia",eat:"Marmots, hares, grouse, young roe deer; carrion in winter",intr:"Its wings span over two metres and it circles for hours on thermals without a single wingbeat. Its eyesight is several times sharper than ours — it spots a marmot two kilometres away.",stat:"Least concern"}},{id:"hlucan",draw:"hlucan",land:"slovensko",h:1.1,rar:3,base:520,minD:28,maxD:110,shy:1.7,group:[1,1],speed:.8,sk:"Hlucháň hôrny",en:"Western Capercaillie",lat:"Tetrao urogallus",icon:"🦃",fsk:{live:"Staré horské smrečiny s čučoriedčím podrastom — na Slovensku ich ostalo asi 700",eat:"V zime len smrekové a jedľové ihličie, v lete čučoriedky a hmyz",intr:"Je to najväčší európsky kurovitý vták — samec váži až päť kíl. Keď na jar toká, na posledné dve-tri sekundy piesne naozaj ohluchne, a práve preto sa volá hlucháň.",stat:"Málo dotknutý"},fen:{live:"Old mountain spruce forest with bilberry undergrowth — about 700 remain in Slovakia",eat:"Nothing but spruce and fir needles in winter; bilberries and insects in summer",intr:"It is Europe's largest grouse — a male weighs up to five kilos. During his spring display he really does go deaf for the last two or three seconds of his song, which is exactly how he got his Slovak name.",stat:"Least concern"}},{id:"jelen",draw:"jelen",land:"slovensko",h:1.9,rar:0,base:28,minD:40,maxD:170,shy:1.2,group:[2,6],speed:1.1,sk:"Jeleň lesný",en:"Red Deer",lat:"Cervus elaphus",icon:"🦌",fsk:{live:"Lesy celého Slovenska, v lete vystupuje až nad hranicu lesa",eat:"Tráva, byliny, výhonky a v zime kôra stromov",intr:"Parožie mu každú jar odpadne a nové narastie za štyri mesiace — pribúda aj dva centimetre denne, čo je najrýchlejšie rastúca kosť na svete. V septembri sa ozve ruja a jeho ručanie počuť cez celú dolinu.",stat:"Málo dotknutý"},fen:{live:"Forests all across Slovakia; in summer it climbs above the treeline",eat:"Grass, herbs, shoots and, in winter, tree bark",intr:"Its antlers drop off every spring and regrow in four months, adding up to two centimetres a day — the fastest growing bone on Earth. In September the rut begins and his roaring fills the whole valley.",stat:"Least concern"}},{id:"diviak",draw:"diviak",land:"slovensko",h:.92,rar:0,base:24,minD:35,maxD:140,shy:1.15,group:[3,7],speed:1,sk:"Diviak lesný",en:"Wild Boar",lat:"Sus scrofa",icon:"🐗",fsk:{live:"Listnaté a zmiešané lesy, húštiny a kalužiská po celom Slovensku",eat:"Žalude, bukvice, korienky, hlodavce, hmyzie larvy — vyryje si ich ňufákom",intr:"Ňufákom nadvihne aj ťažký kameň a vyňuchá jedlo pol metra pod zemou. Mláďatá majú na chrbte svetlé pruhy ako melón, v lístí ich takmer nevidno — do pol roka pruhy zmiznú.",stat:"Málo dotknutý"},fen:{live:"Deciduous and mixed forest, thickets and wallows all over Slovakia",eat:"Acorns, beech mast, roots, rodents and grubs — rooted up with its snout",intr:"Its snout can lift a heavy stone and smell food half a metre underground. Piglets wear pale melon stripes that make them almost invisible in the leaf litter; the stripes fade within six months.",stat:"Least concern"}},{id:"bocianc",draw:"bocianc",land:"slovensko",h:1.02,rar:2,base:215,minD:35,maxD:130,shy:1.5,group:[1,2],speed:.9,sk:"Bocian čierny",en:"Black Stork",lat:"Ciconia nigra",icon:"🕊️",fsk:{live:"Staré lesy pri potokoch — hniezdi hlboko v lese, ďaleko od ľudí",eat:"Ryby, žaby, mloky a vodný hmyz z plytkých horských potokov",intr:"Na rozdiel od bieleho bociana sa ľuďom vyhýba a hniezdo si stavia na starom strome hlboko v lese — to isté používa aj dvadsať rokov. Na zimu odlieta do Afriky, cesta má vyše štyri tisíc kilometrov.",stat:"Málo dotknutý"},fen:{live:"Old forests beside streams — it nests deep in the woods, far from people",eat:"Fish, frogs, newts and water insects from shallow mountain streams",intr:"Unlike the white stork it avoids people and builds its nest on an old tree deep in the forest, using the same one for twenty years. It winters in Africa, a journey of over four thousand kilometres.",stat:"Least concern"}},{id:"vydra",draw:"vy 5,maxD:190,shy:1.8,group:[1,1],speed:1.1,land:"cina",pred:!0,sk:"Leopard snežný",en:"Snow Leopard",lat:"Panthera uncia",icon:"🐆",fsk:{live:"Skalnaté horské svahy Himalájí, Tibetu a Altaja, 3000 až 4500 metrov nad morom",eat:"Ovce modré, kozorožce, svište a zajace",intr:"Chvost má takmer taký dlhý ako telo — balansuje s ním na skalách a v spánku si ním prikryje ňufák ako šálom. Na rozdiel od leva a tigra nevie revať, iba prskať a fučať.",stat:"Zraniteľný"},fen:{live:"Rocky mountain slopes of the Himalayas, Tibet and the Altai, 3000 to 4500 metres up",eat:"Blue sheep, ibex, marmots and hares",intr:"Its tail is almost as long as its body — it balances with it on cliffs and covers its nose with it while sleeping. Unlike lions and tigers it cannot roar, only hiss and puff.",stat:"Vulnerable"}},{id:"muntziak",draw:"muntziak",h:.55,rar:0,base:20,minD:20,maxD:80,shy:1.4,group:[1,2],speed:1.2,land:"cina",sk:"Muntžak malý",en:"Reeves's Muntjac",lat:"Muntiacus reevesi",icon:"🦌",fsk:{live:"Husté podrasty a bambusové lesy južnej a východnej Číny",eat:"Byliny, púčiky, spadnuté ovocie a huby",intr:"Keď zavetrí nebezpečenstvo, šteká ako pes a vydrží tak aj hodinu — preto sa mu hovorí štekajúci jeleň. Samec sa okrem krátkeho parožia bije aj klami, ktoré mu trčia z hornej pery.",stat:"Málo dotknutý"},fen:{live:"Dense undergrowth and bamboo forests of southern and eastern China",eat:"Herbs, buds, fallen fruit and fungi",intr:"When it senses danger it barks like a dog, sometimes for a whole hour — which is why it is called the barking deer. Besides short antlers the male fights with tusks that stick out of his upper lip.",stat:"Least concern"}},{id:"ibiscinsky",draw:"ibiscinsky",h:.8,rar:3,base:520,minD:30,maxD:110,shy:1.7,group:[1,3],speed:1,land:"cina",sk:"Ibis chochlatý",en:"Crested Ibis",lat:"Nipponia nippon",icon:"🐦",fsk:{live:"Ryžové polia, potoky a riedke lesy provincie Šen-si v Číne",eat:"Žubrienky, drobné ryby, kraby, slimáky a hmyz z plytkej vody",intr:"V roku 1981 ostalo na er the snow with its head",intr:"It weighs as much as a small car and still charges uphill at 55 km/h. Yellowstone holds the only bison herd that has lived there continuously since prehistoric times — when hunters cut the species from tens of millions to a few hundred in the 1800s, about twenty-three animals survived right here.",stat:"Near threatened"}},{id:"grizly",pred:!0,draw:"grizly",land:"usa",h:1.35,rar:2,base:300,minD:50,maxD:200,shy:1.4,group:[1,1],speed:.8,sk:"Medveď grizly",en:"Grizzly Bear",lat:"Ursus arctos horribilis",icon:"🐻",fsk:{live:"Horské lesy a údolia Skalnatých vrchov; v okolí Yellowstonu žije okolo 1 000 grizlyov",eat:"Z väčšej časti rastliny — trávy, korienky, píniové oriešky; k tomu hlodavce, mláďatá jeleňov a mršiny",intr:"Hrb na pleciach nie je tuk, ale sval, ktorým hrabe: jednou labou odhŕňa kamene ťažké ako ty. Pred zimou pribratie aj 200 kg a potom pol roka spí bez jedla a bez pitia.",stat:"Málo dotknutý"},fen:{live:"Mountain forests and valleys of the Rockies; about 1,000 grizzlies live around Yellowstone",eat:"Mostly plants — grasses, roots, pine nuts — plus rodents, elk calves and carrion",intr:"The shoulder hump is not fat but muscle for digging: one paw can roll away rocks as heavy as you are. Before winter it puts on up to 200 kg, then sleeps half a year without eating or drinking.",stat:"Least concern"}},{id:"kojot",draw:"kojot",land:"usa",h:.6,rar:0,base:20,minD:45,maxD:160,shy:1.5,group:[1,2],speed:1.3,sk:"Kojot prériový",en:"Coyote",lat:"Canis latrans",icon:"🐺",fsk:{live:"Prérie, stepi aj mestské okraje — v Severnej Amerike prakticky všade",eat:"Hraboše a myši (denne aj tucet), zajace, hmyz, ovocie, zvyšky po vlkoch",intr:"Dva kojoty vedia zavýjať tak, že to znie ako celá svorka. Keď v Yellowstone vyhubili vlkov, kojotov pribudlo; po návrate vlkov v roku 1995 ich v údolí Lamar zas asi o polovicu ubudlo.",stat:"Málo dotknutý"},fen:{live:"Prairies, steppe and even city edges — almost everywhere in North America",eat:"Voles and mice (a dozen a day), hares, insects, fruit and wolf leftovers",intr:"Two coyotes can howl so cleverly that they sound like a whole pack. When wolves were wiped out in Yellowstone, coyotes boomed; after the wolves came back in 1995, coyote numbers in Lamar Valley fell by about half.",stat:"Least concern"}},{id:"wapiti",draw:"wapiti",land:"usa",h:2.3,rar:0,base:28,minD:50,maxD:170,shy:1.1,group:[3,6],speed:1,sk:"Wapiti (jeleň kanadský)",en:"Elk (Wapiti)",lat:"Cervus canadensis",icon:"🦌",fsk:{live:"Otvorené údolia a okraje borovicových lesov Yellowstonu; v zime schádza do nižších polôh",eat:"Tráva, byliny, v zime vŕbové a osikové výhonky",intr:"Parohy zhodí každú jar a za jediné leto mu narastú nové — metrové a ťažké ako plné vedro vody. V septembri samce trúbia tenkým piskľavým hlasom, ktorý počuť cez celé údolie.",stat:"Málo dotknutý"},fen:{live:"Open valleys and pine-forest edges of Yellowstone; it moves lower down in winter",eat:"Grass and herbs, and in winter willow and aspen shoots",intr:"It drops its antlers every spring and grows a whole new metre-long set in a single summer — each one as heavy as a full bucket of water. In September the bulls bugle in a thin, whistling scream you can hear across the whole valley.",stat:"Least concern"}},{id:"vidloroh",draw:"vidloroh",land:"usa",h:.9,rar:1,base:115,minD:60,maxD:200,shy:1.5,group:[2,5],speed:1.5,sk:"Vidloroh americký",en:"Pronghorn",lat:"Antilocapra americana",icon:"🐐",fsk:{live:"Otvorené šalviové stepi a prérie západu USA",eat:"Šalvia, byliny a kríčky, ktoré sú pre iné zvieratá príliš horké",intr:"Beží 88 km/h a na rozdiel od geparda to vydrží celé kilometre — je to najrýchlejší cicavec Ameriky. Uteká pred šelmou, ktorá vyhynula pred desiatimi tisíckami rokov: pred americkým gepardom.",stat:"Málo dotknutý"},fen:{live:"Open sagebrush steppe and prairie of the American West",eat:"Sagebrush, herbs and shrubs too bitter for other animals",intr:"It runs at 88 km/h and, unlike a cheetah, can keep it up for kilometres — the fastest mammal in the Americas. It is still outrunning a predator that died out ten thousand years ago: the American cheetah.",stat:"Least concern"}},{id:"orolbielohlavy",draw:"orolbielohlavy",land:"usa",h:2,rar:2,base:265,minD:40,maxD:170,shy:1.4,group:[1,1],speed:1.2,arb:[6,20],sk:"Orol bielohlavý",en:"Bald Eagle",lat:"Haliaeetus leucocephalus",icon:"🦅",fsk:{live:"Vysoké borovice pri riekach a jazerách Yellowstonu, odkiaľ dovidí na vodu",eat:"Predovšetkým ryby, ktoré chytá pazúrmi z hladiny; v zime aj kačice a zdochliny",intr:"Bielu hlavu nemá od narodenia — dostane ju až v piatich rokoch. Stavia najväčšie vtáčie hniezda na svete: rekordné malo tri metre naprieč a vážilo viac ako auto.",stat:"Málo dotknutý"},fen:{live:"Tall pines beside Yellowstone's rivers and lakes, with a view over the water",eat:"Mainly fish snatched from the surface with its talons; in winter also ducks and carrion",intr:"It is not born with a white head — it only turns white at about five years old. It builds the largest nests of any bird on Earth: the record one was three metres across and weighed more than a car.",stat:"Least concern"}},{id:"bobor",draw:"bobor",land:"usa",h:.35,rar:1,base:105,minD:20,maxD:80,shy:1.5,group:[1,2],speed:.7,sk:"Bobor kanadský",en:"North American Beaver",lat:"Castor canadensis",icon:"🦫",fsk:{live:"Potoky a rieky Yellowstonu, kde si stavia hrádze a hrady z konárov a blata",eat:"Kôra a mladé konáriky osík a vŕb — stromy si sám vyhrýzava",intr:"Predné zuby má oranžové od železa, tvrdé ako dláto a rastú mu celý život, takže sa musí stále prehrýzať drevom. Keď zbadá nebezpečenstvo, plesne plochým chvostom po vode — je to počuť cez celý rybník.",stat:"Málo dotknutý"},fen:{live:"Yellowstone's streams and rivers, where it builds dams and lodges of sticks and mud",eat:"Bark and young twigs of aspen and willow — it fells the trees itself",intr:"Its front teeth are orange with iron, hard as a chisel, and grow all its life, so it must keep gnawing wood. When it senses danger it slaps its flat tail on the water — a crack you hear across the whole pond.",stat:"Least concern"}},{id:"rysc",pred:!0,draw:"rysc",land:"usa",h:.55,rar:2,base:285,minD:30,maxD:150,shy:1.8,group:[1,1],speed:1.2,sk:"Rys červený",en:"Bobcat",lat:"Lynx rufus",icon:"🐈",fsk:{live:"Skalné rokliny, húštiny a okraje lesa; v Yellowstone ho vidieť len veľmi zriedka",eat:"Zajace a králiky, hraboše, veveričky, vtáky — občas aj mladá srna",intr:'Je len asi dvakrát väčší ako domáca mačka, a predsa uloví zviera desaťkrát ťažšie, než je sám. Chvost má taký krátky, akoby ho niekto odstrihol — po anglicky sa preto volá bobcat, „useknutý kocúr".',stat:"Málo dotknutý"},fen:{live:"Rocky gullies, thickets and forest edges; in Yellowstone it is seen only very rarely",eat:"Hares and rabbits, voles, squirrels, birds — occasionally even a young deer",intr:"It is only about twice the size of a house cat, yet it can kill prey ten times its own weight. Its tail is so short it looks cut off — which is exactly why it is called a bobcat.",stat:"Least concern"}},{id:"sokol",draw:"sokol",land:"usa",h:1.1,rar:3,base:520,minD:35,maxD:150,shy:1.7,group:[1,1],speed:1.4,arb:[10,28],sk:"Sokol sťahovavý",en:"Peregrine Falcon",lat:"Falco peregrinus",icon:"🪶",fsk:{live:"Skalné steny a kaňony Yellowstonu; hniezdi na rímsach vysoko nad riekou",eat:"Takmer výlučne vtáky, ktoré zráža priamo vo vzduchu",intr:"Pri strmhlavom útoku padá rýchlosťou vyše 380 km/h — je to najrýchlejšie zviera na svete. Aby mu pritom nárazový vzduch nezničil pľúca, má v nozdrách drobné kostené hrbolčeky, ktoré prúd vzduchu spomalia.",stat:"Málo dotknutý"},fen:{live:"Cliff faces and canyons of Yellowstone; it nests on ledges high above the river",eat:"Almost only birds, which it strikes down in mid-air",intr:"In a hunting stoop it falls at over 380 km/h — the fastest animal on Earth. So the rushing air does not wreck its lungs, tiny bony cones inside its nostrils slow the airflow down.",stat:"Least concern"}},{id:"losamericky šter na svete, ktorý sa potápa do mora — pod vodou vydrží aj polhodinu. Slanú vodu, čo pritom prehltne, vyfúkne späť nosom, takže vyzerá, akoby stále kýchal a mal na hlave bielu soľnú parochňu.",stat:"Zraniteľný"},fen:{live:"Only in the Galápagos — on black lava shores, basking on rocks just above the surf",eat:"Seaweed, which it scrapes off underwater rocks with its teeth",intr:"It is the only lizard on Earth that dives into the sea — it can stay under for half an hour. The salty water it swallows gets blown back out through its nose, so it looks as if it is forever sneezing and wearing a white wig of salt.",stat:"Vulnerable"}},{id:"leguansuchozemsky",draw:"leguansuchozemsky",land:"galapagy",h:.4,rar:2,base:230,minD:8,maxD:55,shy:.7,group:[1,3],speed:.7,sk:"Leguán suchozemský galapágsky",en:"Galápagos Land Iguana",lat:"Conolophus subcristatus",icon:"🦎",fsk:{live:"Suché vnútrozemie galapágskych ostrovov; cez noc spí vo vyhrabanej nore, cez deň leží na slnku",eat:"Hlavne plody a listy opuncie — aj s tŕňmi",intr:"Opunciu žerie celú, aj s ostrými tŕňmi, ktoré si nechá prejsť žalúdkom. Voda mu takmer netreba — vystačí si s tou, ktorú vytiahne z dužinatých kaktusov, a dožije sa vyše päťdesiat rokov.",stat:"Zraniteľný"},fen:{live:"The dry interior of the Galápagos islands; it sleeps in a burrow at night and suns itself by day",eat:"Mostly prickly-pear cactus pads and fruit — spines and all",intr:"It swallows cactus whole, spines included, and lets its stomach deal with them. It barely needs to drink: the juicy cactus supplies the water, and the iguana can live past fifty.",stat:"Vulnerable"}},{id:"korytnackaobria",draw:"korytnackaobria",land:"galapagy",h:1.15,rar:3,base:430,minD:12,maxD:80,shy:.5,group:[1,3],speed:.3,sk:"Korytnačka obrovská",en:"Galápagos Giant Tortoise",lat:"Chelonoidis niger",icon:"🐢",fsk:{live:"Vlhké vysočiny a lávové polia galapágskych ostrovov; každý ostrov má vlastný druh",eat:"Tráva, listy, kaktusy a opadané plody; denne aj tridsať kilogramov",intr:'Bez jedla a bez vody vydrží celý rok — preto ju kedysi námorníci brávali na lode ako živé zásoby. Dožíva sa vyše sto rokov a práve podľa nej dostali ostrovy meno: „galápago" je po španielsky sedlo, ako má tvar jej pancier.',stat:"Zraniteľný"},fen:{live:"The damp highlands and lava fields of the Galápagos; each island has its own kind",eat:"Grass, leaves, cactus and fallen fruit — up to thirty kilograms a day",intr:"It can survive a whole year without food or water, which is why sailors once carried them aboard as living provisions. It lives past a hundred, and the islands are named after it: galápago is old Spanish for the saddle its shell resembles.",stat:"Vulnerable"}},{id:"blbecmodronohy",draw:"blbecmodronohy",land:"galapagy",h:.72,rar:1,base:105,minD:8,maxD:50,shy:.8,group:[2,6],speed:1,sk:"Sula modronohá",en:"Blue-footed Booby",lat:"Sula nebouxii",icon:"🐦",fsk:{live:"Skalnaté pobrežia od Kalifornie po Peru; na Galapágoch hniezdi priamo na holej zemi",eat:"Ryby, po ktorých sa z výšky tridsať metrov vrhá strmhlav do vody",intr:"Modrú farbu nôh nemá odjakživa — robia ju farbivá z čerstvých rýb. Kto je zdravý a dobre loví, má nohy jasnejšie, a preto ich pri námluvách samec dvíha jednu po druhej ako v pomalom tanci.",stat:"Málo dotknutý"},fen:{live:"Rocky coasts from California to Peru; in the Galápagos it nests straight on bare ground",eat:"Fish, which it takes by plunge-diving from thirty metres up",intr:"The blue is not permanent — it comes from pigments in fresh fish. A healthy, well-fed bird has brighter feet, so in courtship the male lifts them one at a time in a slow, showing-off dance.",stat:"Least concern"}},{id:"kormorang",draw:"kormorang",land:"galapagy",h:.95,rar:3,base:560,minD:10,maxD:60,shy:.8,group:[1,2],speed:.8,sk:"Kormorán galapágsky",en:"Flightless Cormorant",lat:"Nannopterum harrisi",icon:"🐦‍⬛",fsk:{live:"Iba chladné pobrežia ostrovov Fernandina a Isabela — nikde inde na svete",eat:"Ryby, chobotnice a úhory, ktoré loví pri dne blízko brehu",intr:"Je jediný kormorán na svete, ktorý nevie lietať. Na ostrovoch nemal pred kým utekať a potravu má hneď pod skalou, tak sa mu krídla za tisícročia scvrkli na tretinu — dnes mu slúžia už len na udržanie rovnováhy. Zostalo ich asi dvetisíc.",stat:"Zraniteľný"},fen:{live:"Only the cool shores of Fernandina and Isabela — nowhere else on Earth",eat:"Fish, octopus and eels hunted along the bottom close to shore",intr:"It is the only cormorant in the world that cannot fly. With no predators to escape and food right below the rocks, its wings shrank over thousands of years to a third of the size it would need — today they only help it balance. About two thousand birds remain.",stat:"Vulnerable"}},{id:"tucniakg",draw:"tucniakg",land:"galapagy",h:.5,rar:3,base:590,minD:8,maxD:45,shy:1,group:[1,4],speed:1,sk:"Tučniak galapágsky",en:"Galápagos Penguin",lat:"Spheniscus mendiculus",icon:"🐧",fsk:{live:"Lávové pobrežia Fernandiny a Isabely, kde more chladí studený prúd z hlbín",eat:"Malé rybky — sardinky a cípale, ktoré chytá v húfoch pod hladinou",intr:"Je to jediný tučniak, ktorý žije na rovníku, a keďže časť ostrova Isabela leží už na severnej pologuli, je zároveň jediným tučniakom severnej pologule. Aby sa v tropickom slnku neuvaril, roztiahne plutvy do tieňa a lapá po dychu ako pes.",stat:"Ohrozený"},fen:{live:"Lava shores of Fernandina and Isabela, where a cold deep-sea current chills the water",eat:"Small fish — sardines and mullet caught in shoals below the surface",intr:"It is the only penguin living on the equator, and because part of Isabela lies north of it, it is also the only penguin of the northern hemisphere. To keep from cooking in tropical sun it holds its flippers out to shade them and pants like a dog.",stat:"Endangered"}},{id:"albatrosg",draw:"albatrosg",land:"galapagy",h:2.4,rar:3,base:640,minD:25,maxD:130,shy:.9,group:[1,2],speed:1.1,arb:[3,14],sk:"Albatros galapágsky",en:"Waved Albatross",lat:"Phoebastria irrorata",icon:"🕊️",fsk:{live:"Hniezdi takmer výlučne na jedinom ostrove — Española; zvyšok roka je nad otvoreným oceánom",eat:"Ryby, chobotnice a kalamáre, ktoré zbiera z hladiny",intr:"S rozpätím dva a pol metra sa vznáša celé hodiny bez jediného mávnutia krídel. Vzlietnuť z rovnej zeme mu však robí problém, tak si na to vyšliapal rozbehovú dráhu k útesu — rozbehne sa a jednoducho zoskočí do vetra.",stat:"Kriticky ohrozený"},fen:{live:"Nests almost only on a single island — Española; the rest of the year it lives over the open ocean",eat:"Fish, octopus and squid picked off the surface",intr:"With a two-and-a-half-metre wingspan it glides for hours without one wingbeat. Taking off from flat ground is hard for it, so it has worn a runway to the cliff edge — it runs and simply drops off into the wind.",stat:"Critically endangered"}},{id:"lachtang",draw:"lachtang",land:"galapagy",h:.7,rar:1,base:85,minD:6,maxD:45,shy:.5,group:[2,7],speed:.5,sk:"Lachtan galapágsky",en:"Galápagos Sea Lion",lat:"Zalophus wollebaeki",icon:"🦭",fsk:{live:"Pláže, skaly a móla galapágskych ostrovov; spí kdekoľvek, aj na lavičke v prístave",eat:"Sardinky a iné ryby; loví aj sto metrov hlboko",intr:"Človeka sa vôbec nebojí — pokojne si ľahne vedľa neho na schody. Od tuleňa ho spoznáš podľa malého ušného lalôčika a podľa toho, že sa vie na predných plutvách postaviť a bežať.",stat:"Ohrozený"},fen:{live:"Beaches, rocks and jetties of the Galápagos; it sleeps anywhere, even on a harbour bench",eat:"Sardines and other fish, hunted down to a hundred metres",intr:"It has no fear of people at all and will flop down beside you on the steps. You can tell it from a true seal by its little external ear flap and by the fact that it can stand up on its front flippers and run.",stat:"Endangered"}},{id:"pinkad",draw:"pinkad",land:"galapagy",h:.12,rar:0,base:28,minD:4,maxD:18,shy:.7,group:[2,6],speed:1.4,sk:"Pinka Darwinova",en:"Darwin's Finch",lat:"Geospiza magnirostris",icon:"🐦",fsk:{live:"Všetky galapágske ostrovy — od suchých lávových polí až po vlhké vysočiny",eat:"Semená a tvrdé oriešky, ktoré rozlúskne hrubým zobákom",intr:"Na Galapágoch žije zo trinásť druhov týchto malých pinák a všetky vznikli z jediného predka — líšia sa hlavne zobákom: hrubý na lúskanie semien, tenký na hmyz, jedna si dokonca pomáha kaktusovým tŕňom. Práve ony priviedli Charlesa Darwina na myšlienku, ako sa druhy menia.",stat:"Málo dotknutý"},fen:{live:"Every Galápagos island — from dry lava fields to the damp highlands",eat:"Seeds and hard nuts, cracked open with the heavy bill",intr:"Some thirteen kinds of these small finches live in the Galápagos and all came from one ancestor — they differ mainly in the bill: thick for cracking seeds, thin for insects, and one even uses a cactus spine as a tool. They are what set Charles Darwin thinking about how species change.",stat:"Least concern"}},{id:"fregatka",draw:"fregatka",land:"galapagy",h:2.3,rar:2,base:250,minD:25,maxD:140,shy:1.1,group:[1,4],speed:1.2,sk:"Fregatka veľkolepá",en:"Magnificent Frigatebird",lat:"Fregata magnificens",icon:"🕊️",fsk:{live:"Teplé moria Ameriky; na Galapágoch hniezdi v nízkych kroch pri pobreží",eat:"Lietajúce ryby a kalamáre z hladiny — a čo ukradne iným vtákom",intr:"Samec si nafúkne pod zobákom obrovský červený vak veľký ako futbalová lopta; trvá mu to asi dvadsať minút a potom ho nosí aj niekoľko dní, kým si ho niektorá samica nevšimne. Perie nemá vodotesné, takže si nesmie sadnúť na vodu — a preto radšej okráda iné vtáky priamo vo vzduchu.",stat:"Málo dotknutý"},fen:{live:"Warm seas of the Americas; in the Galápagos it nests in low coastal bushes",eat:"Flying fish and squid snatched off the surface — and whatever it can steal from other birds",intr:"The male inflates a huge red throat pouch the size of a football; it takes about twenty minutes and he then carries it for days until a female notices. His feathers are not waterproof, so he must never land on the sea — which is why he prefers to rob other birds in mid-air.",stat:"Least concern"}},{id:"krabsally",dra h — it has no sharp teeth. Two lobes beside its mouth funnel water in, and its gill plates comb the plankton out like a sieve catching flour. It has the largest brain of any fish.",stat:"Endangered"}},{id:"korytnackazelena",draw:"korytnackazelena",land:"ocean",h:.8,rar:2,base:215,minD:8,maxD:40,shy:1,group:[1,2],speed:.8,arb:[.5,7],sk:"Korytnačka zelená",en:"Green Sea Turtle",lat:"Chelonia mydas",icon:"🐢",fsk:{live:"Teplé plytčiny s morskou trávou a koralové útesy všetkých oceánov",eat:"Ako jediná morská korytnačka sa dospelá pasie takmer len na morskej tráve a riasach",intr:"Zelená nie je podľa panciera, ale podľa tuku pod ním — zozelenel jej z morskej trávy. Samica sa celý život vracia klásť vajcia na tú istú pláž, na ktorej sa sama vyliahla, hoci k nej musí preplávať aj tisíce kilometrov.",stat:"Ohrozený"},fen:{live:"Warm seagrass shallows and coral reefs in every ocean",eat:"The only sea turtle that as an adult grazes almost entirely on seagrass and algae",intr:"It is not named green after its shell but after the fat underneath it — the seagrass turns it green. A female returns all her life to lay eggs on the very beach where she hatched, even if she must swim thousands of kilometres to reach it.",stat:"Endangered"}},{id:"murena",draw:"murena",land:"ocean",h:.85,rar:1,base:110,minD:6,maxD:26,shy:.8,group:[1,1],speed:.5,sk:"Muréna obrovská",en:"Giant Moray",lat:"Gymnothorax javanicus",icon:"🐍",fsk:{live:"Diery a pukliny v koralových útesoch Indického a Tichého oceánu",eat:"Ryby a chobotnice, ktoré uloví najmä v noci",intr:"Papuľu otvára a zatvára stále — nie je to hrozba, takto si ženie vodu k žiabrám, lebo nemá čím pumpovať. A má dve sady čeľustí: druhá, ukrytá v hrdle, vystrelí dopredu, chytí korisť a vtiahne ju dnu.",stat:"Málo dotknutý"},fen:{live:"Holes and crevices in the coral reefs of the Indian and Pacific Oceans",eat:"Fish and octopuses, hunted mostly at night",intr:"It opens and closes its mouth constantly — that is not a threat, it is how it pushes water over its gills, having no pump. And it has two sets of jaws: the second one, hidden in its throat, shoots forward, grabs the prey and drags it inside.",stat:"Least concern"}},{id:"klaun",draw:"klaun",land:"ocean",h:.078,rar:0,base:24,minD:2,maxD:16,shy:.85,group:[2,4],speed:1.1,arb:[.3,2],sk:"Klaun očkatý",en:"Ocellaris Clownfish",lat:"Amphiprion ocellaris",icon:"🐠",fsk:{live:"Vnútri sasaniek na plytkých útesoch juhovýchodnej Ázie a severnej Austrálie",eat:"Planktón, drobné kôrovce a riasy; aj zvyšky po sasanke",intr:"Sasanka omráči žihľavými bunkami každú rybu — klauna nie, lebo je obalený hlienom, na ktorý sasanka nereaguje. Za to jej odháňa nepriateľov a čistí ju. Všetky klauny sa rodia ako samce, a keď samica uhynie, najsilnejší samec sa na samicu premení.",stat:"Málo dotknutý"},fen:{live:"Inside sea anemones on shallow reefs of South-East Asia and northern Australia",eat:"Plankton, tiny crustaceans and algae, plus the anemone's leftovers",intr:"An anemone's stinging cells stun any fish — but not the clownfish, which is coated in a mucus the anemone ignores. In return it chases off the anemone's enemies and keeps it clean. Every clownfish is born male, and when the female dies the strongest male turns into one.",stat:"Least concern"}},{id:"papagajorybka",draw:"papagajorybka",land:"ocean",h:.18,rar:0,base:28,minD:2.5,maxD:22,shy:1.05,group:[2,5],speed:1.1,arb:[.5,4],sk:"Papagájorybka útesová",en:"Daisy Parrotfish",lat:"Chlorurus sordidus",icon:"🦜",fsk:{live:"Koralové útesy Indického a Tichého oceánu",eat:"Riasy a mŕtvy koral, ktoré zoškrabáva zobákom priamo zo skaly",intr:"Zuby má zrastené do zobáka ako papagáj a ďalšie zuby v hrdle — tými koral rozdrví na prášok. Ten z nej vyjde ako biely piesok: jedna ryba ho vyrobí za rok aj sto kíl, takže na tropickej pláži ležíš na tom, čo papagájorybky vytrúsili. V noci sa zabalí do priehľadného slizového vaku, ktorý prekryje jej pach pred murénami.",stat:"Málo dotknutý"},fen:{live:"Coral reefs of the Indian and Pacific Oceans",eat:"Algae and dead coral scraped straight off the rock with its beak",intr:"Its teeth are fused into a parrot-like beak, and more teeth in its throat grind the coral to powder. That powder comes out as white sand — a single fish can make a hundred kilos a year, so a tropical beach is largely what parrotfish left behind. At night it wraps itself in a see-through mucus bag that hides its scent from moray eels.",stat:"Least concern"}},{id:"barakuda",draw:"barakuda",land:"ocean",h:.32,rar:1,base:125,minD:4,maxD:40,shy:1.25,group:[1,3],speed:1.4,arb:[2,10],sk:"Barakuda veľká",en:"Great Barracuda",lat:"Sphyraena barracuda",icon:"🐟",fsk:{live:"Okraje útesov a otvorená voda teplých morí; mladé ryby v mangrovoch",eat:"Iné ryby — číha na ne bez pohybu a útočí zo zálohy",intr:"Visí vo vode ako strieborné poleno, a keď vyrazí, zrýchli na vyše štyridsať kilometrov za hodinu. Spodná čeľusť jej trčí dopredu a v papuli má dva druhy zubov: veľké kly na prepichnutie a drobné na to, aby korisť neušmykla.",stat:"Málo dotknutý"},fen:{live:"Reef edges and open water of warm seas; the young live in mangroves",eat:"Other fish — it waits motionless and strikes from ambush",intr:"It hangs in the water like a silver log, then bursts forward at over forty kilometres an hour. Its lower jaw juts out in front and its mouth holds two kinds of teeth: big fangs to stab, and small ones to keep the catch from slipping.",stat:"Least concern"}},{id:"chobotnica",draw:"chobotnica",land:"ocean",h:.45,rar:2,base:290,minD:5,maxD:22,shy:1.55,group:[1,1],speed:.7,sk:"Chobotnica pobrežná",en:"Common Octopus",lat:"Octopus vulgaris",icon:"🐙",fsk:{live:"Skalnaté dno a útesy teplých morí; cez deň sa skrýva v puklinách",eat:"Kraby, mušle a raky; tvrdé ulity otvorí alebo prevŕta",intr:"Má tri srdcia, modrú krv a v koži bunky, ktorými zmení farbu aj vzor za tri desatiny sekundy — hoci je pritom farboslepá. Dve tretiny jej nervových buniek sú v ramenách, takže každé rameno si samo ohmatáva okolie a samo sa rozhoduje.",stat:"Málo dotknutý"},fen:{live:"Rocky bottoms and reefs of warm seas; by day it hides in crevices",eat:"Crabs, clams and lobsters; it prises hard shells open or drills through them",intr:"It has three hearts, blue blood and skin cells that change its colour and pattern in three tenths of a second — even though it is colour-blind. Two thirds of its nerve cells sit in its arms, so each arm feels around and decides for itself.",stat:"Least concern"}},{id:"morskykonik",draw:"morskykonik",land:"ocean",h:.17,rar:3,base:445,minD:1.5,maxD:12,shy:.7,group:[1,2],speed:.35,arb:[.2,1.2],sk:"Morský koník žltý",en:"Yellow Seahorse",lat:"Hippocampus kuda",icon:"🐴",fsk:{live:"Plytké zálivy, lúky morskej trávy a koralové útesy Indického a Tichého oceánu",eat:"Drobné kôrovce, ktoré vcucne dlhou trubicovitou papuľkou",intr:"Je to naozaj ryba, hoci pláva postojačky a chvostom sa drží stebla ako rukou. Mláďatá nosí samec: samica mu vajíčka vloží do vaku na bruchu, on ich niekoľko týždňov nosí a potom vypustí do vody stovky maličkých koníkov. Nemá žalúdok, preto musí jesť takmer neprestajne.",stat:"Zraniteľný"},fen:{live:"Shallow bays, seagrass meadows and coral reefs of the Indian and Pacific Oceans",eat:"Tiny crustaceans sucked up through its long tube-like snout",intr:"It really is a fish, even though it swims upright and grips a stem with its tail like a hand. The father carries the young: the female places her eggs in his belly pouch, he carries them for weeks and then releases hundreds of tiny seahorses. Having no stomach, he must eat almost non-stop.",stat:"Vulnerable"}},{id:"rejnok",draw:"rejnok",land:"ocean",h:.5,rar:2,base:200,minD:6,maxD:30,shy:1.1,group:[1,2],speed:.85,arb:[0,3],sk:"Trnucha modrobodkovaná",en:"Bluespotted Ribbontail Ray",lat:"Taeniura lymma",icon:"🥏",fsk:{live:"Piesočnaté dno pri koralových útesoch Indického oceánu a Červeného mora",eat:"Červy, kraby a krevety, ktoré vyhrabe z piesku prúdom vody",intr:"Elektricky modré bodky svietia aj v šere — sú to výstražné svetlá, ktoré hovoria „nechaj ma tak“. Na tenkom chvoste má dva jedovaté ostne, no nikdy nimi neútočí; použije ich len vtedy, keď naň niekto stúpi. Korisť ukrytú v piesku nájde tak, že cíti slabé elektrické polia živých tiel.",stat:"Takmer ohrozený"},fen:{live:"Sandy bottoms beside the coral reefs of the Indian Ocean and the Red Sea",eat:"Worms, crabs and shrimp flushed out of the sand with jets of water",intr:"Its electric-blue spots glow even in dim light — warning lamps that say “leave me alone”. Its thin tail carries two venomous spines, but it never attacks with them; it uses them only if someone steps on it. It finds prey buried in the sand by sensing the faint electric fields of living bodies.",stat:"Near threatened"}},{id:"delfin",draw:"delfin",land:"ocean",h:.86,rar:3,base:530,minD:12,maxD:60,shy:1.05,group:[2,5],speed:1.35,arb:[3,14],sk:"Delfín skákavý",en:"Common Bottlenose Dolphin",lat:"Tursiops truncatus",icon:"🐬",fsk:{live:"Teplé a mierne moria celého sveta, od pobrežných zálivov po otvorený oceán",eat:"Ryby a chobotnice; loví v skupine a korisť si spoločne nadháňajú",intr:"Nedýcha ústami, ale otvorom na temene, a nadýchnuť sa musí vedome — preto pri spaní vypína vždy len polovicu mozgu a jedno oko má otvorené. Vo vode „vidí“ zvukom: vyšle cvakot a z ozveny zistí, či je pred ním kameň alebo ryba. A každý delfín má vlastnú pískavú značku — meno, ktorým ho ostatné volajú.",stat:"Málo dotknutý"},fen:{live:"Warm and temperate seas worldwide, from coastal bays to the open ocean",eat:"Fish and squid; it hunts in groups that herd the shoal together",intr:"It breathes not through its mouth but through a blowhole on top of its head, and every breath is a conscious decision — so when it sleeps it shuts down only half its brain and keeps one eye open. Underwater it “sees” with sound: it sends out clicks and reads the echo to tell a rock from a fish. And every dolphin has its own signature whistle — a name the others call it by.",stat:"Least concern"} vce, hady, med a včelie larvy, korienky aj vajcia",intr:"Nebojí sa nikoho: postaví sa levovi aj byvolovi a ustúpiť odmieta. Kožu má takú voľnú a hrubú, že keď ho niekto chytí do zubov, otočí sa v nej a pohryzie útočníka. Znesie aj uhryznutie kobry — na pár hodín odpadne, potom sa preberie a hada dojedá.",stat:"Málo dotknutý"},fen:{live:"Savanna, semi-desert and open woodland across Africa, Arabia and southern Asia",eat:"Almost anything — rodents, snakes, honey and bee grubs, roots and eggs",intr:"It is afraid of nobody: it stands up to a lion or a buffalo and simply refuses to back off. Its skin is so loose and thick that when something grabs it, it twists round inside its own hide and bites back. It even survives a cobra bite — it collapses for a few hours, then wakes up and finishes eating the snake.",stat:"Least concern"}},{id:"oryx",draw:"oryx",land:"kenya",h:2.05,rar:1,base:105,minD:45,maxD:165,shy:1.3,group:[3,8],speed:1.1,sk:"Priamorožec beisa",en:"Beisa Oryx",lat:"Oryx beisa",icon:"🦌",fsk:{live:"Suché tŕňové savany a polopúšte severnej Kene, Etiópie a Somálska",eat:"Tvrdá tráva, listy, hľuzy a divé melóny, z ktorých pije",intr:"Vydrží celé týždne bez kvapky vody — berie si ju z rastlín. V najväčšej horúčave si nechá telo zohriať až na štyridsaťpäť stupňov, aby sa nemusel potiť, a zvláštna sieť ciev v hlave mu pritom chladí mozog.",stat:"Ohrozený"},fen:{live:"Dry thorn savanna and semi-desert of northern Kenya, Ethiopia and Somalia",eat:"Tough grasses, leaves, tubers and wild melons it drinks from",intr:"It can go weeks without a drop of water, taking it from plants instead. In the worst heat it lets its body warm up to forty-five degrees rather than waste water on sweating, while a special net of blood vessels in its head keeps the brain cool.",stat:"Endangered"}},{id:"kudu",draw:"kudu",land:"kenya",h:2.5,rar:2,base:205,minD:42,maxD:160,shy:1.55,group:[1,4],speed:1.1,sk:"Kudu veľký",en:"Greater Kudu",lat:"Tragelaphus strepsiceros",icon:"🦌",fsk:{live:"Husté kroviny a tŕňové húštiny východnej a južnej Afriky",eat:"Listy, výhonky a struky — trávu takmer neje",intr:"Rohy samca merajú aj poldruha metra a majú dva a pol závitu — sú to najdlhšie rohy zo všetkých antilop. Vyzerá ťažkopádne, no plot vysoký dva a pol metra preskočí takmer z miesta.",stat:"Málo dotknutý"},fen:{live:"Dense bush and thorn thickets of eastern and southern Africa",eat:"Leaves, shoots and pods — it hardly touches grass",intr:"A bull's horns reach a metre and a half and make two and a half full twists — the longest horns of any antelope. It looks heavy, yet it can clear a two-and-a-half-metre fence almost from standing.",stat:"Least concern"}},{id:"mangusta",draw:"mangusta",land:"kenya",h:.18,rar:0,base:26,minD:10,maxD:70,shy:1.25,group:[5,12],speed:1.3,sk:"Mangusta trpasličia",en:"Common Dwarf Mongoose",lat:"Helogale parvula",icon:"🦫",fsk:{live:"Savany a suché lesy východnej a južnej Afriky, najradšej pri termitiskách",eat:"Chrobáky, termity, pavúky, škorpióny, jašterice a vajcia",intr:"Je to najmenšia africká šelma — váži asi toľko ako veľké jablko. Skupinke velí najstaršia samica a so zoborožcami majú dohodu: mangusty hľadajú hmyz, vtáky strážia oblohu, a vtáky dokonca ráno čakajú pri termitisku, kým mangusty vstanú.",stat:"Málo dotknutý"},fen:{live:"Savanna and dry woodland of eastern and southern Africa, always near termite mounds",eat:"Beetles, termites, spiders, scorpions, lizards and eggs",intr:"It is Africa's smallest carnivore — about the weight of a large apple. The oldest female leads the group, and they have a deal with hornbills: the mongooses find insects while the birds watch the sky, and the birds will even wait by the termite mound in the morning until the mongooses get up.",stat:"Least concern"}},{id:"dikdik",draw:"dikdik",land:"tanzania",h:.42,rar:1,base:92,minD:14,maxD:85,shy:1.55,group:[1,2],speed:1.3,sk:"Dikdik Kirkov",en:"Kirk's Dik-dik",lat:"Madoqua kirkii",icon:"🦌",fsk:{live:"Suché kroviny a tŕňové húštiny východnej Afriky",eat:"Listy, púčiky a plody — trávu takmer neje a piť nemusí vôbec",intr:"V kohútiku má štyridsať centimetrov, teda po koleno dospelému človeku. Územie si značkuje čiernym lepkavým výlučkom zo žliazky pred okom — vyzerá to, akoby plakal a slzy nechával na konárikoch. Žije v pároch, ktoré vydržia spolu celý život.",stat:"Málo dotknutý"},fen:{live:"Dry bush and thorn thickets of eastern Africa",eat:"Leaves, buds and fruit — it barely eats grass and need not drink at all",intr:"It stands forty centimetres at the shoulder, knee-high to a grown-up. It marks its territory with a sticky black secretion from a gland in front of the eye — as if it were crying and leaving the tears on the twigs. Pairs stay together for life.",stat:"Least concern"}},{id:"eland",draw:"eland",land:"tanzania",h:2.1,rar:1,base:84,minD:55,maxD:175,shy:1.35,group:[4,12],speed:1,sk:"Antilopa žirafia",en:"Common Eland",lat:"Taurotragus oryx",icon:"🦬",fsk:{live:"Savany, otvorené kroviny a horské lúky východnej a južnej Afriky",eat:"Listy, struky a tráva — pasie sa aj v noci",intr:"Je to najväčšia antilopa sveta: starý samec váži takmer tonu, a aj tak preskočí dvojmetrovú prekážku. Pri chôdzi mu v predných kolenách hlasno cvaká — čím hlbšie cvakanie, tým väčší samec, a ostatné to počujú aj na sto metrov, takže sa nemusia biť.",stat:"Málo dotknutý"},fen:{live:"Savanna, open bush and mountain grassland of eastern and southern Africa",eat:"Leaves, pods and grass — it grazes at night too",intr:"It is the largest antelope in the world: an old bull weighs close to a tonne and still clears a two-metre obstacle. Its front knees click loudly as it walks — the deeper the click, the bigger the bull, and rivals hear it a hundred metres away, so they need not fight at all.",stat:"Least concern"}},{id:"karakal",draw:"karakal",land:"tanzania",h:.6,rar:2,base:275,pred:!0,minD:32,maxD:150,shy:1.7,group:[1,1],speed:1.4,sk:"Karakal",en:"Caracal",lat:"Caracal caracal",icon:"🐆",fsk:{live:"Savany, polopúšte a suché kroviny Afri bar",h:1.7,rar:0,base:24,minD:50,maxD:150,shy:1.3,group:[1,4],speed:1,land:"india",sk:"Sambar indický",en:"Sambar Deer",lat:"Rusa unicolor",icon:"🦌",fsk:{live:"Lesy Indie, Nepálu a juhovýchodnej Ázie",eat:"Tráva, listy, plody a vodné rastliny",intr:"Keď zbadá tigra, vydá hlboké zatrúbenie a dupne — sprievodcovia podľa toho zvuku vedia, že mačka je nablízku. Rád sa váľa v blate, ktoré mu na srsti vyschne na pancier proti hmyzu.",stat:"Zraniteľný"},fen:{live:"Forests of India, Nepal and Southeast Asia",eat:"Grass, leaves, fruit and water plants",intr:"When it spots a tiger it gives a deep honking call and stamps — guides use that sound to know the cat is near. It wallows in mud that dries into an insect-proof crust.",stat:"Vulnerable"}},{id:"diviakindicky",draw:"diviakindicky",h:.95,rar:0,base:18,minD:35,maxD:120,shy:1.2,group:[2,7],speed:1.2,land:"india",sk:"Diviak indický",en:"Indian Wild Boar",lat:"Sus scrofa cristatus",icon:"🐗",fsk:{live:"Lesy, kroviny a polia po celej Indii",eat:"Korene, hľuzy, plody, hmyz aj zdochliny",intr:"Rypákom zacíti potravu aj pol metra pod zemou a vyryje ju ako pluhom. Mláďatá sú pruhované ako melón, aby ich v tráve nebolo vidieť.",stat:"Málo dotknutý"},fen:{live:"Forests, scrub and farmland right across India",eat:"Roots, tubers, fruit, insects and carrion",intr:"Its snout smells food half a metre underground and ploughs it out. Piglets are striped like a melon so they vanish in the grass.",stat:"Least concern"}},{id:"krokodilbahenny",draw:"krokodilbahenny",h:.5,rar:2,base:195,minD:40,maxD:130,shy:1,group:[1,2],speed:.8,land:"india",pred:!0,sk:"Krokodíl bahenný",en:"Mugger Crocodile",lat:"Crocodylus palustris",icon:"🐊",fsk:{live:"Jazerá, rieky a nádrže Indie, Nepálu a Srí Lanky",eat:"Ryby, korytnačky, vtáky, jelene pri brehu",intr:"Má najširší ňufák zo všetkých krokodílov. V najväčšej horúčave si do brehu vyhrabe niekoľkometrový tunel a v ňom prečká, kým jazero nevyschne.",stat:"Zraniteľný"},fen:{live:"Lakes, rivers and reservoirs of India, Nepal and Sri Lanka",eat:"Fish, turtles, birds and deer that come to drink",intr:"It has the broadest snout of any crocodile. In the worst heat it digs a burrow several metres into the bank and waits there until the lake refills.",stat:"Vulnerable"}},{id:"nilgai",draw:"nilgai",h:1.55,rar:1,base:92,minD:60,maxD:175,shy:1.25,group:[1,4],speed:1.1,land:"india",sk:"Nilgai",en:"Nilgai",lat:"Boselaphus tragocamelus",icon:"🦌",fsk:{live:"Suché lesy, kroviny a polia severnej Indie",eat:"Tráva, listy, puky a plody",intr:"Najväčšia ázijská antilopa. Samec je sivomodrý a rohatý, samica hnedá a bez rohov — vyzerajú ako dva rôzne druhy. Jeho meno znamená modrá krava, a preto ho v Indii nikto neloví.",stat:"Málo dotknutý"},fen:{live:"Dry forests, scrub and farmland of northern India",eat:"Grass, leaves, buds and fruit",intr:'Asia\'s largest antelope. The male is blue-grey with horns, the female tawny and hornless — they look like two different species. Its name means "blue cow", which is why nobody in India hunts it.',stat:"Least concern"}},{id:"binturong",draw:"binturong",h:.42,rar:2,base:230,minD:22,maxD:75,shy:1.3,group:[1,1],speed:.6,land:"indonesia",arb:[6,16],sk:"Binturong",en:"Binturong",lat:"Arctictis binturong",icon:"🐾",fsk:{live:"Koruny dažďových pralesov Bornea a juhovýchodnej Ázie",eat:"Ovocie, hlavne divé figy, občas vtáčie vajcia",intr:"Vonia ako pukance s maslom — v jeho moči je naozaj tá istá voňavá látka ako v pukancoch. Chvost používa ako piatu nohu a zavesí sa na ňom.",stat:"Zraniteľný"},fen:{live:"Rainforest canopy of Borneo and Southeast Asia",eat:"Fruit, especially wild figs, sometimes birds' eggs",intr:"It smells of buttered popcorn — its urine really contains the same scent compound as popcorn. Its tail works as a fifth limb and it can hang from it.",stat:"Vulnerable"}},{id:"kalon",draw:"kalon",hang:!0,h:.62,rar:1,base:105,minD:25,maxD:90,shy:1.1,group:[2,6],speed:.8,land:"indonesia",arb:[8,20],sk:"Kaloň veľký",en:"Large Flying Fox",lat:"Pteropus vampyrus",icon:"🦇",fsk:{live:"Pralesy a mangrovy Bornea, Sumatry a Malajzie",eat:"Figy, mango, nektár a kvetné puky",intr:"Najväčší netopier sveta — rozpätie krídel má aj poldruha metra. Sonar nemá, figy hľadá veľkými očami a čuchom, a cez deň visí hlavou dole v kolónii, kde ich môžu byť tisíce.",stat:"Takmer ohrozený"},fen:{live:"Forests and mangroves of Borneo, Sumatra and Malaysia",eat:"Figs, mangoes, nectar and flower buds",intr:"The world's largest bat — its wings span up to a metre and a half. It has no sonar and finds figs with its big eyes and nose, hanging upside down by day in colonies thousands strong.",stat:"Near threatened"}},{id:"cibetka",draw:"cibetka",h:.32,rar:1,base:95,minD:18,maxD:70,shy:1.4,group:[1,2],speed:1.1,land:"indonesia",arb:[4,12],sk:"Cibetka palmová",en:"Asian Palm Civet",lat:"Paradoxurus hermaphroditus",icon:"🐾",fsk:{live:"Pralesy, plantáže aj strechy dedín juhovýchodnej Ázie",eat:"Ovocie, palmové plody, hmyz a drobné stavovce",intr:"Zožerie kávové čerešne a zrnká jej prejdú celým bruchom — z nich sa potom robí najdrahšia káva na svete. Cez deň spí stočená v korune, v noci ju prezradia svietiace oči.",stat:"Málo dotknutý"},fen:{live:"Rainforest, plantations and even village roofs of Southeast Asia",eat:"Fruit, palm fruit, insects and small animals",intr:"It eats coffee cherries and the beans pass right through it — that is how the world's most expensive coffee is made. It sleeps curled in the canopy by day and its shining eyes give it away at night.",stat:"Least concern"}},{id:"tarsier",draw:"tarsier",h:.13,rar:3,base:520,minD:8,maxD:32,shy:1.6,group:[1,2],speed:.9,land:"indonesia",arb:[2,8],sk:"Okáň západný",en:"Western Tarsier",lat:"Cephalopachus bancanus",icon:"👀",fsk:{live:"Podrast dažďových pralesov Bornea a Sumatry",eat:"Iba mäso — hmyz, jašteričky, drobné vtáky",intr:"Každé oko má väčšie ako vlastný mozog a v jamke sa mu vôbec nedá pohnúť — preto otáča hlavu skoro dokola. Je to jediný primát, ktorý nezje ani kúsok rastliny.",stat:"Zraniteľný"},fen:{live:"Rainforest undergrowth of Borneo and Sumatra",eat:"Meat only — insects, small lizards and birds",intr:"Each eyeball is bigger than its own brain and cannot move in the socket, so it swivels its head almost all the way round. It is the only primate that eats no plants at all.",stat:"Vulnerable"}},{id:"varanzeleny",draw:"varanzeleny",h:.2,rar:2,base:240,minD:14,maxD:55,shy:1.3,group:[1,2],speed:.9,land:"indonesia",arb:[3,10],sk:"Varan smaragdový",en:"Emerald Tree Monitor",lat:"Varanus prasinus",icon:"🦎",fsk:{live:"Koruny pralesov Novej Guiney a okolitých indonézskych ostrovov",eat:"Hmyz — najradšej paličkovce, ďalej kobylky a kraby",intr:"Jediný varan, ktorý sa chvostom drží konárov ako opica — chvost má dlhší než celý zvyšok tela. Na rozdiel od ostatných varanov žije v malých skupinkách.",stat:"Málo dotknutý"},fen:{live:"Rainforest canopy of New Guinea and nearby Indonesian islands",eat:"Insects — stick insects above all, plus grasshoppers and crabs",intr:"The only monitor lizard that grips branches with its tail like a monkey — the tail is longer than the whole rest of its body. Unlike other monitors it lives in small groups.",stat:"Least concern"}}),Object.assign(AKTIVITA,{gaur:"oba",sambar:"sumrak",diviakindicky:"oba",krokodilbahenny:"den",nilgai:"den",binturong:"noc",kalon:"noc",cibetka:"noc",tarsier:"noc",varanzeleny:"den"}),Object.assign(NOVE_WEIGHTS,{ranthambore:{gaur:.6,sambar:1.25,diviakindicky:1.15,krokodilbahenny:.6,nilgai:1},borneo:{binturong:.5,kalon:.95,cibetka:.8,tarsier:.3,varanzeleny:.6}}),Object.assign(DRAW,{_juhTvar(e,a){const t=a.length;e.beginPath(),e.moveTo((a[t-1][0]+a[0][0])/2,(a[t-1][1]+a[0][1])/2);for(let o=0;o<t;o++){const l=a[o],i=a[(o+1)%t];e.quadraticCurveTo(l[0],l[1],(l[0]+i[0])/2,(l[1]+i[1])/2)}e.closePath()},_juhUcho(e,a,t,o,l,i,n,r){e.fillStyle=n,ell(e,a,t,o,l,i),DET>.22&&(e.fillStyle=r,ell(e,a+.12*o,t+.14*l,.52*o,.52*l,i))},_juhMakka(e,a,t,o,l,i,n,r){if(DET<.12)return;DRAW._juhRC=DRAW._juhRC||{};let s=DRAW._juh ern USA through Costa Rica to Colombia",eat:"Insects, spiders, lizards and fruit, rooted out of the leaf litter with the snout",intr:"Its snout is so mobile that it swivels in every direction like a tiny trunk and can sniff out a beetle under bark. Females and young travel in noisy bands with their tails held straight up like flags so nobody gets lost in the undergrowth.",stat:"Least concern"}},{id:"kinkaju",draw:"kinkaju",h:.3,rar:2,base:215,minD:12,maxD:60,shy:1.4,group:[1,2],speed:1,land:"costarica",arb:[6,16],sk:"Kinkažu",en:"Kinkajou",lat:"Potos flavus",icon:"🐻",fsk:{live:"Koruny dažďových lesov od Mexika po Brazíliu — na zem takmer nezíde",eat:"Zrelé ovocie, nektár a med; jazyk má dlhý dvanásť centimetrov",intr:"Je príbuzný medvedíka čistotného, no má chápavý chvost ako opica — visí na ňom hlavou dole a oboma rukami si trhá ovocie. Keď pije nektár z kvetov, opeľuje ich, takže robí prales aj kvetinárom.",stat:"Málo dotknutý"},fen:{live:"Rainforest canopy from Mexico to Brazil — it hardly ever comes down",eat:"Ripe fruit, nectar and honey, reached with a twelve-centimetre tongue",intr:"It is a relative of the raccoon, yet it has a prehensile tail like a monkey — it hangs by it upside down and picks fruit with both hands. Drinking nectar from flowers, it pollinates them, so it gardens the forest too.",stat:"Least concern"}},{id:"bazilisok",draw:"bazilisok",h:.24,rar:1,base:110,minD:10,maxD:45,shy:1.3,group:[1,2],speed:1.5,land:"costarica",sk:"Bazilišok zelený",en:"Plumed Basilisk",lat:"Basiliscus plumifrons",icon:"🦎",fsk:{live:"Kríky a konáre nad potokmi a riekami v lesoch Strednej Ameriky",eat:"Hmyz, malé jašterice, kvety a plody",intr:"Keď ho niečo vyplaší, spustí sa na zadné nohy a rozbehne sa PO HLADINE — na prstoch má kožné lemy, ktoré rozprestrie, a dokáže tak prebehnúť aj dvadsať metrov vody. Preto mu hovoria „Ježišova jašterica“. Vysoké hrebene na hlave a chrbte nosia iba samce.",stat:"Málo dotknutý"},fen:{live:"Bushes and branches over streams and rivers in Central American forest",eat:"Insects, small lizards, flowers and fruit",intr:"Startled, it rears onto its hind legs and sprints ACROSS THE WATER — flaps of skin on its toes spread out and carry it up to twenty metres. That is why it is called the Jesus Christ lizard. Only males carry the tall crests on head and back.",stat:"Least concern"}},{id:"pekaribiely",draw:"pekaribiely",h:.55,rar:1,base:95,minD:22,maxD:120,shy:1.3,group:[6,14],speed:1.2,land:"costarica",sk:"Pekari bielobradý",en:"White-lipped Peccary",lat:"Tayassu pecari",icon:"🐗",fsk:{live:"Súvislé dažďové lesy od Mexika po Argentínu — potrebuje veľké nerušené územie",eat:"Padnuté plody, orechy a korene; rozhryzie aj tvrdé palmové orechy",intr:"Chodí v stádach po sto aj tristo kusoch, ktoré cez les valia ako živá rieka a počuť ich na sto metrov podľa cvakania zubov. Keď sa cíti ohrozené, celé stádo sa otočí a postaví sa útočníkovi — aj jaguár radšej ustúpi.",stat:"Zraniteľný"},fen:{live:"Unbroken rainforest from Mexico to Argentina — it needs large undisturbed country",eat:"Fallen fruit, nuts and roots; it can crush even hard palm nuts",intr:"It moves in herds of a hundred or three hundred that roll through the forest like a living river, audible a hundred metres away by the clacking of their teeth. Threatened, the whole herd turns and faces the attacker — even a jaguar backs off.",stat:"Vulnerable"}},{id:"motylmodry",draw:"motylmodry",h:.15,rar:1,base:125,minD:6,maxD:26,shy:1.2,group:[1,3],speed:1.6,land:"costarica",arb:[1,5],sk:"Morpho modrý",en:"Blue Morpho",lat:"Morpho peleides",icon:"🦋",fsk:{live:"Podrast a lesné cestičky dažďových lesov od Mexika po Kolumbiu",eat:"Šťava z prezretého padnutého ovocia, nie nektár z kvetov",intr:"Tá modrá nie je farbivo — krídla sú pokryté priehľadnými šupinkami, ktoré lámu svetlo ako mydlová bublina, takže sa modrá mení podľa uhla pohľadu. Zospodu je motýľ hnedý s očkami, a tak pri každom mávnutí blikne a zase zmizne.",stat:"Málo dotknutý"},fen:{live:"Undergrowth and forest trails of rainforest from Mexico to Colombia",eat:"Juice from overripe fallen fruit, not flower nectar",intr:"That blue is not a pigment — the wings carry transparent scales that split light like a soap bubble, so the colour shifts with the angle. Underneath the butterfly is brown with eyespots, so with every wingbeat it flashes blue and vanishes again.",stat:"Least concern"}}),Object.assign(AKTIVITA,{kinkaju:"noc",nosal:"den",pekaribiely:"oba"}),Object.assign(NOVE_WEIGHTS,{monteverde:{nosal:1.3,motylmodry:1.05,bazilisok:.9,pekaribiely:.8,kinkaju:.5}}),SPECIES.push({id:"pekari",draw:"pekari",h:.5,rar:0,base:22,minD:22,maxD:110,shy:1.15,group:[4,9],speed:1.1,land:"brazil",sk:"Pekari pásavý",en:"Collared Peccary",lat:"Pecari tajacu",icon:"🐗",fsk:{live:"Od juhozápadu USA po Argentínu — húštiny, suché lesy aj okraje mokradí",eat:"Korene, plody, kaktusy, hľuzy; vyrýva ich rypákom zo zeme",intr:"Vyzerá ako prasa, ale prasa to nie je — má len tri prsty na zadných nohách a rovné špiciaky mierené nadol, ktoré si pri cvakaní brúsi ako nožnice. Na chrbte nosí pachovú žľazu a celé stádo sa ňou navzájom natiera, aby všetci voňali rovnako.",stat:"Málo dotknutý"},fen:{live:"From the south-western USA to Argentina — thickets, dry forest and wetland edges",eat:"Roots, fruit, cactus and tubers, rooted out of the ground with its snout",intr:"It looks like a pig but is not one — it has only three toes behind and straight downward tusks that it hones like scissors by clacking them. A scent gland on its back lets the whole herd rub each other until everyone smells the same.",stat:"Least concern"}},{id:"vydraobrovska",draw:"vydraobrovska",h:.48,rar:2,base:250,minD:24,maxD:125,shy:1.35,group:[2,5],speed:1.1,land:"brazil",sk:"Vydra obrovská",en:"Giant Otter",lat:"Pteronura brasiliensis",icon:"🦦",fsk:{live:"Pomalé rieky, jazerá a zaplavené lesy Amazónie a Pantanalu",eat:"Ryby — denne zje až tri kilá, najradšej sumčeky a piraňe",intr:"Meria takmer dva metre a je to najdlhšia lasicovitá šelma sveta. Biela škvrna na hrdle má u každej vydry iný tvar — ako odtlačok prsta, a vydry sa podľa nej navzájom spoznávajú.",stat:"Ohrozený"},fen:{live:"Slow rivers, lakes and flooded forest of Amazonia and the Pantanal",eat:"Fish — up to three kilos a day, mostly catfish and piranha",intr:"Nearly two metres long, it is the longest member of the weasel family on Earth. The white throat patch is a different shape on every otter — like a fingerprint, and they recognise each other by it.",stat:"Endangered"}},{id:"hoacin",draw:"hoacin",h:.62,rar:2,base:215,minD:18,maxD:85,shy:1.25,group:[3,7],speed:.9,land:"brazil",arb:[3,10],sk:"Hoacin chochlatý",en:"Hoatzin",lat:"Opisthocomus hoazin",icon:"🐦",fsk:{live:"Kroviny nad vodou v zaplavených lesoch Amazónie a Orinoka",eat:"Iba listy — kvasia mu vo veľkom hrvoli ako v kravskom bachore",intr:"Mláďa má na krídlach dva pazúry: keď ho vyplaší had, skočí z hniezda do vody, odpláva a potom sa po týchto pazúroch vyšplhá po konári späť. Z kvasenia listov hoacinovi zapácha, takže mu domáci hovoria „smradľavý vták“ a nikto ho neloví.",stat:"Málo dotknutý"},fen:{live:"Waterside thickets in the flooded forests of the Amazon and Orinoco",eat:"Leaves only — fermented in a huge crop that works like a cow's rumen",intr:"The chick has two claws on each wing: if a snake frightens it, it drops into the water, swims away, then climbs back up the branch using those claws. All that fermenting makes the bird smell, so locals call it the stinkbird and nobody hunts it.",stat:"Least concern"}},{id:"jaguarundi",draw:"jaguarundi",h:.35,rar:2,base:200,minD:18,maxD:115,shy:1.6,group:[1,1],speed:1.3,land:"brazil",pred:!0,sk:"Jaguarundi",en:"Jaguarundi",lat:"Herpailurus yagouaroundi",icon:"🐈",fsk:{live:"Húštiny, brehy riek a okraje lesov od Mexika po Argentínu",eat:"Hlodavce, jašterice a vtáky — loví na zemi, cez deň",intr:"Mačka, ktorá vyzerá ako lasica: dlhé nízke telo, krátke nohy, malá plochá hlava a chvost dlhší než pol tela. Ako jediná americká mačka loví hlavne cez deň a jej najbližší príbuzný je puma.",stat:"Málo dotknutý"},fen:{live:"Thickets, riverbanks and forest edges from Mexico to Argentina",eat:"Rodents, lizards and birds, hunted on the ground in daylight",intr:"A cat built like a weasel: long low body, short legs, small flat head and a tail longer than half its body. It is the one American cat that hunts mainly by day, and its closest relative is the puma.",stat:"Least concern"}},{id:"aguti",draw:"aguti",h:.33,rar:0,base:20,minD:16,maxD:85,shy:1.35,group:[1,3],speed:1.3,land:"brazil",sk:"Aguti",en:"Central American Agouti",lat:"Dasyprocta punctata",icon:"🐀",fsk:{live:"Dažďové lesy a ich okraje od južného Mexika po severnú Argentínu",eat:"Opadané plody a orechy; prebytok zahrabáva do malých skrýš",intr:"Má zuby dosť silné na to, aby prehrýzol orech para, ktorý neotvorí nik iný. Časť skrýš potom zabudne — a práve z nich vyrastú nové stromy, takže aguti prales vlastne vysádza.",stat:"Málo dotknutý"},fen:{live:"Rainforest and forest edges from southern Mexico to northern Argentina",eat:"Fallen fruit and nuts; surplus is buried in scattered caches",intr:"Its teeth are strong enough to crack a Brazil nut, which almost nothing else can open. It then forgets some of its buried caches — and those become new trees, so the agouti quietly plants the forest.",stat:"Least concern"}}),Object.assign(AKTIVITA,{vydraobrovska:"den",jaguarundi:"den"}),Object.assign(NOVE_WEIGHTS,{pantanal:{pekari:1.25,aguti:1.05,hoacin:.6,vydraobrovska:.5,jaguarundi:.4}}),SPECIES.push({id:"bonobo",draw:"bonobo",h:1.15,rar:3,base:520,minD:26,maxD:105,shy:1.5,group:[2,4],speed:1,land:"kongo",sk:"Bonobo",en:"Bonobo",lat:"Pan paniscus",icon:"🐵",fsk:{live:"Iba nížinné pralesy južne od rieky Kongo — nikde inde na svete",eat:"Ovocie, byle, huby, občas hmyz alebo malý cicavec",intr:"Rieka Kongo ho pred miliónmi rokov oddelila od šimpanzov a odvtedy sa vyvíjal sám. Skupinu vedie stará samica a spory sa tu neriešia bitkou, ale objatím a prehrabávaním srsti. Na temene má vlasy rozdelené pútcom presne po strede, ako keby ho práve učesali.",stat:"Ohrozený"},fen:{live:"Only the lowland forests south of the Congo River — nowhere else on Earth",eat:"Fruit, stems, fungi and the occasional insect or small mammal",intr:"The Congo River cut it off from chimpanzees millions of years ago and it has gone its own way since. An old female leads the group, and quarrels are settled by hugging and grooming rather than fighting. Its head hair is famously split by a neat central parting.",stat:"Endangered"}},{id:"mandril",draw:"mandril",h:.62,rar:2,base:270,minD:22,maxD:100,shy:1.4,group:[3,8],speed:1.1,land:"kongo",sk:"Mandril",en:"Mandrill",lat:"Mandrillus sphinx",icon:"🐒",fsk:{live:"Dažďové lesy Kamerunu, Gabonu, Rovníkovej Guiney a Konga",eat:"Ovocie, semená, korene, hmyz; hrabe v lístí na zemi",intr:"Je to najfarebnejší cicavec sveta — dospelý samec má modré ryhované líca a jasne červený nos. Čím je zdravší a silnejší, tým sú farby jasnejšie, takže sa v pralesnom šere pozná zďaleka. Mandrily chodia v obrovských tlupách, aké nemá žiadny iný primát.",stat:"Zraniteľný"},fen:{live:"Rainforests of Cameroon, Gabon, Equatorial Guinea and Congo",eat:"Fruit, seeds, roots and insects, raked out of the forest floor",intr:"It is the most colourful mammal on Earth — an adult male has blue ridged cheeks and a bright red nose. The healthier and stronger he is, the brighter the colours, so he can be read from far off in the forest gloom. Mandrills travel in the biggest troops of any primate.",stat:"Vulnerable"}},{id:"pangolin",draw:"pangolin",h:.45,rar:3,base:560,minD:20,maxD:100,shy:1.6,group:[1,1],speed:.7,land:"kongo",sk:"Pangolín veľký",en:"Giant Pangolin",lat:"Smutsia gigantea",icon:"🦔",fsk:{live:"Dažďové lesy a vlhké savany rovníkovej Afriky",eat:"Iba mravce a termity — jazykom dlhším než celé telo, zubov nemá ani jeden",intr:"Je to jediný cicavec na svete pokrytý šupinami; sú z keratínu, teda z toho istého, z čoho máš nechty. Keď sa zľakne, zvinie sa do gule, ktorú neotvorí ani lev. A práve pre tie šupiny je pangolín najpytliačenejším cicavcom sveta.",stat:"Ohrozený"},fen:{live:"Rainforest and moist savanna of equatorial Africa",eat:"Ants and termites only, licked up with a tongue longer than its whole body; it has no teeth at all",intr:"It is the only mammal on Earth covered in scales, made of keratin — the same stuff as your fingernails. Frightened, it rolls into a ball that not even a lion can open. And it is exactly those scales that make the pangolin the most trafficked mammal in the world.",stat:"Endangered"}},{id:"mangabej",draw:"mangabej",h:.55,rar:1,base:112,minD:20,maxD:95,shy:1.35,group:[3,7],speed:1.3,land:"kongo",arb:[5,14],sk:"Mangabej chocholatý",en:"Grey-cheeked Mangabey",lat:"Lophocebus albigena",icon:"🐒",fsk:{live:"Vysoké koruny pralesov strednej Afriky — na zem takmer nezíde",eat:"Ovocie a hlavne tvrdé orechy, ktoré iné opice neprelúskajú",intr:"Samce majú v hrdle vzduchový vak a hučia ním tak hlboko, že ich počuť cez kilometer hustého lesa. Tak si skupiny odkazujú, kde ktorá je, bez toho, aby sa museli stretnúť.",stat:"Zraniteľný"},fen:{live:"The high canopy of central African rainforest — it almost never comes down",eat:"Fruit and especially hard nuts that other monkeys cannot crack",intr:"Males have an air sac in the throat and use it to boom so deeply that the sound carries over a kilometre of dense forest. That is how groups tell each other where they are without ever meeting.",stat:"Vulnerable"}},{id:"genetka",draw:"genetka",h:.22,rar:1,base:120,minD:12,maxD:60,shy:1.5,group:[1,1],speed:1.4,land:"kongo",arb:[2,9],sk:"Geneta škvrnitá",en:"Rusty-spotted Genet",lat:"Genetta maculata",icon:"🐈",fsk:{live:"Lesy a húštiny takmer celej subsaharskej Afriky, hlavne v korunách",eat:"Hlodavce, vtáky, hmyz, ovocie; loví po nociach na vetvách",intr:"Nie je to mačka, hoci tak vyzerá — je príbuzná cibetiek a mangúst. Telo má také tenké, že prejde všade, kam sa jej zmestí hlava, a
