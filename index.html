uhozápadu USA cez Kostariku až po Kolumbiu",eat:"Hmyz, pavúky, jašterice, ovocie; ňufákom prehŕňa lístie",intr:"Ňufák má taký pohyblivý, že ním krúti do všetkých strán ako malým chobotom a vyňuchá ním chrobáka pod kôrou. Samice s mláďatami chodia v hlučných tlupách a chvosty držia kolmo hore ako zástavy, aby sa v húštine nestratili.",stat:"Málo dotknutý"},fen:{live:"Forests from the south-western USA through Costa Rica to Colombia",eat:"Insects, spiders, lizards and fruit, rooted out of the leaf litter with the snout",intr:"Its snout is so mobile that it swivels in every direction like a tiny trunk and can sniff out a beetle under bark. Females and young travel in noisy bands with their tails held straight up like flags so nobody gets lost in the undergrowth.",stat:"Least concern"}},{id:"kinkaju",draw:"kinkaju",h:.3,rar:2,base:215,minD:12,maxD:60,shy:1.4,group:[1,2],speed:1,land:"costarica",arb:[6,16],sk:"Kinkažu",en:"Kinkajou",lat:"Potos flavus",icon:"🐻",fsk:{live:"Koruny dažďových lesov od Mexika po Brazíliu — na zem takmer nezíde",eat:"Zrelé ovocie, nektár a med; jazyk má dlhý dvanásť centimetrov",intr:"Je príbuzný medvedíka čistotného, no má chápavý chvost ako opica — visí na ňom hlavou dole a oboma rukami si trhá ovocie. Keď pije nektár z kvetov, opeľuje ich, takže robí prales aj kvetinárom.",stat:"Málo dotknutý"},fen:{live:"Rainforest canopy from Mexico to Brazil — it hardly ever comes down",eat:"Ripe fruit, nectar and honey, reached with a twelve-centimetre tongue",intr:"It is a relative of the raccoon, yet it has a prehensile tail like a monkey — it hangs by it upside down and picks fruit with both hands. Drinking nectar from flowers, it pollinates them, so it gardens the forest too.",stat:"Least concern"}},{id:"bazilisok",draw:"bazilisok",h:.24,rar:1,base:110,minD:10,maxD:45,shy:1.3,group:[1,2],speed:1.5,land:"costarica",sk:"Bazilišok zelený",en:"Plumed Basilisk",lat:"Basiliscus plumifrons",icon:"🦎",fsk:{live:"Kríky a konáre nad potokmi a riekami v lesoch Strednej Ameriky",eat:"Hmyz, malé jašterice, kvety a plody",intr:"Keď ho niečo vyplaší, spustí sa na zadné nohy a rozbehne sa PO HLADINE — na prstoch má kožné lemy, ktoré rozprestrie, a dokáže tak prebehnúť aj dvadsať metrov vody. Preto mu hovoria „Ježišova jašterica“. Vysoké hrebene na hlave a chrbte nosia iba samce.",stat:"Málo dotknutý"},fen:{live:"Bushes and branches over streams and rivers in Central American forest",eat:"Insects, small lizards, flowers and fruit",intr:"Startled, it rears onto its hind legs and sprints ACROSS THE WATER — flaps of skin on its toes spread out and carry it up to twenty metres. That is why it is called the Jesus Christ lizard. Only males carry the tall crests on head and back.",stat:"Least concern"}},{id:"pekaribiely",draw:"pekaribiely",h:.55,rar:1,base:95,minD:22,maxD:120,shy:1.3,group:[6,14],speed:1.2,land:"costarica",sk:"Pekari bielobradý",en:"White-lipped Peccary",lat:"Tayassu pecari",icon:"🐗",fsk:{live:"Súvislé dažďové lesy od Mexika po Argentínu — potrebuje veľké nerušené územie",eat:"Padnuté plody, orechy a korene; rozhryzie aj tvrdé palmové orechy",intr:"Chodí v stádach po sto aj tristo kusoch, ktoré cez les valia ako živá rieka a počuť ich na sto metrov podľa cvakania zubov. Keď sa cíti ohrozené, celé stádo sa otočí a postaví sa útočníkovi — aj jaguár radšej ustúpi.",stat:"Zraniteľný"},fen:{live:"Unbroken rainforest from Mexico to Argentina — it needs large undisturbed country",eat:"Fallen fruit, nuts and roots; it can crush even hard palm nuts",intr:"It moves in herds of a hundred or three hundred that roll through the forest like a living river, audible a hundred metres away by the clacking of their teeth. Threatened, the whole herd turns and faces the attacker — even a jaguar backs off.",stat:"Vulnerable"}},{id:"motylmodry",draw:"motylmodry",h:.15,rar:1,base:125,minD:6,maxD:26,shy:1.2,group:[1,3],speed:1.6,land:"costarica",arb:[1,5],sk:"Morpho modrý",en:"Blue Morpho",lat:"Morpho peleides",icon:"🦋",fsk:{live:"Podrast a lesné cestičky dažďových lesov od Mexika po Kolumbiu",eat:"Šťava z prezretého padnutého ovocia, nie nektár z kvetov",intr:"Tá modrá nie je farbivo — krídla sú pokryté priehľadnými šupinkami, ktoré lámu svetlo ako mydlová bublina, takže sa modrá mení podľa uhla pohľadu. Zospodu je motýľ hnedý s očkami, a tak pri každom mávnutí blikne a zase zmizne.",stat:"Málo dotknutý"},fen:{live:"Undergrowth and forest trails of rainforest from Mexico to Colombia",eat:"Juice from overripe fallen fruit, not flower nectar",intr:"That blue is not a pigment — the wings carry transparent scales that split light like a soap bubble, so the colour shifts with the angle. Underneath the butterfly is brown with eyespots, so with every wingbeat it flashes blue and vanishes again.",stat:"Least concern"}}),Object.assign(AKTIVITA,{kinkaju:"noc",nosal:"den",pekaribiely:"oba"}),Object.assign(NOVE_WEIGHTS,{monteverde:{nosal:1.3,motylmodry:1.05,bazilisok:.9,pekaribiely:.8,kinkaju:.5}}),SPECIES.push({id:"pekari",draw:"pekari",h:.5,rar:0,base:22,minD:22,maxD:110,shy:1.15,group:[4,9],speed:1.1,land:"brazil",sk:"Pekari pásavý",en:"Collared Peccary",lat:"Pecari tajacu",icon:"🐗",fsk:{live:"Od juhozápadu USA po Argentínu — húštiny, suché lesy aj okraje mokradí",eat:"Korene, plody, kaktusy, hľuzy; vyrýva ich rypákom zo zeme",intr:"Vyzerá ako prasa, ale prasa to nie je — má len tri prsty na zadných nohách a rovné špiciaky mierené nadol, ktoré si pri cvakaní brúsi ako nožnice. Na chrbte nosí pachovú žľazu a celé stádo sa ňou navzájom natiera, aby všetci voňali rovnako.",stat:"Málo dotknutý"},fen:{live:"From the south-western USA to Argentina — thickets, dry forest and wetland edges",eat:"Roots, fruit, cactus and tubers, rooted out of the ground with its snout",intr:"It looks like a pig but is not one — it has only three toes behind and straight downward tusks that it hones like scissors by clacking them. A scent gland on its back lets the whole herd rub each other until everyone smells the same.",stat:"Least concern"}},{id:"vydraobrovska",draw:"vydraobrovska",h:.48,rar:2,base:250,minD:24,maxD:125,shy:1.35,group:[2,5],speed:1.1,land:"brazil",sk:"Vydra obrovská",en:"Giant Otter",lat:"Pteronura brasiliensis",icon:"🦦",fsk:{live:"Pomalé rieky, jazerá a zaplavené lesy Amazónie a Pantanalu",eat:"Ryby — denne zje až tri kilá, najradšej sumčeky a piraňe",intr:"Meria takmer dva metre a je to najdlhšia lasicovitá šelma sveta. Biela škvrna na hrdle má u každej vydry iný tvar — ako odtlačok prsta, a vydry sa podľa nej navzájom spoznávajú.",stat:"Ohrozený"},fen:{live:"Slow rivers, lakes and flooded forest of Amazonia and the Pantanal",eat:"Fish — up to three kilos a day, mostly catfish and piranha",intr:"Nearly two metres long, it is the longest member of the weasel family on Earth. The white throat patch is a different shape on every otter — like a fingerprint, and they recognise each other by it.",stat:"Endangered"}},{id:"hoacin",draw:"hoacin",h:.62,rar:2,base:215,minD:18,maxD:85,shy:1.25,group:[3,7],speed:.9,land:"brazil",arb:[3,10],sk:"Hoacin chochlatý",en:"Hoatzin",lat:"Opisthocomus hoazin",icon:"🐦",fsk:{live:"Kroviny nad vodou v zaplavených lesoch Amazónie a Orinoka",eat:"Iba listy — kvasia mu vo veľkom hrvoli ako v kravskom bachore",intr:"Mláďa má na krídlach dva pazúry: keď ho vyplaší had, skočí z hniezda do vody, odpláva a potom sa po týchto pazúroch vyšplhá po konári späť. Z kvasenia listov hoacinovi zapácha, takže mu domáci hovoria „smradľavý vták“ a nikto ho neloví.",stat:"Málo dotknutý"},fen:{live:"Waterside thickets in the flooded forests of the Amazon and Orinoco",eat:"Leaves only — fermented in a huge crop that works like a cow's rumen",intr:"The chick has two claws on each wing: if a snake frightens it, it drops into the water, swims away, then climbs back up the branch using those claws. All that fermenting makes the bird smell, so locals call it the stinkbird and nobody hunts it.",stat:"Least concern"}},{id:"jaguarundi",draw:"jaguarundi",h:.35,rar:2,base:200,minD:18,maxD:115,shy:1.6,group:[1,1],speed:1.3,land:"brazil",pred:!0,sk:"Jaguarundi",en:"Jaguarundi",lat:"Herpailurus yagouaroundi",icon:"🐈",fsk:{live:"Húštiny, brehy riek a okraje lesov od Mexika po Argentínu",eat:"Hlodavce, jašterice a vtáky — loví na zemi, cez deň",intr:"Mačka, ktorá vyzerá ako lasica: dlhé nízke telo, krátke nohy, malá plochá hlava a chvost dlhší než pol tela. Ako jediná americká mačka loví hlavne cez deň a jej najbližší príbuzný je puma.",stat:"Málo dotknutý"},fen:{live:"Thickets, riverbanks and forest edges from Mexico to Argentina",eat:"Rodents, lizards and birds, hunted on the ground in daylight",intr:"A cat built like a weasel: long low body, short legs, small flat head and a tail longer than half its body. It is the one American cat that hunts mainly by day, and its closest relative is the puma.",stat:"Least concern"}},{id:"aguti",draw:"aguti",h:.33,rar:0,base:20,minD:16,maxD:85,shy:1.35,group:[1,3],speed:1.3,land:"brazil",sk:"Aguti",en:"Central American Agouti",lat:"Dasyprocta punctata",icon:"🐀",fsk:{live:"Dažďové lesy a ich okraje od južného Mexika po severnú Argentínu",eat:"Opadané plody a orechy; prebytok zahrabáva do malých skrýš",intr:"Má zuby dosť silné na to, aby prehrýzol orech para, ktorý neotvorí nik iný. Časť skrýš potom zabudne — a práve z nich vyrastú nové stromy, takže aguti prales vlastne vysádza.",stat:"Málo dotknutý"},fen:{live:"Rainforest and forest edges from southern Mexico to northern Argentina",eat:"Fallen fruit and nuts; surplus is buried in scattered caches",intr:"Its teeth are strong enough to crack a Brazil nut, which almost nothing else can open. It then forgets some of its buried caches — and those become new trees, so the agouti quietly plants the forest.",stat:"Least concern"}}),Object.assign(AKTIVITA,{vydraobrovska:"den",jaguarundi:"den"}),Object.assign(NOVE_WEIGHTS,{pantanal:{pekari:1.25,aguti:1.05,hoacin:.6,vydraobrovska:.5,jaguarundi:.4}}),SPECIES.push({id:"bonobo",draw:"bonobo",h:1.15,rar:3,base:520,minD:26,maxD: 5,rar:3,base:560,minD:20,maxD:100,shy:1.6,group:[1,1],speed:.7,land:"kongo",sk:"Pangolín veľký",en:"Giant Pangolin",lat:"Smutsia gigantea",icon:"🦔",fsk:{live:"Dažďové lesy a vlhké savany rovníkovej Afriky",eat:"Iba mravce a termity — jazykom dlhším než celé telo, zubov nemá ani jeden",intr:"Je to jediný cicavec na svete pokrytý šupinami; sú z keratínu, teda z toho istého, z čoho máš nechty. Keď sa zľakne, zvinie sa do gule, ktorú neotvorí ani lev. A práve pre tie šupiny je pangolín najpytliačenejším cicavcom sveta.",stat:"Ohrozený"},fen:{live:"Rainforest and moist savanna of equatorial Africa",eat:"Ants and termites only, licked up with a tongue longer than its whole body; it has no teeth at all",intr:"It is the only mammal on Earth covered in scales, made of keratin — the same stuff as your fingernails. Frightened, it rolls into a ball that not even a lion can open. And it is exactly those scales that make the pangolin the most trafficked mammal in the world.",stat:"Endangered"}},{id:"mangabej",draw:"mangabej",h:.55,rar:1,base:112,minD:20,maxD:95,shy:1.35,group:[3,7],speed:1.3,land:"kongo",arb:[5,14],sk:"Mangabej chocholatý",en:"Grey-cheeked Mangabey",lat:"Lophocebus albigena",icon:"🐒",fsk:{live:"Vysoké koruny pralesov strednej Afriky — na zem takmer nezíde",eat:"Ovocie a hlavne tvrdé orechy, ktoré iné opice neprelúskajú",intr:"Samce majú v hrdle vzduchový vak a hučia ním tak hlboko, že ich počuť cez kilometer hustého lesa. Tak si skupiny odkazujú, kde ktorá je, bez toho, aby sa museli stretnúť.",stat:"Zraniteľný"},fen:{live:"The high canopy of central African rainforest — it almost never comes down",eat:"Fruit and especially hard nuts that other monkeys cannot crack",intr:"Males have an air sac in the throat and use it to boom so deeply that the sound carries over a kilometre of dense forest. That is how groups tell each other where they are without ever meeting.",stat:"Vulnerable"}},{id:"genetka",draw:"genetka",h:.22,rar:1,base:120,minD:12,maxD:60,shy:1.5,group:[ 。"],Začiatočník:["Principiante","新手"],Pozorovateľ:["Observador","观察者"],Fotograf:["Fotógrafo","摄影师"],Dokumentarista:["Documentalista","纪录片人"],"Legenda divočiny":["Leyenda de la naturaleza","荒野传奇"],"Masai Mara — Otvorená pláň":["Masái Mara — Llanura abierta","马赛马拉——开阔平原"],"Nekonečná tráva a akácie. Veľké stáda, dobrý výhľad, zvieratá ďaleko.":["Hierba infinita y acacias. Grandes manadas, buena vista, animales lejos.","无边的草原和金合欢树。大群动物，视野开阔，动物离得远。"],"Masai Mara — Rieka Mara":["Masái Mara — Río Mara","马赛马拉——马拉河"],"Zelenší breh, kroviny a voda. Zvieratá chodia piť — sú bližšie, ale aj šelmy.":["Orillas más verdes, matorrales y agua. Los animales vienen a beber: más cerca, pero también los felinos.","更绿的河岸、灌木丛和水。动物来喝水——离得更近，但猫科动物也会来。"],"Ngorongoro — Kráter a jazero":["Ngorongoro — Cráter y lago","恩戈罗恩戈罗——火山口和湖"],"Dno starej sopky obohnané stenou. Plytké slané jazero, plameniaky a hyeny.":["El fondo de un viejo volcán rodeado por su pared. Un lago salado poco profundo, flamencos y hienas.","古老火山的底部，四周环绕着火山壁。浅浅的盐湖、火烈鸟和鬣狗。"],"Ranthambore — Suchý les":["Ranthambore — Bosque seco","兰坦博尔——干燥森林"],"Redký les, vysoká zlatá tráva a staré ruiny. Tiger tu je, len ho treba nájsť.":["Bosque abierto, hierba alta y dorada y viejas ruinas. El tigre está aquí: solo tienes que encontrarlo.","稀疏的森林、高高的金色草丛和古老的遗迹。老虎就在这里——你只需要找到它。"],"Borneo — Dažďový prales":["Borneo — Selva tropical","婆罗洲——热带雨林"],"Zeleno a šero. Väčšina zvierat je vysoko v korunách — treba dvíhať hlavu.":["Verde y en penumbra. La mayoría de los animales están arriba, en las copas: mirarás hacia arriba.","绿色而昏暗。大多数动物在高高的树冠上——你得抬头看。"],"Pantanal — Mokrade":["Pantanal — Humedales","潘塔纳尔——湿地"],"Najväčšia mokraď sveta. Voda všade, palmy, kajmany na brehu a niekde jaguár.":["El humedal más grande del mundo. Agua por todas partes, palmeras, caimanes en la orilla… y en algún sitio, un jaguar.","世界上最大的湿地。到处是水、棕榈树，岸边有凯门鳄——某处还有一只美洲豹。"],"Ituri — Konžský prales":["Ituri — Selva del Congo","伊图里——刚果雨林"],"Najhustejší les Afriky. Domov okapi, goríl a šimpanzov — a takmer nikoho iného.":["El bosque más denso de África. Hogar de okapis, gorilas y chimpancés, y de casi nadie más.","非洲最茂密的森林。霍加狓、大猩猩和黑猩猩的家——几乎没有别人。"],"Monteverde — Hmlistý les":["Monteverde — Bosque nuboso","蒙特维多——云雾森林"],"Machom obrastené stromy a hmla, ktorá príde a odíde. Najmenšie a najvzácnejšie druhy hry.":["Árboles cubiertos de musgo y niebla que va y viene. Las especies más pequeñas y raras del juego.","长满苔藓的树和时来时去的雾。游戏中最小、最稀有的物种。"],"Vysoké Tatry — Kosodrevina":["Altos Tatras — Pino enano","高塔特拉山——偃松带"],"Smrekový les prechádza do kosodreviny a holých brál. Domáca príroda, ktorú Adamko pozná z výletov.":["El bosque de abetos da paso al pino enano y a las rocas desnudas. La naturaleza de casa.","云杉林渐渐变成偃松和裸露的岩石。家乡的荒野。"],"Wolong — Bambusový les":["Wolong — Bosque de bambú","卧龙——竹林"],"Husté bambusové steny v horskej hmle. Vidieť ďaleko sa nedá, počuť však áno.":["Densas paredes de bambú en la niebla de la montaña. No se ve lejos, pero se oye.","山雾中密密的竹墙。看不远——但听得见。"],"Yellowstone — Údolie Lamar":["Yellowstone — Valle de Lamar","黄石——拉马尔山谷"],"Široké údolie medzi borovicami, para z gejzírov a najväčšie stáda Severnej Ameriky.":["Un amplio valle entre pinos, vapor de géiseres y las mayores manadas de Norteamérica.","松林间宽阔的山谷、间歇泉的蒸汽和北美最大的兽群。"],"Fernandina — Lávové pobrežie":["Fernandina — Costa de lava","费尔南迪纳岛——熔岩海岸"],"Čierna láva, príboj a zvieratá, ktoré sa človeka vôbec neboja. Nikde inde na svete takto neexistujú.":["Lava negra, olas y animales que no temen a las personas. No existen en ningún otro lugar de la Tierra.","黑色熔岩、海浪，还有不怕人的动物。它们在地球上别处都没有。"],"Koralový útes — Pod hladinou":["Arrecife de coral — Bajo el agua","珊瑚礁——水下"],"Potápačský oblek, fotoaparát v púzdre a osemnásť metrov vody nad hlavou. Ryby plávajú v každej výške.":["Traje de neopreno, la cámara en una carcasa y dieciocho metros de agua encima. Hay peces a todas las profundidades.","穿上潜水服，相机装进防水壳，头顶十八米深的水。各个深度都有鱼在游。"],"Polárne kraje — Ľadové pobrežie":["Tierras polares — Costa
