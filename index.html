<head>

<title>BBC fotoreportér</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0d0c;font-family:'Trebuchet MS',Verdana,sans-serif;color:#f2ede2;user-select:none}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
  /* justify-content:center by pri dlhom obsahu odrezal vrch nad scrollTop=0 a
     nedal sa dorolovať. "safe center" centruje len keď sa obsah zmestí; kde ho
     prehliadač nepozná, ostane flex-start a všetko je dosiahnuteľné. */
  .scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
       justify-content:flex-start;justify-content:safe center;
       background:radial-gradient(ellipse at 50% 40%,#20301f 0%,#0d1310 70%,#070908 100%);
       z-index:10;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .scr>*{flex-shrink:0}
  .scr.on{display:flex}
  h1{font-size:clamp(30px,7vw,62px);letter-spacing:3px;color:#ffd97a;text-shadow:0 4px 20px rgba(0,0,0,.7);margin-bottom:4px;text-align:center}
  .sub{font-size:clamp(12px,2.4vw,17px);color:#a8bfa0;letter-spacing:5px;text-transform:uppercase;margin-bottom:28px;text-align:center}
  .card{background:rgba(12,20,15,.82);border:1px solid rgba(255,217,122,.28);border-radius:14px;padding:20px 24px;max-width:760px;width:100%;margin-bottom:16px;backdrop-filter:blur(4px)}
  .card h2{font-size:17px;color:#ffd97a;margin-bottom:10px;letter-spacing:1px}
  .card p,.card li{font-size:14px;line-height:1.65;color:#d6e0cf}
  .card ul{margin-left:18px}
  .btn{background:linear-gradient(#3f6b3a,#264423);border:1px solid #6f9d63;color:#f4f7ee;font-size:17px;font-weight:bold;
       padding:14px 30px;border-radius:11px;cursor:pointer;margin:6px;letter-spacing:1px;transition:.15s;font-family:inherit}
  .btn:hover{background:linear-gradient(#4e8446,#31572c);transform:translateY(-2px)}
  .btn.gold{background:linear-gradient(#b8892f,#7d5a17);border-color:#ffd97a;color:#fff8e4}
  .btn.gold:hover{background:linear-gradient(#d0a03f,#96701f)}
  .btn.sm{font-size:14px;padding:12px 18px;min-height:44px}
  .row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
  .kbd{display:inline-block;background:#1d2a1c;border:1px solid #4d6b45;border-radius:5px;padding:1px 8px;font-size:12px;color:#ffd97a;margin:0 3px}
  #lang{position:absolute;top:14px;right:14px;z-index:20;display:flex;gap:6px}
  #lang button{background:rgba(0,0,0,.5);border:1px solid #6f9d63;color:#cfe0c4;border-radius:7px;padding:6px 11px;font-size:13px;cursor:pointer;font-family:inherit}
  #lang button.act{background:#ffd97a;color:#20301f;font-weight:bold;border-color:#ffd97a}
  #lang button{min-width:46px;min-height:44px}
  /* Počas expedície lišta preč: na 1024 px a menej zasahovala do tlačidla STÁŤ
     a ťuknutie prepínalo jazyk namiesto znehybnenia. */
  #lang.hraje{display:none}
  #otoc .ok{margin-top:20px;background:#2d4a28;border:1px solid #6f9d63;color:#dff0d6;border-radius:9px;
    padding:11px 20px;font-size:15px;cursor:pointer;font-family:inherit}
  #otoc{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
        background:rgba(8,12,9,.94);color:#ffd97a;text-align:center;padding:28px;font-size:18px;line-height:1.6}
  #otoc.on{display:flex}
  #otoc .ic{font-size:56px;margin-bottom:14px;animation:otacaj 2s ease-in-out infinite}
  @keyframes otacaj{0%,45%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
  .ph{background:rgba(0,0,0,.45);border:1px solid #40563a;border-radius:9px;overflow:hidden;text-align:center;padding-bottom:8px}
  .ph img{width:100%;display:block;background:#111}
  .ph .nm{font-size:12px;color:#e6eedd;margin-top:6px;font-weight:bold}
  .ph .en{font-size:10px;color:#8fa886;font-style:italic}
  .ph .pt{font-size:15px;color:#ffd97a;font-weight:bold;margin-top:3px}
  .ph .dt{font-size:10px;color:#8fa887;margin-top:2px;letter-spacing:.2px}
  .ph .fb{font-size:10px;color:#9db394;padding:0 6px;margin-top:3px;line-height:1.3}
  .ph.locked{opacity:.35}
  .ph.locked .sil{height:92px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#4c6144}
  .tot{font-size:clamp(28px,6vw,46px);color:#ffd97a;font-weight:bold;text-align:center;letter-spacing:2px}
  .fact{font-size:13px;line-height:1.6;color:#cfdcc6}
  .fact b{color:#ffd97a}
  #toast{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);z-index:9;pointer-events:none;
         background:rgba(6,12,8,.86);border:1px solid rgba(255,217,122,.5);border-radius:12px;padding:12px 22px;
         text-align:center;opacity:0;transition:opacity .25s;max-width:88%}
  #toast .t1{font-size:22px;font-weight:bold;color:#ffd97a}
  #toast .t2{font-size:14px;color:#dfe8d6;margin-top:3px}
  #toast .t3{font-size:12px;color:#93ab8b;margin-top:5px;font-style:italic}
  #touch{position:absolute;inset:0;z-index:30;display:none;pointer-events:none}
  #touch.on{display:block}
  #tbar{position:absolute;left:0;right:0;bottom:0;height:var(--pas,110px);
        display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.4vw,16px);
        padding:0 10px;pointer-events:none;
        background:linear-gradient(180deg,rgba(6,10,7,0) 0%,rgba(6,10,7,.72) 45%,rgba(6,10,7,.92) 100%)}
  .tb{pointer-events:auto;background:rgba(14,24,16,.78);border:2px solid rgba(255,255,255,.38);
      border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
      font-size:clamp(13px,2.1vw,19px);text-align:center;line-height:1.05;
      width:clamp(52px,7.2vw,74px);height:clamp(52px,7.2vw,74px);flex:0 0 auto;
      -webkit-user-select:none;user-select:none;transition:transform .08s,background .08s}
  .tb:active{transform:scale(.92);background:rgba(40,70,44,.92)}
  .tb.big{width:clamp(66px,9.4vw,96px);height:clamp(66px,9.4vw,96px);
          font-size:clamp(24px,3.6vw,34px);background:rgba(170,42,42,.62);border-color:rgba(255,190,190,.75)}
  .tb.warn{background:rgba(170,42,42,.62);border-color:rgba(255,190,190,.75);display:none;font-size:clamp(11px,1.6vw,15px)}
  .tb.safe{background:rgba(38,110,58,.62);border-color:rgba(180,255,190,.75);display:none;font-size:clamp(11px,1.6vw,15px)}
  .tb.warn.on,.tb.safe.on{display:flex}
  .hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;background:rgba(0,0,0,.72);
        border:1px solid #ffd97a;border-radius:12px;padding:16px 26px;font-size:16px;text-align:center;color:#ffd97a;display:none}
  .hint.on{display:block}
  .bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center;margin-bottom:14px;max-width:780px}
  .chip{background:rgba(12,22,15,.85);border:1px solid #40563a;border-radius:20px;padding:5px 13px;font-size:13px;color:#d6e0cf}
  .chip.gold{border-color:#ffd97a;color:#ffd97a;font-weight:bold}
  .chip.sm{font-size:11px;padding:4px 10px}
  .pbar{display:inline-block;width:110px;height:7px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#6f9d63,#ffd97a)}
  .line{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(80,110,70,.25)}
  .line:last-child{border-bottom:none}
  .line.act{background:rgba(255,217,122,.07);border-radius:8px}
  .line .ic{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
  .line .nm{flex:1 1 auto;font-size:14px;color:#e6eedd;min-width:120px}
  .line .cur{font-size:12px;color:#9db394;flex:0 0 auto}
  .line .rt{flex:0 0 auto;text-align:right}

  .lock{color:#7f8a76;font-size:12px;font-style:italic}
  .gold2{color:#ffd97a;font-weight:bold}
  .chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;max-width:900px;width:100%;margin-bottom:16px}
  .ch{background:rgba(12,20,15,.85);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;text-align:center}
  .ch:hover{border-color:var(--c);transform:translateY(-3px)}
  .ch.sel{border-color:var(--c);box-shadow:0 0 18px rgba(255,217,122,.2)}
  .cIc{font-size:36px}
  .cNm{font-size:19px;font-weight:bold;color:var(--c);margin-top:4px}
  .cRo{font-size:12px;color:#9db394;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
  .cDe{font-size:13px;line-height:1.5;color:#d6e0cf}
  .contT{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#8fa886;margin:14px 0 4px}
  .card.locked{opacity:.55}
  .leg{display:flex;align-items:center;gap:12px;font-size:15px;color:#e6eedd;padding:7px 0;animation:sl .4s}
  .lIc{font-size:24px}
  @keyframes sl{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
  .tprog{height:6px;background:rgba(0,0,0,.5);border-radius:4px;margin-top:12px;overflow:hidden}
  .tprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6f9d63,#ffd97a);transition:width .5s}
  @media (orientation:portrait){
    #tShot{bottom:3%} #tFoc{bottom:3%;margin-bottom:94px}
    #tMove,#tFlash{bottom:3%;margin-bottom:164px}
    #tWater{bottom:3%;margin-bottom:228px}
    #tIn,#tOut,#tRun,#tStay{bottom:3%}
    #tOut{margin-bottom:70px} #tRun,#tStay{margin-bottom:140px}
  }
  @media (max-width:600px){.card{padding:14px 16px}.btn{font-size:15px;padding:12px 22px}}
</style>

<script>
"use strict";
//////////////////////////////////////////////////////////////////////////////

// 8 stanovíšť v 7 krajinách, 54 druhov zvierat, cyklus dňa a noci.

/* ---------------------------------------------------------------- JAZYK -- */
const T = {
 sk:{

  howT:"Ako sa to hrá",
  how:["Pozeráš sa cez hľadáčik fotoaparátu. Rozhliadaj sa dookola a hľadaj zvieratá.",

       "<b>Hýb sa pomaly!</b> Keď prudko švihneš kamerou, zvieratá si ťa všimnú a ujdú. Nad zvieraťom svieti oranžový pruh — to je jeho pozornosť."],
  ctrlT:"Ovládanie",
  ctrl:"<span class='kbd'>myš</span> alebo <span class='kbd'>šípky</span> rozhliadanie &nbsp;·&nbsp; <span class='kbd'>koliesko</span> alebo <span class='kbd'>+ −</span> zoom &nbsp;·&nbsp; <span class='kbd'>ľavé tl.</span> alebo <span class='kbd'>medzerník</span> spúšť &nbsp;·&nbsp; <span class='kbd'>F</span> alebo <span class='kbd'>pravé tl.</span> zaostrenie &nbsp;·&nbsp; <span class='kbd'>Shift</span> zadržať dych a znehybnieť pred predátorom &nbsp;·&nbsp; <span class='kbd'>B</span> blesk &nbsp;·&nbsp; <span class='kbd'>N</span> nočné videnie &nbsp;·&nbsp; <span class='kbd'>U</span> útek &nbsp;·&nbsp; <span class='kbd'>M</span> presun inam &nbsp;·&nbsp; <span class='kbd'>1</span>/<span class='kbd'>2</span> voda a jedlo<br><br>Na tablete: ťahaj prstom, dva prsty = zoom, tlačidlá vpravo dole.",
  goalT:"Cieľ",
  goal:"Podľa vybranej expedície máš 4 až 10 minút a obmedzený počet fotiek — koľko presne, vidíš v tábore. Vzácne zviera, ostré a dobre skomponované = veľa bodov. Za druh, ktorý fotíš prvýkrát, dostane Adamko trojnásobok. To isté zviera sa oplatí odfotiť raz — druhá a tretia fotka toho istého druhu už dávajú menej.",
  start:"ZAČAŤ EXPEDÍCIU", free:"Voľné fotenie (bez času)", album:"Album zvierat", back:"Späť",
  clickPlay:"Klikni pre ovládanie kamery",
  time:"ČAS", shots:"FOTIEK", score:"BODY", focus:"OSTRENIE", locked:"ZAOSTRENÉ", breath:"DYCH",
  resT:"KONIEC EXPEDÍCIE", total:"CELKOM", best:"Najlepší záber", noPhoto:"Žiadna fotka. Skús to znova — hlavne pomaly!",
  again:"Znova", menu:"Hlavné menu",
  albumT:"ALBUM ZVIERAT", albumS:"druhov z", found:"objavených",
  newSpecies:"NOVÝ DRUH!", blurry:"Rozmazané", nothing:"Prázdny záber", noCard:"Karta je plná!",
  rare:["Bežné","Nezvyčajné","Vzácne","Legendárne"],
  fb_sharp:"Pekne ostré", fb_blur:"Rozmazané — musíš zaostriť a nehýbať sa",
  fb_far:"Príliš ďaleko — priblíž si ho", fb_big:"Skvelé priblíženie",
  fb_edge:"Odrezal si ho — daj ho celého do záberu", fb_center:"Pekná kompozícia",
  fb_ok:"Slušný záber", fb_first:"Prvýkrát v albume — dvojnásobok!",
  fled:"utieklo", spotted:"si ťa všimlo",
  thWarn:"POZOR — PREDÁTOR!", thHow:"NEHÝB SA (Shift) alebo UTEČ (U)",
  thSafe:"Predátor stratil záujem. Dýchaj.", thHit:"ZAÚTOČIL! Stratil si polovicu bodov.",
  thFlee:"Utiekol si do bezpečia — ale stratil si čas.", thNear:"Niečo sa hýbe v tráve…",
  thBonus:"Nebezpečný záber!", flee:"ÚTEK", steady:"NEHÝBAŤ SA",
  lat:"Latinsky", live:"Kde žije", eat:"Čím sa živí", intr:"Zaujímavosť", stat:"Stav", bestp:"Tvoja najlepšia fotka",
  pts:"b"
 },
 en:{
  title:"BBC PHOTO REPORTER", sub:"Masai Mara · Kenya",
  howT:"How to play",
  how:["You look through a camera viewfinder. Pan around and search for animals.",
       "Zoom in, <b>focus</b>, then press the shutter. A blurry photo is worth almost nothing.",
       "<b>Move slowly!</b> Whipping the camera around makes animals notice you and run. The orange bar above an animal is its alertness."],
  ctrlT:"Controls",
  ctrl:"<span class='kbd'>mouse</span> or <span class='kbd'>arrows</span> look around &nbsp;·&nbsp; <span class='kbd'>wheel</span> or <span class='kbd'>+ −</span> zoom &nbsp;·&nbsp; <span class='kbd'>left btn</span> or <span class='kbd'>space</span> shutter &nbsp;·&nbsp; <span class='kbd'>F</span> or <span class='kbd'>right btn</span> focus &nbsp;·&nbsp; <span class='kbd'>Shift</span> hold breath and freeze when a predator comes &nbsp;·&nbsp; <span class='kbd'>B</span> flash &nbsp;·&nbsp; <span class='kbd'>N</span> night vision &nbsp;·&nbsp; <span class='kbd'>U</span> run &nbsp;·&nbsp; <span class='kbd'>M</span> move elsewhere &nbsp;·&nbsp; <span class='kbd'>1</span>/<span class='kbd'>2</span> water and food<br><br>On tablet: drag with a finger, two fingers = zoom, buttons bottom right.",
  goalT:"Goal",
  goal:"Depending on the expedition you get 4 to 10 minutes and a limited number of shots — the camp tells you how many. A rare animal, sharp and well composed, scores big. Adam gets triple for a species shot for the first time. Photographing the same species again is worth steadily less.",
  start:"START EXPEDITION", free:"Free shooting (no timer)", album:"Animal album", back:"Back",
  clickPlay:"Click to control the camera",
  time:"TIME", shots:"SHOTS", score:"SCORE", focus:"FOCUS", locked:"IN FOCUS", breath:"BREATH",
  resT:"EXPEDITION OVER", total:"TOTAL", best:"Best shot", noPhoto:"No photos. Try again — slowly!",
  again:"Again", menu:"Main menu",
  albumT:"ANIMAL ALBUM", albumS:"species of", found:"discovered",
  newSpecies:"NEW SPECIES!", blurry:"Blurry", nothing:"Empty frame", noCard:"Card full!",
  rare:["Common","Uncommon","Rare","Legendary"],
  fb_sharp:"Nice and sharp", fb_blur:"Blurry — focus and hold still",
  fb_far:"Too far away — zoom in", fb_big:"Great close-up",
  fb_edge:"You cut it off — fit the whole animal", fb_center:"Nice composition",
  fb_ok:"Decent shot", fb_first:"First in the album — double points!",

  thWarn:"WATCH OUT — PREDATOR!", thHow:"HOLD STILL (Shift) or RUN (U)",

  thFlee:"You made it to safety — but lost time.", thNear:"Something is moving in the grass…",
  thBonus:"Dangerous shot!", flee:"RUN", steady:"HOLD STILL",
  lat:"Latin", live:"Habitat", eat:"Diet", intr:"Did you know", stat:"Status", bestp:"Your best photo",
  pts:"pts"
 }

let LANG = "sk";
const t = k => T[LANG][k];

/* ------------------------------------------------------------- POMÔCKY -- */
const TAU = Math.PI*2, D2R = Math.PI/180, R2D = 180/Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
// dotykové zariadenie sa musí poznať skôr, než sa prvýkrát počíta rám hľadáčika
let isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints>0);
const lerp=(a,b,k)=>a+(b-a)*k;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri =(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function angDiff(a,b){let d=(a-b)%360; if(d>180)d-=360; if(d<-180)d+=360; return d;}
function ell(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,TAU);g.fill();}
function poly(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fill();}
// deterministický šum podľa semienka
function srnd(s){s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s);}

/* ------------------------------------------------------------ DEŇ A NOC --
   Počas jednej expedície prejde celý deň. Každá fáza má inú farbu oblohy,
   iné svetlo a iné zvieratá.
------------------------------------------------------------------------- */
function hex2rgb(h){h=h.replace("#","");return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function rgb2hex(r,g,b){const f=v=>("0"+Math.round(clamp(v,0,255)).toString(16)).slice(-2);return "#"+f(r)+f(g)+f(b);}
function mixHex(a,b,k){const A=hex2rgb(a),B=hex2rgb(b);
  return rgb2hex(A[0]+(B[0]-A[0])*k,A[1]+(B[1]-A[1])*k,A[2]+(B[2]-A[2])*k);}

// aktuálny stav osvetlenia — plynulý prechod medzi dvoma susednými fázami
let _dennyT=-1,_dennyV=null;
function denny(){ if(_dennyT===game.dayT && _dennyV) return _dennyV; _dennyT=game.dayT; return _dennyV=_dennyPocitaj(); }
function _dennyPocitaj(){
  const t=clamp(game.dayT||0,0,0.9999);
  let acc=0, i=0;
  for(;i<FAZY.length;i++){ if(t<acc+FAZY[i].dl) break; acc+=FAZY[i].dl; }
  if(i>=FAZY.length) i=FAZY.length-1;
  const f=FAZY[i], d=FAZY[Math.min(i+1,FAZY.length-1)];
  const k=clamp((t-acc)/f.dl,0,1);
  const kr=clamp((k-0.60)/0.40,0,1), kk=kr*kr*(3-2*kr);      // prelína sa až v poslednej tretine fázy
  return { faza:f, dalsia:d, k:kk, idx:i,
           svet: lerp(f.svet,d.svet,kk),
           tint: mixHex(f.tint,d.tint,kk),
           tk:   lerp(f.tk,d.tk,kk),
           zlata:lerp(f.zlata,d.zlata,kk),
           nebo:{ top:mixHex(f.nebo.top,d.nebo.top,kk),
                  mid:mixHex(f.nebo.mid,d.nebo.mid,kk),
                  low:mixHex(f.nebo.low,d.nebo.low,kk) } };
}
function nazovFazy(){ const d=denny(); return (LANG==="sk"?FAZA_SK:FAZA_EN)[d.faza.id]; }
function jeTma(){ return denny().svet<0.42; }

/* ---------------------------------------------------- KRESLENIE ZVIERAT --
   Kreslí sa v METROCH.  Origo = bod dotyku so zemou, os y ide hore záporne,
   zviera je otočené doprava (+x).  Mierka rieši volajúci.
------------------------------------------------------------------------- */
let MV=1;   // 0 = zviera stojí, 1 = kráča (mierka rozkročenia nôh)
let DET=0;  // 0 = ďaleko (hrubý tvar), 1 = úplné priblíženie (plné detaily)

// prechody sa vytvárali nanovo pre každé zviera v každom snímku — to trhalo obraz
const _gcache=new Map();
function grad(g,x0,y0,x1,y1,c1,c2){
  const k=x0+"|"+y0+"|"+x1+"|"+y1+"|"+c1+"|"+c2;
  let q=_gcache.get(k);
  if(!q){ q=g.createLinearGradient(x0,y0,x1,y1); q.addColorStop(0,c1); q.addColorStop(1,c2); _gcache.set(k,q); }
  return q;
}
function legStroke(g,x,ytop,swing,w,col,hoof,dark){
  const sw=swing*MV, foot=x+sw, kx=x+sw*0.42+w*0.25, ky=ytop*0.44;
  g.strokeStyle=col; g.lineCap="round"; g.lineJoin="round";
  // stehno je hrubšie ako predkolenie — bez toho vyzerá zviera ako na chodúľoch
  g.lineWidth=w*1.75; g.beginPath(); g.moveTo(x,ytop*1.04); g.lineTo(kx,ky); g.stroke();
  g.lineWidth=w*0.85; g.beginPath(); g.moveTo(kx,ky); g.lineTo(foot,0); g.stroke();
  if(DET>0.2){
    if(dark){ g.strokeStyle=dark; g.lineWidth=w*0.30; g.globalAlpha=0.35*DET;
      g.beginPath(); g.moveTo(x+w*0.5,ytop*1.0); g.lineTo(kx+w*0.42,ky); g.stroke(); g.globalAlpha=1; }
    if(hoof){ g.fillStyle=hoof; ell(g,foot,-w*0.30,w*0.66,w*0.46); }
  }
}
function tail(g,x,y,len,sway,w,col,tuft){
  g.strokeStyle=col; g.lineWidth=w; g.lineCap="round";
  g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x-len*0.5,y+len*0.4, x-len*0.35+sway, y+len);
  g.stroke();
  if(tuft){ g.fillStyle=tuft; ell(g,x-len*0.35+sway,y+len+w*0.6,w*1.5,w*2.4,0.3); }
}
function head(g,pivot,ang,fn){ g.save(); g.translate(pivot[0],pivot[1]); g.rotate(ang); g.translate(-pivot[0],-pivot[1]); fn(); g.restore(); }
function eye(g,x,y,r,col){
  g.fillStyle=col||"#100c08"; ell(g,x,y,r,r);
  if(DET>0.25){ g.fillStyle="rgba(255,255,255,"+(0.8*DET).toFixed(2)+")"; ell(g,x+r*0.34,y-r*0.36,r*0.34,r*0.34); }
}
function nostril(g,x,y,r,col){ if(DET<0.25) return; g.fillStyle=col||"rgba(20,14,10,.75)"; ell(g,x,y,r,r*0.72,0.4); }
function ear(g,pts,outer,inner){
  g.fillStyle=outer; poly(g,pts);
  if(DET>0.3){ const cx=(pts[0][0]+pts[1][0]+pts[2][0])/3, cy=(pts[0][1]+pts[1][1]+pts[2][1])/3;
    g.fillStyle=inner; poly(g,pts.map(p=>[cx+(p[0]-cx)*0.48, cy+(p[1]-cy)*0.48])); }
}
// jemné chĺpky/textúra v rámci orezanej oblasti
function fur(g,clip,col,n,x0,x1,y0,y1,len,w,seed){
  if(DET<0.4) return;
  g.save(); clip(); g.clip();
  g.strokeStyle=col; g.lineWidth=w; g.lineCap="round"; g.globalAlpha=0.30*DET;
  for(let i=0;i<n;i++){ const s=seed+i*3.77, x=x0+srnd(s)*(x1-x0), y=y0+srnd(s+1)*(y1-y0);
    g.beginPath(); g.moveTo(x,y); g.lineTo(x-len*0.55,y+len); g.stroke(); }
  g.restore(); g.globalAlpha=1;
}

let AC=null, master=null, ambGain=null, soundOn=true;

// Preto pri každom odchode zo stránky kontext uspíme a pri návrate prebudíme.
function audioPauza(){
  if(!AC) return;
  try{ if(AC.state==="running") AC.suspend(); }catch(e){}
}
function audioPokracuj(){
  if(!AC||!soundOn) return;
  try{ if(AC.state==="suspended") AC.resume(); }catch(e){}
}
function audioStop(){             // definitívny koniec — pri zatváraní stránky
  _audioTikaje.forEach(id=>clearInterval(id)); _audioTikaje=[];
  if(!AC) return;
  try{ AC.close(); }catch(e){}
  AC=null; master=null; ambGain=null;
}
document.addEventListener("visibilitychange",()=>{ document.hidden? audioPauza() : audioPokracuj(); });

window.addEventListener("beforeunload",audioStop);
window.addEventListener("blur",audioPauza);
window.addEventListener("focus",audioPokracuj);
function audioInit(){
  if(AC){ if(AC.state==="suspended"&&soundOn) AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  master=AC.createGain(); master.gain.value=0.55; master.connect(AC.destination);
  // ambient: šum vetra
  const len=AC.sampleRate*2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*0.5;
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
  const f=AC.createBiquadFilter(); f.type="lowpass"; f.frequency.value=340; f.Q.value=0.6;
  ambGain=AC.createGain(); ambGain.gain.value=0.10;
  _audioTikaje.push(setInterval(()=>{ if(!ambGain) return;
    const ciel = (game.screen==="play"&&soundOn)? 0.040+0.085*clamp(game.windS||0.5,0,1) : 0.0;
    try{ ambGain.gain.setTargetAtTime(ciel,AC.currentTime,0.6); }catch(e){ ambGain.gain.value=ciel; }
  },900));
  src.connect(f); f.connect(ambGain); ambGain.connect(master); src.start();
  _audioTikaje.push(setInterval(()=>{
    if(!soundOn||game.screen!=="play"||document.hidden) return;
    const noc = (typeof denny==="function" && game.spot) ? denny().svet<0.36 : false;
    if(noc){ if(Math.random()<0.80) cvrcek(); if(Math.random()<0.12) sova(); }

  },1500));

function beep(freq,dur,type,vol,pan,glide){
  if(!AC||!soundOn) return;
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  if(glide) o.frequency.exponentialRampToValueAtTime(Math.max(20,glide),AC.currentTime+dur*0.9);
  g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(vol||0.18,AC.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  o.connect(g);
  if(pan!==undefined && AC.createStereoPanner){
    const pn=AC.createStereoPanner(); pn.pan.value=clamp(pan,-1,1);
    g.connect(pn); pn.connect(master);
  } else g.connect(master);
  o.start(); o.stop(AC.currentTime+dur+0.02);
}

function _vystup(pan){
  if(pan===undefined || !AC.createStereoPanner) return master;
  const pn=AC.createStereoPanner(); pn.pan.value=clamp(pan,-1,1);
  pn.connect(master); return pn;
}

function sum(dur,vol,typ,frq,Q,pan,frq2){

  const buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const src=AC.createBufferSource(); src.buffer=buf;
  const f=AC.createBiquadFilter(); f.type=typ||"bandpass";
  f.frequency.setValueAtTime(frq,AC.currentTime);
  if(frq2) f.frequency.exponentialRampToValueAtTime(Math.max(30,frq2),AC.currentTime+dur*0.9);
  f.Q.value=Q||1;
  const g=AC.createGain();
  g.gain.setValueAtTime(0,AC.currentTime);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+Math.min(0.05,dur*0.2));
  g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
  src.connect(f); f.connect(g); g.connect(_vystup(pan));
  src.start(); src.stop(AC.currentTime+dur+0.02);
}
// tón s chvením (vibrato) a formantom — základ každého zvieracieho hlasu
function ton(o){
  if(!AC||!soundOn) return;
  const t0=AC.currentTime+(o.od||0), dur=o.d;
  const osc=AC.createOscillator(); osc.type=o.t||"sawtooth";
  osc.frequency.setValueAtTime(o.f,t0);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+dur*0.85);
  if(o.vib){                                   // chvenie hlasu
    const lfo=AC.createOscillator(), la=AC.createGain();
    lfo.frequency.value=o.vib; la.gain.value=o.vibA||o.f*0.03;
    lfo.connect(la); la.connect(osc.frequency); lfo.start(t0); lfo.stop(t0+dur+0.05);
  }
  const fm=AC.createBiquadFilter();            // formant = rezonancia hrdla
  fm.type="bandpass"; fm.frequency.value=o.fmt||o.f*3; fm.Q.value=o.fmtQ||1.4;
  const g=AC.createGain();
  const a=o.a===undefined? 0.02 : o.a;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001,o.v),t0+a);
  g.gain.setValueAtTime(Math.max(0.001,o.v),t0+Math.max(a,dur*(o.drz||0.45)));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(fm); fm.connect(g); g.connect(_vystup(o.pan));
  osc.start(t0); osc.stop(t0+dur+0.03);
}

    ton({f:f*1.9,f2:f*0.85,d:1.05,t:"sawtooth",v:0.17*v,fmt:f*4.2,fmtQ:2.2,vib:5.5,drz:0.35,a:0.05,pan});
    ton({f:f*0.95,f2:f*0.6,d:1.25,t:"triangle",v:0.11*v,fmt:f*2.1,drz:0.4,a:0.08,od:0.06,pan});
    setTimeout(()=>{ ton({f:f*0.8,f2:f*0.55,d:0.7,t:"sawtooth",v:0.07*v,fmt:f*2,vib:7,drz:0.3,pan}); },1150);
  },
  // slon: trúbenie — rýchly nábeh nahor a zostup, plus dunenie
  slon(v,pan){ const f=rnd(190,240);
    ton({f:f*0.55,f2:f*0.5,d:0.9,t:"sine",v:0.10*v,fmt:90,drz:0.5,a:0.06,pan});     // infra dunenie
    ton({f:f,f2:f*2.6,d:0.22,t:"square",v:0.13*v,fmt:f*3,fmtQ:2,a:0.015,drz:0.5,pan});
    ton({f:f*2.6,f2:f*1.7,d:0.55,t:"sawtooth",v:0.12*v,fmt:f*5,fmtQ:2.6,vib:9,vibA:60,drz:0.55,od:0.2,pan});
    sum(0.25,0.05*v,"highpass",1200,0.7,pan);
  },
  // vták: trilok — niekoľko rýchlych tónov s kĺzaním
  vtak(v,pan){ const f=rnd(1500,2900), n=ri(3,6);
    for(let i=0;i<n;i++){
      const sm=rnd(0.86,1.22);
      ton({f:f*sm,f2:f*sm*rnd(1.1,1.5),d:0.075,t:"sine",v:0.075*v,fmt:f*sm,fmtQ:6,
           a:0.006,drz:0.3,od:i*rnd(0.075,0.13),pan});

  },
  // kopytník: krátke frknutie s dychom
  kopyt(v,pan){ const f=rnd(230,340);

    ton({f:f,f2:f*0.62,d:0.26,t:"sawtooth",v:0.10*v,fmt:f*2.6,fmtQ:1.8,vib:14,drz:0.3,a:0.012,pan});
  },
  // opica: štekavé „hu-hu" stúpajúce nahor
  opica(v,pan){ const f=rnd(430,760), n=ri(2,4);
    for(let i=0;i<n;i++)
      ton({f:f*(1+i*0.16),f2:f*(1.5+i*0.2),d:0.13,t:"sine",v:0.11*v,fmt:f*2.4,fmtQ:3,
           a:0.008,drz:0.35,od:i*0.17,pan});
  },
  // pes hyenovitý / hyena: štekot a zaskučanie
  pes(v,pan){ const f=rnd(520,900);
    sum(0.07,0.08*v,"bandpass",1600,1.2,pan);
    ton({f:f,f2:f*0.45,d:0.15,t:"square",v:0.10*v,fmt:f*2.2,fmtQ:2,a:0.006,drz:0.25,pan});
    if(Math.random()<0.55) ton({f:f*1.3,f2:f*2.4,d:0.3,t:"sine",v:0.06*v,vib:11,od:0.22,pan});
  },
  // nosorožec/hroch/buvol: hlboké zafunenie
  velky(v,pan){ const f=rnd(62,95);
    ton({f:f,f2:f*0.72,d:1.15,t:"sawtooth",v:0.15*v,fmt:f*2.4,fmtQ:1.6,vib:4,drz:0.45,a:0.07,pan});
    sum(0.45,0.09*v,"lowpass",520,0.6,pan,220);

  }

function shutterSnd(){
  if(!AC||!soundOn) return;
  const cvak=(od,vol,frq)=>{
    const len=Math.floor(AC.sampleRate*0.035);
    const buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++){ const k=i/len; d[i]=(Math.random()*2-1)*Math.pow(1-k,5); }
    const src=AC.createBufferSource(); src.buffer=buf;
    const f=AC.createBiquadFilter(); f.type="bandpass"; f.frequency.value=frq; f.Q.value=1.6;
    const g=AC.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(AC.currentTime+od); src.stop(AC.currentTime+od+0.05);
    // kovový podtón mechaniky
    ton({f:frq*0.42,f2:frq*0.3,d:0.05,t:"triangle",v:vol*0.5,fmt:frq,fmtQ:5,a:0.002,drz:0.2,od:od});
  };
  cvak(0,    0.42, 3100);          // zrkadlo hore
  cvak(0.055,0.30, 2300);          // zrkadlo dole
  sum(0.05,0.10,"highpass",4200,0.7);
}

function spawnGroup(){
  const wt=(game.spot&&game.spot.weights)||{};
  // najprv kto na stanovišti žije, POTOM kto je práve v túto dennú dobu hore,
  // a až nakoniec vzácnosť — inak by v noci vyliezali denné zvieratá
  let pool=SPECIES.filter(x=>(wt[x.id]||0)>0);
  const vaha=x=>(wt[x.id]||0)*aktW(x);
  const podlaCasu=pool.filter(x=>vaha(x)>0.02);
  if(podlaCasu.length) pool=podlaCasu;
  if(!pool.length) pool=SPECIES;
  const roll=Math.random();
  const pasmo = roll<0.50?0 : roll<0.78?1 : roll<0.955?2 : 3;
  const vPasme=pool.filter(x=>x.rar===pasmo);
  if(vPasme.length) pool=vPasme;
  // ak je ten druh už na scéne, skús radšej iný — aby sa striedali
  const naScene=new Set(game.animals.map(a=>a.sp.id));
  const fresh=pool.filter(x=>!naScene.has(x.id));
  const vyber=fresh.length?fresh:pool;
  let sp=vyber[0];
  { const tot=vyber.reduce((q,x)=>q+Math.max(0.001,vaha(x)),0);
    let r2=Math.random()*tot;
    for(const x of vyber){ r2-=Math.max(0.001,vaha(x)); if(r2<=0){ sp=x; break; } } }
  const n=ri(sp.group[0],sp.group[1]);
  const dm=(game.mod&&game.mod.dist)||1;
  const baseAng=rnd(0,360), baseD=clamp(rnd(sp.minD,sp.maxD)*dm, sp.minD*0.8, sp.maxD*1.15);
  // niekedy je v skupine aj mláďa — fotka mláďaťa s matkou je najcennejšia
  const smMlada = MLADATA[sp.id] && n>1 && Math.random()<0.30;
  for(let i=0;i<n;i++){
    if(game.animals.length>=19) break;
    game.animals.push({
      sp, ang:baseAng+rnd(-6,6)*(1+i*0.4), d:baseD+rnd(-18,18),
      face: Math.random()<0.5?1:-1,
      hgt: sp.arb? rnd(sp.arb[0],sp.arb[1]) : 0,
      young: smMlada && i===n-1, hm: (smMlada && i===n-1)?0.55:1,
      walk:rnd(0,TAU), pose:Math.random()<0.55?1:0, poseT:rnd(2,7),
      state:"idle", att:0, life:rnd(15,30), t:rnd(0,20), seed:rnd(0,99),
      alpha:0, vAng:rnd(-0.25,0.25)*sp.speed, vD:rnd(-0.5,0.5), alertT:0
    });
  }
}
// vloží konkrétny druh na scénu (napr. ten zo zadania)
function spawnDruh(sp){
  if(!sp || game.animals.length>=19) return;
  const dm=(game.mod&&game.mod.dist)||1;
  const n=Math.min(ri(sp.group[0],sp.group[1]), 19-game.animals.length);
  const baseAng=rnd(0,360), baseD=clamp(rnd(sp.minD,sp.maxD)*dm, sp.minD*0.8, sp.maxD*1.15);
  for(let i=0;i<n;i++){
    game.animals.push({ sp, ang:baseAng+rnd(-6,6)*(1+i*0.4), d:baseD+rnd(-18,18),
      face:Math.random()<0.5?1:-1, hgt: sp.arb? rnd(sp.arb[0],sp.arb[1]) : 0, young:false, hm:1,
      walk:rnd(0,TAU), pose:Math.random()<0.55?1:0, poseT:rnd(2,7),
      state:"idle", att:0, life:rnd(20,40), t:rnd(0,20), seed:rnd(0,99),
      alpha:0, vAng:rnd(-0.25,0.25)*sp.speed, vD:rnd(-0.5,0.5), alertT:0 });
  }
}
function updateAnimals(dt){
  const arr=game.animals;
  for(let i=arr.length-1;i>=0;i--){
    const a=arr[i], sp=a.sp;
    if(a.threat) continue;              // predátora riadi výhradne updateThreat()
    a.t+=dt; a.life-=dt;
    // POZOR: nábeh priehľadnosti smie bežať len pri zvieratách, ktoré ostávajú.
    // Kým bežal vždy, prebil odchodové miznutie a zviera sa nikdy nezmazalo —
    // scéna sa po minúte zaplnila „duchmi" a nedalo sa už nič odfotiť.
    if(a.state==="idle"||a.state==="alert") a.alpha=Math.min(1,a.alpha+dt*1.5);

    // pozornosť
    const dv=Math.abs(angDiff(a.ang,game.yaw));
    const inView = dv < game.fov*0.85;
    const prox = clamp(90/a.d, 0.35, 2.2);
    if(a.state==="idle"){
      if(inView){
        const ratio = Math.min(4, game.angSpeed/Math.max(2,game.fov));
        const rate = Math.max(0,(ratio-0.32))*0.72*prox*sp.shy*(game.mod.attMul||1);
        a.att += rate*dt;
      }
      // vietor: keď fúka od hráča k zvieraťu, zavetrí ho aj bez pohybu
      if(!game.mod.pach){
        const zav=Math.max(0, Math.cos(angDiff(a.ang,game.wind)*D2R));
        if(zav>0.25) a.att += zav*game.windS*0.085*prox*sp.shy*(game.mod.attMul||1)*dt;
      }
      a.att -= 0.30*dt;
      a.att = clamp(a.att,0,1);
      if(a.att>=1){ a.state="alert"; a.alertT=1.3; a.pose=0; if(inView) beep(220,0.14,"square",0.09); }
    }

    if(a.state==="alert"){
      a.alertT-=dt; a.mv=lerp(a.mv||0,0.1,0.1);
      if(a.alertT<=0){ a.state="flee"; a.vD=rnd(9,16)*sp.speed; a.vAng=rnd(-2.5,2.5); }
    } else if(a.state==="flee"){
      a.mv=1;
      a.d += a.vD*dt; a.ang += a.vAng*dt; a.walk += dt*10*sp.speed;
      a.alpha -= dt*0.60;
      if(a.d>sp.maxD*2.1 || a.alpha<=0){ arr.splice(i,1); continue; }
    } else if(a.state==="leaving"){
      a.mv=1;
      a.d += 2.4*dt; a.ang += a.vAng*0.5*dt; a.walk += dt*3.2*sp.speed;
      a.alpha -= dt*0.50;
      if(a.alpha<=0){ arr.splice(i,1); continue; }
    } else { // idle
      a.poseT-=dt;
      if(a.poseT<=0){ a.pose = a.pose>0.5?0:1; a.poseT=rnd(3,9); }
      const moving = a.pose<0.5 && (Math.floor(a.t/6)%2===0);
      a.mv = lerp(a.mv===undefined?0.2:a.mv, moving?1:0.18, 0.05);
      if(moving){ a.ang += a.vAng*dt*0.35; a.d += a.vD*dt*0.35; a.walk += dt*2.4*sp.speed; }
      a.d = clamp(a.d, sp.minD*0.8, sp.maxD*1.15);
      if(a.life<=0){ a.state="leaving"; }
    }
    a.ang = (a.ang+360)%360;
  }

  game.spawnT-=dt;
  // priestor pre nový druh: buď je na scéne málo zvierat, alebo málo rôznych druhov
  // rozhoduje počet zvierat, ktoré sa DAJÚ odfotiť — nie tie, čo práve odchádzajú
  const zive=game.animals.filter(a=>a.state==="idle"||a.state==="alert");
  const pocetDruhov=new Set(zive.map(a=>a.sp.id)).size;
  if(game.spawnT<=0 && game.animals.length<19 && (zive.length<12 || pocetDruhov<5)){
    spawnGroup(); game.spawnT=rnd(1.2,3.0)*(game.mod.spawnMul||1);
  }
  // zadaný druh drž na scéne, kým zadanie nie je splnené
  const job=P().job;
  if(job && SP[job.sp] && game.jobCount<job.n){
    game.jobT=(game.jobT||0)-dt;
    if(game.jobT<=0){
      if(!zive.some(a=>a.sp.id===job.sp)) spawnDruh(SP[job.sp]);
      game.jobT=18;
    }
  }
}

/* ------------------------------------------------------------- PREDÁTOR --
   Tri fázy: náznak (počuť ho, nevidieť) → varovanie (blíži sa, treba reagovať)
   → útok.  Zachrániť sa dá znehybnením alebo útekom.  Dá sa aj odfotiť —
   je to najhodnotnejší záber v hre, ale riskuje celé kolo.
------------------------------------------------------------------------- */
function predatoriTu(){
  const wt=(game.spot&&game.spot.weights)||{};
  const zo=SPECIES.filter(s=>s.pred&&(wt[s.id]||0)>0);
  // v noci chodí nočný predátor, cez deň denný
  const teraz=zo.filter(s=>aktW(s)>0.3);
  return teraz.length?teraz : (zo.length?zo:[SP.lion]);
}
function spawnThreat(){
  if(game.threat) return;
  // na scéne musí byť miesto — ak treba, odíde najvzdialenejšie zviera
  while(game.animals.length>=19){
    let k=0; for(let i=1;i<game.animals.length;i++) if(game.animals[i].d>game.animals[k].d) k=i;
    game.animals.splice(k,1);
  }
  const sp=pick(predatoriTu());
  const a={ sp, ang:(game.yaw+rnd(-170,170)+360)%360, d:78, face:1, walk:0, pose:0,
            state:"idle", att:0, life:999, t:0, seed:rnd(0,99), alpha:1,
            vAng:0, vD:0, alertT:0, poseT:999, _pose:0, mv:1, threat:true };
  game.animals.push(a);
  game.threat={ a, phase:"stalk", t:0 };
  game.threatSafeT=0;
  beep(70,0.9,"sawtooth",0.16); setTimeout(()=>beep(58,1.1,"sawtooth",0.13),420);
  toast(t("thNear"),"","");
}
function endThreat(walkAway){
  if(!game.threat) return;
  const a=game.threat.a;
  a.threat=false; a.state="leaving"; a.vAng=rnd(-1.2,1.2); a.mv=1;
  game.threat=null; game.danger=0;
  game.threatCool=rnd(52,88)*((game.mod&&game.mod.predCool)||1);
}
function relocate(){
  game.yaw=(game.yaw+rnd(80,280))%360;
  game.animals=[]; game.threat=null; game.danger=0; game.afHold=null;
  game.threatCool=rnd(52,88)*((game.mod&&game.mod.predCool)||1);
  buildScenery();
  for(let i=0;i<5;i++) spawnGroup();
  if(game.timed) game.timeLeft=Math.max(2,game.timeLeft-12);
  game.breath=Math.max(0.15,game.breath-0.35);
  toast(t("thFlee"),"−12 s","");
  beep(300,0.18,"triangle",0.12);
}
function updateThreat(dt){
  if(!game.threat){
    game.threatCool-=dt;
    if(game.threatCool<=0) spawnThreat();
    game.danger=Math.max(0,game.danger-dt*1.6);
    return;
  }
  const T=game.threat, a=T.a;
  const WARN=7.5+(game.mod.warnBonus||0);
  T.t+=dt; a.t+=dt; a.walk+=dt*2.2; a.mv=1;
  // stále mieri na hráča
  const toward=angDiff(game.yaw,a.ang);
  a.ang += clamp(toward,-0.35,0.35)*dt*4;

  if(T.phase==="stalk"){
    a.d = lerp(78,34,clamp(T.t/7,0,1));
    game.danger=Math.min(0.35,T.t/7*0.35);
    if(!T.rada && T.t>2.0){ T.rada=1;
      toast(TX("Blíži sa predátor","A predator is coming"),
            isTouch? TX("Priprav sa: podrž STÁŤ alebo ťukni na ÚTEK","Get ready: hold HOLD or tap RUN")
                   : TX("Priprav sa: Shift = nehýbať sa, U = utiecť","Get ready: Shift = hold still, U = run"),""); }
    if(T.t>7){ T.phase="warn"; T.t=0; game.threatSafeT=0;
      beep(90,1.2,"sawtooth",0.20); }
    return;
  }
  // ---- varovanie ----
  a.d = lerp(34,11,clamp(T.t/WARN,0,1));
  game.danger=0.4+0.6*clamp(T.t/WARN,0,1);
  if(game.fleeReq){ game.fleeReq=false; relocate(); return; }
  // znehybnieť treba VEDOME: podržať Shift (alebo tlačidlo na dotyku) a nehýbať kamerou.
  // Samotné státie nestačí — predátor sa nezľakne toho, že hráč nič nerobí.
  const stojiTicho = (game.holding||game.steadyBtn) && game.angSpeed<8;
  // reálnym časom, nie herným — na slabom tablete pri 5 fps by "3 sekundy
  // nehýbať sa" inak trvali dvanásť
  if(stojiTicho) game.threatSafeT+=(game._dtCas||dt); else game.threatSafeT=0;
  if(game.threatSafeT>3.0){ toast(t("thSafe"),"",""); beep(420,0.2,"sine",0.10); endThreat(); return; }
  if(T.t>WARN){
    if(game.medkit){ game.medkit=false;
      toast(TX("Lekárnička ťa zachránila!","The first-aid kit saved you!"),"","");
      beep(500,0.25,"sine",0.12); endThreat(); return; }
    const stráta=Math.floor(game.score*((game.mod&&game.mod.trest)||0.5));
    game.score-=stráta;
    game.flash=1; game.danger=1;
    game.panX+=rnd(-9,9); game.panY+=rnd(-6,6);      // kamerou to trhne
    toast(TX("ZAÚTOČIL!","IT ATTACKED!"),"−"+stráta+" "+t("pts"),
          TX("Prišiel si o "+Math.round(((game.mod&&game.mod.trest)||0.5)*100)+" % bodov z tohto kola.",
             "You lost "+Math.round(((game.mod&&game.mod.trest)||0.5)*100)+" % of this round's points."));
    beep(60,0.7,"sawtooth",0.3); setTimeout(()=>beep(45,0.9,"sawtooth",0.22),160);
    endThreat();
  }
}

/* -------------------------------------------------------------- KAMERA --- */
function groundY(d,f){ return CYV + f*(CAM_H/d) + game.pitchPx; }
function vys(a){ return a.sp.h*(a.hm||1); }
function project(ang,d,hgt){
  const f=focalPx();
  const dv=angDiff(ang,game.yaw)*D2R;
  if(Math.abs(dv)>1.35) return null;
  const x=W/2 + f*Math.tan(dv) + game.shakeX;
  const y=CYV + f*((CAM_H-(hgt||0))/d) + game.pitchPx + game.shakeY;
  return {x,y,f,ppm:f/d};
}
function blurFor(d){
  const f=focalPx(), ap=0.030*(game.apMul||1);
  const b = f*ap*Math.abs(1/d - 1/game.focus);
  return Math.min(b, 14);
}

/* -------------------------------------------------------------- RENDER --- */
function skyColors(){
  const b=(game.spot&&game.spot.sky)||{top:"#5d8fbe",mid:"#a8c4d4",low:"#f2d2a0"};
  const d=denny();
  return {top:mixHex(b.top,d.nebo.top,d.tk), mid:mixHex(b.mid,d.nebo.mid,d.tk),
          low:mixHex(b.low,d.nebo.low,d.tk), sun:"#fff2c8"};
}
function drawSky(){
  const hz=CYV+game.pitchPx+game.shakeY;
  const gr=ctx.createLinearGradient(0,Math.min(0,hz-H),0,hz);
  const c=skyColors();
  gr.addColorStop(0,c.top); gr.addColorStop(0.62,c.mid); gr.addColorStop(1,c.low);
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,Math.max(0,hz));
  const d=denny(), f=focalPx();
  // hviezdy — čím tmavšie, tým výraznejšie
  if(d.svet<0.35){
    const al=clamp((0.35-d.svet)/0.30,0,1);
    for(let i=0;i<90;i++){
      const q=srnd(i*3.7), q2=srnd(i*5.1), q3=srnd(i*9.3);
      const sa=((q*360 - game.yaw)%360+540)%360-180;
      if(Math.abs(sa)>game.fov*0.75) continue;
      const x=W/2+f*Math.tan(sa*D2R)+game.shakeX;
      const y=hz - f*(0.03+q2*0.42) ;
      if(y<0||y>hz) continue;
      const bl=(0.35+q3*0.65)*al*(0.75+0.25*Math.sin(game.t*2+i));
      ctx.fillStyle="rgba(255,252,230,"+bl.toFixed(2)+")";
      ctx.fillRect(x,y,1.6,1.6);
    }
  }
  // slnko / mesiac — putujú po oblohe podľa času dňa
  const vys=Math.sin(clamp(game.dayT,0,1)*Math.PI);
  const sp=project(72,100000);
  if(sp){
    if(d.svet>0.30){
      const sy=hz-f*(0.02+vys*0.22), r=Math.max(6,f*0.028);
      const al=clamp((d.svet-0.30)/0.35,0,1);
      const g2=ctx.createRadialGradient(sp.x,sy,0,sp.x,sy,r*5);
      g2.addColorStop(0,"rgba(255,246,214,"+(0.95*al).toFixed(2)+")");
      g2.addColorStop(0.25,"rgba(255,232,170,"+(0.45*al).toFixed(2)+")");
      g2.addColorStop(1,"rgba(255,220,150,0)");
      ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(sp.x,sy,r*5,0,TAU); ctx.fill();
      ctx.fillStyle="rgba(255,251,232,"+al.toFixed(2)+")"; ctx.beginPath(); ctx.arc(sp.x,sy,r,0,TAU); ctx.fill();
    }
    if(d.svet<0.50){
      const mp=project(212,100000);
      if(mp){
        const my=hz-f*(0.06+0.20*Math.sin((1-clamp(game.dayT,0,1))*Math.PI));
        const r=Math.max(5,f*0.022), al=clamp((0.50-d.svet)/0.30,0,1);
        const g3=ctx.createRadialGradient(mp.x,my,0,mp.x,my,r*6);
        g3.addColorStop(0,"rgba(226,236,255,"+(0.35*al).toFixed(2)+")");
        g3.addColorStop(1,"rgba(200,220,255,0)");
        ctx.fillStyle=g3; ctx.beginPath(); ctx.arc(mp.x,my,r*6,0,TAU); ctx.fill();
        ctx.fillStyle="rgba(238,243,255,"+al.toFixed(2)+")"; ctx.beginPath(); ctx.arc(mp.x,my,r,0,TAU); ctx.fill();
        ctx.fillStyle="rgba(206,216,238,"+(0.5*al).toFixed(2)+")";
        ctx.beginPath(); ctx.arc(mp.x-r*0.28,my-r*0.22,r*0.24,0,TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(mp.x+r*0.30,my+r*0.18,r*0.18,0,TAU); ctx.fill();
      }
    }
  }
}
function drawHills(){
  const hz=CYV+game.pitchPx+game.shakeY, f=focalPx();
  ctx.save(); { const hb=Math.min(3,Math.round(blurFor(20000)*0.35)); ctx.filter = hb>1?"blur("+hb+"px)":"none"; }
  const typ=(game.spot&&game.spot.hills)||"kopce";
  const COL={kopce:["rgba(158,178,178,.75)","rgba(140,158,144,.8)"],
             stena:["rgba(132,150,150,.85)","rgba(112,132,116,.9)"],
             les:  ["rgba(120,148,120,.85)","rgba(84,116,80,.92)"]}[typ]||["rgba(158,178,178,.75)","rgba(140,158,144,.8)"];
  const AMP={kopce:[0.030,0.020],stena:[0.115,0.082],les:[0.060,0.042]}[typ]||[0.030,0.020];
  for(let layer=0;layer<2;layer++){
    ctx.fillStyle = COL[layer];
    ctx.beginPath(); ctx.moveTo(-40,hz+4);
    const amp=f*AMP[layer], step=6;
    for(let x=-40;x<=W+40;x+=step){
      const a=game.yaw + Math.atan((x-W/2-game.shakeX)/f)*R2D;
      const n=Math.sin(a*(layer?0.16:0.09)+layer*3)*0.55+Math.sin(a*(layer?0.41:0.27)+7)*0.3+Math.sin(a*0.73+2)*0.15;
      ctx.lineTo(x,hz - amp*(0.35+n*0.65) - (layer?0:f*0.012));
    }
    ctx.lineTo(W+40,hz+4); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawGround(){
  const hz=CYV+game.pitchPx+game.shakeY;
  const pal=(game.spot&&game.spot.pal)||{g1:"#b9ab74",g2:"#a89960",g3:"#8e8447",g4:"#6d6a34"};
  const gr=ctx.createLinearGradient(0,hz,0,H);
  gr.addColorStop(0,pal.g1); gr.addColorStop(0.16,pal.g2); gr.addColorStop(0.55,pal.g3); gr.addColorStop(1,pal.g4);
  ctx.fillStyle=gr; ctx.fillRect(0,hz-1,W,H-hz+2);
  // rieka: pás vody v strednej vzdialenosti
  if(game.spot&&game.spot.water){
    const f2=focalPx(), y0=hz+f2*(CAM_H/game.spot.water[0]), y1=hz+f2*(CAM_H/game.spot.water[1]);
    const wg=ctx.createLinearGradient(0,y0,0,y1);
    wg.addColorStop(0,"#7f9aa0"); wg.addColorStop(0.4,"#6d8b96"); wg.addColorStop(1,"#5c7b88");
    ctx.fillStyle=wg; ctx.fillRect(0,y0,W,Math.max(2,y1-y0));
    ctx.fillStyle="rgba(255,255,255,.13)";
    for(let i=0;i<7;i++){ const yy=y0+(y1-y0)*(i+0.5)/7;
      ctx.fillRect((Math.sin(game.t*0.4+i*2.1)*0.5+0.5)*W-90,yy,180,Math.max(1,(y1-y0)/14)); }
  }
  // pásy trávy podľa vzdialenosti
  const f=focalPx();
  ctx.save(); ctx.globalAlpha=0.22;
  for(let i=0;i<9;i++){
    const d=300/Math.pow(1.55,i);
    const y=hz+f*(CAM_H/d);
    if(y>H+30) break;
    ctx.fillStyle= i%2? "#9c9155":"#88803f";
    ctx.fillRect(0,y,W,Math.max(1,f*CAM_H*(1/d-1/(d*1.55))*0.55));
  }
  ctx.restore();
}
function drawAcacia(o,p){
  const s=p.ppm*o.sz/6;
  const g=ctx;
  g.save(); g.translate(p.x,p.y); g.scale(s,s);
  g.strokeStyle="#4a3a26"; g.lineWidth=0.42; g.lineCap="round";
  g.beginPath(); g.moveTo(0,0); g.lineTo(-0.25,-3.1); g.stroke();
  g.beginPath(); g.moveTo(-0.25,-3.1); g.lineTo(-1.5,-4.1); g.moveTo(-0.25,-3.1); g.lineTo(1.2,-4.2); g.lineWidth=0.24; g.stroke();
  const cr=srnd(o.seed)*0.15;
  g.fillStyle="#4e6635";
  g.beginPath(); g.ellipse(0,-4.9,3.5+cr*3,1.0,0,0,TAU); g.fill();
  g.fillStyle="#5f7a3f";
  g.beginPath(); g.ellipse(-0.5,-5.25,2.7+cr*2,0.85,0,0,TAU); g.fill();
  g.fillStyle="#6d8a49";
  g.beginPath(); g.ellipse(0.6,-5.5,1.7,0.6,0,0,TAU); g.fill();
  g.restore();
}
function drawBush(o,p){
  const s=p.ppm*o.sz;
  const g=ctx; g.save(); g.translate(p.x,p.y); g.scale(s,s);
  const c=["#6b7038","#5d6633","#77793e"][Math.floor(srnd(o.seed)*3)];
  g.fillStyle=c;
  for(let i=0;i<5;i++){ const q=srnd(o.seed+i*1.3);
    g.beginPath(); g.ellipse(-0.7+q*1.4,-0.34-srnd(o.seed+i*2.1)*0.45,0.42+q*0.3,0.30+q*0.18,0,0,TAU); g.fill(); }
  g.restore();
}
function drawRock(o,p){
  const s=p.ppm*o.sz; const g=ctx;
  g.save(); g.translate(p.x,p.y); g.scale(s,s);
  g.fillStyle="#8b8577"; g.beginPath(); g.ellipse(0,-0.28,0.55,0.32,0,0,TAU); g.fill();
  g.fillStyle="#a09a8b"; g.beginPath(); g.ellipse(-0.1,-0.38,0.36,0.2,0,0,TAU); g.fill();
  g.restore();
}
function drawClump(o,p){
  const s=p.ppm*o.sz; const g=ctx;
  g.save(); g.translate(p.x,p.y); g.scale(s,s);
  const c=["#7d7c3c","#8b8646","#6f7135"][Math.floor(srnd(o.seed)*3)];
  g.strokeStyle=c; g.lineWidth=0.10; g.lineCap="round";
  for(let i=0;i<9;i++){ const q=srnd(o.seed+i*1.7), q2=srnd(o.seed+i*3.1);
    const bx=-0.55+q*1.1;
    g.beginPath(); g.moveTo(bx*0.4,0.03); g.quadraticCurveTo(bx*0.8,-0.5-q2*0.3,bx,-0.85-q2*0.5); g.stroke(); }
  g.restore();
}
function drawGrassTuft(o,p,g){
  const s=p.ppm*o.sz; g=g||ctx;
  g.save(); g.translate(p.x,p.y); g.scale(s,s);
  g.globalAlpha=0.9;
  g.strokeStyle="#5f6b30"; g.lineWidth=0.055; g.lineCap="round";
  for(let i=0;i<14;i++){ const q=srnd(o.seed+i*1.7), q2=srnd(o.seed+i*3.1);
    const bx=-0.7+q*1.4, sway=Math.sin(game.t*0.9+i+o.seed)*0.10;
    g.beginPath(); g.moveTo(bx,0.2); g.quadraticCurveTo(bx+sway*0.5,-0.45-q2*0.3,bx+sway*1.6-0.12,-0.85-q2*0.55); g.stroke(); }
  g.restore(); g.globalAlpha=1;
}
function shadow(p,wMeters){
  const rx=p.ppm*wMeters*0.55;
  if(rx<0.8) return;
  ctx.fillStyle="rgba(64,54,26,.26)";
  ctx.beginPath(); ctx.ellipse(p.x,p.y,rx,Math.max(0.6,rx*0.17),0,0,TAU); ctx.fill();
}
function drawAnimal(a,p){
  const g=ctx, s=p.ppm;
  g.save();
  g.globalAlpha=clamp(a.alpha,0,1);
  g.translate(p.x,p.y);
  const hm=a.hm||1;
  g.scale(s*a.face*hm, s*hm);
  const pose = a.state==="alert"||a.state==="flee" ? 0 : a.pose;
  a._pose = lerp(a._pose===undefined?pose:a._pose, pose, 0.06);
  MV = a.mv===undefined?0.25:a.mv;
  // úroveň detailu podľa toho, aké veľké je zviera na obrazovke
  DET = clamp((s*vys(a) - 110)/300, 0, 1);
  DRAW[a.sp.draw](g,{walk:a.walk, pose:a._pose, t:a.t, seed:a.seed});
  MV = 1; DET = 0;
  g.restore();
  g.globalAlpha=1;
}

function renderScene(){
  const f=focalPx();
  game.pitchPx = f*Math.tan(game.pitch*D2R);

  drawSky();
  // v hustom lese je nad hlavou koruna, nie obloha
  if(game.spot&&game.spot.canopy){
    const hz2=CYV+game.pitchPx+game.shakeY, hc=game.spot.canopy[0], dc=game.spot.canopy[1];
    const yc=hz2 - f*((hc-CAM_H)/dc);
    if(yc>0){
      const cg=ctx.createLinearGradient(0,Math.max(0,yc-f*0.10),0,yc);
      cg.addColorStop(0,"#20401f"); cg.addColorStop(0.6,"#2e5528"); cg.addColorStop(1,"#3d6a33");
      ctx.fillStyle=cg; ctx.fillRect(0,0,W,yc);
      // roztrhaný spodný okraj koruny — nie rovná čiara
      for(let i=0;i<26;i++){ const q=srnd(i*7.3), q2=srnd(i*3.1);
        const x=((((q*3.7+game.yaw/360*2.2)%1)+1)%1)*W;
        ctx.fillStyle= i%3? "rgba(38,72,34,.85)":"rgba(52,92,44,.8)";
        ell(ctx,x,yc+f*0.010*(q2-0.35),f*0.050*(0.55+q),f*0.026*(0.5+q2)); }
    }
  }
  drawHills(); drawGround();

  // všetko zoradené od najvzdialenejšieho
  const items=[];
  for(const o of game.scenery){ if(o.type!=="grass") items.push({d:o.d,o,kind:"s"}); }
  for(const a of game.animals) items.push({d:a.d,o:a,kind:"a"});
  items.sort((A,B)=>B.d-A.d);

  let lastBlur=-1;
  for(const it of items){
    const o=it.o;
    const p=project(o.ang,it.d,it.kind==="a"?o.hgt:0);
    if(!p) continue;
    const size = it.kind==="a" ? p.ppm*vys(o) : p.ppm*(o.type==="tree"?o.sz:o.sz*1.2);
    if(size<0.7) continue;
    if(p.x<-W*0.6||p.x>W*1.6) continue;
    // malé objekty sa nerozmazávajú — je to nevidieť a stojí to výkon
    // rozmazanie sa zaokrúhľuje na párne hodnoty — každá zmena filtra stojí výkon
    let bq = size<55 ? 0 : Math.min(8,Math.round(blurFor(it.d)/2)*2);
    if(bq<2) bq=0;
    if(bq!==lastBlur){ ctx.filter = (bq && MA_FILTER) ? "blur("+bq+"px)" : "none"; lastBlur=bq; }
    if(it.kind==="a"){ if(!(o.hgt>0.4)) shadow(p,vys(o)*0.72); drawAnimal(o,p); }
    else if(o.type==="tree"){ if(game.spot&&game.spot.biome!=="prales") shadow(p,o.sz*0.35); drawTree(o,p); }
    else if(o.type==="bush"){ shadow(p,o.sz*1.1); drawBush(o,p); }
    else if(o.type==="clump") drawClump(o,p);
    else drawRock(o,p);
  }
  ctx.filter="none";

  // atmosférický opar — všetko pri horizonte sa stráca v pare
  {
    const hz=CYV+game.pitchPx+game.shakeY, f=focalPx();
    const hd=Math.max(24,f*CAM_H/110);
    const gr=ctx.createLinearGradient(0,hz-hd*0.45,0,hz+hd);
    const hzA=(game.spot&&game.spot.haze)||0.30;
    const hc=(game.spot&&game.spot.biome==="prales")?"214,226,206":
             (game.spot&&game.spot.biome==="hmlistyles")?"222,230,222":"226,222,198";
    gr.addColorStop(0,"rgba("+hc+","+hzA.toFixed(2)+")");
    gr.addColorStop(0.34,"rgba("+hc+","+(hzA*0.45).toFixed(2)+")");
    gr.addColorStop(1,"rgba("+hc+",0)");
    ctx.fillStyle=gr; ctx.fillRect(0,Math.max(0,hz-hd*0.45),W,hd*1.45);
  }

  // pásy hmly medzi stromami
  if(game.spot&&game.spot.mist){
    const hz3=CYV+game.pitchPx+game.shakeY, f3=focalPx();
    for(let i=0;i<3;i++){
      const dm=[70,130,220][i], y=hz3+f3*(CAM_H/dm), hgt=Math.max(6,f3*0.020);
      ctx.fillStyle="rgba(228,236,228,"+(0.13+i*0.05).toFixed(2)+")";
      ctx.fillRect(0,y-hgt,W,hgt*2);
    }
  }
  drawForeGrass();

  // svetlo dňa: jedna vrstva cez celú scénu stmaví alebo ozlatí obraz
  {
    const d=denny();
    if(game.nv && d.svet<0.55){
      // nočné videnie: obraz sa nestmavuje, len sa zazelená
      ctx.fillStyle="rgba(26,120,52,.30)"; ctx.fillRect(0,0,W,H);
      ctx.fillStyle="rgba(150,255,170,.07)";
      for(let i=0;i<26;i++){ const y=((i*37+Math.floor(game.t*40))%H); ctx.fillRect(0,y,W,1); }
      const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.20,W/2,H/2,Math.max(W,H)*0.62);
      vg.addColorStop(0,"rgba(0,40,10,0)"); vg.addColorStop(1,"rgba(0,30,8,.55)");
      ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
    } else {
      const al=clamp(1-d.svet,0,1)*0.82;
      if(al>0.01){ ctx.fillStyle="rgba("+hex2rgb(d.tint).join(",")+","+al.toFixed(3)+")"; ctx.fillRect(0,0,W,H); }
      // v tme svietia zvieratám oči
      if(d.svet<0.34){
        const sila=clamp((0.34-d.svet)/0.26,0,1);
        for(const a of game.animals){
          if(a.alpha<0.3) continue;
          const pp=project(a.ang,a.d,a.hgt); if(!pp) continue;
          const hh=pp.ppm*vys(a); if(hh<6) continue;
          const ey=(a.sp.hang? pp.y+hh*0.75 : pp.y-hh*0.86);
          const r=Math.max(1.2,hh*0.022);
          ctx.fillStyle="rgba(240,240,190,"+(0.85*sila).toFixed(2)+")";
          ctx.beginPath(); ctx.arc(pp.x+r*1.1,ey,r,0,TAU); ctx.fill();
          ctx.beginPath(); ctx.arc(pp.x-r*1.1,ey,r*0.9,0,TAU); ctx.fill();
        }
      }
    }
  }
}

/* Predná tráva: nakreslí sa ostro do polovičného pomocného plátna a potom
   sa rozmaže jediným ťahom — inak by každé stebielko stálo vlastné rozmazanie. */
const gcv=document.createElement("canvas"), gctx=gcv.getContext("2d");
function drawForeGrass(){
  const SC=0.5, gw=Math.max(2,Math.floor(W*SC)), gh=Math.max(2,Math.floor(H*SC));
  const list=[];
  for(const o of game.scenery){
    if(o.type!=="grass") continue;
    const p=project(o.ang,o.d); if(!p) continue;
    if(p.x<-250||p.x>W+250) continue;
    if(p.y - p.ppm*o.sz*1.6 > H) continue;      // celý trs je pod obrazovkou
    list.push([o,p]);
  }
  if(!list.length) return;
  const bq=Math.min(9,Math.round(blurFor(14)));
  if(gcv.width!==gw||gcv.height!==gh){ gcv.width=gw; gcv.height=gh; }
  gctx.setTransform(SC,0,0,SC,0,0);
  gctx.clearRect(0,0,W,H);
  for(const [o,p] of list) drawGrassTuft(o,p,gctx);
  ctx.save();
  ctx.filter = bq>1 ? "blur("+(bq*SC).toFixed(1)+"px)" : "none";
  ctx.drawImage(gcv,0,0,W,H);
  ctx.restore();
}

/* ------------------------------------------------------ HĽADÁČIK / HUD --- */
function drawViewfinder(){
  const R0=frameRect(), cx=W/2, cy=R0.Tp+R0.mh/2;
  // vinetácia
  const vg=ctx.createRadialGradient(cx,cy,Math.min(W,R0.mh)*0.32,cx,cy,Math.max(W,H)*0.72);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.42)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  // maska hľadáčika
  const mw=R0.mw, mh=R0.mh, L=R0.L, Tp=R0.Tp;
  ctx.fillStyle="rgba(6,9,7,.72)";
  ctx.fillRect(0,0,W,Tp); ctx.fillRect(0,Tp+mh,W,H-Tp-mh);
  ctx.fillRect(0,Tp,L,mh); ctx.fillRect(L+mw,Tp,W-L-mw,mh);

  ctx.strokeStyle="rgba(255,255,255,.30)"; ctx.lineWidth=1.5;
  ctx.strokeRect(L,Tp,mw,mh);
  // tretiny
  ctx.strokeStyle="rgba(255,255,255,.10)"; ctx.lineWidth=1;
  for(let i=1;i<3;i++){
    ctx.beginPath(); ctx.moveTo(L+mw*i/3,Tp); ctx.lineTo(L+mw*i/3,Tp+mh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(L,Tp+mh*i/3); ctx.lineTo(L+mw,Tp+mh*i/3); ctx.stroke();
  }
  // rohy
  ctx.strokeStyle="rgba(255,255,255,.62)"; ctx.lineWidth=2.5;
  const cl=Math.min(mw,mh)*0.07;
  [[L,Tp,1,1],[L+mw,Tp,-1,1],[L,Tp+mh,1,-1],[L+mw,Tp+mh,-1,-1]].forEach(([x,y,sx,sy])=>{
    ctx.beginPath(); ctx.moveTo(x+cl*sx,y); ctx.lineTo(x,y); ctx.lineTo(x,y+cl*sy); ctx.stroke();
  });

  // ostriaci štvorec
  const fs=Math.min(mw,mh)*0.14;
  const lock=game.afLock>0.7;
  ctx.strokeStyle= lock? "rgba(90,255,140,.95)" : (game.focusing? "rgba(255,220,110,.9)":"rgba(255,255,255,.5)");
  ctx.lineWidth= lock?2.6:2;
  ctx.strokeRect(cx-fs/2,cy-fs/2,fs,fs);
  ctx.beginPath(); ctx.moveTo(cx-5,cy); ctx.lineTo(cx+5,cy); ctx.moveTo(cx,cy-5); ctx.lineTo(cx,cy+5); ctx.stroke();

  return {L,Tp,mw,mh};
}

function drawHUD(vf){
  const {L,Tp,mw,mh}=vf;
  const pad=Math.max(10,mw*0.018);
  ctx.textBaseline="top";

  // horný riadok
  ctx.font="bold "+Math.max(11,Math.round(mw*0.017))+"px 'Trebuchet MS',sans-serif";
  ctx.fillStyle="rgba(255,255,255,.9)";
  const mm=mmEquiv();
  ctx.textAlign="left";
  ctx.fillText(mm+" mm", L+pad, Tp+pad);
  {
    const d=denny();
    ctx.font=Math.max(10,Math.round(mw*0.014))+"px 'Trebuchet MS',sans-serif";
    ctx.fillStyle= d.svet<0.40? "#9fc8ff" : d.zlata>0.55? "#ffc47a" : "rgba(255,255,255,.75)";
    const sirkaMM=Math.max(64,ctx.measureText("0000 mm").width*1.35);
    ctx.fillText(d.faza.ico+" "+nazovFazy(), L+pad+sirkaMM, Tp+pad+2);
  }
  ctx.textAlign="center";
  if(game.timed){
    const m=Math.floor(game.timeLeft/60), s=Math.floor(game.timeLeft%60);
    ctx.fillStyle = game.timeLeft<30? "#ff8a6a":"rgba(255,255,255,.9)";
    ctx.fillText(t("time")+"  "+m+":"+(s<10?"0":"")+s, L+mw/2, Tp+pad);
    const dw=mw*0.20, dx=L+mw/2-dw/2, dy=Tp+pad+Math.max(15,mw*0.019);
    ctx.fillStyle="rgba(0,0,0,.40)"; ctx.fillRect(dx,dy,dw,4);
    const d2=denny();
    ctx.fillStyle= d2.svet<0.40? "#5f78b8" : d2.zlata>0.55? "#e8a24a" : "#ffe6a8";
    ctx.fillRect(dx,dy,dw*clamp(game.dayT,0,1),4);
  }
  ctx.textAlign="right";
  ctx.fillStyle = game.shots<=3? "#ff8a6a":"rgba(255,255,255,.9)";
  ctx.fillText("▣ "+game.shots+"/"+game.maxShots, L+mw-pad, Tp+pad);
  {
    const d=denny(); let ind="";
    if(game.nv) ind="🌙 "+TX("noč. videnie","night vision");
    else if(d.svet<0.48) ind = game.flashOn? (game.flashCd>0? "⚡ …" : "⚡ "+TX("blesk","flash"))
                                           : "⚡ "+(isTouch? TX("vypnutý","off") : TX("vypnutý (B)","off (B)"));
    if(ind){
      ctx.font=Math.max(10,Math.round(mw*0.014))+"px 'Trebuchet MS',sans-serif";
      ctx.fillStyle= game.nv? "#8fe8a8" : game.flashOn? "#ffd97a" : "rgba(255,140,110,.9)";
      ctx.fillText(ind, L+mw-pad, Tp+pad+Math.max(15,mw*0.020));
    }
  }

  // spodný riadok
  ctx.textBaseline="bottom";
  ctx.textAlign="left";
  ctx.fillStyle="rgba(255,255,255,.85)";
  ctx.fillText(game.afLock>0.7? t("locked") : t("focus")+"  "+Math.round(game.focus)+" m", L+pad, Tp+mh-pad);
  // vytrvalosť + zásoby v batohu
  {
    const bw4=mw*0.17, bx4=L+pad, by4=Tp+mh-pad-34;
    ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(bx4,by4,bw4,6);
    const st=clamp(game.stam/100,0,1);
    ctx.fillStyle= st>0.5? "rgba(150,220,130,.9)" : st>0.22? "rgba(255,200,90,.9)" : "rgba(255,110,80,.95)";
    ctx.fillRect(bx4,by4,bw4*st,6);
    ctx.font=Math.max(9,Math.round(mw*0.012))+"px 'Trebuchet MS',sans-serif";
    ctx.fillStyle="rgba(255,255,255,.6)"; ctx.textBaseline="bottom";
    let inv=TX("SILA","STAMINA");
    if(game.water>0) inv+="   1 💧"+game.water;
    if(game.food>0)  inv+="   2 🥪"+game.food;
    if(game.medkit)  inv+="   🩹";
    ctx.fillText(inv, bx4, by4-2);
  }
  ctx.textAlign="right"; ctx.textBaseline="bottom";
  ctx.textAlign="right";
  ctx.fillStyle="#ffd97a";
  ctx.font="bold "+Math.max(15,Math.round(mw*0.026))+"px 'Trebuchet MS',sans-serif";
  ctx.fillText(game.score+" "+t("pts"), L+mw-pad, Tp+mh-pad);

  // dych
  const bw=mw*0.16, bh=5;
  const bx=L+mw/2-bw/2, by=Tp+mh-pad-4;
  ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle= game.breath>0.3? "rgba(140,210,255,.85)":"rgba(255,120,90,.9)";
  ctx.fillRect(bx,by,bw*game.breath,bh);
  ctx.textBaseline="bottom"; ctx.textAlign="center";
  ctx.font=Math.max(9,Math.round(mw*0.013))+"px 'Trebuchet MS',sans-serif";
  ctx.fillStyle="rgba(255,255,255,.55)";
  ctx.fillText(t("breath"), L+mw/2, by-2);

  // postup v prijatom zadaní — hore pod časom
  {
    const job=P().job;
    if(job && SP[job.sp]){
      const sp3=SP[job.sp], nm3=LANG==="sk"?sp3.sk:sp3.en;
      ctx.textAlign="center"; ctx.textBaseline="top";
      ctx.font="bold "+Math.max(11,Math.round(mw*0.0155))+"px 'Trebuchet MS',sans-serif";
      ctx.fillStyle= game.jobCount>=job.n? "#8fd07f" : "rgba(255,235,180,.82)";
      ctx.fillText("📋 "+nm3+"  "+Math.min(game.jobCount,job.n)+"/"+job.n+
                   (job.min?"  ("+TX("min.","min.")+" "+job.min+" "+t("pts")+")":""),
                   L+mw/2, Tp+pad+Math.max(13,Math.round(mw*0.017))+6);
    }
  }

  // kruhový kompas — vidno, kde v celom kruhu sa hráč práve pozerá
  {
    const R=Math.max(26,Math.min(46,mw*0.036));
    const cx0=L+pad+R+2, cy0=Tp+pad+R+20;
    ctx.save();
    ctx.fillStyle="rgba(6,10,7,.42)"; ctx.beginPath(); ctx.arc(cx0,cy0,R,0,TAU); ctx.fill();
    // výsek zodpovedajúci aktuálnemu zornému uhlu (vždy smeruje hore)
    const hf=game.fov*D2R/2;
    ctx.fillStyle="rgba(255,235,170,.20)";
    ctx.beginPath(); ctx.moveTo(cx0,cy0);
    ctx.arc(cx0,cy0,R-3,-Math.PI/2-hf,-Math.PI/2+hf); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.45)"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx0,cy0,R,0,TAU); ctx.stroke();
    // ružica sa otáča spolu s hráčom
    for(let a=0;a<360;a+=15){
      const rad=(a-game.yaw-90)*D2R, major=a%90===0;
      const r1=R-2, r0=R-(major?9:4.5);
      ctx.strokeStyle="rgba(255,255,255,"+(major?.9:.35)+")"; ctx.lineWidth=major?1.8:1;
      ctx.beginPath();
      ctx.moveTo(cx0+Math.cos(rad)*r0,cy0+Math.sin(rad)*r0);
      ctx.lineTo(cx0+Math.cos(rad)*r1,cy0+Math.sin(rad)*r1); ctx.stroke();
    }
    // sever
    const nr=(-game.yaw-90)*D2R;
    ctx.fillStyle="#ff6b4a";
    ctx.beginPath();
    ctx.moveTo(cx0+Math.cos(nr)*(R-2), cy0+Math.sin(nr)*(R-2));
    ctx.lineTo(cx0+Math.cos(nr+0.20)*(R-10), cy0+Math.sin(nr+0.20)*(R-10));
    ctx.lineTo(cx0+Math.cos(nr-0.20)*(R-10), cy0+Math.sin(nr-0.20)*(R-10));
    ctx.closePath(); ctx.fill();
    // vietor — kam fúka; ak fúka k zvieraťu, zavetrí ťa
    {
      const wr=(game.wind-game.yaw-90)*D2R, rr=R-13;
      const wx=cx0+Math.cos(wr)*rr, wy=cy0+Math.sin(wr)*rr;
      ctx.strokeStyle="rgba(150,205,255,"+(0.35+0.5*game.windS).toFixed(2)+")";
      ctx.lineWidth=2; ctx.lineCap="round";
      ctx.beginPath();
      ctx.moveTo(cx0-Math.cos(wr)*rr*0.55, cy0-Math.sin(wr)*rr*0.55);
      ctx.lineTo(wx,wy); ctx.stroke();
      ctx.fillStyle="rgba(150,205,255,"+(0.5+0.4*game.windS).toFixed(2)+")";
      ctx.beginPath();
      ctx.moveTo(wx,wy);
      ctx.lineTo(cx0+Math.cos(wr+0.34)*(rr-7), cy0+Math.sin(wr+0.34)*(rr-7));
      ctx.lineTo(cx0+Math.cos(wr-0.34)*(rr-7), cy0+Math.sin(wr-0.34)*(rr-7));
      ctx.closePath(); ctx.fill();
    }
    // stopár alebo ďalekohľad ukáže, kde sa čo hýbe
    if(game.mod && game.mod.radar){
      for(const an of game.animals){
        if(an.threat) continue;
        const ar=(an.ang-game.yaw-90)*D2R;
        const al=clamp(1.15-an.d/240,0.25,0.9);
        ctx.fillStyle="rgba(255,225,140,"+al.toFixed(2)+")";
        ctx.beginPath(); ctx.arc(cx0+Math.cos(ar)*(R-7), cy0+Math.sin(ar)*(R-7), 2.4, 0, TAU); ctx.fill();
      }
    }
    // smer predátora
    if(game.threat && game.threat.t>1.6){
      const tr=(game.threat.a.ang-game.yaw-90)*D2R;
      ctx.fillStyle="rgba(255,60,40,"+(0.55+0.45*Math.sin(game.t*7)).toFixed(2)+")";
      ctx.beginPath(); ctx.arc(cx0+Math.cos(tr)*(R-7), cy0+Math.sin(tr)*(R-7), 4.2, 0, TAU); ctx.fill();
    }
    ctx.fillStyle="rgba(255,255,255,.92)";
    ctx.font="bold "+Math.round(R*0.42)+"px 'Trebuchet MS',sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(Math.round(game.yaw)+"°",cx0,cy0);
    ctx.restore();
  }

  // prvé kroky — len v úplne prvej expedícii
  if(game.tut>=0 && game.tut<3){
    if(game.tut===0 && game.fov<28) game.tut=1;
    else if(game.tut===1 && game.afLock>0.7) game.tut=2;
    else if(game.tut===2 && game.photos.length>0) game.tut=3;
    const rady = isTouch ? [
      TX("Ťahaj prstom po obrazovke a tlačidlom + si zviera priblíž",
         "Drag a finger across the screen, then zoom in with the + button"),
      TX("Podrž AF a zaostri na zviera — rámik zozelenie",
         "Hold AF to focus on the animal — the frame turns green"),
      TX("Teraz ťukni na veľké červené tlačidlo a odfoť ho",
         "Now tap the big red button and take the shot")] : [
      TX("Kolieskom myši (alebo + −) si zviera priblíž","Zoom in on an animal with the mouse wheel (or + −)"),
      TX("Podrž F a zaostri na zviera — rámik zozelenie","Hold F to focus on the animal — the frame turns green"),
      TX("Teraz stlač medzerník a odfoť ho","Now press the spacebar and take the shot")];
    if(game.tut<3){
      ctx.textAlign="center"; ctx.textBaseline="bottom";
      ctx.font="bold "+Math.max(13,Math.round(mw*0.020))+"px 'Trebuchet MS',sans-serif";
      const txt=rady[game.tut], tw=ctx.measureText(txt).width;
      ctx.fillStyle="rgba(8,14,10,.72)";
      ctx.fillRect(L+mw/2-tw/2-14, Tp+mh*0.74-24, tw+28, 32);
      ctx.fillStyle="#ffd97a"; ctx.fillText(txt, L+mw/2, Tp+mh*0.74);
    }
  }
  // varovanie pred predátorom
  if(game.danger>0.01){
    const d=game.danger;
    const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.22,W/2,H/2,Math.max(W,H)*0.62);
    vg.addColorStop(0,"rgba(180,20,10,0)");
    vg.addColorStop(1,"rgba(180,20,10,"+(0.10+0.42*d*(0.75+0.25*Math.sin(game.t*6))).toFixed(3)+")");
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  }
  if(game.threat && game.threat.phase==="warn"){
    ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillStyle="#ff5a3c";
    ctx.font="bold "+Math.max(19,Math.round(mw*0.032))+"px 'Trebuchet MS',sans-serif";
    ctx.fillText(t("thWarn"), L+mw/2, Tp+mh*0.13);
    ctx.fillStyle="#ffd97a";
    ctx.font="bold "+Math.max(12,Math.round(mw*0.019))+"px 'Trebuchet MS',sans-serif";
    ctx.fillText(isTouch? TX("Podrž STÁŤ alebo ťukni na ÚTEK","Hold HOLD or tap RUN")
                        : t("thHow"), L+mw/2, Tp+mh*0.13+Math.max(22,mw*0.038));
    // ako dlho ešte vydrží stáť / koľko času zostáva
    const bw3=mw*0.30, bx3=L+mw/2-bw3/2, by3=Tp+mh*0.13+Math.max(44,mw*0.062);
    ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(bx3,by3,bw3,7);
    ctx.fillStyle="#ff4a30"; ctx.fillRect(bx3,by3,bw3*clamp(1-game.threat.t/(7.5+(game.mod.warnBonus||0)),0,1),7);
    const sp2=clamp(game.threatSafeT/3.0,0,1);
    if(sp2>0){ ctx.fillStyle="#5aff8c"; ctx.fillRect(bx3,by3+9,bw3*sp2,4); }
  }

  // pruhy pozornosti nad zvieratami
  for(const a of game.animals){
    if(a.att<0.12 && a.state==="idle") continue;
    if(a.state==="flee"||a.state==="leaving") continue;
    const p=project(a.ang,a.d,a.hgt); if(!p) continue;
    const top=a.sp.hang? p.y - p.ppm*0.35 : p.y - p.ppm*vys(a)*1.05;
    if(p.x<L||p.x>L+mw||top<Tp||top>Tp+mh) continue;
    const bw2=Math.max(24,Math.min(70,p.ppm*vys(a)*0.7)), bh2=5;
    const v=a.state==="alert"?1:a.att;
    ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(p.x-bw2/2,top-12,bw2,bh2);
    ctx.fillStyle = v>0.75? "#ff5a3c" : v>0.4? "#ffa93c" : "#ffd97a";
    ctx.fillRect(p.x-bw2/2,top-12,bw2*v,bh2);
    if(a.state==="alert"){
      ctx.fillStyle="#ff5a3c"; ctx.font="bold 13px 'Trebuchet MS',sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="bottom";
      ctx.fillText("!",p.x,top-14);
    }
  }
}

/* -------------------------------------------------------- FOTOGRAFOVANIE -- */
// Jediné miesto, kde sa počíta rám hľadáčika — používa ho vykreslenie
// aj vyhodnotenie fotky, aby sa nikdy nerozišli.
function frameRect(){
  const pas = isTouch? Math.min(118, Math.max(78, H*0.16)) : 0;   // spodný pás s tlačidlami
  const uH = H - pas;
  const mw = Math.min(W*0.94, uH*1.5);
  const mh = Math.min(uH*0.94, mw/1.5);
  return {L:W/2-mw/2, Tp:uH/2-mh/2, mw, mh, pas};
}
function evaluateShot(){
  const {L,Tp,mw,mh}=frameRect();
  const cands=[];
  for(const a of game.animals){
    if(a.alpha<0.3) continue;
    const p=project(a.ang,a.d,a.hgt); if(!p) continue;
    const hh=p.ppm*vys(a), ww=hh*0.95;
    const x0=p.x-ww/2, x1=p.x+ww/2;
    const y0=a.sp.hang? p.y : p.y-hh, y1=a.sp.hang? p.y+hh : p.y;
    const ix=Math.max(0,Math.min(x1,L+mw)-Math.max(x0,L));
    const iy=Math.max(0,Math.min(y1,Tp+mh)-Math.max(y0,Tp));
    if(ix<=0||iy<=0) continue;
    const visible=(ix*iy)/(ww*hh);
    if(visible<0.12) continue;
    cands.push({a,p,hh,ww,x0,x1,y0,y1,visible,area:ix*iy});
  }
  if(!cands.length) return null;
  cands.sort((A,B)=>{
    const da=Math.hypot(A.p.x-W/2,(A.p.y-A.hh/2)-H/2), db=Math.hypot(B.p.x-W/2,(B.p.y-B.hh/2)-H/2);
    return (B.area/(1+db*db*0.002)) - (A.area/(1+da*da*0.002));
  });
  const c=cands[0], a=c.a, sp=a.sp;

  // ostrosť
  const b=blurFor(a.d);
  let sharp = clamp(1 - b/5.5, 0.12, 1);
  const motion = clamp(1 - Math.max(0,(game.angSpeed/Math.max(3,game.fov))-0.15)*0.55, 0.22, 1);
  sharp = clamp(sharp*motion, 0.12, 1);
  // expozícia: v šere treba blesk alebo nočné videnie, inak je fotka tmavá
  const den=denny();
  let expo=1;
  if(!game.nv && den.svet<0.48 && !game.flashFired) expo=clamp(0.38+den.svet*1.3,0.38,1);
  sharp = clamp(sharp*expo, 0.08, 1);

  // veľkosť v zábere
  const frac = c.hh/mh;
  let size = clamp(0.35 + Math.pow(clamp(frac,0,1),0.55)*1.35, 0.35, 1.6);

  // kompozícia
  const ccx=c.p.x, ccy=c.p.y+(a.sp.hang? c.hh/2 : -c.hh/2);
  const off = Math.hypot((ccx-(L+mw/2))/(mw/2), (ccy-(Tp+mh/2))/(mh/2));
  let comp = clamp(1.32 - off*0.5, 0.75, 1.32);
  comp *= clamp(0.55 + c.visible*0.55, 0.55, 1.1);

  let pts = sp.base * sharp * size * comp;

  // bonusy
  const bonuses=[];
  const species=new Set(); cands.forEach(k=>{ if(k.visible>0.4) species.add(k.a.sp.id); });
  if(species.size>=2){ pts*=1.4; bonuses.push("multi"); }
  const first = !mem.album[sp.id];
  if(first){ pts*=(game.mod.firstMul||2); bonuses.push("first"); }
  const dangerShot = !!a.threat;
  if(dangerShot){ pts*=1.6; bonuses.push("danger"); }
  // mláďa s matkou v jednom zábere
  const jeMlada = cands.some(k=>k.a.young && k.a.sp.id===sp.id && k.visible>0.35);
  const jeDospele = cands.some(k=>!k.a.young && k.a.sp.id===sp.id && k.visible>0.35);
  const mladaBonus = jeMlada && jeDospele;
  if(mladaBonus){ pts*=1.5; bonuses.push("mláďa"); }
  // zviera v pohybe
  const vPohybe = (a.mv||0)>0.62 || a.state==="flee";
  if(vPohybe){ pts*=1.28; bonuses.push("pohyb"); }
  // svetlo: noc je vzácna, zlatá hodina je krásna
  const nocnyZaber = den.svet<0.30;
  if(nocnyZaber) pts*=1.35;
  else if(den.zlata>0.55) pts*=1.22;

  // opakované fotky toho istého druhu v jednom kole majú klesajúcu cenu —
  // inak je najvýhodnejšie vyprázdniť kartu do jedného zvieraťa
  const ptsRaw=Math.round(pts);
  const kolkoUz=game.photos.filter(q=>q.id===sp.id).length;
  pts *= [1,0.62,0.40,0.26,0.17][Math.min(4,kolkoUz)];
  pts=Math.round(pts);

  // spätná väzba
  let fb;
  if(expo<0.6) fb=isTouch? TX("Tmavé — zapni blesk ⚡ alebo si vezmi nočné videnie",
                            "Dark — switch the ⚡ flash on or bring night vision")
                        : TX("Tmavé — zapni blesk (B) alebo si vezmi nočné videnie",
                     "Too dark — turn on the flash (B) or pack night vision");
  else if(mladaBonus) fb=TX("Mláďa s matkou — nádhera!","A youngster with its mother — beautiful!");
  else if(vPohybe && sharp>0.6) fb=TX("Zachytil si ho v pohybe!","Caught it on the move!");
  else if(nocnyZaber && sharp>0.6) fb=TX("Nočný záber — to sa len tak nevidí","A night shot — you do not see that every day");
  else if(kolkoUz>=2) fb=TX("Toho už máš dosť — skús nájsť iný druh","You have plenty of these — try another species");
  else if(sharp<0.4) fb=t("fb_blur");
  else if(frac<0.10) fb=t("fb_far");
  else if(c.visible<0.85) fb=t("fb_edge");
  else if(sharp>0.82 && frac>0.35) fb=t("fb_big");
  else if(sharp>0.8) fb=t("fb_sharp");
  else if(comp>1.15) fb=t("fb_center");
  else fb=t("fb_ok");
  if(first) fb=TX("Prvýkrát v albume — "+(game.mod.firstMul||2)+"× body!","First in the album — "+(game.mod.firstMul||2)+"× points!");
  if(dangerShot) fb=t("thBonus");

  const kvalita=sharp*size*comp;
  return {sp,pts,ptsRaw,sharp,size,comp,first,fb,frac,expo,kvalita,opak:kolkoUz};
}
function capture(){
  const {L,Tp,mw,mh}=frameRect();
  const c=document.createElement("canvas");
  c.width=200; c.height=Math.round(200*mh/mw);
  const g=c.getContext("2d");
  g.drawImage(cv, L*DPR,Tp*DPR,mw*DPR,mh*DPR, 0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.6);
}
function doShot(){
  if(game.screen!=="play") return;
  if(game.shots<=0){ toast(t("noCard"),"", ""); return; }
  if(game.pendingShot||game.flash>0.55) return;      // bez dvojitého cvaknutia
  game.shots--;
  game.pendingShot=true;
}
function finishShot(){
  // v šere sa blesk odpáli sám — ale zvieratá to poriadne vyplaší
  const den=denny();
  game.flashFired = (!game.nv && den.svet<0.48 && game.flashOn && game.flashCd<=0);
  if(game.flashFired) game.flashCd=1.6;
  const img=capture();
  shutterSnd();
  game.flash=game.flashFired?1.6:1;
  const r=evaluateShot();
  if(!r){ toast(t("nothing"),"0 "+t("pts"),""); return; }
  game.score+=r.pts;
  game.photos.push({id:r.sp.id, pts:r.pts, img, fb:r.fb, first:r.first, kval:r.kvalita});
  // album
  const job=P().job;
  if(job && r.sp.id===job.sp && r.ptsRaw>=(job.min||0)){
    game.jobCount++;
    if(game.jobCount===job.n){ toast(TX("Zadanie splnené!","Assignment complete!"),"+"+eur(job.pay),"");
      beep(700,0.14,"sine",0.13); setTimeout(()=>beep(940,0.18,"sine",0.13),150); }
  }
  const cur=mem.album[r.sp.id];
  if(!cur || cur.pts<r.pts){ mem.album[r.sp.id]={pts:r.pts,img,t:Date.now()}; save(); }
  const nm = LANG==="sk"? r.sp.sk : r.sp.en;
  const hv = r.kvalita>1.55? "★★★" : r.kvalita>0.95? "★★☆" : r.kvalita>0.55? "★☆☆" : "☆☆☆";
  toast(r.first? t("newSpecies")+" "+nm : nm, hv+"   +"+r.pts+" "+t("pts"), r.fb);
  if(r.first) setTimeout(()=>{beep(660,0.12,"sine",0.14);setTimeout(()=>beep(880,0.16,"sine",0.14),120);},60);
  // po blesku sa zvieratá v zábere rozutekajú
  if(game.flashFired){
    beep(1800,0.05,"square",0.07);
    for(const an of game.animals){
      if(an.state!=="idle") continue;
      const dv=Math.abs(angDiff(an.ang,game.yaw));
      if(dv<game.fov*1.1) an.att=Math.min(1.2,an.att+0.60);
      else if(dv<game.fov*2.4) an.att=Math.min(1,an.att+0.20);
    }
  }
  if(game.shots<=0 && game.timed) setTimeout(endRound,1400);
}

  toastEl.querySelector(".t1").textContent=a;

  toastEl.style.opacity="1"; toastT=2.4;
}

let keys={}, dragging=false, lastTouch=null, pinchD=0, locked=false;

document.addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(game.screen!=="play") return;
  if(e.code==="Space"){ e.preventDefault(); doShot(); }
  if(e.code==="KeyB"){ game.flashOn=!game.flashOn;
    toast(TX("Blesk","Flash")+": "+(game.flashOn?TX("zapnutý","on"):TX("vypnutý","off")),"",""); }
  if(e.code==="KeyN"){ if(game.mod.nv){ game.nvManual=true; game.nv=!game.nv;
      toast(TX("Nočné videnie","Night vision")+": "+(game.nv?TX("zapnuté","on"):TX("vypnuté","off")),"",""); }
    else toast(TX("Nočné videnie nemáš v batohu","No night vision in your pack"),"",""); }
  if(e.code==="Digit1"||e.code==="Numpad1"){ useItem("voda"); }
  if(e.code==="Digit2"||e.code==="Numpad2"){ useItem("jedlo"); }
  if(e.code==="KeyM"){ e.preventDefault(); presun(); }
  if(e.code==="KeyU"){ e.preventDefault(); if(game.threat&&game.threat.phase==="warn") game.fleeReq=true; }
  if(e.code==="Escape" && document.pointerLockElement) document.exitPointerLock();
});
document.addEventListener("keyup",e=>{ keys[e.code]=false; });

function pustiVsetko(){ keys={}; game.holding=false; game.focusing=false;

window.addEventListener("blur",pustiVsetko);

cv.addEventListener("mousedown",e=>{

document.addEventListener("pointerlockchange",()=>{

});

  if(document.pointerLockElement){
    const k=game.fov/W*1.15;
    game.panX += e.movementX*k;          // uloží sa a rozloží plynulo cez viac snímok

cv.addEventListener("wheel",e=>{
  if(game.screen!=="play") return;

  game.fovT = clamp(game.fovT*(e.deltaY>0?1.13:0.885), FOV_MIN, FOV_MAX);

cv.addEventListener("touchstart",e=>{
  isTouch=true; document.getElementById("touch").classList.add("on");
  hintEl.classList.remove("on");
  audioInit();
  if(e.touches.length===1){ lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY}; }
  else if(e.touches.length===2){ pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); }
},{passive:false});
cv.addEventListener("touchmove",e=>{
  if(game.screen!=="play") return;
  e.preventDefault();
  if(e.touches.length===1 && lastTouch){
    const k=game.fov/W*1.25;
    // Prst vedie kameru: ťah doľava = pozeráš doľava (rovnako ako myšou).
    // Zároveň sa uhol mení HNEĎ, nie cez vyhladzovací zásobník — ten pridával
    // na tablete citeľné oneskorenie. Dotyk chodí sám o sebe plynulo.
    const dx=(e.touches[0].clientX-lastTouch.x)*k;
    const dy=(e.touches[0].clientY-lastTouch.y)*k*0.9;
    game.yaw=(game.yaw+dx+360)%360;
    game.pitch=clamp(game.pitch-dy,-16,42);
    lastTouch={x:e.touches[0].clientX,y:e.touches[0].clientY};
  } else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(pinchD>0){ const nf=clamp(game.fovT*(pinchD/d), FOV_MIN, FOV_MAX);
      game.fovT=nf; game.fov=nf; }        // štipka reaguje okamžite
    pinchD=d;
  }
},{passive:false});
function _touchKoniec(e){
  pinchD=0;
  // Po zdvihnutí jedného prsta zo štipky ostával druhý na skle, ale lastTouch
  // bol null a otáčanie prestalo fungovať. Preto ho preberieme na zvyšný prst.
  const z=e&&e.touches&&e.touches[0];
  lastTouch = z? {x:z.clientX,y:z.clientY} : null;
}
cv.addEventListener("touchend",_touchKoniec);
// bez touchcancel ostala stará poloha prsta a kamera po systémovom geste skočila
cv.addEventListener("touchcancel",()=>{ lastTouch=null; pinchD=0; });

function bindTouch(id,down,up){
  const el=document.getElementById(id); if(!el) return;
  el.addEventListener("touchstart",e=>{e.preventDefault();e.stopPropagation();down();},{passive:false});
  el.addEventListener("touchend",e=>{e.preventDefault();e.stopPropagation();up&&up();},{passive:false});
  el.addEventListener("touchcancel",()=>{ up&&up(); });
  // myš: bez zachytenia ukazovateľa ostane tlačidlo zaseknuté, keď ho hráč pustí vedľa
  el.addEventListener("pointerdown",e=>{
    if(e.pointerType==="touch") return;
    e.preventDefault(); e.stopPropagation();
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    down();
  });
  const pust=e=>{ if(e && e.pointerType==="touch") return; up&&up(); };
  el.addEventListener("pointerup",pust);
  el.addEventListener("pointercancel",pust);
  el.addEventListener("lostpointercapture",()=>{ up&&up(); });
}
