<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#0b0d0c;font-family:'Trebuchet MS',Verdana,sans-serif;color:#f2ede2;user-select:none}#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}#cv3{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;justify-content:safe center;background:radial-gradient(ellipse at 50% 40%,#20301f 0%,#0d1310 70%,#070908 100%);z-index:10;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}.scr>*{flex-shrink:0}.scr.on{display:flex}h1{font-size:clamp(30px,7vw,62px);letter-spacing:3px;color:#ffd97a;text-shadow:0 4px 20px rgba(0,0,0,.7);margin-bottom:4px;text-align:center}.sub{font-size:clamp(12px,2.4vw,17px);color:#a8bfa0;letter-spacing:5px;text-transform:uppercase;margin-bottom:28px;text-align:center}.card{background:rgba(12,20,15,.82);border:1px solid rgba(255,217,122,.28);border-radius:14px;padding:20px 24px;max-width:760px;width:100%;margin-bottom:16px;backdrop-filter:blur(4px)}.card h2{font-size:17px;color:#ffd97a;margin-bottom:10px;letter-spacing:1px}.card p,.card li{font-size:14px;line-height:1.65;color:#d6e0cf}.card ul{margin-left:18px}.btn{background:linear-gradient(#3f6b3a,#264423);border:1px solid #6f9d63;color:#f4f7ee;font-size:17px;font-weight:bold;padding:14px 30px;border-radius:11px;cursor:pointer;margin:6px;letter-spacing:1px;transition:.15s;font-family:inherit}.btn:hover{background:linear-gradient(#4e8446,#31572c);transform:translateY(-2px)}.btn.gold{background:linear-gradient(#b8892f,#7d5a17);border-color:#ffd97a;color:#fff8e4}.btn.gold:hover{background:linear-gradient(#d0a03f,#96701f)}.btn.sm{font-size:14px;padding:12px 18px;min-height:44px}.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}.kbd{display:i %);z-index:8;background:rgba(0,0,0,.72);border:1px solid #ffd97a;border-radius:12px;padding:16px 26px;font-size:16px;text-align:center;color:#ffd97a;display:none}.hint.on{display:block}.bar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center;margin-bottom:14px;max-width:780px}.chip{background:rgba(12,22,15,.85);border:1px solid #40563a;border-radius:20px;padding:5px 13px;font-size:13px;color:#d6e0cf}.chip.gold{border-color:#ffd97a;color:#ffd97a;font-weight:bold}.chip.sm{font-size:11px;padding:4px 10px}.pbar{display:inline-block;width:110px;height:7px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,#6f9d63,#ffd97a)}.line{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(80,110,70,.25)}.line:last-child{border-bottom:none}.line.act{background:rgba(255,217,122,.07);border-radius:8px}.line .ic{font-size:20px;width:26px;text-align:center;flex:0 0 auto}.line .nm{flex:1 1 auto;font-size:14px;color:#e6eedd;min-width:120px}.line .cur{font-size:12px;color:#9db394;flex:0 0 auto}.line .rt{flex:0 0 auto;text-align:right}.ok{color:#8fd07f;font-size:12px}.lock{color:#7f8a76;font-size:12px;font-style:italic}.gold2{color:#ffd97a;font-weight:bold}.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;max-width:900px;width:100%;margin-bottom:16px}.ch{background:rgba(12,20,15,.85);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;text-align:center}.ch:hover{border-color:var(--c);transform:translateY(-3px)}.ch.sel{border-color:var(--c);box-shadow:0 0 18px rgba(255,217,122,.2)}.cIc{font-size:36px}.cNm{font-size:19px;font-weight:bold;color:var(--c);margin-top:4px}.cRo{font-size:12px;color:#9db394;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}.cDe{font-size:13px;line-height:1.5;color:#d6e0cf}.contT{font-size:12px;letter-spacing:4px;text-transform:uppercas <script>"use strict";const T={sk:{title:"BBC FOTOREPORTÉR",sub:"Masai Mara · Keňa",howT:"Ako sa to hrá",how:["Pozeráš sa cez hľadáčik fotoaparátu. Rozhliadaj sa dookola a hľadaj zvieratá.","Priblíž si ich zoomom, <b>zaostri</b> a stlač spúšť. Rozmazaná fotka je takmer bez bodov.","<b>Hýb sa pomaly!</b> Keď prudko švihneš kamerou, zvieratá si ťa všimnú a ujdú. Nad zvieraťom svieti oranžový pruh — to je jeho pozornosť."],ctrlT:"Ovládanie",ctrl:"<span class='kbd'>myš</span> alebo <span class='kbd'>šípky</span> rozhliadanie &nbsp;·&nbsp; <span class='kbd'>koliesko</span> alebo <span class='kbd'>+ −</span> zoom &nbsp;·&nbsp; <span class='kbd'>ľavé tl.</span> alebo <span class='kbd'>medzerník</span> spúšť &nbsp;·&nbsp; <span class='kbd'>F</span> alebo <span class='kbd'>pravé tl.</span> zaostrenie &nbsp;·&nbsp; <span class='kbd'>Shift</span> zadržať dych a znehybnieť pred predátorom &nbsp;·&nbsp; <span class='kbd'>B</span> blesk &nbsp;·&nbsp; <span class='kbd'>N</span> nočné videnie &nbsp;·&nbsp; <span class='kbd'>U</span> útek &nbsp;·&nbsp; <span class='kbd'>M</span> presun inam &nbsp;·&nbsp; <span class='kbd'>1</span>/<span class='kbd'>2</span> voda a jedlo<br><br>Na tablete sa hrá prstom — pozri kartu nižšie.",ctrlDotyk:"<b>Ťahaj prstom</b> po obraze a rozhliadaj sa. <b>Dva prsty</b> (štipka) alebo tlačidlá <span class='kbd'>−</span> <span class='kbd'>+</span> priblížia zviera.<br><br>Dole je pás tlačidiel: <span class='kbd'>AF</span> podrž a zaostri (rámik zozelenie) &nbsp;·&nbsp; <span class='kbd'>◉</span> veľké červené odfotí &nbsp;·&nbsp; <span class='kbd'>INAM</span> presun na iné miesto &nbsp;·&nbsp; <span class='kbd'>⚡</span> blesk a nočné videnie &nbsp;·&nbsp; <span class='kbd'>💧</span> napi sa a najedz.<br><br>Keď príde predátor, pribudnú <span class='kbd'>ÚTEK</span> a <span class='kbd'>STÁŤ</span>. Podržaním <b>STÁŤ</b> aj zadržíš dych, takže sa hľadáčik prestane triasť.",goalT:"Cieľ",goal:"Podľa vybranej expedície máš 4 až 10 minút a obmedzený počet fotiek — koľko presne, vidíš v tábore. Vzácne zviera, ostré a dobre skomponované = veľa bodov. Za druh, ktorý fotíš prvýkrát, dostane Adamko trojnásobok. To isté zviera sa oplatí odfotiť raz — druhá a tretia fotka toho istého druhu už dávajú menej.",start:"ZAČAŤ EXPEDÍCIU",free:"Voľné fotenie (bez času)",album:"Album zvierat",back:"Späť",clickPlay:"Klikni pre ovládanie kamery",time:"ČAS",shots:"FOTIEK",score:"BODY",focus:"OSTRENIE",locked:"ZAOSTRENÉ",breath:"DYCH",resT:"KONIEC EXPEDÍCIE",total:"CELKOM",best:"Najlepší záber",noPhoto:"Žiadna fotka. Skús to znova — hlavne pomaly!",again:"Znova",menu:"Hlavné menu",albumT:"ALBUM ZVIERAT",albumS:"druhov z",found:"objavených",newSpecies:"NOVÝ DRUH!",blurry:"Rozmazané",nothing:"Prázdny záber",noCard:"Karta je plná!",rare:["Bežné","Nezvyčajné","Vzácne","Legendárne"],fb_sharp:"Pekne ostré",fb_blur:"Rozmazané — musíš zaostriť a nehýbať sa",fb_far:"Príliš ďaleko — priblíž si ho",fb_big:"Skvelé priblíženie",fb_edge:"Odrezal si ho — daj ho celého do záberu",fb_center:"Pekná kompozícia",fb_ok:"Slušný záber",fb_first:"Prvýkrát v albume — dvojnásobok!",fled:"utieklo",spotted:"si ťa všimlo",thWarn:"POZOR — PREDÁTOR!",thHow:"NEHÝB SA (Shift) alebo UTEČ (U)",thSafe:"Predátor stratil záujem. Dýchaj.",thHit:"ZAÚTOČIL! Stratil si polovicu bodov.",thFlee:"Utiekol si do bezpečia — ale stratil si čas.",thNear:"Niečo sa hýbe v tráve…",thBonus:"Nebezpečný záber!",flee:"ÚTEK",steady:"NEHÝBAŤ SA",lat:"Latinsky",live:"Kde žije",eat:"Čím sa živí",intr:"Zaujímavosť",stat:"Stav",bestp:"Tvoja najlepšia fotka",pts:"b"},en:{title:"BBC PHOTO REPORTER",sub:"Masai Mara · Kenya",howT:"How to play",how:["You look through a camera viewfinder. Pan around and search for animals.","Zoom in, <b>focus</b>, then press the shutter. A blurry photo is worth almost nothing.","<b>Move slowly!</b> Whipping the camera around makes animals notice you and run. The orange bar above an animal is its alertness."],ctrlT:"Controls",ctrl:"<span class='kbd'>mouse</span> or <span class='k , buds and fungi; its 30 cm tongue even cleans its own ears",intr:"The giraffe's closest relative, yet striped like a zebra. Science only found it in 1901 — until then it was a European legend about a forest horse.",stat:"Endangered"}},{id:"gorila",draw:"gorila",h:1.6,rar:2,base:265,minD:32,maxD:115,shy:1.35,group:[1,3],speed:.8,land:"kongo",sk:"Gorila východná",en:"Eastern Gorilla",lat:"Gorilla beringei",icon:"🦍",fsk:{live:"Horské a nížinné pralesy východného Konga, Rwandy a Ugandy",eat:"Listy, byle, bambus — denne až 30 kg zelene",intr:"Dospelý samec so strieborným chrbtom váži dvestopäťdesiat kíl a je desaťkrát silnejší než človek, ale je to pokojný vegetarián. Každý večer si postaví nové hniezdo.",stat:"Kriticky ohrozený"},fen:{live:"Mountain and lowland forests of eastern Congo, Rwanda and Uganda",eat:"Leaves, stems and bamboo — up to 30 kg of greenery a day",intr:"A silverback weighs 250 kg and is ten times stronger than a person, yet is a gentle vegetarian. He builds a fresh nest every evening.",stat:"Critically endangered"}},{id:"bongo",draw:"bongo",h:1.35,rar:3,base:420,minD:30,maxD:105,shy:1.8,group:[1,2],speed:1,land:"kongo",sk:"Bongo lesné",en:"Bongo",lat:"Tragelaphus eurycerus",icon:"🦌",fsk:{live:"Najhustejšie porasty afrických pralesov",eat:"Listy, byliny, kôra; chodí k slaným prameňom",intr:"Najväčšia lesná antilopa a jedna z najplachších. Rohy nesú samce aj samice a pri behu húštinou ich zaklonia na chrbát, aby sa nezachytili.",stat:"Takmer ohrozený"},fen:{live:"The densest thickets of African rainforest",eat:"Leaves, herbs and bark; it visits salt licks",intr:"The largest forest antelope and one of the shyest. Both sexes carry horns and lay them flat along the back when crashing through undergrowth.",stat:"Near threatened"}}),SPECIES.forEach(e=>{SP[e.id]=e});const AKTIVITA={lion:"noc",hyena:"noc",slothbear:"noc",cloudleopard:"noc",jaguar:"noc",ocelot:"noc",hippo:"noc",tapir:"noc",leopard:"noc",bongo:"noc",serval:"sumrak",tiger:"sumrak",jackal:"sumra s the winter away in a den, eating and drinking nothing for months. Its cubs are born right then, blind and no bigger than a guinea pig.",stat:"Least concern"}},{id:"vlk",draw:"vlk",land:"slovensko",h:.88,rar:2,base:265,minD:50,maxD:170,shy:1.75,group:[2,5],speed:1.3,pred:!0,sk:"Vlk dravý",en:"Grey Wolf",lat:"Canis lupus",icon:"🐺",fsk:{live:"Rozľahlé lesy severného a východného Slovenska, svorka potrebuje aj 200 km²",eat:"Jelene, srny a diviaky — najčastejšie choré a slabé kusy",intr:"Vytie počuť aj na desať kilometrov a každý vlk zavýja v inej výške, takže svorka znie oveľa väčšia, než naozaj je. Od roku 2021 je u nás chránený po celý rok.",stat:"Málo dotknutý"},fen:{live:"Large forests of northern and eastern Slovakia; a pack needs up to 200 km²",eat:"Red deer, roe deer and wild boar — usually the sick and the weak",intr:"A howl carries ten kilometres, and every wolf howls at a different pitch so the pack sounds far bigger than it is. Since 2021 it has been protected in Slovakia all year round.",stat:"Least concern"}},{id:"rys",draw:"rys",land:"slovensko",h:.72,rar:3,base:470,minD:45,maxD:150,shy:1.8,group:[1,1],speed:1.2,pred:!0,sk:"Rys ostrovid",en:"Eurasian Lynx",lat:"Lynx lynx",icon:"🐈",fsk:{live:"Husté karpatské lesy so skalami — na Slovensku ich je asi tristo",eat:"Srny a jelenčatá, zajace, tetrovy — číha a skočí z niekoľkých metrov",intr:"Čierne štetiny na ušiach mu pomáhajú počuť — bez nich je nedoslýchavý. Jednu srnu jedáva aj týždeň a medzitým ju zahrabáva do lístia.",stat:"Málo dotknutý"},fen:{live:"Dense rocky Carpathian forest — around three hundred live in Slovakia",eat:"Roe deer and fawns, hares, grouse — it stalks and pounces from a few metres",intr:"The black tufts on its ears help it hear; without them it is half deaf. It feeds off one roe deer for a week, burying it in leaves in between.",stat:"Least concern"}},{id:"kamzik",draw:"kamzik",land:"slovensko",h:.82,rar:2,base:285,minD:40,maxD:160,shy:1.45,group:[3,8],speed:1.2,sk:"Kamzík vrchovský tatranský",en:"Tatra Chamois",lat:"Rupicapra rupicapra tatrica",icon:"🐐",fsk:{live:"Bralá a kosodrevina Vysokých a Belianskych Tatier — nikde inde na svete",eat:"Tráva, byliny, machy a lišajníky spomedzi skál",intr:"Žije len v Tatrách a je to náš jediný veľký endemit. Po kolmej stene beží rýchlejšie, ako človek ide po chodníku, a preskočí až šesť metrov. V roku 1999 ich ostalo len okolo dvesto, dnes ich je vyše tisíc štyristo.",stat:"Ohrozený"},fen:{live:"Crags and dwarf pine of the High and Belianske Tatras — nowhere else on Earth",eat:"Grass, herbs, mosses and lichens from among the rocks",intr:"It lives only in the Tatras and is Slovakia's only large endemic animal. It runs up a sheer wall faster than a person walks a path and leaps six metres. In 1999 barely two hundred were left; today there are over fourteen hundred.",stat:"Endangered"}},{id:"svist",draw:"svist",land:"slovensko",h:.54,rar:1,base:115,minD:14,maxD:60,shy:1.3,group:[1,3],speed:.9,sk:"Svišť vrchovský tatranský",en:"Tatra Marmot",lat:"Marmota marmota latirostris",icon:"🐹",fsk:{live:"Alpínske lúky Tatier nad hranicou lesa, v norách hlbokých aj sedem metrov",eat:"Tráva a horské byliny — na jeseň je dvakrát ťažší ako na jar",intr:"Zimu prespí sedem mesiacov pod snehom a srdce mu spomalí až na päť úderov za minútu. Keď zbadá orla, postaví sa na zadné a zapíska tak prenikavo, že to počuť cez celú dolinu.",stat:"Ohrozený"},fen:{live:"Alpine meadows above the treeline, in burrows up to seven metres deep",eat:"Grass and mountain herbs — by autumn it weighs twice what it did in spring",intr:"It sleeps seven months under the snow with its heart down to five beats a minute. When it spots an eagle it stands up on its hind legs and whistles so shrilly the whole valley hears it.",stat:"Endangered"}},{id:"orolskalny",draw:"orolskalny",land:"slovensko",h:2.2,rar:2,base:300,minD:35,maxD:150,shy:1.55,group:[1,2],speed:1.3,arb:[8,22],sk:"Orol skalný",en:"Golden Eagle",lat:"Aquila chrysaetos",icon:"🦅",fsk:{live:"Skalné steny Tatier a Nízkych Tatier — na Slovensku hniezdi okolo 80 párov",eat:"Svište, zajace, tetrovy, mladé srnčatá; v zime aj zdochliny",intr:"Rozpätie krídel má vyše dva metre a v termike krúži hodiny bez jediného mávnutia. Zrak má niekoľkokrát ostrejší než človek — svišťa zbadá z dvoch kilometrov.",stat:"Málo dotknutý"},fen:{live:"Cliff faces of the Tatras and Low Tatras — around 80 pairs nest in Slovakia",eat:"Marmots, hares, grouse, young roe deer; carrion in winter",intr:"Its wings span over two metres and it circles for hours on thermals without a single wingbeat. Its eyesight is several times sharper than ours — it spots a marmot two kilometres away.",stat:"Least concern"}},{id:"hlucan",draw:"hlucan",land:"slovensko",h:1.1,rar:3,base:520,minD:28,maxD:110,shy:1.7,group:[1,1],speed:.8,sk:"Hlucháň hôrny",en:"Western Capercaillie",lat:"Tetrao urogallus",icon:"🦃",fsk:{live:"Staré horské smrečiny s čučoriedčím podrastom — na Slovensku ich ostalo asi 700",eat:"V zime len smrekové a jedľové ihličie, v lete čučoriedky a hmyz",intr:"Je to najväčší európsky kurovitý vták — samec váži až päť kíl. Keď na jar toká, na posledné dve-tri sekundy piesne naozaj ohluchne, a práve preto sa volá hlucháň.",stat:"Málo dotknutý"},fen:{live:"Old mountain spruce forest with bilberry undergrowth — about 700 remain in Slovakia",eat:"Nothing but spruce and fir needles in winter; bilberries and insects in summer",intr:"It is Europe's largest grouse — a male weighs up to five kilos. During his spring display he really does go deaf for the last two or three seconds of his song, which is exactly how he got his Slovak name.",stat:"Least concern"}},{id:"jelen",draw:"jelen",land:"slovensko",h:1.9,rar:0,base:28,minD:40,maxD:170,shy:1.2,group:[2,6],speed:1.1,sk:"Jeleň lesný",en:"Red Deer",lat:"Cervus elaphus",icon:"🦌",fsk:{live:"Lesy celého Slovenska, v lete vystupuje až nad hranicu lesa",eat:"Tráva, byliny, výhonky a v zime kôra stromov",intr:"Parožie mu každú jar odpadne a nové narastie za štyri mesiace — pribúda aj dva centimetre denne, čo je najrýchlejšie rastúca kosť na svete. V septembri sa ozve ruja a jeho ručanie počuť cez celú dolinu.",stat:"Málo dotknutý"},fen:{live:"Forests all across Slovakia; in summer it climbs above the treeline",eat:"Grass, herbs, shoots and, in winter, tree bark",intr:"Its antlers drop off every spring and regrow in four months, adding up to two centimetres a day — the fastest growing bone on Earth. In September the rut begins and his roaring fills the whole valley.",stat:"Least concern"}},{id:"diviak",draw:"diviak",land:"slovensko",h:.92,rar:0,base:24,minD:35,maxD:140,shy:1.15,group:[3,7],speed:1,sk:"Diviak lesný",en:"Wild Boar",lat:"Sus scrofa",icon:"🐗",fsk:{live:"Listnaté a zmiešané lesy, húštiny a kalužiská po celom Slovensku",eat:"Žalude, bukvice, korienky, hlodavce, hmyzie larvy — vyryje si ich ňufákom",intr:"Ňufákom nadvihne aj ťažký kameň a vyňuchá jedlo pol metra pod zemou. Mláďatá majú na chrbte svetlé pruhy ako melón, v lístí ich takmer nevidno — do pol roka pruhy zmiznú.",stat:"Málo dotknutý"},fen:{live:"Deciduous and mixed forest, thickets and wallows all over Slovakia",eat:"Acorns, beech mast, roots, rodents and grubs — rooted up with its snout",intr:"Its snout can lift a heavy stone and smell food half a metre underground. Piglets wear pale melon stripes that make them almost invisible in the leaf litter; the stripes fade within six months.",stat:"Least concern"}},{id:"bocianc",draw:"bocianc",land:"slovensko",h:1.02,rar:2,base:215,minD:35,maxD:130,shy:1.5,group:[1,2],speed:.9,sk:"Bocian čierny",en:"Black Stork",lat:"Ciconia nigra",icon:"🕊️",fsk:{live:"Staré lesy pri potokoch — hniezdi hlboko v lese, ďaleko od ľudí",eat:"Ryby, žaby, mloky a vodný hmyz z plytkých horských potokov",intr:"Na rozdiel od bieleho bociana sa ľuďom vyhýba a hniezdo si stavia na starom strome hlboko v lese — to isté používa aj dvadsať rokov. Na zimu odlieta do Afriky, cesta má vyše štyri tisíc kilometrov.",stat:"Málo dotknutý"},fen:{live:"Old forests beside streams — it nests deep in the woods, far from people",eat:"Fish, frogs, newts and water insects from shallow mountain streams",intr:"Unlike the white stork it avoids people and builds its nest on an old tree deep in the forest, using the same one for twenty years. It winters in Africa, a journey of over four thousand kilometres.",stat:"Least concern"}},{id:"vydra",draw:"vydra",land:"slovensko",h:.4,rar:2,base:230,minD:14,maxD:55,shy:1.55,group:[1,1],speed:1.1,sk:"Vydra riečna",en:"Eurasian Otter",lat:"Lutra lutra",icon:"🦦",fsk:{live:"Čisté potoky a rieky s brehmi zarastenými koreňmi — aj tatranské doliny",eat:"Ryby, raky, žaby; denne zje pätinu svojej váhy",intr:"Pod vodou si chlopňami zavrie uši aj nozdry a vydrží tam dve minúty. Fúzy jej fungujú ako radar — rybu nájde aj v úplne kalnej vode a potme.",stat:"Takmer ohrozený"},fen:{live:"Clean streams and rivers with root-tangled banks — including Tatra valleys",eat:"Fish, crayfish and frogs; it eats a fifth of its own weight a day",intr:"Underwater it closes its ears and nostrils with flaps and stays under for two minutes. Its whiskers work like radar — it finds a fish in pitch-dark, muddy water.",stat:"Near threatened"}}),Object.assign(AKTIVITA,{vlk:"noc",rys:"sumrak",diviak:"noc",vydra:"sumrak"}),Object.assign(NOVE_WEIGHTS,{tatry:{jelen:.9,diviak:1.2,svist:.95,kamzik:.65,medved:.5,orolskalny:.5,bocianc:.45,vydra:.4,vlk:.35,rys:.25,hlucan:.22}}),Object.assign(DRAW,{_qp(e,a,o,t,l,n,r){const i=1-r;return[i*i*e+2*i*r*o+r*r*l,i*i*a+2*i*r*t+r*r*n]},panda(e,a){const o="#1a1714",t=.012*Math.sin(1.1*a.t),l=.2*a.pose;if(e.save(),e.translate(0,t),e.strokeStyle="#332c26",e.lineCap="round",e.lineJoin="round",e.lineWidth=.185,e.beginPath(),e.moveTo(-.18,-.28),e.lineTo(.16,-.15),e.stroke(),e.fillStyle="#332c26",ell(e,.24,-.13,.115,.09,-.14),e.fillStyle=grad(e,0,-1,0,-.02,"#fcf9f0","#c9c1aa"),ell(e,-.22,-.36,.46,.36),ell(e,.02,-.62,.42,.34),ell(e,.18,-.46,.34,.29),DET>.2&&(e.fillStyle="rgba(255,255,255,.30)", berries, acorns, sometimes eggs and insects",intr:"It is not related to the giant panda at all — it has a family of its own, closer to weasels and skunks. In winter it wraps its bushy ringed tail around itself like a scarf.",stat:"Endangered"}},{id:"takin",draw:"takin",h:1.25,rar:2,base:240,minD:35,maxD:120,shy:1.3,group:[2,5],speed:.9,land:"cina",sk:"Takin zlatý",en:"Golden Takin",lat:"Budorcas taxicolor bedfordi",icon:"🐐",fsk:{live:"Strmé bambusové a rododendronové svahy pohoria Čchin-ling a S'-čchuanu",eat:"Listy, tráva, bambus a vŕbové výhonky; chodí lízať soľné pramene",intr:"Váži až 350 kilogramov a napriek tomu šplhá po skalách ako koza. Jeho zlatá srsť je mastná, takže z neho voda steká ako z pršiplášťa.",stat:"Zraniteľný"},fen:{live:"Steep bamboo and rhododendron slopes of the Qinling mountains and Sichuan",eat:"Leaves, grass, bamboo and willow shoots; it visits salt licks",intr:"It weighs up to 350 kilograms yet climbs rocks like a goat. Its golden coat is oily, so rain runs off it as off a raincoat.",stat:"Vulnerable"}},{id:"langurzlaty",draw:"langurzlaty",h:.66,rar:3,base:470,minD:20,maxD:80,shy:1.6,group:[3,8],speed:1.2,land:"cina",arb:[4,12],sk:"Langur zlatý",en:"Golden Snub-nosed Monkey",lat:"Rhinopithecus roxellana",icon:"🐒",fsk:{live:"Horské lesy Čchin-lingu a S'-čchuanu vo výške 1500 až 3000 metrov",eat:"Lišajníky, ihličie, kôra, púčiky a ovocie",intr:"Je to jediná opica, ktorá bežne prežíva v snehu a mraze pod mínus desať stupňov. Nos má taký sploštený, že mu z neho ostali len dve dierky obrátené nahor.",stat:"Ohrozený"},fen:{live:"Mountain forests of Qinling and Sichuan, 1500 to 3000 metres up",eat:"Lichens, pine needles, bark, buds and fruit",intr:"It is the only monkey that routinely survives snow and frost below minus ten degrees. Its nose is so flattened that only two upturned nostrils are left.",stat:"Endangered"}},{id:"bazantzlaty",draw:"bazantzlaty",h:.42,rar:1,base:105,minD:14,maxD:55,shy:1.5,group:[1,2],speed:1.2,land:"cina",sk:"Bažant zlatý",en:"Golden Pheasant",lat:"Chrysolophus pictus",icon:"🐦",fsk:{live:"Horské lesy a bambusové húštiny v strednej Číne",eat:"Semená, listy, bobule a drobné bezstavovce",intr:"Samec pri námluvách rozprestrie oranžový golier ako vejár a zakryje si ním pol tváre. Samica je celá hnedastá a nenápadná, aby ju na hniezde nikto nenašiel.",stat:"Málo dotknutý"},fen:{live:"Mountain forests and bamboo thickets of central China",eat:"Seeds, leaves, berries and small invertebrates",intr:"When courting, the male spreads his orange cape like a fan and hides half his face behind it. The female is plain brown so that nobody finds her on the nest.",stat:"Least concern"}},{id:"zeriavmandzursky",draw:"zeriavmandzursky",h:1.55,rar:2,base:265,minD:45,maxD:150,shy:1.6,group:[2,4],speed:1,land:"cina",sk:"Žeriav mandžurský",en:"Red-crowned Crane",lat:"Grus japonensis",icon:"🕊️",fsk:{live:"Močiare Mandžuska, Amuru a Hokkaida; zimuje v Číne a Kórei",eat:"Ryby, obojživelníky, hmyz, korienky a semená",intr:"Červená čiapočka nie je perie — je to holá koža, ktorá sa pri vzrušení rozžiari. Páry ostávajú spolu celý život a tancujú spolu aj vtedy, keď práve nehniezdia.",stat:"Ohrozený"},fen:{live:"Marshes of Manchuria, the Amur and Hokkaido; it winters in China and Korea",eat:"Fish, amphibians, insects, roots and seeds",intr:"The red cap is not feathers — it is bare skin that glows brighter when the bird is excited. Pairs stay together for life and dance even outside the breeding season.",stat:"Endangered"}},{id:"makaktibetsky",draw:"makaktibetsky",h:.66,rar:0,base:24,minD:16,maxD:70,shy:1.1,group:[4,9],speed:1.2,land:"cina",sk:"Makak tibetský",en:"Tibetan Macaque",lat:"Macaca thibetana",icon:"🐒",fsk:{live:"Horské a bambusové lesy strednej a východnej Číny",eat:"Ovocie, listy, semená, huby a hmyz",intr:"Je to najväčší makak na svete a chvost má taký krátky, že ho takmer nevidno. Keď sa dvaja samci chcú udobriť, spoločne podržia mláďa — je to ich zmierovacie gesto.",stat:"Takmer ohrozený"},fen:{live:"Mountain and bamboo forests of central and eastern China",eat:"Fruit, leaves, seeds, mushrooms and insects",intr:"It is the largest macaque in the world and its tail is so short you hardly see it. When two males want to make peace, they hold an infant together — it is their reconciliation gesture.",stat:"Near threatened"}},{id:"leopardsnezny",draw:"leopardsnezny",h:.62,rar:3,base:620,minD:35,maxD:190,shy:1.8,group:[1,1],speed:1.1,land:"cina",pred:!0,sk:"Leopard snežný",en:"Snow Leopard",lat:"Panthera uncia",icon:"🐆",fsk:{live:"Skalnaté horské svahy Himalájí, Tibetu a Altaja, 3000 až 4500 metrov nad morom",eat:"Ovce modré, kozorožce, svište a zajace",intr:"Chvost má takmer taký dlhý ako telo — balansuje s ním na skalách a v spánku si ním prikryje ňufák ako šálom. Na rozdiel od leva a tigra nevie revať, iba prskať a fučať.",stat:"Zraniteľný"},fen:{live:"Rocky mountain slopes of the Himalayas, Tibet and the Altai, 3000 to 4500 metres up",eat:"Blue sheep, ibex, marmots and hares",intr:"Its tail is almost as long as its body — it balances with it on cliffs and covers its nose with it while sleeping. Unlike lions and tigers it cannot roar, only hiss and puff.",stat:"Vulnerable"}},{id:"muntziak",draw:"muntziak",h:.55,rar:0,base:20,minD:20,maxD:80,shy:1.4,group:[1,2],speed:1.2,land:"cina",sk:"Muntžak malý",en:"Reeves's Muntjac",lat:"Muntiacus reevesi",icon:"🦌",fsk:{live:"Husté podrasty a bambusové lesy južnej a východnej Číny",eat:"Byliny, púčiky, spadnuté ovocie a huby",intr:"Keď zavetrí nebezpečenstvo, šteká ako pes a vydrží tak aj hodinu — preto sa mu hovorí štekajúci jeleň. Samec sa okrem krátkeho parožia bije aj klami, ktoré mu trčia z hornej pery.",stat:"Málo dotknutý"},fen:{live:"Dense undergrowth and bamboo forests of southern and eastern China",eat:"Herbs, buds, fallen fruit and fungi",intr:"When it senses danger it barks like a dog, sometimes for a whole hour — which is why it is called the barking deer. Besides short antlers the male fights with tusks that stick out of his upper lip.",stat:"Least concern"}},{id:"ibiscinsky",draw:"ibiscinsky",h:.8,rar:3,base:520,minD:30,maxD:110,shy:1.7,group:[1,3],speed:1,land:"cina",sk:"Ibis chochlatý",en:"Crested Ibis",lat:"Nipponia nippon",icon:"🐦",fsk:{live:"Ryžové polia, potoky a riedke lesy provincie Šen-si v Číne",eat:"Žubrienky, drobné ryby, kraby, slimáky a hmyz z plytkej vody",intr:"V roku 1981 ostalo na svete posledných sedem vtákov, všetky pri jednej čínskej dedine. Vďaka prísnej ochrane ich dnes lieta znovu niekoľko tisíc.",stat:"Ohrozený"},fen:{live:"Rice paddies, streams and open woodland of Shaanxi province in China",eat:"Tadpoles, small fish, crabs, snails and insects from shallow water",intr:"In 1981 only seven birds were left in the world, all near one Chinese village. Thanks to strict protection several thousand fly again today.",stat:"Endangered"}},{id:"salamandra",draw:"salamandra",h:.32,rar:3,base:560,minD:10,maxD:45,shy:1.2,group:[1,1],speed:.7,land:"cina",sk:"Veľmlok čínsky",en:"Chinese Giant Salamander",lat:"Andrias davidianus",icon:"🦎",fsk:{live:"Chladné rýchle horské potoky a rieky strednej Číny",eat:"Ryby, raky, žaby a vodný hmyz",intr:"Je to najväčší obojživelník na svete — dorastá aj do 1,8 metra a dožije sa vyše päťdesiat rokov. Takmer nevidí, korisť cíti podľa chvenia vody uzlíkmi na koži.",stat:"Kriticky ohrozený"},fen:{live:"Cold fast mountain streams and rivers of central China",eat:"Fish, crayfish, frogs and water insects",intr:"It is the largest amphibian on Earth — it grows up to 1.8 metres and lives over fifty years. It can barely see; it senses prey by water vibrations through tiny nodes on its skin.",stat:"Critically endangered"}}),Object.assign(AKTIVITA,{panda:"oba",pandacervena:"sumrak",leopardsnezny:"sumrak",muntziak:"sumrak",salamandra:"noc",takin:"oba"}),Object.assign(NOVE_WEIGHTS,{wolong:{panda:.55,pandacervena:.8,takin:.7,langurzlaty:.5,bazantzlaty:1.1,zeriavmandzursky:.45,makaktibetsky:.8,leopardsnezny:.25,muntziak:1.3,ibiscinsky:.35,sala j tak vybehne do kopca rýchlosťou 55 km/h. V Yellowstone žije jediné stádo bizónov, ktoré tam pretrvalo od praveku — keď ich v 19. storočí lovci vybili z desiatok miliónov na pár stoviek, práve tu prežilo asi dvadsaťtri kusov.",stat:"Takmer ohrozený"},fen:{live:"Wide grassy valleys of Yellowstone — above all Lamar and Hayden Valley",eat:"Grass and sedges; in winter it ploughs them out from under the snow with its head",intr:"It weighs as much as a small car and still charges uphill at 55 km/h. Yellowstone holds the only bison herd that has lived there continuously since prehistoric times — when hunters cut the species from tens of millions to a few hundred in the 1800s, about twenty-three animals survived right here.",stat:"Near threatened"}},{id:"grizly",pred:!0,draw:"grizly",land:"usa",h:1.35,rar:2,base:300,minD:50,maxD:200,shy:1.4,group:[1,1],speed:.8,sk:"Medveď grizly",en:"Grizzly Bear",lat:"Ursus arctos horribilis",icon:"🐻",fsk:{live:"Horské lesy a údolia Skalnatých vrchov; v okolí Yellowstonu žije okolo 1 000 grizlyov",eat:"Z väčšej časti rastliny — trávy, korienky, píniové oriešky; k tomu hlodavce, mláďatá jeleňov a mršiny",intr:"Hrb na pleciach nie je tuk, ale sval, ktorým hrabe: jednou labou odhŕňa kamene ťažké ako ty. Pred zimou pribratie aj 200 kg a potom pol roka spí bez jedla a bez pitia.",stat:"Málo dotknutý"},fen:{live:"Mountain forests and valleys of the Rockies; about 1,000 grizzlies live around Yellowstone",eat:"Mostly plants — grasses, roots, pine nuts — plus rodents, elk calves and carrion",intr:"The shoulder hump is not fat but muscle for digging: one paw can roll away rocks as heavy as you are. Before winter it puts on up to 200 kg, then sleeps half a year without eating or drinking.",stat:"Least concern"}},{id:"kojot",draw:"kojot",land:"usa",h:.6,rar:0,base:20,minD:45,maxD:160,shy:1.5,group:[1,2],speed:1.3,sk:"Kojot prériový",en:"Coyote",lat:"Canis latrans",icon:"🐺",fsk:{live:"Prérie, stepi aj mestské okraje — v Severnej Amerike prakticky všade",eat:"Hraboše a myši (denne aj tucet), zajace, hmyz, ovocie, zvyšky po vlkoch",intr:"Dva kojoty vedia zavýjať tak, že to znie ako celá svorka. Keď v Yellowstone vyhubili vlkov, kojotov pribudlo; po návrate vlkov v roku 1995 ich v údolí Lamar zas asi o polovicu ubudlo.",stat:"Málo dotknutý"},fen:{live:"Prairies, steppe and even city edges — almost everywhere in North America",eat:"Voles and mice (a dozen a day), hares, insects, fruit and wolf leftovers",intr:"Two coyotes can howl so cleverly that they sound like a whole pack. When wolves were wiped out in Yellowstone, coyotes boomed; after the wolves came back in 1995, coyote numbers in Lamar Valley fell by about half.",stat:"Least concern"}},{id:"wapiti",draw:"wapiti",land:"usa",h:2.3,rar:0,base:28,minD:50,maxD:170,shy:1.1,group:[3,6],speed:1,sk:"Wapiti (jeleň kanadský)",en:"Elk (Wapiti)",lat:"Cervus canadensis",icon:"🦌",fsk:{live:"Otvorené údolia a okraje borovicových lesov Yellowstonu; v zime schádza do nižších polôh",eat:"Tráva, byliny, v zime vŕbové a osikové výhonky",intr:"Parohy zhodí každú jar a za jediné leto mu narastú nové — metrové a ťažké ako plné vedro vody. V septembri samce trúbia tenkým piskľavým hlasom, ktorý počuť cez celé údolie.",stat:"Málo dotknutý"},fen:{live:"Open valleys and pine-forest edges of Yellowstone; it moves lower down in winter",eat:"Grass and herbs, and in winter willow and aspen shoots",intr:"It drops its antlers every spring and grows a whole new metre-long set in a single summer — each one as heavy as a full bucket of water. In September the bulls bugle in a thin, whistling scream you can hear across the whole valley.",stat:"Least concern"}},{id:"vidloroh",draw:"vidloroh",land:"usa",h:.9,rar:1,base:115,minD:60,maxD:200,shy:1.5,group:[2,5],speed:1.5,sk:"Vidloroh americký",en:"Pronghorn",lat:"Antilocapra americana",icon:"🐐",fsk:{live:"Otvorené šalviové stepi a prérie západu USA",eat:"Šalvia, byliny a kríčky, ktoré sú pre iné zvieratá príliš horké",intr:"Beží 88 km/h a na rozdiel od geparda to vydrží celé kilometre — je to najrýchlejší cicavec Ameriky. Uteká pred šelmou, ktorá vyhynula pred desiatimi tisíckami rokov: pred americkým gepardom.",stat:"Málo dotknutý"},fen:{live:"Open sagebrush steppe and prairie of the American West",eat:"Sagebrush, herbs and shrubs too bitter for other animals",intr:"It runs at 88 km/h and, unlike a cheetah, can keep it up for kilometres — the fastest mammal in the Americas. It is still outrunning a predator that died out ten thousand years ago: the American cheetah.",stat:"Least concern"}},{id:"orolbielohlavy",draw:"orolbielohlavy",land:"usa",h:2,rar:2,base:265,minD:40,maxD:170,shy:1.4,group:[1,1],speed:1.2,arb:[6,20],sk:"Orol bielohlavý",en:"Bald Eagle",lat:"Haliaeetus leucocephalus",icon:"🦅",fsk:{live:"Vysoké borovice pri riekach a jazerách Yellowstonu, odkiaľ dovidí na vodu",eat:"Predovšetkým ryby, ktoré chytá pazúrmi z hladiny; v zime aj kačice a zdochliny",intr:"Bielu hlavu nemá od narodenia — dostane ju až v piatich rokoch. Stavia najväčšie vtáčie hniezda na svete: rekordné malo tri metre naprieč a vážilo viac ako auto.",stat:"Málo dotknutý"},fen:{live:"Tall pines beside Yellowstone's rivers and lakes, with a view over the water",eat:"Mainly fish snatched from the surface with its talons; in winter also ducks and carrion",intr:"It is not born with a white head — it only turns white at about five years old. It builds the largest nests of any bird on Earth: the record one was three metres across and weighed more than a car.",stat:"Least concern"}},{id:"bobor",draw:"bobor",land:"usa",h:.35,rar:1,base:105,minD:20,maxD:80,shy:1.5,group:[1,2],speed:.7,sk:"Bobor kanadský",en:"North American Beaver",lat:"Castor canadensis",icon:"🦫",fsk:{live:"Potoky a rieky Yellowstonu, kde si stavia hrádze a hrady z konárov a blata",eat:"Kôra a mladé konáriky osík a vŕb — stromy si sám vyhrýzava",intr:"Predné zuby má oranžové od železa, tvrdé ako dláto a rastú mu celý život, takže sa musí stále prehrýzať drevom. Keď zbadá nebezpečenstvo, plesne plochým chvostom po vode — je to počuť cez celý rybník.",stat:"Málo dotknutý"},fen:{live:"Yellowstone's streams and rivers, where it builds dams and lodges of sticks and mud",eat:"Bark and young twigs of aspen and willow — it fells the trees itself",intr:"Its front teeth are orange with iron, hard as a chisel, and grow all its life, so it must keep gnawing wood. When it senses danger it slaps its flat tail on the water — a crack you hear across the whole pond.",stat:"Least concern"}},{id:"rysc",pred:!0,draw:"rysc",land:"usa",h:.55,rar:2,base:285,minD:30,maxD:150,shy:1.8,group:[1,1],speed:1.2,sk:"Rys červený",en:"Bobcat",lat:"Lynx rufus",icon:"🐈",fsk:{live:"Skalné rokliny, húštiny a okraje lesa; v Yellowstone ho vidieť len veľmi zriedka",eat:"Zajace a králiky, hraboše, veveričky, vtáky — občas aj mladá srna",intr:'Je len asi dvakrát väčší ako domáca mačka, a predsa uloví zviera desaťkrát ťažšie, než je sám. Chvost má taký krátky, akoby ho niekto odstrihol — po anglicky sa preto volá bobcat, „useknutý kocúr".',stat:"Málo dotknutý"},fen:{live:"Rocky gullies, thickets and forest edges; in Yellowstone it is seen only very rarely",eat:"Hares and rabbits, voles, squirrels, birds — occasionally even a young deer",intr:"It is only about twice the size of a house cat, yet it can kill prey ten times its own weight. Its tail is so short it looks cut off — which is exactly why it is called a bobcat.",stat:"Least concern"}},{id:"sokol",draw:"sokol",land:"usa",h:1.1,rar:3,base:520,minD:35,maxD:150,shy:1.7,group:[1,1],speed:1.4,arb:[10,28],sk:"Sokol sťahovavý",en:"Peregrine Falcon",lat:"Falco peregrinus",icon:"🪶",fsk:{live:"Skalné steny a kaňony Yellowstonu; hniezdi na rímsach vysoko nad riekou",eat:"Takmer výlučne vtáky, ktoré zráža priamo vo vzduchu",intr:"Pri strmhlavom útoku padá rýchlosťou vyše 380 km/h — je to najrýchlejšie zviera na svete. Aby mu pritom nárazový vzduch nezničil pľúca, má v nozdrách drobné kostené hrbolčeky, ktoré prúd vzduchu spomalia.",stat:"Málo dotknutý"},fen:{live:"Cliff faces and canyons of Yellowstone; it nests on ledges high above the river",eat:"Almost only birds, which it strikes down in mid-air",intr:"In a hunting stoop it falls at over 380 km/h — the fastest animal on Earth. So the rushing air does not wreck its lungs, tiny bony cones inside its nostrils slow the airflow down.",stat:"Least concern"}},{id:"losamericky",draw:"losamericky",land:"usa",h:2,rar:2,base:235,minD:55,maxD:180,shy:1.2,group:[1,2],speed:.85,sk:"Los mokraďový",en:"Moose",lat:"Alces alces",icon:"🦌",fsk:{live:"Vŕbové mokrade, jazerá a bažiny Yellowstonu — kde je voda, tam je los",eat:"Vŕbové výhonky a vodné rastliny, denne až 30 kilogramov",intr:"Je to najväčší jeleň sveta a jediný, ktorý sa potápa: pod vodou vydrží aj pol minúty a trhá rastliny z hĺbky niekoľkých metrov. Lopatovité parohy mu pritom fungujú ako dva taniere — zbierajú zvuk a smerujú ho do uší.",stat:"Málo dotknutý"},fen:{live:"Willow wetlands, lakes and marshes of Yellowstone — where there is water, there is moose",eat:"Willow shoots and water plants, up to 30 kilograms a day",intr:"It is the largest deer on Earth and the only one that dives: it can stay under for half a minute and tear plants from several metres down. Its broad palmate antlers even work like a satellite dish, funnelling sound towards its ears.",stat:"Least concern"}},{id:"skunk",draw:"skunk",land:"usa",h:.32,rar:1,base:90,minD:18,maxD:70,shy:1.1,group:[1,1],speed:.7,sk:"Skunk pruhovaný",en:"Striped Skunk",lat:"Mephitis mephitis",icon:"🦨",fsk:{live:"Kroviny, lúky a okraje lesa po celej Severnej Amerike; cez deň spí v nore",eat:"Chrobáky, larvy, myši, vajcia, ovocie — vyhrabáva ich ňufákom zo zeme",intr:"Kým strekne, najprv vystríha: dupe prednými labkami a dvíha chvost. Až potom vystrelí smradľavý sprej na päť metrov ďaleko — cítiť ho aj z kilometra a v očiach páli tak, že šelma na chvíľu oslepne.",stat:"Málo dotknutý"},fen:{live:"Scrub, meadows and forest edges across North America; by d .push({id:"leguanmorsky",draw:"leguanmorsky",land:"galapagy",h:.3,rar:2,base:195,minD:6,maxD:45,shy:.6,group:[3,9],speed:.7,sk:"Leguán morský",en:"Marine Iguana",lat:"Amblyrhynchus cristatus",icon:"🦎",fsk:{live:"Iba na Galapágoch — na čiernych lávových brehoch, kde sa vyhrieva na skalách tesne nad príbojom",eat:"Morské riasy, ktoré zubami zoškrabuje z podmorských kameňov",intr:"Je to jediný jašter na svete, ktorý sa potápa do mora — pod vodou vydrží aj polhodinu. Slanú vodu, čo pritom prehltne, vyfúkne späť nosom, takže vyzerá, akoby stále kýchal a mal na hlave bielu soľnú parochňu.",stat:"Zraniteľný"},fen:{live:"Only in the Galápagos — on black lava shores, basking on rocks just above the surf",eat:"Seaweed, which it scrapes off underwater rocks with its teeth",intr:"It is the only lizard on Earth that dives into the sea — it can stay under for half an hour. The salty water it swallows gets blown back out through its nose, so it looks as if it is forever sneezing and wearing a white wig of salt.",stat:"Vulnerable"}},{id:"leguansuchozemsky",draw:"leguansuchozemsky",land:"galapagy",h:.4,rar:2,base:230,minD:8,maxD:55,shy:.7,group:[1,3],speed:.7,sk:"Leguán suchozemský galapágsky",en:"Galápagos Land Iguana",lat:"Conolophus subcristatus",icon:"🦎",fsk:{live:"Suché vnútrozemie galapágskych ostrovov; cez noc spí vo vyhrabanej nore, cez deň leží na slnku",eat:"Hlavne plody a listy opuncie — aj s tŕňmi",intr:"Opunciu žerie celú, aj s ostrými tŕňmi, ktoré si nechá prejsť žalúdkom. Voda mu takmer netreba — vystačí si s tou, ktorú vytiahne z dužinatých kaktusov, a dožije sa vyše päťdesiat rokov.",stat:"Zraniteľný"},fen:{live:"The dry interior of the Galápagos islands; it sleeps in a burrow at night and suns itself by day",eat:"Mostly prickly-pear cactus pads and fruit — spines and all",intr:"It swallows cactus whole, spines included, and lets its stomach deal with them. It barely needs to drink: the juicy cactus supplies the water, and the iguana can live past fifty.",stat:"Vulnerable"}},{id:"korytnackaobria",draw:"korytnackaobria",land:"galapagy",h:1.15,rar:3,base:430,minD:12,maxD:80,shy:.5,group:[1,3],speed:.3,sk:"Korytnačka obrovská",en:"Galápagos Giant Tortoise",lat:"Chelonoidis niger",icon:"🐢",fsk:{live:"Vlhké vysočiny a lávové polia galapágskych ostrovov; každý ostrov má vlastný druh",eat:"Tráva, listy, kaktusy a opadané plody; denne aj tridsať kilogramov",intr:'Bez jedla a bez vody vydrží celý rok — preto ju kedysi námorníci brávali na lode ako živé zásoby. Dožíva sa vyše sto rokov a práve podľa nej dostali ostrovy meno: „galápago" je po španielsky sedlo, ako má tvar jej pancier.',stat:"Zraniteľný"},fen:{live:"The damp highlands and lava fields of the Galápagos; each island has its own kind",eat:"Grass, leaves, cactus and fallen fruit — up to thirty kilograms a day",intr:"It can survive a whole year without food or water, which is why sailors once carried them aboard as living provisions. It lives past a hundred, and the islands are named after it: galápago is old Spanish for the saddle its shell resembles.",stat:"Vulnerable"}},{id:"blbecmodronohy",draw:"blbecmodronohy",land:"galapagy",h:.72,rar:1,base:105,minD:8,maxD:50,shy:.8,group:[2,6],speed:1,sk:"Sula modronohá",en:"Blue-footed Booby",lat:"Sula nebouxii",icon:"🐦",fsk:{live:"Skalnaté pobrežia od Kalifornie po Peru; na Galapágoch hniezdi priamo na holej zemi",eat:"Ryby, po ktorých sa z výšky tridsať metrov vrhá strmhlav do vody",intr:"Modrú farbu nôh nemá odjakživa — robia ju farbivá z čerstvých rýb. Kto je zdravý a dobre loví, má nohy jasnejšie, a preto ich pri námluvách samec dvíha jednu po druhej ako v pomalom tanci.",stat:"Málo dotknutý"},fen:{live:"Rocky coasts from California to Peru; in the Galápagos it nests straight on bare ground",eat:"Fish, which it takes by plunge-diving from thirty metres up",intr:"The blue is not permanent — it comes from pigments in fresh fish. A healthy, well-fed bird has brighter feet, so in courtship the male lifts them one at a time in a slow, showing-off dance.",stat:"Least concern"}},{id:"kormorang",draw:"kormorang",land:"galapagy",h:.95,rar:3,base:560,minD:10,maxD:60,shy:.8,group:[1,2],speed:.8,sk:"Kormorán galapágsky",en:"Flightless Cormorant",lat:"Nannopterum harrisi",icon:"🐦‍⬛",fsk:{live:"Iba chladné pobrežia ostrovov Fernandina a Isabela — nikde inde na svete",eat:"Ryby, chobotnice a úhory, ktoré loví pri dne blízko brehu",intr:"Je jediný kormorán na svete, ktorý nevie lietať. Na ostrovoch nemal pred kým utekať a potravu má hneď pod skalou, tak sa mu krídla za tisícročia scvrkli na tretinu — dnes mu slúžia už len na udržanie rovnováhy. Zostalo ich asi dvetisíc.",stat:"Zraniteľný"},fen:{live:"Only the cool shores of Fernandina and Isabela — nowhere else on Earth",eat:"Fish, octopus and eels hunted along the bottom close to shore",intr:"It is the only cormorant in the world that cannot fly. With no predators to escape and food right below the rocks, its wings shrank over thousands of years to a third of the size it would need — today they only help it balance. About two thousand birds remain.",stat:"Vulnerable"}},{id:"tucniakg",draw:"tucniakg",land:"galapagy",h:.5,rar:3,base:590,minD:8,maxD:45,shy:1,group:[1,4],speed:1,sk:"Tučniak galapágsky",en:"Galápagos Penguin",lat:"Spheniscus mendiculus",icon:"🐧",fsk:{live:"Lávové pobrežia Fernandiny a Isabely, kde more chladí studený prúd z hlbín",eat:"Malé rybky — sardinky a cípale, ktoré chytá v húfoch pod hladinou",intr:"Je to jediný tučniak, ktorý žije na rovníku, a keďže časť ostrova Isabela leží už na severnej pologuli, je zároveň jediným tučniakom severnej pologule. Aby sa v tropickom slnku neuvaril, roztiahne plutvy do tieňa a lapá po dychu ako pes.",stat:"Ohrozený"},fen:{live:"Lava shores of Fernandina and Isabela, where a cold deep-sea current chills the water",eat:"Small fish — sardines and mullet caught in shoals below the surface",intr:"It is the only penguin living on the equator, and because part of Isabela lies north of it, it is also the only penguin of the northern hemisphere. To keep from cooking in tropical sun it holds its flippers out to shade them and pants like a dog.",stat:"Endangered"}},{id:"albatrosg",draw:"albatrosg",land:"galapagy",h:2.4,rar:3,base:640,minD:25,maxD:130,shy:.9,group:[1,2],speed:1.1,arb:[3,14],sk:"Albatros galapágsky",en:"Waved Albatross",lat:"Phoebastria irrorata",icon:"🕊️",fsk:{live:"Hniezdi takmer výlučne na jedinom ostrove — Española; zvyšok roka je nad otvoreným oceánom",eat:"Ryby, chobotnice a kalamáre, ktoré zbiera z hladiny",intr:"S rozpätím dva a pol metra sa vznáša celé hodiny bez jediného mávnutia krídel. Vzlietnuť z rovnej zeme mu však robí problém, tak si na to vyšliapal rozbehovú dráhu k útesu — rozbehne sa a jednoducho zoskočí do vetra.",stat:"Kriticky ohrozený"},fen:{live:"Nests almost only on a single island — Española; the rest of the year it lives over the open ocean",eat:"Fish, octopus and squid picked off the surface",intr:"With a two-and-a-half-metre wingspan it glides for hours without one wingbeat. Taking off from flat ground is hard for it, so it has worn a runway to the cliff edge — it runs and simply drops off into the wind.",stat:"Critically endangered"}},{id:"lachtang",draw:"lachtang",land:"galapagy",h:.7,rar:1,base:85,minD:6,maxD:45,shy:.5,group:[2,7],speed:.5,sk:"Lachtan galapágsky",en:"Galápagos Sea Lion",lat:"Zalophus wollebaeki",icon:"🦭",fsk:{live:"Pláže, skaly a móla galapágskych ostrovov; spí kdekoľvek, aj na lavičke v prístave",eat:"Sardinky a iné ryby; loví aj sto metrov hlboko",intr:"Človeka sa vôbec nebojí — pokojne si ľahne vedľa neho na schody. Od tuleňa ho spoznáš podľa malého ušného lalôčika a podľa toho, že sa vie na predných plutvách postaviť a bežať.",stat:"Ohrozený"},fen:{live:"Beaches, rocks and jetties of the Galápagos; it sleeps anywhere, even on a harbour bench",eat:"Sardines and other fish, hunted down to a hundred metres",intr:"It has no fear of people at all and will flop down beside you on the steps. You can tell it from a true seal by its little external ear flap and by the fact that it can stand up on its front flippers and run.",stat:"Endangered"}},{id:"pinkad",draw:"pinkad",land:"galapagy",h:.12,rar:0,base:28,minD:4,maxD:18,shy:.7,group:[2,6],speed:1.4,sk:"Pinka Darwinova",en:"Darwin's Finch",lat:"Geospiza magnirostris",icon:"🐦",fsk:{live:"Všetky galapágske ostrovy — od suchých lávových polí až po vlhké vysočiny",eat:"Semená a tvrdé oriešky, ktoré rozlúskne hrubým zobákom",intr:"Na Galapágoch žije zo trinásť druhov týchto malých pinák a všetky vznikli z jediného predka — líšia sa hlavne zobákom: hrubý na lúskanie semien, tenký na hmyz, jedna si dokonca pomáha kaktusovým tŕňom. Práve ony priviedli Charlesa Darwina na myšlienku, ako sa druhy menia.",stat:"Málo dotknutý"},fen:{live:"Every Galápagos island — from dry lava fields to the damp highlands",eat:"Seeds and hard nuts, cracked open with the heavy bill",intr:"Some thirteen kinds of these small finches live in the Galápagos and all came from one ancestor — they differ mainly in the bill: thick for cracking seeds, thin for insects, and one even uses a cactus spine as a tool. They are what set Charles Darwin thinking about how species change.",stat:"Least concern"}},{id:"fregatka",draw:"fregatka",land:"galapagy",h:2.3,rar:2,base:250,minD:25,maxD:140,shy:1.1,group:[1,4],speed:1.2,sk:"Fregatka veľkolepá",en:"Magnificent Frigatebird",lat:"Fregata magnificens",icon:"🕊️",fsk:{live:"Teplé moria Ameriky; na Galapágoch hniezdi v nízkych kroch pri pobreží",eat:"Lietajúce ryby a kalamáre z hladiny — a čo ukradne iným vtákom",intr:"Samec si nafúkne pod zobákom obrovský červený vak veľký ako futbalová lopta; trvá mu to asi dvadsať minút a potom ho nosí aj niekoľko dní, kým si ho niektorá samica nevšimne. Perie nemá vodotesné, takže si nesmie sadnúť na vodu — a preto radšej okráda iné vtáky priamo vo vzduchu.",stat:"Málo dotknutý"},fen:{live:"Warm seas of the Americas; in the Galápagos it nests in low coastal bushes",eat:"Flying fish and squid snatched off the surface — and whatever it can steal from other birds",intr:"The male inflates a huge red throat pouch the size of a football; it takes about twenty minutes and he then carries it for days until a female notices. His feathers are not waterproof, so he must never land on the sea — which is why he prefers to rob other birds in mid-air.",stat:"Least concern"}},{id:"krabsally",draw:"krabsally",land:"galapagy",h:.1,rar:0,base:20,minD:3,maxD:15,shy:1.3,group:[3,9],speed:1.5,sk:"Krab Sally Lightfoot",en:"Sally Lightfoot Crab",lat:"Grapsus grapsus",icon:"🦀",fsk:{live:"Čierne lávové skaly tesne nad príbojom po celom tichomorskom pobreží Ameriky",eat:"Riasy zoškrabané zo skál, mŕtve zvieratá a zvyšky, ktoré vyhodí more",intr:"Mláďatá sú takmer čierne a na láve ich nevidno; až po niekoľkých zvlečeniach panciera sa z nich stanú tieto ohnivo červené kraby. Leguánom morským obratne vyzobávajú kliešte a odumretú kožu — a leguány im to pokojne dovolia.",stat:"Málo dotknutý"},fen:{live:"Black lava rocks just above the surf all along the Pacific coast of the Americas",eat:"Algae scraped off the rocks, dead animals and whatever the sea throws up",intr:"The young are almost black and invisible on the lava; only after several moults do they turn into these fiery red crabs. They neatly pick ticks and dead skin off marine iguanas — and the iguanas calmly let them.",stat:"Least concern"}}),Object.assign(AKTIVITA,{leguanmorsky:"den",leguansuchozemsky:"den",korytnackaobria:"oba",lachtang:"oba",krabsally:"oba",tucniakg:"oba"}),Object.assign(NOVE_WEIGHTS,{fernandina:{krabsally:.9,leguanmorsky:1.35,pinkad:1.2,lachtang:1.1,blbecmodronohy:.95,fregatka:.6,leguansuchozemsky:.55,korytnackaobria:.45,kormorang:.4,tucniakg:.35,albatrosg:.55}}),Object.assign(DRAW,{_sm(e,a){const o=a.length;e.beginPath(),e.moveTo(a[0][0],a[0][1]);for(let t=0;t<o;t++){const l=a[(t-1+o)%o],n=a[t],r=a[(t+1)%o],i=a[(t+2)%o];e.bezierCurveTo(n[0]+(r[0]-l[0])/6,n[1]+(r[1]-l[1])/6,r[0]-(i[0]-n[0])/6,r[1]-(i[1]-n bke — nemá ostré zuby. Dvoma lalokmi po stranách úst si vháňa vodu dnu a na žiabrových platniach z nej vyčesáva planktón ako sitko múku. Zo všetkých rýb má najväčší mozog.",stat:"Ohrozený"},fen:{live:"The open ocean and reef cleaning stations in warm seas worldwide",eat:"Plankton, which it strains out of the water",intr:"Its wingspan reaches seven metres, yet it could not hurt even a small fish — it has no sharp teeth. Two lobes beside its mouth funnel water in, and its gill plates comb the plankton out like a sieve catching flour. It has the largest brain of any fish.",stat:"Endangered"}},{id:"korytnackazelena",draw:"korytnackazelena",land:"ocean",h:.8,rar:2,base:215,minD:8,maxD:40,shy:1,group:[1,2],speed:.8,arb:[.5,7],sk:"Korytnačka zelená",en:"Green Sea Turtle",lat:"Chelonia mydas",icon:"🐢",fsk:{live:"Teplé plytčiny s morskou trávou a koralové útesy všetkých oceánov",eat:"Ako jediná morská korytnačka sa dospelá pasie takmer len na morskej tráve a riasach",intr:"Zelená nie je podľa panciera, ale podľa tuku pod ním — zozelenel jej z morskej trávy. Samica sa celý život vracia klásť vajcia na tú istú pláž, na ktorej sa sama vyliahla, hoci k nej musí preplávať aj tisíce kilometrov.",stat:"Ohrozený"},fen:{live:"Warm seagrass shallows and coral reefs in every ocean",eat:"The only sea turtle that as an adult grazes almost entirely on seagrass and algae",intr:"It is not named green after its shell but after the fat underneath it — the seagrass turns it green. A female returns all her life to lay eggs on the very beach where she hatched, even if she must swim thousands of kilometres to reach it.",stat:"Endangered"}},{id:"murena",draw:"murena",land:"ocean",h:.85,rar:1,base:110,minD:6,maxD:26,shy:.8,group:[1,1],speed:.5,sk:"Muréna obrovská",en:"Giant Moray",lat:"Gymnothorax javanicus",icon:"🐍",fsk:{live:"Diery a pukliny v koralových útesoch Indického a Tichého oceánu",eat:"Ryby a chobotnice, ktoré uloví najmä v noci",intr:"Papuľu otvára a zatvára stále — nie je to hrozba, takto si ženie vodu k žiabrám, lebo nemá čím pumpovať. A má dve sady čeľustí: druhá, ukrytá v hrdle, vystrelí dopredu, chytí korisť a vtiahne ju dnu.",stat:"Málo dotknutý"},fen:{live:"Holes and crevices in the coral reefs of the Indian and Pacific Oceans",eat:"Fish and octopuses, hunted mostly at night",intr:"It opens and closes its mouth constantly — that is not a threat, it is how it pushes water over its gills, having no pump. And it has two sets of jaws: the second one, hidden in its throat, shoots forward, grabs the prey and drags it inside.",stat:"Least concern"}},{id:"klaun",draw:"klaun",land:"ocean",h:.078,rar:0,base:24,minD:2,maxD:16,shy:.85,group:[2,4],speed:1.1,arb:[.3,2],sk:"Klaun očkatý",en:"Ocellaris Clownfish",lat:"Amphiprion ocellaris",icon:"🐠",fsk:{live:"Vnútri sasaniek na plytkých útesoch juhovýchodnej Ázie a severnej Austrálie",eat:"Planktón, drobné kôrovce a riasy; aj zvyšky po sasanke",intr:"Sasanka omráči žihľavými bunkami každú rybu — klauna nie, lebo je obalený hlienom, na ktorý sasanka nereaguje. Za to jej odháňa nepriateľov a čistí ju. Všetky klauny sa rodia ako samce, a keď samica uhynie, najsilnejší samec sa na samicu premení.",stat:"Málo dotknutý"},fen:{live:"Inside sea anemones on shallow reefs of South-East Asia and northern Australia",eat:"Plankton, tiny crustaceans and algae, plus the anemone's leftovers",intr:"An anemone's stinging cells stun any fish — but not the clownfish, which is coated in a mucus the anemone ignores. In return it chases off the anemone's enemies and keeps it clean. Every clownfish is born male, and when the female dies the strongest male turns into one.",stat:"Least concern"}},{id:"papagajorybka",draw:"papagajorybka",land:"ocean",h:.18,rar:0,base:28,minD:2.5,maxD:22,shy:1.05,group:[2,5],speed:1.1,arb:[.5,4],sk:"Papagájorybka útesová",en:"Daisy Parrotfish",lat:"Chlorurus sordidus",icon:"🦜",fsk:{live:"Koralové útesy Indického a Tichého oceánu",eat:"Riasy a mŕtvy koral, ktoré zoškrabáva zobákom priamo zo skaly",intr:"Zuby má zrastené do zobáka ako papagáj a ďalšie zuby v hrdle — tými koral rozdrví na prášok. Ten z nej vyjde ako biely piesok: jedna ryba ho vyrobí za rok aj sto kíl, takže na tropickej pláži ležíš na tom, čo papagájorybky vytrúsili. V noci sa zabalí do priehľadného slizového vaku, ktorý prekryje jej pach pred murénami.",stat:"Málo dotknutý"},fen:{live:"Coral reefs of the Indian and Pacific Oceans",eat:"Algae and dead coral scraped straight off the rock with its beak",intr:"Its teeth are fused into a parrot-like beak, and more teeth in its throat grind the coral to powder. That powder comes out as white sand — a single fish can make a hundred kilos a year, so a tropical beach is largely what parrotfish left behind. At night it wraps itself in a see-through mucus bag that hides its scent from moray eels.",stat:"Least concern"}},{id:"barakuda",draw:"barakuda",land:"ocean",h:.32,rar:1,base:125,minD:4,maxD:40,shy:1.25,group:[1,3],speed:1.4,arb:[2,10],sk:"Barakuda veľká",en:"Great Barracuda",lat:"Sphyraena barracuda",icon:"🐟",fsk:{live:"Okraje útesov a otvorená voda teplých morí; mladé ryby v mangrovoch",eat:"Iné ryby — číha na ne bez pohybu a útočí zo zálohy",intr:"Visí vo vode ako strieborné poleno, a keď vyrazí, zrýchli na vyše štyridsať kilometrov za hodinu. Spodná čeľusť jej trčí dopredu a v papuli má dva druhy zubov: veľké kly na prepichnutie a drobné na to, aby korisť neušmykla.",stat:"Málo dotknutý"},fen:{live:"Reef edges and open water of warm seas; the young live in mangroves",eat:"Other fish — it waits motionless and strikes from ambush",intr:"It hangs in the water like a silver log, then bursts forward at over forty kilometres an hour. Its lower jaw juts out in front and its mouth holds two kinds of teeth: big fangs to stab, and small ones to keep the catch from slipping.",stat:"Least concern"}},{id:"chobotnica",draw:"chobotnica",land:"ocean",h:.45,rar:2,base:290,minD:5,maxD:22,shy:1.55,group:[1,1],speed:.7,sk:"Chobotnica pobrežná",en:"Common Octopus",lat:"Octopus vulgaris",icon:"🐙",fsk:{live:"Skalnaté dno a útesy teplých morí; cez deň sa skrýva v puklinách",eat:"Kraby, mušle a raky; tvrdé ulity otvorí alebo prevŕta",intr:"Má tri srdcia, modrú krv a v koži bunky, ktorými zmení farbu aj vzor za tri desatiny sekundy — hoci je pritom farboslepá. Dve tretiny jej nervových buniek sú v ramenách, takže každé rameno si samo ohmatáva okolie a samo sa rozhoduje.",stat:"Málo dotknutý"},fen:{live:"Rocky bottoms and reefs of warm seas; by day it hides in crevices",eat:"Crabs, clams and lobsters; it prises hard shells open or drills through them",intr:"It has three hearts, blue blood and skin cells that change its colour and pattern in three tenths of a second — even though it is colour-blind. Two thirds of its nerve cells sit in its arms, so each arm feels around and decides for itself.",stat:"Least concern"}},{id:"morskykonik",draw:"morskykonik",land:"ocean",h:.17,rar:3,base:445,minD:1.5,maxD:12,shy:.7,group:[1,2],speed:.35,arb:[.2,1.2],sk:"Morský koník žltý",en:"Yellow Seahorse",lat:"Hippocampus kuda",icon:"🐴",fsk:{live:"Plytké zálivy, lúky morskej trávy a koralové útesy Indického a Tichého oceánu",eat:"Drobné kôrovce, ktoré vcucne dlhou trubicovitou papuľkou",intr:"Je to naozaj ryba, hoci pláva postojačky a chvostom sa drží stebla ako rukou. Mláďatá nosí samec: samica mu vajíčka vloží do vaku na bruchu, on ich niekoľko týždňov nosí a potom vypustí do vody stovky maličkých koníkov. Nemá žalúdok, preto musí jesť takmer neprestajne.",stat:"Zraniteľný"},fen:{live:"Shallow bays, seagrass meadows and coral reefs of the Indian and Pacific Oceans",eat:"Tiny crustaceans sucked up through its long tube-like snout",intr:"It really is a fish, even though it swims upright and grips a stem with its tail like a hand. The father carries the young: the female places her eggs in his belly pouch, he carries them for weeks and then releases hundreds of tiny seahorses. Having no stomach, he must eat almost non-stop.",stat:"Vulnerable"}},{id:"rejnok",draw:"rejnok",land:"ocean",h:.5,rar:2,base:200,minD:6,maxD:30,shy:1.1,group:[1,2],speed:.85,arb:[0,3],sk:"Trnucha modrobodkovaná",en:"Bluespotted Ribbontail Ray",lat:"Taeniura lymma",icon:"🥏",fsk:{live:"Piesočnaté dno pri koralových útesoch Indického oceánu a Červeného mora",eat:"Červy, kraby a krevety, ktoré vyhrabe z piesku prúdom vody",intr:"Elektricky modré bodky svietia aj v šere — sú to výstražné svetlá, ktoré hovoria „nechaj ma tak“. Na tenkom chvoste má dva jedovaté ostne, no nikdy nimi neútočí; použije ich len vtedy, keď naň niekto stúpi. Korisť ukrytú v piesku nájde tak, že cíti slabé elektrické polia živých tiel.",stat:"Takmer ohrozený"},fen:{live:"Sandy bottoms beside the coral reefs of the Indian Ocean and the Red Sea",eat:"Worms, crabs and shrimp flushed out of the sand with jets of water",intr:"Its electric-blue spots glow even in dim light — warning lamps that say “leave me alone”. Its thin tail carries two venomous spines, but it never attacks with them; it uses them only if someone steps on it. It finds prey buried in the sand by sensing the faint electric fields of living bodies.",stat:"Near threatened"}},{id:"delfin",draw:"delfin",land:"ocean",h:.86,rar:3,base:530,minD:12,maxD:60,shy:1.05,group:[2,5],speed:1.35,arb:[3,14],sk:"Delfín skákavý",en:"Common Bottlenose Dolphin",lat:"Tursiops truncatus",icon:"🐬",fsk:{live:"Teplé a mierne moria celého sveta, od pobrežných zálivov po otvorený oceán",eat:"Ryby a chobotnice; loví v skupine a korisť si spoločne nadháňajú",intr:"Nedýcha ústami, ale otvorom na temene, a nadýchnuť sa musí vedome — preto pri spaní vypína vždy len polovicu mozgu a jedno oko má otvorené. Vo vode „vidí“ zvukom: vyšle cvakot a z ozveny zistí, či je pred ním kameň alebo ryba. A každý delfín má vlastnú pískavú značku — meno, ktorým ho ostatné volajú.",stat:"Málo dotknutý"},fen:{live:"Warm and temperate seas worldwide, from coastal bays to the open ocean",eat:"Fish and squid; it hunts in groups that herd the shoal together",intr:"It oung male who fears a fight will grab someone else's infant and hold it as a living shield.",stat:"Least concern"}},{id:"medojed",draw:"medojed",land:"kenya",h:.3,rar:2,base:240,minD:12,maxD:80,shy:1.35,group:[1,2],speed:1.2,sk:"Medojed kapský",en:"Honey Badger",lat:"Mellivora capensis",icon:"🦡",fsk:{live:"Savany, polopúšte a riedke lesy Afriky, Arábie a južnej Ázie",eat:"Takmer všetko — hlodavce, hady, med a včelie larvy, korienky aj vajcia",intr:"Nebojí sa nikoho: postaví sa levovi aj byvolovi a ustúpiť odmieta. Kožu má takú voľnú a hrubú, že keď ho niekto chytí do zubov, otočí sa v nej a pohryzie útočníka. Znesie aj uhryznutie kobry — na pár hodín odpadne, potom sa preberie a hada dojedá.",stat:"Málo dotknutý"},fen:{live:"Savanna, semi-desert and open woodland across Africa, Arabia and southern Asia",eat:"Almost anything — rodents, snakes, honey and bee grubs, roots and eggs",intr:"It is afraid of nobody: it stands up to a lion or a buffalo and simply refuses to back off. Its skin is so loose and thick that when something grabs it, it twists round inside its own hide and bites back. It even survives a cobra bite — it collapses for a few hours, then wakes up and finishes eating the snake.",stat:"Least concern"}},{id:"oryx",draw:"oryx",land:"kenya",h:2.05,rar:1,base:105,minD:45,maxD:165,shy:1.3,group:[3,8],speed:1.1,sk:"Priamorožec beisa",en:"Beisa Oryx",lat:"Oryx beisa",icon:"🦌",fsk:{live:"Suché tŕňové savany a polopúšte severnej Kene, Etiópie a Somálska",eat:"Tvrdá tráva, listy, hľuzy a divé melóny, z ktorých pije",intr:"Vydrží celé týždne bez kvapky vody — berie si ju z rastlín. V najväčšej horúčave si nechá telo zohriať až na štyridsaťpäť stupňov, aby sa nemusel potiť, a zvláštna sieť ciev v hlave mu pritom chladí mozog.",stat:"Ohrozený"},fen:{live:"Dry thorn savanna and semi-desert of northern Kenya, Ethiopia and Somalia",eat:"Tough grasses, leaves, tubers and wild melons it drinks from",intr:"It can go weeks without a drop of water, taking it from plants instead. In the worst heat it lets its body warm up to forty-five degrees rather than waste water on sweating, while a special net of blood vessels in its head keeps the brain cool.",stat:"Endangered"}},{id:"kudu",draw:"kudu",land:"kenya",h:2.5,rar:2,base:205,minD:42,maxD:160,shy:1.55,group:[1,4],speed:1.1,sk:"Kudu veľký",en:"Greater Kudu",lat:"Tragelaphus strepsiceros",icon:"🦌",fsk:{live:"Husté kroviny a tŕňové húštiny východnej a južnej Afriky",eat:"Listy, výhonky a struky — trávu takmer neje",intr:"Rohy samca merajú aj poldruha metra a majú dva a pol závitu — sú to najdlhšie rohy zo všetkých antilop. Vyzerá ťažkopádne, no plot vysoký dva a pol metra preskočí takmer z miesta.",stat:"Málo dotknutý"},fen:{live:"Dense bush and thorn thickets of eastern and southern Africa",eat:"Leaves, shoots and pods — it hardly touches grass",intr:"A bull's horns reach a metre and a half and make two and a half full twists — the longest horns of any antelope. It looks heavy, yet it can clear a two-and-a-half-metre fence almost from standing.",stat:"Least concern"}},{id:"mangusta",draw:"mangusta",land:"kenya",h:.18,rar:0,base:26,minD:10,maxD:70,shy:1.25,group:[5,12],speed:1.3,sk:"Mangusta trpasličia",en:"Common Dwarf Mongoose",lat:"Helogale parvula",icon:"🦫",fsk:{live:"Savany a suché lesy východnej a južnej Afriky, najradšej pri termitiskách",eat:"Chrobáky, termity, pavúky, škorpióny, jašterice a vajcia",intr:"Je to najmenšia africká šelma — váži asi toľko ako veľké jablko. Skupinke velí najstaršia samica a so zoborožcami majú dohodu: mangusty hľadajú hmyz, vtáky strážia oblohu, a vtáky dokonca ráno čakajú pri termitisku, kým mangusty vstanú.",stat:"Málo dotknutý"},fen:{live:"Savanna and dry woodland of eastern and southern Africa, always near termite mounds",eat:"Beetles, termites, spiders, scorpions, lizards and eggs",intr:"It is Africa's smallest carnivore — about the weight of a large apple. The oldest female leads the group, and they have a deal with hornbills: the mongooses find insects while the birds watch the sky, and the birds will even wait by the termite mound in the morning until the mongooses get up.",stat:"Least concern"}},{id:"dikdik",draw:"dikdik",land:"tanzania",h:.42,rar:1,base:92,minD:14,maxD:85,shy:1.55,group:[1,2],speed:1.3,sk:"Dikdik Kirkov",en:"Kirk's Dik-dik",lat:"Madoqua kirkii",icon:"🦌",fsk:{live:"Suché kroviny a tŕňové húštiny východnej Afriky",eat:"Listy, púčiky a plody — trávu takmer neje a piť nemusí vôbec",intr:"V kohútiku má štyridsať centimetrov, teda po koleno dospelému človeku. Územie si značkuje čiernym lepkavým výlučkom zo žliazky pred okom — vyzerá to, akoby plakal a slzy nechával na konárikoch. Žije v pároch, ktoré vydržia spolu celý život.",stat:"Málo dotknutý"},fen:{live:"Dry bush and thorn thickets of eastern Africa",eat:"Leaves, buds and fruit — it barely eats grass and need not drink at all",intr:"It stands forty centimetres at the shoulder, knee-high to a grown-up. It marks its territory with a sticky black secretion from a gland in front of the eye — as if it were crying and leaving the tears on the twigs. Pairs stay together for life.",stat:"Least concern"}},{id:"eland",draw:"eland",land:"tanzania",h:2.1,rar:1,base:84,minD:55,maxD:175,shy:1.35,group:[4,12],speed:1,sk:"Antilopa žirafia",en:"Common Eland",lat:"Taurotragus oryx",icon:"🦬",fsk:{live:"Savany, otvorené kroviny a horské lúky východnej a južnej Afriky",eat:"Listy, struky a tráva — pasie sa aj v noci",intr:"Je to najväčšia antilopa sveta: starý samec váži takmer tonu, a aj tak preskočí dvojmetrovú prekážku. Pri chôdzi mu v predných kolenách hlasno cvaká — čím hlbšie cvakanie, tým väčší samec, a ostatné to počujú aj na sto metrov, takže sa nemusia biť.",stat:"Málo dotknutý"},fen:{live:"Savanna, open bush and mountain grassland of eastern and southern Africa",eat:"Leaves, pods and grass — it grazes at night too",intr:"It is the largest antelope in the world: an old bull weighs close to a tonne and still clears a two-metre obstacle. Its front knees click loudly as it walks — the deeper the click, the bigger the bull, and rivals hear it a hundred metres away, so they need not fight at all.",stat:"Least concern"}},{id:"karakal",draw:"karakal",land:"tanzania",h:.6,rar:2,base:275,pred:!0,minD:32,maxD:150,shy:1.7,group:[1,1],speed:1.4,sk:"Karakal",en:"Caracal",lat:"Caracal caracal",icon:"🐆",fsk:{live:"Savany, polopúšte a suché kroviny Afriky a juhozápadnej Ázie",eat:"Zajace, hlodavce, vtáky a mladé antilopy",intr:"Z miesta vyskočí do výšky troch metrov a labou zrazí vtáka priamo z letu — niekedy aj dva naraz. Meno má z turečtiny: „karakulak“ znamená „čierne ucho“, a tie dlhé čierne štetiny na ušiach mu pomáhajú zameriavať zvuk.",stat:"Málo dotknutý"},fen:{live:"Savanna, semi-desert and dry scrub of Africa and south-west Asia",eat:"Hares, rodents, birds and young antelope",intr:"It leaps three metres straight up and swats a bird out of the air with a paw — sometimes two at once. Its name comes from Turkish: “karakulak” means “black ear”, and those long black ear tufts help it pinpoint sound.",stat:"Least concern"}},{id:"pelikan",draw:"pelikan",land:"tanzania",h:1.45,rar:1,base:95,minD:45,maxD:170,shy:1.2,group:[3,9],speed:.9,sk:"Pelikán ružový",en:"Great White Pelican",lat:"Pelecanus onocrotalus",icon:"🦢",fsk:{live:"Plytké jazerá a mokrade Afriky, juhovýchodnej Európy a Ázie",eat:"Ryby — denne zje aj dve kilá",intr:"Do vaku pod zobákom sa mu zmestí vyše desať litrov vody, viac ako do vedra. Loví v tíme: pelikány sa zoradia do podkovy, plieskaním krídel naženú ryby do plytčiny a naberajú ich všetci naraz.",stat:"Málo dotknutý"},fen:{live:"Shallow lakes and wetlands of Africa, south-east Europe and Asia",eat:"Fish — up to two kilograms a day",intr:"The pouch under its bill holds more than ten litres of water, more than a bucket. It fishes as a team: the pelicans form a horseshoe, beat the water with their wings to drive the fish into the shallows, and all scoop together.",stat:"Least concern"}},{id:"ibisposvatny",d y má biele ako podkolienky, takže ho spoznáš aj v šere.",stat:"Zraniteľný"},fen:{live:"Hill forests of India and Southeast Asia",eat:"Grass, bamboo, leaves and bark",intr:"The largest wild cattle on Earth — an old bull weighs up to a tonne and stands over two metres at the shoulder. Its legs are white like knee socks, so you can spot it even at dusk.",stat:"Vulnerable"}},{id:"sambar",draw:"sambar",h:1.7,rar:0,base:24,minD:50,maxD:150,shy:1.3,group:[1,4],speed:1,land:"india",sk:"Sambar indický",en:"Sambar Deer",lat:"Rusa unicolor",icon:"🦌",fsk:{live:"Lesy Indie, Nepálu a juhovýchodnej Ázie",eat:"Tráva, listy, plody a vodné rastliny",intr:"Keď zbadá tigra, vydá hlboké zatrúbenie a dupne — sprievodcovia podľa toho zvuku vedia, že mačka je nablízku. Rád sa váľa v blate, ktoré mu na srsti vyschne na pancier proti hmyzu.",stat:"Zraniteľný"},fen:{live:"Forests of India, Nepal and Southeast Asia",eat:"Grass, leaves, fruit and water plants",intr:"When it spots a tiger it gives a deep honking call and stamps — guides use that sound to know the cat is near. It wallows in mud that dries into an insect-proof crust.",stat:"Vulnerable"}},{id:"diviakindicky",draw:"diviakindicky",h:.95,rar:0,base:18,minD:35,maxD:120,shy:1.2,group:[2,7],speed:1.2,land:"india",sk:"Diviak indický",en:"Indian Wild Boar",lat:"Sus scrofa cristatus",icon:"🐗",fsk:{live:"Lesy, kroviny a polia po celej Indii",eat:"Korene, hľuzy, plody, hmyz aj zdochliny",intr:"Rypákom zacíti potravu aj pol metra pod zemou a vyryje ju ako pluhom. Mláďatá sú pruhované ako melón, aby ich v tráve nebolo vidieť.",stat:"Málo dotknutý"},fen:{live:"Forests, scrub and farmland right across India",eat:"Roots, tubers, fruit, insects and carrion",intr:"Its snout smells food half a metre underground and ploughs it out. Piglets are striped like a melon so they vanish in the grass.",stat:"Least concern"}},{id:"krokodilbahenny",draw:"krokodilbahenny",h:.5,rar:2,base:195,minD:40,maxD:130,shy:1,group:[1,2],speed:.8,land:"india",pred:!0,sk:"Krokodíl bahenný",en:"Mugger Crocodile",lat:"Crocodylus palustris",icon:"🐊",fsk:{live:"Jazerá, rieky a nádrže Indie, Nepálu a Srí Lanky",eat:"Ryby, korytnačky, vtáky, jelene pri brehu",intr:"Má najširší ňufák zo všetkých krokodílov. V najväčšej horúčave si do brehu vyhrabe niekoľkometrový tunel a v ňom prečká, kým jazero nevyschne.",stat:"Zraniteľný"},fen:{live:"Lakes, rivers and reservoirs of India, Nepal and Sri Lanka",eat:"Fish, turtles, birds and deer that come to drink",intr:"It has the broadest snout of any crocodile. In the worst heat it digs a burrow several metres into the bank and waits there until the lake refills.",stat:"Vulnerable"}},{id:"nilgai",draw:"nilgai",h:1.55,rar:1,base:92,minD:60,maxD:175,shy:1.25,group:[1,4],speed:1.1,land:"india",sk:"Nilgai",en:"Nilgai",lat:"Boselaphus tragocamelus",icon:"🦌",fsk:{live:"Suché lesy, kroviny a polia severnej Indie",eat:"Tráva, listy, puky a plody",intr:"Najväčšia ázijská antilopa. Samec je sivomodrý a rohatý, samica hnedá a bez rohov — vyzerajú ako dva rôzne druhy. Jeho meno znamená modrá krava, a preto ho v Indii nikto neloví.",stat:"Málo dotknutý"},fen:{live:"Dry forests, scrub and farmland of northern India",eat:"Grass, leaves, buds and fruit",intr:'Asia\'s largest antelope. The male is blue-grey with horns, the female tawny and hornless — they look like two different species. Its name means "blue cow", which is why nobody in India hunts it.',stat:"Least concern"}},{id:"binturong",draw:"binturong",h:.42,rar:2,base:230,minD:22,maxD:75,shy:1.3,group:[1,1],speed:.6,land:"indonesia",arb:[6,16],sk:"Binturong",en:"Binturong",lat:"Arctictis binturong",icon:"🐾",fsk:{live:"Koruny dažďových pralesov Bornea a juhovýchodnej Ázie",eat:"Ovocie, hlavne divé figy, občas vtáčie vajcia",intr:"Vonia ako pukance s maslom — v jeho moči je naozaj tá istá voňavá látka ako v pukancoch. Chvost používa ako piatu nohu a zavesí sa na ňom.",stat:"Zraniteľný"},fen:{live:"Rainforest canopy of Borneo and Southeast Asia",eat:"Fruit, especially
