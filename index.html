种子、草、昆虫和小蜥蜴","它不会飞，但奔跑速度可达每小时70公里——比地球上任何鸟都快。"]],elephant:[["Elefante africano","Sabanas, bosques y humedales de toda África","Hierba, hojas, corteza y fruta: hasta 150 kg al día","Habla con sonidos tan graves que tú no los oyes, pero otro elefante los capta a 10 km."],["非洲象","非洲各地的草原、森林和湿地","草、树叶、树皮和果实——每天多达150公斤","它能发出低得你听不见的声音交流，但10公里外的另一头大象却能听到。"]],cheetah:[["Guepardo","Llanuras abiertas donde tiene espacio para correr","Gacelas y antílopes pequeños","De 0 a 100 km/h en tres segundos: más rápido que un coche deportivo. Pero solo aguanta 20 segundos."],["猎豹","有足够空间冲刺的开阔平原","瞪羚和小型羚羊","三秒内从0加速到每小时100公里——比跑车还快。但只能坚持20秒。"]],lion:[["León","Sabanas del África subsahariana; vive en manadas","Cebras, ñus y búfalos; caza sobre todo de noche","Su rugido se oye a ocho kilómetros. La mayor parte de la caza la hacen las leonas."],["狮子","撒哈拉以南非洲的草原，群居生活","斑马、角马和水牛，大多在夜间捕猎","它的吼声能传到八公里外。大部分捕猎工作由母狮完成。"]],rhino:[["Rinoceronte negro","Matorrales del este y el sur de África","Ramitas y hojas de arbustos, no hierba","Ve mal, pero oye y huele de maravilla. En los años setenta solo quedaban 2500; hoy vuelve a haber unos 6000."],["黑犀牛","非洲东部和南部的灌木丛","灌木的嫩枝和叶子，不吃草","它视力很差，但听觉和嗅觉极好。上世纪70年代只剩下2500头，如今又恢复到大约6000头。"]],jackal:[["Chacal de lomo negro","Sabanas y matorrales secos del este y el sur de África","Roedores, aves, insectos y sobras de los grandes felinos","Las parejas permanecen juntas toda la vida y defienden su territorio en equipo."],["黑背胡狼","非洲东部和南部的草原和干燥灌丛","啮齿动物、鸟、昆虫，以及大型猫科动物吃剩的食物","夫妻一生相伴，并肩保卫自己的领地。"]],buffalo:[["Búfalo cafre","Praderas y bosques cerca del agua","Hierba dura; necesita beber todos los días","Se le considera uno de los animales más peligrosos de África: un macho viejo se enfrenta incluso a un león."],["非洲水牛","靠近水源的草地和林地","粗硬的草；每天都要喝水","它被认为是非洲最危险的动物之一——一头老公牛甚至敢和狮子对峙。"]],flamingo:[["Flamenco enano","Lagos salados del este de África","Algas verdeazuladas que filtra del agua con el pico","Es rosa por lo que come. Los pollos nacen grises y tardan años en colorearse."],["小红鹳","东非的咸水湖","用喙从水里滤出的蓝绿藻","它是粉红色的，因为它吃的东西。雏鸟刚孵出来是灰色的，要好几年才变红。"]],hippo:[["Hipopótamo","Ríos y lagos del África subsahariana","Hierba: de noche sale a tierra y come hasta 40 kg","No sabe nadar: camina y se impulsa por el fondo. Mata a más personas que los leones."],["河马","撒哈拉以南非洲的河流和湖泊","草——夜里上岸，最多能吃40公斤","它不会游泳，而是在水底行走和蹬地前进。它杀死的人比狮子还多。"]],hyena:[["Hiena manchada","Sabanas y semidesiertos de África","Caza mucho más de lo que come carroña","El clan lo dirige la hembra más vieja, y sus mandíbulas pueden partir el fémur de un búfalo."],["斑鬣狗","非洲的草原和半沙漠","它主要靠自己捕猎，而不是吃腐肉","族群由最年长的雌性带领，它的嘴能咬碎水牛的大腿骨。"]],serval:[["Serval","Hierba alta cerca del agua","Roedores y aves que oye a través de la hierba","Salta más de tres metros de altura y atrapa pájaros en pleno vuelo."],["薮猫","靠近水边的高草丛","隔着草丛听到的啮齿动物和鸟","它能跳起三米多高，在半空中抓住飞鸟。"]],chital:[["Chital","Bosques secos y claros de la India y Sri Lanka","Hierba, hojas y fruta caída","Sigue a los grupos de langures: los monos le dejan caer hojas desde arriba y le avisan cuando hay tigres."],["花鹿（白斑鹿）","印度和斯里兰卡的干燥森林和林间空地","草、树叶和掉落的果实","它常跟着叶猴群——猴子从树上丢下树叶，还会提醒它老虎来了。"]],peafowl:[["Pavo real común","Bosques y pueblos de toda la India","Semillas, insectos y pequeñas serpientes","El abanico no es la cola: son plumas alargadas del lomo. A menudo canta una hora antes de que llueva."],["蓝孔雀","印度各地的森林和村庄","种子、昆虫和小蛇","那把“扇子”不是尾巴，而是背上长长的羽毛。它常在下雨前一小时鸣叫。"]],langur:[["Langur hanuman","Bosques, acantilados e incluso ciudades de la India","Hojas; tiene un estómago especial con varias cámaras para digerirlas","En la India es sagrado y nadie le hace daño, así que pasea libremente por los templos."],["长尾叶猴","印度的森林、悬崖甚至城市","树叶——它有一个特殊的多室胃来消化","在印度它被视为神圣的动物，没人伤害它，所以它能在寺庙里自由走动。"]],indrhino:[["Rinoceronte indio","Praderas inundables y hierba de elefante en Kaziranga","Hierba, plantas acuáticas y ramitas","Su piel parece una armadura de placas, pero es blanda y se quema con el sol."],["印度犀","卡齐兰加的洪泛草地和象草丛","草、水生植物和嫩枝","它的皮看起来像一副盔甲，其实很软，还会被太阳晒伤。"]],slothbear:[["Oso bezudo","Bosques secos de la India y Sri Lanka","Termitas: las aspira directamente del termitero","Le faltan dos dientes delanteros para poder soplar y aspirar mejor. Se le oye a 200 m."],["懒熊","印度和斯里兰卡的干燥森林","白蚁——直接从蚁丘里吸出来","它少了两颗门牙，这样吹气和吸食更方便。200米外都能听到它的声音。"]],tiger:[["Tigre de Bengala","Bosques, manglares y hierba alta de la India y Bangladés","Ciervos, jabalíes y búfalos jóvenes","Las rayas de cada tigre son únicas, así que los guardas los reconocen por las fotos. Quedan unos 3700 en libertad."],["孟加拉虎","印度和孟加拉国的森林、红树林和高草丛","鹿、野猪和小水牛","每只老虎的条纹都不一样，所以护林员能靠照片认出它们。野外大约还剩3700只。"]],macaque:[["Macaco cangrejero","Bosques costeros y manglares del sudeste asiático","Fruta, cangrejos e insectos","Bucea y atrapa cangrejos; por eso también se le llama macaco cangrejero."],["食蟹猕猴","东南亚的沿海森林和红树林","果实、螃蟹和昆虫","它会潜水抓螃蟹——所以也叫食蟹猴。"]],hornbill:[["Cálao rinoceronte","Selvas de Borneo y Sumatra","Higos y otras frutas; a veces un lagarto","La hembra se encierra en un hueco del árbol y el macho la alimenta por una rendija durante meses."],["马来犀鸟","婆罗洲和苏门答腊的热带雨林","无花果和其他果实，有时也吃蜥蜴","雌鸟把自己封在树洞里，雄鸟要通过一条细缝喂它好几个月。"]],proboscis:[["Mono narigudo","Solo en Borneo, a lo largo de ríos y en manglares","Hojas y fruta verde","Cuanto más grande es la nariz, más grave es la voz y más respeto recibe el macho. También nada bajo el agua."],["长鼻猴","只生活在婆罗洲的河边和红树林","树叶和未成熟的果实","鼻子越大，声音越低沉，雄猴也越受尊重。它还会潜水游泳。"]],orangutan:[["Orangután de Borneo","Selvas de Borneo, casi siempre en lo alto de los árboles","Fruta, sobre todo higos silvestres","Cada tarde se construye una cama nueva de ramas: más de 30 000 a lo largo de su vida."],["婆罗洲猩猩","婆罗洲的雨林，几乎总在树冠上","果实，尤其是野生无花果","它每天傍晚都用树枝搭一张新床——一生要搭三万多张。"]],komodo:[["Dragón de Komodo","Solo cinco islas de Indonesia","Ciervos, jabalíes, búfalos y carroña","El lagarto más grande del mundo: tres metros y 90 kg. Huele a su presa a 9 km de distancia."],["科莫多巨蜥","只生活在印度尼西亚的五个岛上","鹿、野猪、水牛和腐肉","世界上最大的蜥蜴：长三米，重90公斤。它能闻到9公里外的猎物。"]],cloudleopard:[["Pantera nebulosa de Sonda","Selvas densas de Borneo y Sumatra","Monos, ciervos pequeños y aves; caza sobre todo en los árboles","Tiene los colmillos más largos de todos los felinos en proporción a su tamaño y baja por los troncos cabeza abajo."],["巽他云豹","婆罗洲和苏门答腊的茂密雨林","猴子、小型鹿和鸟——大多在树上捕猎","按体型比例，它的犬齿是所有猫科动物中最长的，还能头朝下爬下树干。"]],capybara:[["Capibara","Orillas de ríos y humedales de Sudamérica","Hierba y plantas acuáticas","El roedor más grande del mundo. Aguanta cinco minutos bajo el agua y duerme con la nariz fuera."],["水豚","南美洲的河岸和湿地","草和水生植物","世界上最大的啮齿动物。它能在水下待五分钟，睡觉时只把鼻子露出水面。"]],macaw:[["Guacamayo azul y amarillo","Selvas y palmerales de Sudamérica","Nueces y frutos de palmera; su pico rompe las cáscaras más duras","Las parejas vuelan tan juntas que sus alas casi se tocan. Puede vivir sesenta años."],["蓝黄金刚鹦鹉","南美洲的雨林和棕榈林","坚果和棕榈果——它的喙能咬开最硬的壳","夫妻飞行时靠得很近，翅膀几乎相碰。它能活六十年。"]],toucan:[["Tucán toco","Bosques abiertos y palmerales de Brasil","Fruta, huevos e insectos","El pico mide un tercio de su cuerpo, pero casi no pesa: es hueco por dentro y le ayuda a refrescarse."],["鞭笞巨嘴鸟","巴西的稀疏林地和棕榈林","果实、鸟蛋和昆虫","喙有身体的三分之一长，却几乎没有重量——里面是空心的，还能帮它散热。"]],anteater:[["Oso hormiguero gigante","Sabanas y humedales desde Honduras hasta Argentina","Hormigas y termitas: hasta 30 000 al día","No tiene ningún diente. Su lengua mide 60 cm y la saca 150 veces por minuto."],["大食蚁兽","从洪都拉斯到阿根廷的草原和湿地","蚂蚁和白蚁——每天多达三万只","它一颗牙齿都没有。舌头长60厘米，每分钟伸缩150次。"]],caiman:[["Yacaré","Humedales del Pantanal: viven millones en un área pequeña","Peces, sobre todo pirañas","En el Pantanal viven más de diez millones. De día se queda inmóvil con la boca abierta para refrescarse."],["巴拉圭凯门鳄","潘塔纳尔湿地——数百万只生活在一小片区域","鱼，主要是食人鱼","潘塔纳尔生活着一千多万只。白天它张着嘴一动不动地趴着散热。"]],jaguar:[["Jaguar","Selvas y humedales desde México hasta Argentina","Capibaras, caimanes y tortugas","Tiene la mordida más fuerte de todos los grandes felinos: rompe caparazones de tortuga. A diferencia de otros felinos, le encanta el agua."],["美洲豹","从墨西哥到阿根廷的雨林和湿地","水豚、凯门鳄和乌龟","它的咬合力是所有大型猫科动物中最强的，能咬碎龟壳。和别的猫不同，它很喜欢水。"]],sloth:[["Perezoso de tres dedos","Copas de los árboles de Centroamérica y Sudamérica","Hojas, que tarda un mes en digerir","Se mueve tan despacio que en su pelo crecen algas y lo vuelven verde. Baja al suelo una vez por semana."],["褐喉树懒","中美洲和南美洲的树冠","树叶——要花一个月才能消化","它动得太慢，毛里都长出了藻类，把它染成绿色。它每周只下树一次。"]],squirrelmonkey:[["Mono ardilla centroamericano","Solo en la costa del Pacífico de Costa Rica y Panamá","Insectos y fruta","Tiene el cerebro más grande en proporción a su cuerpo de todos los monos. Sus grupos de cuarenta nunca dejan de moverse."],["中美松鼠猴","只生活在哥斯达黎加和巴拿马的太平洋沿岸","昆虫和果实","按身体比例，它的大脑是所有猴子中最大的。四十只一群，总是在不停移动。"]],dartfrog:[["Rana fresa venenosa","Hojarasca húmeda de la selva centroamericana","Hormigas y ácaros: de ahí viene su veneno","Es más pequeña que una moneda. La hembra lleva a cada renacuajo a su propio charquito dentro de una bromelia."],["草莓箭毒蛙","中美洲雨林潮湿的落叶层","蚂蚁和螨虫——它的毒就来自这些食物","它比一枚硬币还小。雌蛙会把每只蝌蚪分别背到凤梨科植物里的小水池中。"]],hummingbird:[["Colibrí morado","Bosques nubosos de Centroamérica","Néctar e insectos diminutos","Bate las alas ochenta veces por segundo y su corazón late 1200 veces por minuto. Es el único pájaro que vuela hacia atrás."],["紫刀翅蜂鸟","中美洲的云雾林","花蜜和微小的昆虫","它每秒扇动翅膀八十次，心脏每分钟跳1200次。它是唯一能倒着飞的鸟。"]],quetzal:[["Quetzal","Bosques nubosos desde México hasta Panamá","Aguacates silvestres, que se traga enteros","Las plumas de la cola del macho miden más de medio metro. Para mayas y aztecas era sagrado: matar uno se pagaba con la muerte."],["凤尾绿咬鹃","从墨西哥到巴拿马的云雾林","野生鳄梨，整个吞下","雄鸟的尾羽长达半米以上。玛雅人和阿兹特克人视它为神鸟，杀死它要被处死。"]],tapir:[["Tapir centroamericano","Bosques húmedos desde México hasta Colombia","Hojas, brotes y fruta","Sus parientes más cercanos son los caballos y los rinocerontes. Esparce semillas por todo el bosque: lo llaman el jardinero de la selva."],["中美貘","从墨西哥到哥伦比亚的潮湿森林","树叶、嫩芽和果实","它最近的亲戚是马和犀牛。它把种子带到森林各处，被称为“雨林园丁”。"]],ocelot:[["Ocelote","Bosques densos desde Texas hasta Argentina","Roedores, lagartos y aves que caza de noche","El dibujo de cada ocelote es diferente: no hay dos iguales. De día duerme en una rama y de noche recorre diez kilómetros."],["虎猫","从得克萨斯到阿根廷的茂密森林","夜间捕食的啮齿动物、蜥蜴和鸟","每只虎猫的花纹都不同，没有两只一样。白天它在树枝上睡觉，夜里能走十公里。"]],vulture:[["Buitre dorsiblanco","Sabanas de toda el África subsahariana","Carroña: hasta cien se reúnen en un solo cadáver","Planea durante horas sin batir las alas y descubre lo que pasa desde tres kilómetros de altura. Su número ha caído un noventa por ciento en treinta años."],["白背兀鹫","撒哈拉以南非洲各地的草原","腐肉——一具尸体旁能聚集上百只","它能盘旋几个小时不扇一下翅膀，从三公里高空发现地面的动静。三十年来数量减少了九成。"]],redbillhornbill:[["Toco piquirrojo","Sabana seca y bosques de acacias de África","Insectos, semillas y pequeños reptiles","Tiene un trato con las suricatas: vigila el cielo y avisa de los halcones mientras ellas buscan comida, y a cambio caza junto a ellas."],["红嘴弯嘴犀鸟","非洲干燥的草原和金合欢林地","昆虫、种子和小型爬行动物","它和狐獴有个约定：狐獴觅食时，它在一旁盯着天空，发现老鹰就大声报警——作为回报，它可以跟着狐獴一起捕食。"]],crane:[["Grulla coronada cuelligrís","Humedales y praderas húmedas del este y el sur de África","Semillas, insectos y ranas; pisotea el suelo para hacerlos salir","Es la única grulla africana que puede dormir en los árboles. Es el ave nacional de Uganda y aparece en su bandera."],["灰冠鹤","非洲东部和南部的湿地和潮湿草地","种子、昆虫和青蛙——它会跺脚把它们赶出来","它是唯一能在树上栖息的非洲鹤。它是乌干达的国鸟，还出现在乌干达国旗上。"]],secretarybird:[["Serpentario","Sabana abierta donde puede caminar","Serpientes, lagartos y roedores, que mata a patadas","Un ave rapaz que eligió caminar. Recorre más de veinte kilómetros al día y patea con una fuerza de cinco veces su propio peso."],["蛇鹫（秘书鸟）","可以行走的开阔草原","蛇、蜥蜴和啮齿动物——用脚踢死","一种选择走路的猛禽。它每天走二十多公里，踢击的力量相当于自身体重的五倍。"]],marabou:[["Marabú africano","Orillas de ríos, lagos y vertederos cerca de las ciudades","Carroña, peces y basura: limpia lo que otros dejan","Sus alas miden casi tres metros, las más grandes de todas las aves terrestres. La bolsa rosa del cuello no es para la comida: la infla para presumir."],["非洲秃鹳","城镇附近的河岸、湖泊和垃圾场","腐肉、鱼和垃圾——它把别人留下的东西清理干净","它的翼展将近三米，是所有陆地鸟类中最大的。喉部的粉色囊袋不是装食物用的——它把它鼓起来炫耀。"]],impala:[["Impala","Bordes de la sabana y bosques claros del este y el sur de África","Hierba en la época de lluvias y hojas en la estación seca","Salta diez metros de largo y tres de alto. Cuando se asusta, toda la manada sale disparada en distintas direcciones para confundir al depredador."],["黑斑羚","非洲东部和南部的草原边缘和稀疏林地","雨季吃草，旱季吃树叶","它能跳十米远、三米高。受到惊吓时，整群黑斑羚会朝不同方向四散奔逃，让捕食者摸不着头脑。"]],gazela:[["Gacela de Thomson","Llanuras de hierba corta del Serengueti y el Masái Mara","Hierba corta y fresca que dejan al descubierto las cebras","Corre a 80 km/h y es la presa principal del guepardo. Cuando ve a un depredador da botes con las patas rígidas, como diciendo: estoy en forma, no te molestes en perseguirme."],["汤氏瞪羚","塞伦盖蒂和马赛马拉的矮草平原","斑马吃过后露出的鲜嫩短草","它能以每小时80公里奔跑，是猎豹的主要猎物。发现捕食者时，它会僵着腿弹跳，好像在说：我很强壮，别白费力气追我。"]],lycaon:[["Licaón","Sabana abierta y bosques claros; necesita territorios enormes","Impalas y gacelas, que la jauría caza en largas persecuciones","No hay dos con las mismas manchas. Tres de cada cuatro cacerías tienen éxito: es el mejor cazador de África. Quedan menos de siete mil."],["非洲野犬","开阔草原和稀疏林地；需要非常大的领地","黑斑羚和瞪羚，由整个群体长距离追捕","没有两只野犬的斑块是一样的。每四次捕猎有三次成功——它是非洲最成功的猎手。野外只剩不到七千只。"]],leopard:[["Leopardo","De la sabana a la selva y las montañas: el gran felino más adaptable","Antílopes, monos y aves; sube sus presas a los árboles","Puede subir a un árbol una presa más pesada que él. Caza casi solo de noche, e incluso los guías con experiencia rara vez lo ven."],["豹（花豹）","从草原到雨林再到山地——适应力最强的大型猫科动物","羚羊、猴子和鸟；会把猎物拖到树上","它能把比自己还重的猎物拖上树。它几乎只在夜间捕猎，连经验丰富的向导也难得一见。"]],kolobus:[["Colobo guereza","Copas de los bosques de África central","Hojas, que digiere en un estómago con varias cámaras, como el de una vaca","No tiene pulgares, así que su mano se engancha a las ramas al saltar. Su largo manto blanco se abre como un paracaídas en el aire."],["东非黑白疣猴","非洲中部的森林树冠","树叶，用像牛一样的多室胃来消化","它没有大拇指，所以跳跃时用手勾住树枝。长长的白色披毛在空中展开，像一顶降落伞。"]],simpanz:[["Chimpancé","Selva y bosques de galería de África central y occidental","Fruta, hojas, termitas y a veces carne","Fabrica herramientas: pela una ramita para pescar termitas. Las crías aprenden mirando a su madre, así que cada grupo tiene sus propias costumbres."],["黑猩猩","非洲中部和西部的雨林和河岸森林","果实、树叶、白蚁，偶尔吃肉","它会制造工具——把树枝的叶子剥掉，用来钓白蚁。小黑猩猩看着妈妈学习，所以每个群体都有自己的习俗。"]],slonpralesny:[["Elefante africano de bosque","Selvas de la cuenca del Congo","Fruta, hojas y corteza; esparce las semillas de cientos de especies de árboles","Es más pequeño que su primo de la sabana y tiene colmillos rectos que no se enganchan en la vegetación. Sin él la selva del Congo se ahogaría: es su jardinero."],["非洲森林象","刚果盆地的雨林","果实、树叶和树皮——它传播几百种树的种子","它比草原上的亲戚小，象牙是直的，不会被茂密的植物卡住。没有它，刚果森林就会窒息——它是森林的园丁。"]],okapi:[["Okapi","Solo en los bosques densos del noreste del Congo","Hojas, brotes y hongos; con su lengua de 30 cm se limpia hasta las orejas","Es el pariente más cercano de la jirafa, pero tiene rayas como una cebra. La ciencia no lo descubrió hasta 1901; antes era una leyenda europea sobre un caballo del bosque."],["霍加狓","只生活在刚果东北部的茂密森林","树叶、嫩芽和真菌；它30厘米长的舌头甚至能清洁自己的耳朵","它是长颈鹿最近的亲戚，却长着像斑马一样的条纹。科学家直到1901年才发现它——在那之前，它只是欧洲人传说中的“森林之马”。"]],gorila:[["Gorila oriental","Bosques de montaña y de llanura del este del Congo, Ruanda y Uganda","Hojas, tallos y bambú: hasta 30 kg de verdura al día","Un espalda plateada pesa 250 kg y es diez veces más fuerte que una persona, pero es un vegetariano tranquilo. Cada tarde construye un nido nuevo."],["东部大猩猩","刚果东部、卢旺达和乌干达的山地和低地森林","树叶、茎和竹子——每天多达30公斤的绿色植物","一只银背大猩猩重250公斤，力气是人的十倍，却是温和的素食者。它每天傍晚都会搭一个新窝。"]],bongo:[["Bongo","Los matorrales más densos de la selva africana","Hojas, hierbas y corteza; visita los saladares","Es el antílope de bosque más grande y uno de los más tímidos. Machos y hembras tienen cuernos y los pegan al lomo cuando atraviesan la maleza."],["紫羚（邦戈羚羊）","非洲雨林中最茂密的灌木丛","树叶、草本植物和树皮；会去舔盐地","它是最大的森林羚羊，也是最害羞的羚羊之一。雌雄都长角，穿过灌木丛时会把角平贴在背上。"]],medved:[["Oso pardo","Bosques de los Cárpatos: en Eslovaquia viven unos 1300","Nueve décimas partes plantas: arándanos, hayucos, hormigas; a veces carroña","Pasa el invierno durmiendo en su osera sin comer ni beber durante meses. Justo entonces nacen sus oseznos, ciegos y no más grandes que un cobaya."],["棕熊","喀尔巴阡山的森林——斯洛伐克大约生活着1300只","十分之九是植物：越橘、山毛榉果、蚂蚁；偶尔吃腐肉","它在洞里睡过整个冬天，几个月不吃不喝。小熊就在这时出生，眼睛还没睁开，个头不比豚鼠大。"]],vlk:[["Lobo gris","Grandes bosques del norte y el este de Eslovaquia; una manada necesita hasta 200 km²","Ciervos, corzos y jabalíes, normalmente los enfermos y los débiles","Su aullido se oye a diez kilómetros, y cada lobo aúlla en un tono distinto para que la manada parezca mucho más grande. Desde 2021 está protegido en Eslovaquia todo el año."],["灰狼","斯洛伐克北部和东部的大森林；一个狼群需要多达200平方公里","马鹿、狍子和野猪——通常是病弱的个体","狼嚎能传到十公里外，每只狼的音调都不同，让狼群听起来比实际大得多。自2021年起，它在斯洛伐克全年受到保护。"]],rys:[["Lince boreal","Bosques densos y rocosos de los Cárpatos: en Eslovaquia viven unos trescientos","Corzos y cervatillos, liebres, urogallos; acecha y salta desde pocos metros","Los pinceles negros de sus orejas le ayudan a oír: sin ellos estaría medio sordo. Con un corzo come una semana, y entre comida y comida lo esconde bajo las hojas."],["欧亚猞猁","喀尔巴阡山茂密多岩的森林——斯洛伐克大约有三百只","狍子和小鹿、野兔、松鸡——它悄悄靠近，从几米外猛扑","耳朵上的黑色簇毛帮助它听声音；没有它们，它就会半聋。一只狍子它能吃一个星期，中间会用树叶把它盖起来。"]],kamzik:[["Rebeco de los Tatras","Peñascos y pino enano de los Altos Tatras y los Tatras de Belianske: en ningún otro lugar de la Tierra","Hierba, hierbas, musgos y líquenes entre las rocas","Vive solo en los Tatras y es el único gran animal endémico de Eslovaquia. Sube una pared vertical más rápido de lo que una persona camina por un sendero y salta seis metros. En 1999 apenas quedaban doscientos; hoy hay más de mil cuatrocientos."],["塔特拉岩羚","高塔特拉山和贝利安斯凯塔特拉山的岩壁和矮松林——地球上别处都没有","岩石间的草、草本植物、苔藓和地衣","它只生活在塔特拉山，是斯洛伐克唯一的大型特有动物。它爬陡峭岩壁比人走山路还快，一跳就是六米。1999年只剩下不到两百只，如今已超过一千四百只。"]],svist:[["Marmota de los Tatras","Prados alpinos por encima del límite del bosque, en madrigueras de hasta siete metros de profundidad","Hierba y plantas de montaña; en otoño pesa el doble que en primavera","Duerme siete meses bajo la nieve con el corazón a solo cinco latidos por minuto. Cuando ve un águila se pone de pie y silba tan fuerte que lo oye todo el valle."],["塔特拉旱獭","林线以上的高山草甸，洞穴深达七米","草和高山植物——到秋天，它的体重是春天的两倍","它在雪下冬眠七个月，心跳降到每分钟五次。发现老鹰时，它会用后腿站起来，发出尖锐的哨声，整个山谷都能听到。"]],orolskalny:[["Águila real","Paredes rocosas de los Altos y Bajos Tatras: en Eslovaquia anidan unas 80 parejas","Marmotas, liebres, urogallos, corzos jóvenes; carroña en invierno","Sus alas miden más de dos metros y planea durante horas en las corrientes de aire sin batirlas ni una vez. Ve varias veces mejor que nosotros: descubre una marmota a dos kilómetros."],["金雕","塔特拉山和低塔特拉山的悬崖——斯洛伐克大约有80对在此筑巢","旱獭、野兔、松鸡、小狍子；冬天也吃腐肉","它的翼展超过两米，能乘着上升气流盘旋几个小时，一下翅膀都不扇。它的视力比人敏锐好几倍——两公里外就能看到一只旱獭。"]],hlucan:[["Urogallo","Viejos bosques de abetos de montaña con arándanos: en Eslovaquia quedan unos 700","En invierno solo agujas de abeto y pícea; en verano arándanos e insectos","Es el tetraónido más grande de Europa: un macho pesa hasta cinco kilos. Durante su canto de cortejo en primavera se queda realmente sordo durante los últimos dos o tres segundos; por eso en eslovaco se llama «hlucháň», el sordo."],["西方松鸡","长着越橘的古老山地云杉林——斯洛伐克大约还剩700只","冬天只吃云杉和冷杉的针叶；夏天吃越橘和昆虫","它是欧洲最大的松鸡——雄鸟重达五公斤。春天求偶鸣唱时，最后两三秒它真的会听不见声音，所以它的斯洛伐克名字“hlucháň”意思就是“聋子”。"]],jelen:[["Ciervo común","Bosques de toda Eslovaquia; en verano sube por encima del límite del bosque","Hierba, plantas, brotes y, en invierno, corteza de árbol","Pierde la cornamenta cada primavera y le vuelve a crecer en cuatro meses, hasta dos centímetros al día: el hueso que crece más rápido de la Tierra. En septiembre empieza la berrea y sus bramidos llenan todo el valle."],["马鹿","斯洛伐克各地的森林；夏天会爬到林线以上","草、草本植物、嫩芽，冬天吃树皮","它的鹿角每年春天脱落，四个月就重新长好，每天最多长两厘米——是地球上长得最快的骨头。九月发情期开始，它的吼声响彻整个山谷。"]],diviak:[["Jabalí","Bosques caducifolios y mixtos, matorrales y charcas de barro de toda Eslovaquia","Bellotas, hayucos, raíces, roedores y larvas que desentierra con el hocico","Su hocico puede levantar una piedra pesada y oler comida medio metro bajo tierra. Los jabatos tienen rayas claras, como un melón, que los hacen casi invisibles entre las hojas; desaparecen en seis meses."],["野猪","斯洛伐克各地的阔叶林和混交林、灌木丛和泥塘","橡子、山毛榉果、根、啮齿动物和幼虫——用鼻子拱出来","它的鼻子能掀起沉重的石头，还能闻到地下半米的食物。小野猪身上有像西瓜一样的浅色条纹，在落叶里几乎看不见；半年后条纹就消失了。"]],bocianc:[["Cigüeña negra","Bosques viejos junto a arroyos; anida en lo profundo del bosque, lejos de la gente","Peces, ranas, tritones e insectos acuáticos de arroyos de montaña poco profundos","A diferencia de la cigüeña blanca, evita a las personas y construye su nido en un árbol viejo en lo profundo del bosque, el mismo durante veinte años. Pasa el invierno en África, un viaje de más de cuatro mil kilómetros."],["黑鹳","溪流边的古老森林——它在远离人类的森林深处筑巢","浅山溪里的鱼、青蛙、蝾螈和水生昆虫","和白鹳不同，它躲着人类，把巢建在森林深处的老树上，同一个巢能用二十年。它飞到非洲过冬，旅程超过四千公里。"]],vydra:[["Nutria europea","Arroyos y ríos limpios con orillas llenas de raíces, también en los valles de los Tatras","Peces, cangrejos de río y ranas; come la quinta parte de su peso al día","Bajo el agua cierra las orejas y la nariz con unas tapitas y aguanta dos minutos. Sus bigotes funcionan como un radar: encuentra un pez en agua turbia y totalmente oscura."],["欧亚水獭","干净的溪流和河流，岸边树根交错——包括塔特拉山的山谷","鱼、小龙虾和青蛙；每天吃掉自身体重五分之一的食物","在水下，它用小皮瓣关上耳朵和鼻孔，能潜水两分钟。它的胡须像雷达——在漆黑浑浊的水里也能找到鱼。"]],panda:[["Panda gigante","Bosques de bambú de montaña de Sichuan, Shaanxi y Gansu","Casi solo bambú: entre 12 y 38 kilos al día","Tiene un sexto «pulgar», un hueso de la muñeca agrandado con el que sujeta los tallos de bambú. Una cría recién nacida es rosada, sin pelo y pesa solo unos 100 gramos, como un yogur."],["大熊猫","四川、陕西和甘肃的山地竹林","几乎只吃竹子——每天12到38公斤","它有第六根“拇指”，是一块变大的腕骨，用来握住竹子。刚出生的熊猫宝宝粉红色、没有毛，只有大约100克——一杯酸奶那么重。"]],pandacervena:[["Panda rojo","Bosques de montaña con bambú en el Himalaya y el sur de China","Hojas de bambú, bayas, bellotas y a veces huevos e insectos","No es pariente del panda gigante: tiene su propia familia, más cercana a las comadrejas y las mofetas. En invierno se envuelve con su cola anillada como si fuera una bufanda."],["小熊猫","喜马拉雅山和中国南部长着竹子的山地森林","竹叶、浆果、橡子，有时也吃鸟蛋和昆虫","它和大熊猫根本不是亲戚——它自成一科，跟鼬和臭鼬更接近。冬天它把蓬松的环纹尾巴裹在身上，像围巾一样。"]],takin:[["Takín dorado","Laderas empinadas con bambú y rododendros de las montañas Qinling y Sichuan","Hojas, hierba, bambú y brotes de sauce; visita los saladares","Pesa hasta 350 kilos y aun así trepa por las rocas como una cabra. Su pelaje dorado es grasiento, así que la lluvia le resbala como sobre un impermeable."],["金毛羚牛","秦岭和四川长着竹子和杜鹃花的陡坡","树叶、草、竹子和柳树嫩芽；会去舔盐地","它重达350公斤，却能像山羊一样攀爬岩石。它的金色皮毛油乎乎的，雨水会像从雨衣上一样滑落。"]],langurzlaty:[["Mono dorado de nariz chata","Bosques de montaña de Qinling y Sichuan, entre 1500 y 3000 metros","Líquenes, agujas de pino, corteza, brotes y fruta","Es el único mono que sobrevive habitualmente a la nieve y a heladas de menos diez grados. Su nariz es tan chata que solo le quedan dos orificios hacia arriba."],["川金丝猴","秦岭和四川海拔1500到3000米的山地森林","地衣、松针、树皮、嫩芽和果实","它是唯一经常经受住大雪和零下十度严寒的猴子。它的鼻子扁得只剩下两个朝天的鼻孔。"]],bazantzlaty:[["Faisán dorado","Bosques de montaña y bambusales del centro de China","Semillas, hojas, bayas y pequeños invertebrados","Durante el cortejo, el macho abre su capa naranja como un abanico y esconde detrás media cara. La hembra es de un marrón sencillo para que nadie la encuentre en el nido."],["红腹锦鸡","中国中部的山地森林和竹林","种子、树叶、浆果和小型无脊椎动物","求偶时，雄鸟像扇子一样展开橙色的披肩，把半张脸藏在后面。雌鸟是朴素的褐色，这样孵蛋时谁也找不到它。"]],zeriavmandzursky:[["Grulla de Manchuria","Pantanos de Manchuria, el Amur y Hokkaido; pasa el invierno en China y Corea","Peces, anfibios, insectos, raíces y semillas","La mancha roja de la cabeza no son plumas: es piel desnuda que brilla más cuando el ave se emociona. Las parejas permanecen juntas toda la vida y bailan incluso fuera de la época de cría."],["丹顶鹤","中国东北、黑龙江流域和北海道的沼泽；在中国和朝鲜半岛越冬","鱼、两栖动物、昆虫、根和种子","头顶的红色不是羽毛，而是裸露的皮肤，鹤激动时会变得更红。夫妻终生相伴，即使不在繁殖季也会跳舞。"]],makaktibetsky:[["Macaco del Tíbet","Bosques de montaña y de bambú del centro y el este de China","Fruta, hojas, semillas, setas e insectos","Es el macaco más grande del mundo y su cola es tan corta que casi no se ve. Cuando dos machos quieren hacer las paces, sostienen juntos a una cría: es su gesto de reconciliación."],["藏酋猴","中国中部和东部的山地森林和竹林","果实、树叶、种子、蘑菇和昆虫","它是世界上最大的猕猴，尾巴短得几乎看不见。两只雄猴想和好时，会一起抱着一只小猴——这是它们的和解动作。"]],leopardsnezny:[["Leopardo de las nieves","Laderas rocosas del Himalaya, el Tíbet y el Altái, entre 3000 y 4500 metros","Bharales, íbices, marmotas y liebres","Su cola es casi tan larga como su cuerpo: la usa para mantener el equilibrio en los acantilados y para taparse la nariz al dormir. A diferencia del león y el tigre no puede rugir; solo bufa y resopla."],["雪豹","喜马拉雅山、青藏高原和阿尔泰山海拔3000到4500米的多岩山坡","岩羊、北山羊、旱獭和野兔","它的尾巴几乎和身体一样长——在悬崖上用来保持平衡，睡觉时用来盖住鼻子。和狮子、老虎不同，它不会吼叫，只会嘶嘶声和喷气。"]],muntziak:[["Muntíaco de Reeves","Maleza densa y bosques de bambú del sur y el este de China","Plantas, brotes, fruta caída y hongos","Cuando nota peligro ladra como un perro, a veces durante una hora entera; por eso lo llaman ciervo ladrador. Además de unas astas cortas, el macho pelea con colmillos que le salen del labio superior."],["小麂","中国南部和东部茂密的灌木丛和竹林","草本植物、嫩芽、掉落的果实和真菌","感到危险时，它会像狗一样吠叫，有时能叫上整整一个小时——所以又叫“吠鹿”。雄麂除了短短的角，还会用从上唇伸出的獠牙打架。"]],ibiscinsky:[["Ibis crestado","Arrozales, arroyos y bosques abiertos de la provincia de Shaanxi, en China","Renacuajos, pececillos, cangrejos, caracoles e insectos de aguas poco profundas","En 1981 solo quedaban siete en todo el mundo, todos cerca de un pueblo chino. Gracias a una protección estricta, hoy vuelven a volar varios miles."],["朱鹮","中国陕西省的稻田、溪流和稀疏林地","浅水中的蝌蚪、小鱼、螃蟹、螺和昆虫","1981年，全世界只剩下七只，都在中国的一个村庄附近。经过严格保护，如今又有几千只在天空飞翔。"]],salamandra:[["Salamandra gigante china","Arroyos y ríos de montaña fríos y rápidos del centro de China","Peces, cangrejos de río, ranas e insectos acuáticos","Es el anfibio más grande de la Tierra: mide hasta 1,8 metros y vive más de cincuenta años. Casi no ve; nota a sus presas por las vibraciones del agua con unos bultitos de la piel."],["中国大鲵（娃娃鱼）","中国中部寒冷湍急的山溪和河流","鱼、小龙虾、青蛙和水生昆虫","它是地球上最大的两栖动物——身长可达1.8米，能活五十多年。它几乎看不见东西，靠皮肤上的小疙瘩感知水的振动来发现猎物。"]],bizon:[["Bisonte americano","Amplios valles de hierba de Yellowstone, sobre todo Lamar y Hayden","Hierba y juncias; en invierno las desentierra de la nieve con la cabeza","Pesa como un coche pequeño y aun así carga cuesta arriba a 55 km/h. En Yellowstone vive la única manada de bisontes que ha estado allí sin interrupción desde la prehistoria: cuando en el siglo XIX los cazadores redujeron la especie de decenas de millones a unos cientos, aquí sobrevivieron unos veintitrés."],["美洲野牛","黄石公园宽阔的草谷——尤其是拉马尔谷和海登谷","草和莎草；冬天用头把它们从雪下拱出来","它和一辆小汽车一样重，却能以每小时55公里冲上山坡。黄石公园有唯一一群从史前时代起就一直生活在那里的野牛——19世纪猎人把野牛从几千万头杀到只剩几百头时，这里大约幸存了二十三头。"]],grizly:[["Oso grizzly","Bosques y valles de montaña de las Rocosas; alrededor de Yellowstone viven unos 1000","Sobre todo plantas (hierba, raíces, piñones), además de roedores, crías de wapití y carroña","La joroba de los hombros no es grasa sino músculo para cavar: con una pata puede apartar rocas tan pesadas como tú. Antes del invierno engorda hasta 200 kg y luego duerme medio año sin comer ni beber."],["灰熊","落基山脉的山地森林和山谷；黄石公园周围生活着大约1000只灰熊","主要是植物——草、根、松子——还有啮齿动物、小马鹿和腐肉","肩上的隆起不是脂肪，而是用来挖掘的肌肉：一只熊掌就能推开和你一样重的石头。入冬前它能长胖200公斤，然后半年不吃不喝地睡觉。"]],kojot:[["Coyote","Praderas, estepas e incluso las afueras de las ciudades: casi toda Norteamérica","Topillos y ratones (una docena al día), liebres, insectos, fruta y sobras de los lobos","Dos coyotes saben aullar con tanta astucia que parecen una manada entera. Cuando los lobos desaparecieron de Yellowstone, los coyotes se multiplicaron; tras el regreso de los lobos en 1995, su número en el valle Lamar bajó casi a la mitad."],["郊狼","草原、荒原甚至城市边缘——几乎遍布北美","田鼠和老鼠（每天十几只）、野兔、昆虫、果实和狼吃剩的食物","两只郊狼能巧妙地嚎叫，听起来像一整群。黄石公园的狼被消灭后，郊狼大量增加；1995年狼回来后，拉马尔谷的郊狼减少了大约一半。"]],wapiti:[["Uapití","Valles abiertos y bordes de pinares de Yellowstone; en invierno baja más","Hierba y plantas; en invierno brotes de sauce y álamo","Cada primavera pierde la cornamenta y en un solo verano le crece otra entera de un metro, cada asta tan pesada como un cubo lleno de agua. En septiembre los machos berrean con un grito agudo y silbante que se oye en todo el valle."],["北美马鹿","黄石公园开阔的山谷和松林边缘；冬天会往低处走","草和草本植物，冬天吃柳树和白杨的嫩枝","它每年春天脱落鹿角，一个夏天就能长出一整副一米长的新角——每只角都像一满桶水那么重。九月，雄鹿会发出尖细的哨声般的叫声，整个山谷都听得见。"]],vidloroh:[["Berrendo","Estepas abiertas de artemisa y praderas del oeste de Estados Unidos","Artemisa, hierbas y arbustos demasiado amargos para otros animales","Corre a 88 km/h y, a diferencia del guepardo, aguanta durante kilómetros: es el mamífero más rápido de América. Todavía huye de un depredador que se extinguió hace diez mil años: el guepardo americano."],["叉角羚","美国西部开阔的蒿草荒原和草原","蒿草、草本植物和其他动物嫌太苦的灌木","它能以每小时88公里奔跑，而且和猎豹不同，它能连续跑好几公里——是美洲跑得最快的哺乳动物。它至今还在躲避一种一万年前就灭绝的捕食者：美洲猎豹。"]],orolbielohlavy:[["Pigargo americano","Pinos altos junto a los ríos y lagos de Yellowstone, con vistas al agua","Sobre todo peces que atrapa en la superficie con las garras; en invierno también patos y carroña","No nace con la cabeza blanca: se le vuelve blanca hacia los cinco años. Construye los nidos más grandes de todas las aves: el récord medía tres metros de ancho y pesaba más que un coche."],["白头海雕","黄石公园河湖旁可以俯瞰水面的高大松树","主要是用爪子从水面抓起的鱼；冬天也吃鸭子和腐肉","它生下来头不是白的——大约五岁才变白。它筑的巢是地球上所有鸟中最大的：最大纪录宽三米，比一辆汽车还重。"]],bobor:[["Castor americano","Arroyos y ríos de Yellowstone, donde construye presas y madrigueras de palos y barro","Corteza y ramitas tiernas de álamo y sauce; tala los árboles él mismo","Sus dientes delanteros son naranjas por el hierro, duros como un cincel, y le crecen toda la vida, así que tiene que roer madera sin parar. Cuando nota peligro golpea el agua con su cola plana: un chasquido que se oye en todo el estanque."],["北美河狸","黄石公园的溪流和河流，它在那里用树枝和泥巴筑坝、建窝","白杨和柳树的树皮和嫩枝——树是它自己咬倒的","它的门牙含铁，呈橙色，像凿子一样硬，而且一辈子不停地长，所以必须不停地啃木头。感到危险时，它会用扁平的尾巴拍打水面——整个池塘都能听到“啪”的一声。"]],rysc:[["Lince rojo","Barrancos rocosos, matorrales y bordes del bosque; en Yellowstone se ve muy pocas veces","Liebres y conejos, topillos, ardillas, aves y a veces incluso un ciervo joven","Solo es el doble de grande que un gato doméstico, pero puede matar presas diez veces más pesadas que él. Su cola es tan corta que parece cortada: por eso en inglés se llama «bobcat»."],["短尾猫（红猞猁）","多岩的沟谷、灌木丛和森林边缘；在黄石公园很难见到","野兔和兔子、田鼠、松鼠、鸟——偶尔甚至捕食小鹿","它只有家猫的两倍大，却能杀死比自己重十倍的猎物。它的尾巴短得像被剪掉了一样——英文名“bobcat”就是这么来的。"]],sokol:[["Halcón peregrino","Paredes rocosas y cañones de Yellowstone; anida en repisas muy por encima del río","Casi solo aves, que derriba en pleno vuelo","En picado de caza cae a más de 380 km/h: es el animal más rápido de la Tierra. Para que el aire no le dañe los pulmones, unos conos de hueso diminutos dentro de sus fosas nasales frenan la corriente."],["游隼","黄石公园的悬崖和峡谷；在河流上方高高的岩架上筑巢","几乎只吃鸟，在半空中把它们击落","俯冲捕猎时，它的速度超过每小时380公里——是地球上最快的动物。为了不让急速的气流伤到肺，它鼻孔里有小小的骨质锥体减缓气流。"]],losamericky:[["Alce","Humedales con sauces, lagos y pantanos de Yellowstone: donde hay agua, hay alces","Brotes de sauce y plantas acuáticas, hasta 30 kilos al día","Es el ciervo más grande de la Tierra y el único que bucea: aguanta medio minuto bajo el agua y arranca plantas a varios metros de profundidad. Su ancha cornamenta en forma de pala funciona incluso como una antena parabólica que lleva el sonido a sus orejas."],["驼鹿","黄石公园长着柳树的湿地、湖泊和沼泽——有水的地方就有驼鹿","柳树嫩芽和水生植物，每天多达30公斤","它是地球上最大的鹿，也是唯一会潜水的鹿：能在水下待半分钟，从几米深的水底扯下植物。它宽大的掌状鹿角甚至像卫星天线一样，把声音汇聚到耳朵里。"]],skunk:[["Mofeta rayada","Matorrales, prados y bordes del bosque de toda Norteamérica; de día duerme en una madriguera","Escarabajos, larvas, ratones, huevos y fruta que desentierra con el hocico","Antes de rociar te avisa: patea con las patas delanteras y levanta la cola. Solo entonces dispara su chorro apestoso a cinco metros; se huele a un kilómetro y pica tanto en los ojos del depredador que lo deja ciego un rato."],["条纹臭鼬","北美各地的灌木丛、草地和森林边缘；白天在洞里睡觉","甲虫、幼虫、老鼠、鸟蛋和果实，用鼻子从地里拱出来","喷臭液之前，它会先警告你：用前脚跺地，再把尾巴竖起来。然后才把臭液喷到五米外——一公里外都能闻到，还会刺得捕食者的眼睛暂时看不见。"]],leguanmorsky:[["Iguana marina","Solo en las Galápagos, en costas de lava negra, tomando el sol en las rocas junto a las olas","Algas que raspa con los dientes de las rocas submarinas","Es el único lagarto de la Tierra que bucea en el mar: aguanta media hora bajo el agua. El agua salada que traga la expulsa por la nariz, así que parece que estornuda sin parar y lleva una peluca blanca de sal."],["海鬣蜥","只生活在加拉帕戈斯群岛——黑色熔岩海岸上，在浪花边的岩石上晒太阳","海藻，用牙齿从水下岩石上刮下来","它是地球上唯一会潜入大海的蜥蜴——能在水下待半个小时。它咽下的海水会从鼻子里喷出来，所以看起来总在打喷嚏，头上还戴着一顶白色的盐“假发”。"]],leguansuchozemsky:[["Iguana terrestre de Galápagos","El interior seco de las islas Galápagos; de noche duerme en una madriguera y de día toma el sol","Sobre todo pencas y frutos de tuna, con espinas y todo","Se traga el cactus entero, con espinas incluidas, y deja que su estómago se encargue. Casi no necesita beber: el jugoso cactus le da el agua. Puede vivir más de cincuenta años."],["加拉帕戈斯陆鬣蜥","加拉帕戈斯群岛干燥的内陆；夜里在洞里睡觉，白天晒太阳","主要是仙人掌的茎片和果实——连刺一起吃","它把仙人掌连刺整个吞下去，让胃去处理。它几乎不用喝水：多汁的仙人掌提供了水分。它能活五十多年。"]],korytnackaobria:[["Tortuga gigante de Galápagos","Las tierras altas húmedas y los campos de lava de las Galápagos; cada isla tiene su propia variedad","Hierba, hojas, cactus y fruta caída: hasta treinta kilos al día","Puede sobrevivir un año entero sin comida ni agua; por eso los marineros las llevaban en los barcos como provisiones vivas. Vive más de cien años, y las islas llevan su nombre: «galápago» es una palabra antigua para la silla de montar a la que se parece su caparazón."],["加拉帕戈斯象龟","加拉帕戈斯群岛潮湿的高地和熔岩原；每个岛都有自己的品种","草、树叶、仙人掌和掉落的果实——每天多达三十公斤","它能一整年不吃不喝，所以从前的水手把它们搬上船，当作活的储备粮。它能活一百多岁，群岛也是以它命名的：“galápago”在古西班牙语里指马鞍，它的龟壳就像一副马鞍。"]],blbecmodronohy:[["Piquero de patas azules","Costas rocosas desde California hasta Perú; en las Galápagos anida directamente en el suelo","Peces, que atrapa lanzándose en picado desde treinta metros","El azul no es permanente: viene de los pigmentos del pescado fresco. Un ave sana y bien alimentada tiene las patas más brillantes, así que en el cortejo el macho las levanta una a una en un baile lento para presumir."],["蓝脚鲣鸟","从加利福尼亚到秘鲁的岩石海岸；在加拉帕戈斯直接在地面上筑巢","鱼，从三十米高处俯冲入水捕捉","蓝色不是永久的——它来自新鲜鱼肉里的色素。健康、吃得好的鸟脚更蓝，所以求偶时，雄鸟会慢慢地轮流抬起双脚，跳一段炫耀的舞。"]],kormorang:[["Cormorán mancón","Solo las costas frescas de Fernandina e Isabela: en ningún otro lugar de la Tierra","Peces, pulpos y anguilas que caza en el fondo cerca de la costa","Es el único cormorán del mundo que no puede volar. Sin depredadores de los que huir y con comida justo bajo las rocas, sus alas se encogieron durante miles de años a un tercio del tamaño necesario; hoy solo le sirven para mantener el equilibrio. Quedan unos dos mil."],["弱翅鸬鹚","只生活在费尔南迪纳岛和伊莎贝拉岛凉爽的海岸——地球上别处都没有","在近岸海底捕食鱼、章鱼和鳗鱼","它是世界上唯一不会飞的鸬鹚。这里没有需要逃避的天敌，食物就在岩石下面，几千年来它的翅膀缩小到飞行所需大小的三分之一——如今只用来保持平衡。现在大约还有两千只。"]],tucniakg:[["Pingüino de Galápagos","Costas de lava de Fernandina e Isabela, donde una corriente fría del fondo del mar enfría el agua","Peces pequeños: sardinas y lisas que caza en bancos bajo la superficie","Es el único pingüino que vive en el ecuador, y como parte de Isabela queda al norte de él, también es el único pingüino del hemisferio norte. Para no cocerse bajo el sol tropical extiende las aletas para darles sombra y jadea como un perro."],["加拉帕戈斯企鹅","费尔南迪纳岛和伊莎贝拉岛的熔岩海岸，那里有来自深海的寒流让海水变凉","小鱼——在水面下成群捕捉的沙丁鱼和鲻鱼","它是唯一生活在赤道上的企鹅；因为伊莎贝拉岛有一部分在赤道以北，它也是唯一生活在北半球的企鹅。为了不被热带阳光烤熟，它会把鳍伸出来遮阴，还像狗一样喘气。"]],albatrosg:[["Albatros de Galápagos","Anida casi solo en una isla, Española; el resto del año vive sobre el océano abierto","Peces, pulpos y calamares que recoge de la superficie","Con sus dos metros y medio de envergadura planea durante horas sin batir las alas. Despegar desde el suelo llano le cuesta, así que ha marcado una pista hasta el borde del acantilado: corre y simplemente se deja caer al viento."],["加岛信天翁","几乎只在一个岛——埃斯帕尼奥拉岛上筑巢；一年中其余时间都生活在大洋上空","从水面啄起的鱼、章鱼和鱿鱼","它的翼展有两米半，能滑翔几个小时不扇一下翅膀。从平地起飞对它来说很难，所以它踩出了一条通向悬崖边的“跑道”——跑过去，然后直接跳进风里。"]],lachtang:[["León marino de Galápagos","Playas, rocas y muelles de las Galápagos; duerme en cualquier sitio, incluso en un banco del puerto","Sardinas y otros peces, que caza hasta a cien metros de profundidad","No le tiene ningún miedo a la gente y se tumba a tu lado en las escaleras. Se distingue de una foca por su pequeña oreja externa y porque sabe ponerse de pie sobre las aletas delanteras y correr."],["加拉帕戈斯海狮","加拉帕戈斯的海滩、岩石和码头；它哪儿都能睡，连港口的长椅上也行","沙丁鱼和其他鱼，能潜到一百米深捕猎","它一点也不怕人，会直接在你身边的台阶上躺下。它和海豹的区别是：它有小小的外耳，而且能用前鳍撑起身体奔跑。"]],pinkad:[["Pinzón de Darwin","Todas las islas Galápagos, desde los campos de lava secos hasta las tierras altas húmedas","Semillas y frutos secos duros, que rompe con su grueso pico","En las Galápagos viven unas trece clases de estos pinzones y todas vienen de un mismo antepasado. Se diferencian sobre todo en el pico: grueso para romper semillas, fino para los insectos, e incluso uno usa una espina de cactus como herramienta. Fueron ellos los que hicieron pensar a Charles Darwin en cómo cambian las especies."],["达尔文雀","加拉帕戈斯的每个岛——从干燥的熔岩原到潮湿的高地","种子和硬坚果，用粗壮的喙嗑开","加拉帕戈斯生活着大约十三种这样的小雀，它们都来自同一个祖先——主要区别在喙：粗喙嗑种子，细喙吃昆虫，有一种甚至会用仙人掌刺当工具。正是它们让查尔斯·达尔文开始思考物种是如何变化的。"]],fregatka:[["Rabihorcado magnífico","Mares cálidos de América; en las Galápagos anida en arbustos bajos de la costa","Peces voladores y calamares que atrapa en la superficie, y lo que pueda robar a otras aves","El macho infla una enorme bolsa roja en el cuello del tamaño de un balón; tarda unos veinte minutos y la lleva días hasta que una hembra se fija en él. Sus plumas no son impermeables, así que nunca debe posarse en el mar; por eso prefiere robar a otras aves en el aire."],["丽色军舰鸟","美洲温暖的海域；在加拉帕戈斯，它在海边低矮的灌木上筑巢","从水面抓起的飞鱼和鱿鱼——还有从别的鸟那里抢来的食物","雄鸟会把喉部巨大的红色气囊鼓得像足球那么大；鼓起来要二十分钟左右，然后一连几天带着它，直到有雌鸟注意到。它的羽毛不防水，所以绝不能落在海面上——这就是它更喜欢在空中抢劫别的鸟的原因。"]],krabsally:[["Cangrejo zayapa","Rocas de lava negra justo por encima de las olas en toda la costa pacífica de América","Algas que raspa de las rocas, animales muertos y lo que trae el mar","Las crías son casi negras e invisibles sobre la lava; solo tras varias mudas se convierten en estos cangrejos rojo fuego. Limpian con cuidado las garrapatas y la piel muerta de las iguanas marinas, y las iguanas se dejan tranquilamente."],["红石蟹（莎莉轻脚蟹）","美洲整个太平洋沿岸浪花上方的黑色熔岩","从岩石上刮下的藻类、死去的动物和海浪冲上来的东西","小蟹几乎是黑色的，在熔岩上看不见；蜕几次壳后才变成火红色。它们会仔细地帮海鬣蜥挑掉身上的寄生虫和死皮——海鬣蜥也很乐意让它们挑。"]],zralokutesovy:[["Tiburón de puntas negras","Lagunas poco profundas y bordes de los arrecifes de coral de los océanos Índico y Pacífico","Peces de arrecife, pulpos, cangrejos y gambas","Las puntas de sus aletas parecen mojadas en tinta: así se le reconoce enseguida. Caza en aguas tan poco profundas que su aleta dorsal asoma sobre la superficie, pero nos tiene mucho más miedo que nosotros a él y suele alejarse nadando."],["黑鳍礁鲨","印度洋和太平洋的浅水潟湖和珊瑚礁边缘","礁鱼、章鱼、螃蟹和虾","它的鳍尖像是在墨水里蘸过一样——一眼就能认出来。它在很浅的水里捕猎，背鳍常常露出水面，但它怕人远远超过我们怕它，通常会立刻游走。"]],manta:[["Manta gigante","Océano abierto y estaciones de limpieza de arrecifes en mares cálidos de todo el mundo","Plancton, que filtra del agua","Sus aletas miden hasta siete metros de punta a punta, pero no podría hacer daño ni a un pez pequeño: no tiene dientes afilados. Dos lóbulos junto a la boca le meten el agua y sus branquias peinan el plancton como un colador. Tiene el cerebro más grande de todos los peces."],["双吻前口蝠鲼（巨型蝠鲼）","全世界温暖海域的开阔大洋和珊瑚礁清洁站","浮游生物，从水中滤食","它的“翅膀”展开可达七米，却连一条小鱼都伤害不了——它没有尖牙。嘴边的两片头鳍把水引进嘴里，鳃耙像筛面粉一样把浮游生物筛出来。它的大脑是所有鱼类中最大的。"]],korytnackazelena:[["Tortuga verde","Praderas marinas cálidas y poco profundas y arrecifes de coral de todos los océanos","Es la única tortuga marina que de adulta come casi solo pastos marinos y algas","No se llama verde por su caparazón sino por la grasa de debajo: los pastos marinos la tiñen de verde. La hembra vuelve toda su vida a poner los huevos en la misma playa donde nació, aunque tenga que nadar miles de kilómetros."],["绿海龟","各大洋温暖的海草浅滩和珊瑚礁","它是唯一成年后几乎只吃海草和藻类的海龟","它叫“绿海龟”不是因为壳是绿的，而是因为壳下的脂肪——海草把脂肪染成了绿色。雌龟一辈子都会回到自己出生的那片海滩产卵，哪怕要游几千公里。"]],murena:[["Morena gigante","Agujeros y grietas de los arrecifes de coral de los océanos Índico y Pacífico","Peces y pulpos, que caza sobre todo de noche","Abre y cierra la boca sin parar: no es una amenaza, así hace pasar el agua por las branquias, porque no tiene bomba. Y tiene dos pares de mandíbulas: el segundo, escondido en la garganta, sale disparado, atrapa la presa y la arrastra hacia dentro."],["爪哇裸胸鳝（巨海鳝）","印度洋和太平洋珊瑚礁的洞穴和缝隙","鱼和章鱼，大多在夜间捕猎","它的嘴总是一张一合——这不是威胁，而是在让水流过鳃，因为它没有“水泵”。它还有两副颌骨：第二副藏在喉咙里，会猛地向前伸出，抓住猎物拖进去。"]],klaun:[["Pez payaso","Dentro de anémonas en arrecifes poco profundos del sudeste asiático y el norte de Australia","Plancton, crustáceos diminutos y algas, además de las sobras de la anémona","Las células urticantes de la anémona aturden a cualquier pez, pero no al pez payaso, que está cubierto de una mucosidad que la anémona ignora. A cambio, ahuyenta a los enemigos de la anémona y la mantiene limpia. Todos los peces payaso nacen machos, y cuando muere la hembra, el macho más fuerte se convierte en hembra."],["眼斑双锯鱼（小丑鱼）","东南亚和澳大利亚北部浅礁上的海葵里","浮游生物、小甲壳动物和藻类，还有海葵吃剩的东西","海葵的刺细胞能麻痹任何鱼——但小丑鱼不怕，因为它身上有一层海葵不理会的黏液。作为回报，它赶走海葵的敌人，还帮海葵保持清洁。所有小丑鱼生下来都是雄的，雌鱼死后，最强壮的雄鱼会变成雌鱼。"]],papagajorybka:[["Pez loro","Arrecifes de coral de los océanos Índico y Pacífico","Algas y coral muerto, que raspa de la roca con su pico","Sus dientes están unidos en un pico como el de un loro, y otros dientes en la garganta muelen el coral hasta hacerlo polvo. Ese polvo sale como arena blanca: un solo pez puede producir cien kilos al año, así que una playa tropical es en gran parte lo que dejan los peces loro. De noche se envuelve en una bolsa de moco transparente que esconde su olor a las morenas."],["鹦嘴鱼","印度洋和太平洋的珊瑚礁","用喙从岩石上直接刮下的藻类和死珊瑚","它的牙齿长在一起，像鹦鹉的喙，喉咙里还有牙齿把珊瑚磨成粉。这些粉排出来就是白沙——一条鱼一年能产一百公斤，所以热带海滩很大一部分是鹦嘴鱼留下的。夜里它会用一个透明的黏液袋把自己包起来，让海鳝闻不到它的气味。"]],barakuda:[["Barracuda","Bordes de arrecifes y aguas abiertas de mares cálidos; las crías viven en los manglares","Otros peces: espera inmóvil y ataca por sorpresa","Flota en el agua como un tronco plateado y de repente sale disparada a más de cuarenta kilómetros por hora. Su mandíbula inferior sobresale y su boca tiene dos clases de dientes: colmillos grandes para clavar y otros pequeños para que la presa no se escape."],["大鳞魣（大梭鱼）","温暖海域的礁石边缘和开阔水域；幼鱼生活在红树林中","其他鱼——一动不动地等待，然后突然袭击","它像一根银色的木头悬在水中，然后突然以每小时四十多公里的速度冲出去。它的下颌向前突出，嘴里有两种牙齿：大尖牙用来刺穿，小牙让猎物滑不掉。"]],chobotnica:[["Pulpo común","Fondos rocosos y arrecifes de mares cálidos; de día se esconde en las grietas","Cangrejos, almejas y langostas; abre las conchas duras o las perfora","Tiene tres corazones, sangre azul y células en la piel que cambian su color y su dibujo en tres décimas de segundo, aunque no distingue los colores. Dos tercios de sus neuronas están en los brazos, así que cada brazo palpa y decide por su cuenta."],["真蛸（普通章鱼）","温暖海域的岩石海底和珊瑚礁；白天藏在缝隙里","螃蟹、蛤蜊和龙虾；能撬开或钻透坚硬的外壳","它有三颗心脏、蓝色的血，皮肤里的细胞能在十分之三秒内改变颜色和花纹——可它自己却是色盲。它三分之二的神经细胞长在腕足里，所以每条腕足都能自己摸索、自己做决定。"]],morskykonik:[["Caballito de mar amarillo","Bahías poco profundas, praderas marinas y arrecifes de los océanos Índico y Pacífico","Crustáceos diminutos que aspira con su largo hocico en forma de tubo","Es de verdad un pez, aunque nade en vertical y se agarre a un tallo con la cola como con una mano. Es el padre quien lleva a las crías: la hembra deja los huevos en la bolsa de su vientre, él los lleva durante semanas y luego suelta cientos de caballitos diminutos. Como no tiene estómago, tiene que comer casi sin parar."],["黄海马","印度洋和太平洋的浅水海湾、海草床和珊瑚礁","用管子一样的长嘴吸进的小甲壳动物","它真的是一种鱼，虽然它竖着游泳，还像用手一样用尾巴抓住草茎。是海马爸爸怀孩子：雌海马把卵放进雄海马的育儿袋，他带着卵好几周，然后放出几百只小海马。它没有胃，所以几乎要不停地吃东西。"]],rejnok:[["Raya de puntos azules","Fondos de arena junto a los arrecifes de coral del océano Índico y el mar Rojo","Gusanos, cangrejos y gambas que saca de la arena con chorros de agua","Sus manchas azul eléctrico brillan incluso con poca luz: son lucecitas de aviso que dicen «déjame en paz». Su cola fina lleva dos espinas venenosas, pero nunca ataca con ellas; solo las usa si alguien la pisa. Encuentra las presas enterradas en la arena notando los débiles campos eléctricos de los cuerpos vivos."],["蓝斑条尾魟","印度洋和红海珊瑚礁旁的沙质海底","用水流从沙子里冲出来的虫子、螃蟹和虾","它电光蓝的斑点在昏暗的光线下也很显眼——像警示灯一样说“别惹我”。它细细的尾巴上有两根毒刺，但从不主动攻击，只有被人踩到时才会用。它靠感知生物身体发出的微弱电场，找到埋在沙里的猎物。"]],delfin:[["Delfín mular","Mares cálidos y templados de todo el mundo, desde las bahías hasta el océano abierto","Peces y calamares; caza en grupo empujando al banco de peces","No respira por la boca sino por un orificio en lo alto de la cabeza, y cada respiración es una decisión consciente; por eso al dormir apaga solo medio cerebro y deja un ojo abierto. Bajo el agua «ve» con el sonido: emite chasquidos y lee el eco para distinguir una roca de un pez. Y cada delfín tiene su propio silbido: un nombre con el que los demás lo llaman."],["宽吻海豚","全世界温暖和温和的海域，从沿岸海湾到开阔大洋","鱼和鱿鱼；它们成群捕猎，把鱼群赶到一起","它不用嘴呼吸，而是用头顶的气孔，而且每次呼吸都要有意识地进行——所以睡觉时它只让半个大脑休息，还睁着一只眼睛。在水下它用声音“看”东西：发出咔嗒声，听回声来分辨岩石和鱼。每只海豚都有自己独特的口哨声——就像名字一样，同伴用它来呼唤它。"]],pavian:[["Babuino oliva","Sabana, bosques abiertos y laderas rocosas del centro y el este de África","Omnívoro: hierba, raíces, fruta, insectos y alguna cría de antílope","Viven en grupos de cincuenta a cien y siguen un orden estricto de rango: el de rango más alto se sienta donde quiere. Se saludan chasqueando los labios, y un macho joven que teme una pelea agarra la cría de otro y la sujeta como escudo vivo."],["东非狒狒（橄榄狒狒）","非洲中部和东部的草原、稀疏林地和多岩山坡","杂食——草、根、果实、昆虫，偶尔也吃小羚羊","它们五十到一百只一群，等级森严——地位高的想坐哪儿就坐哪儿。它们咂嘴打招呼；年轻雄狒狒怕打架时，会抓起别人的孩子抱着当“活盾牌”。"]],medojed:[["Ratel (tejón de la miel)","Sabana, semidesierto y bosques abiertos de África, Arabia y el sur de Asia","Casi de todo: roedores, serpientes, miel y larvas de abeja, raíces y huevos","No le tiene miedo a nadie: se enfrenta a un león o a un búfalo y simplemente se niega a retroceder. Su piel es tan suelta y gruesa que cuando algo lo agarra, se gira dentro de su propia piel y muerde. Incluso sobrevive a la mordedura de una cobra: se desmaya unas horas, luego se despierta y termina de comerse la serpiente."],["蜜獾","非洲、阿拉伯半岛和南亚的草原、半沙漠和稀疏林地","几乎什么都吃——啮齿动物、蛇、蜂蜜和蜂蛹、根和蛋","它谁都不怕：敢和狮子、水牛对峙，就是不肯后退。它的皮又松又厚，被咬住时能在自己的皮里转过身来反咬一口。它甚至能扛住眼镜蛇的毒：昏倒几个小时，醒来后接着把蛇吃完。"]],oryx:[["Órix beisa","Sabana seca de espinos y semidesierto del norte de Kenia, Etiopía y Somalia","Hierbas duras, hojas, tubérculos y melones silvestres de los que bebe","Puede pasar semanas sin una gota de agua; la saca de las plantas. Con el peor calor deja que su cuerpo se caliente hasta cuarenta y cinco grados para no gastar agua sudando, mientras una red especial de vasos sanguíneos en la cabeza mantiene el cerebro fresco."],["东非剑羚","肯尼亚北部、埃塞俄比亚和索马里干燥的荆棘草原和半沙漠","粗硬的草、树叶、块茎，还从野瓜里喝水","它能几个星期一滴水都不喝，从植物中获取水分。最热的时候，它宁愿让体温升到四十五度，也不愿出汗浪费水分，而头部一张特殊的血管网能让大脑保持凉爽。"]],kudu:[["Gran kudú","Matorral denso y espinoso del este y el sur de África","Hojas, brotes y vainas; apenas toca la hierba","Los cuernos del macho miden hasta metro y medio y dan dos vueltas y media: son los cuernos más largos de todos los antílopes. Parece pesado, pero salta una valla de dos metros y medio casi desde parado."],["大扭角林羚","非洲东部和南部茂密的灌木丛和荆棘丛","树叶、嫩芽和豆荚——几乎不吃草","公羚的角长达一米半，扭了两圈半——是所有羚羊中最长的角。它看起来很笨重，却几乎能原地跳过两米半高的围栏。"]],mangusta:[["Mangosta enana","Sabana y bosque seco del este y el sur de África, siempre cerca de los termiteros","Escarabajos, termitas, arañas, escorpiones, lagartos y huevos","Es el carnívoro más pequeño de África: pesa como una manzana grande. La hembra más vieja dirige el grupo, y tienen un trato con los cálaos: las mangostas encuentran insectos mientras las aves vigilan el cielo, y por la mañana los cálaos incluso esperan junto al termitero a que las mangostas se levanten."],["侏獴","非洲东部和南部的草原和干燥林地，总在白蚁丘附近","甲虫、白蚁、蜘蛛、蝎子、蜥蜴和蛋","它是非洲最小的食肉动物——只有一个大苹果那么重。群体由最年长的雌獴带领。它们和犀鸟有约定：侏獴找虫子，犀鸟盯着天空，早上犀鸟甚至会在白蚁丘旁等侏獴起床。"]],dikdik:[["Dik-dik de Kirk","Matorral seco y espinoso del este de África","Hojas, brotes y fruta; apenas come hierba y no necesita beber","Mide cuarenta centímetros a la cruz: llega a la rodilla de un adulto. Marca su territorio con una sustancia negra y pegajosa de una glándula delante del ojo, como si llorara y dejara las lágrimas en las ramitas. Las parejas permanecen juntas toda la vida."],["柯氏犬羚","东非干燥的灌木丛和荆棘丛","树叶、嫩芽和果实——几乎不吃草，完全不用喝水","它肩高只有四十厘米，才到大人的膝盖。它用眼睛前面腺体分泌的黑色黏液标记领地——就像在哭，把眼泪留在树枝上。夫妻终生相伴。"]],eland:[["Eland común","Sabana, matorral abierto y praderas de montaña del este y el sur de África","Hojas, vainas y hierba; también come de noche","Es el antílope más grande del mundo: un macho viejo pesa casi una tonelada y aun así salta un obstáculo de dos metros. Sus rodillas delanteras chasquean al andar: cuanto más grave el chasquido, más grande el macho; los rivales lo oyen a cien metros y así no necesitan pelear."],["大羚羊（伊兰羚羊）","非洲东部和南部的草原、开阔灌丛和山地草原","树叶、豆荚和草——夜里也吃","它是世界上最大的羚羊：一头老公羚将近一吨重，却还能跳过两米高的障碍。它走路时前膝会发出响亮的咔嗒声——声音越低沉，公羚越大，对手在一百米外就能听到，所以根本不用打架。"]],karakal:[["Caracal","Sabana, semidesierto y matorral seco de África y el suroeste de Asia","Liebres, roedores, aves y antílopes jóvenes","Salta tres metros hacia arriba y derriba un pájaro en el aire de un zarpazo, a veces dos a la vez. Su nombre viene del turco: «karakulak» significa «oreja negra», y esos largos pinceles negros le ayudan a localizar los sonidos."],["狞猫","非洲和亚洲西南部的草原、半沙漠和干燥灌丛","野兔、啮齿动物、鸟和小羚羊","它能直直地跳起三米高，用爪子把空中的鸟拍下来——有时一次两只。它的名字来自土耳其语：“karakulak”意思是“黑耳朵”，那长长的黑色耳簇帮它准确判断声音的方向。"]],pelikan:[["Pelícano común","Lagos poco profundos y humedales de África, el sureste de Europa y Asia","Peces: hasta dos kilos al día","La bolsa de debajo del pico cabe más de diez litros de agua, más que un cubo. Pesca en equipo: los pelícanos forman una herradura, golpean el agua con las alas para empujar a los peces hacia la orilla y los recogen todos a la vez."],["白鹈鹕","非洲、欧洲东南部和亚洲的浅湖和湿地","鱼——每天多达两公斤","它嘴下的喉囊能装十多升水，比一桶还多。它们合作捕鱼：鹈鹕围成马蹄形，用翅膀拍打水面，把鱼赶到浅水里，然后一起舀起来。"]],ibisposvatny:[["Ibis sagrado","Humedales, orillas de lagos y praderas inundadas del África subsahariana","Insectos, ranas, crustáceos y moluscos; caza a ciegas, tanteando en el barro","Los antiguos egipcios lo adoraban como Thot, dios de la sabiduría, y lo momificaron por millones: solo en unas catacumbas egipcias había unos cuatro millones. Sin embargo, hoy ya no vive en libertad en Egipto."],["埃及圣鹮","撒哈拉以南非洲的湿地、湖岸和被淹没的草地","昆虫、青蛙、甲壳动物和软体动物——它在泥里靠触觉盲捕","古埃及人把它奉为智慧之神托特，制作了数以百万计的圣鹮木乃伊——仅一处埃及地下墓穴就有大约四百万只。可如今，埃及已经没有野生的圣鹮了。"]],gaur:[["Gaur","Bosques de colinas de la India y el sudeste asiático","Hierba, bambú, hojas y corteza","Es el bóvido salvaje más grande de la Tierra: un macho viejo pesa hasta una tonelada y mide más de dos metros a la cruz. Tiene las patas blancas como si llevara calcetines, así que se le ve incluso al anochecer."],["印度野牛","印度和东南亚的丘陵森林","草、竹子、树叶和树皮","它是地球上最大的野牛——一头老公牛重达一吨，肩高超过两米。它的腿是白色的，像穿着长袜，所以黄昏时也能认出它。"]],sambar:[["Sambar","Bosques de la India, Nepal y el sudeste asiático","Hierba, hojas, fruta y plantas acuáticas","Cuando ve un tigre lanza un bramido grave y patea el suelo; los guías usan ese sonido para saber que el felino está cerca. Se revuelca en barro que al secarse forma una costra contra los insectos."],["水鹿","印度、尼泊尔和东南亚的森林","草、树叶、果实和水生植物","发现老虎时，它会发出低沉的叫声并跺脚——向导就靠这个声音知道老虎在附近。它在泥里打滚，泥干后形成一层防虫的硬壳。"]],diviakindicky:[["Jabalí indio","Bosques, matorrales y tierras de cultivo de toda la India","Raíces, tubérculos, fruta, insectos y carroña","Su hocico huele la comida medio metro bajo tierra y la desentierra. Los jabatos tienen rayas como un melón para desaparecer entre la hierba."],["印度野猪","印度各地的森林、灌木丛和农田","根、块茎、果实、昆虫和腐肉","它的鼻子能闻到地下半米的食物，并把它拱出来。小野猪身上有像西瓜一样的条纹，在草丛里就消失不见了。"]],krokodilbahenny:[["Cocodrilo de las marismas","Lagos, ríos y embalses de la India, Nepal y Sri Lanka","Peces, tortugas, aves y ciervos que vienen a beber","Tiene el hocico más ancho de todos los cocodrilos. Con el peor calor excava una madriguera de varios metros en la orilla y espera allí hasta que el lago se vuelve a llenar."],["泽鳄","印度、尼泊尔和斯里兰卡的湖泊、河流和水库","鱼、乌龟、鸟和来喝水的鹿","它的吻部是所有鳄鱼中最宽的。最热的时候，它在岸边挖一个好几米深的洞，在里面等湖水重新涨满。"]],nilgai:[["Nilgó","Bosques secos, matorrales y tierras de cultivo del norte de la India","Hierba, hojas, brotes y fruta","Es el antílope más grande de Asia. El macho es gris azulado y tiene cuernos; la hembra es leonada y sin cuernos: parecen dos especies distintas. Su nombre significa «vaca azul», y por eso nadie lo caza en la India."],["蓝牛羚","印度北部的干燥森林、灌木丛和农田","草、树叶、嫩芽和果实","它是亚洲最大的羚羊。雄性是蓝灰色、有角，雌性是黄褐色、没有角——看起来像两个不同的物种。它的名字意思是“蓝色的牛”，所以在印度没人猎杀它。"]],binturong:[["Binturong","Copas de la selva de Borneo y el sudeste asiático","Fruta, sobre todo higos silvestres, y a veces huevos de aves","Huele a palomitas con mantequilla: su orina contiene de verdad la misma sustancia olorosa que las palomitas. Su cola funciona como una quinta pata y puede colgarse de ella."],["熊狸","婆罗洲和东南亚雨林的树冠","果实，尤其是野生无花果，有时也吃鸟蛋","它闻起来像黄油爆米花——它的尿里真的含有和爆米花一样的气味物质。它的尾巴像第五条腿，能用来倒挂。"]],kalon:[["Zorro volador gigante","Bosques y manglares de Borneo, Sumatra y Malasia","Higos, mangos, néctar y capullos de flores","Es el murciélago más grande del mundo: sus alas miden hasta metro y medio. No tiene sonar; encuentra los higos con sus grandes ojos y su nariz, y de día cuelga cabeza abajo en colonias de miles."],["马来大狐蝠","婆罗洲、苏门答腊和马来西亚的森林和红树林","无花果、芒果、花蜜和花蕾","它是世界上最大的蝙蝠——翼展可达一米半。它没有回声定位，靠大眼睛和鼻子找无花果；白天成千上万只倒挂在一起。"]],cibetka:[["Civeta de las palmeras","Selva, plantaciones e incluso tejados de pueblos del sudeste asiático","Fruta, frutos de palmera, insectos y pequeños animales","Come cerezas de café y los granos pasan enteros por su cuerpo: así se hace el café más caro del mundo. De día duerme enroscada en los árboles y de noche la delatan sus ojos brillantes."],["椰子狸（棕榈果子狸）","东南亚的雨林、种植园甚至村庄屋顶","果实、棕榈果、昆虫和小动物","它吃咖啡果，咖啡豆会完整地从它体内排出——世界上最贵的咖啡就是这样做出来的。它白天蜷在树冠上睡觉，夜里发光的眼睛会暴露它。"]],tarsier:[["Tarsero de Borneo","Sotobosque de la selva de Borneo y Sumatra","Solo carne: insectos, pequeños lagartos y aves","Cada ojo es más grande que su cerebro y no puede moverse en la órbita, así que gira la cabeza casi del todo. Es el único primate que no come ninguna planta."],["西部眼镜猴","婆罗洲和苏门答腊的雨林林下","只吃肉——昆虫、小蜥蜴和鸟","它每只眼球都比自己的大脑还大，而且在眼眶里不能转动，所以它的头几乎能转一整圈。它是唯一完全不吃植物的灵长类。"]],varanzeleny:[["Varano esmeralda","Copas de la selva de Nueva Guinea y de islas cercanas de Indonesia","Insectos, sobre todo insectos palo, además de saltamontes y cangrejos","Es el único varano que se agarra a las ramas con la cola como un mono; la cola es más larga que todo el resto del cuerpo. A diferencia de otros varanos, vive en pequeños grupos."],["绿树巨蜥","新几内亚和附近印度尼西亚岛屿的雨林树冠","昆虫——尤其是竹节虫，还有蚱蜢和螃蟹","它是唯一能像猴子一样用尾巴缠住树枝的巨蜥——尾巴比身体其余部分加起来还长。和别的巨蜥不同，它们过小群生活。"]],nosal:[["Coatí de nariz blanca","Bosques desde el suroeste de Estados Unidos, pasando por Costa Rica, hasta Colombia","Insectos, arañas, lagartos y fruta que saca de la hojarasca con el hocico","Su hocico es tan móvil que gira en todas direcciones como una pequeña trompa y huele un escarabajo bajo la corteza. Hembras y crías viajan en bandas ruidosas con la cola levantada como una bandera para que nadie se pierda en la maleza."],["白鼻浣熊","从美国西南部经哥斯达黎加到哥伦比亚的森林","昆虫、蜘蛛、蜥蜴和果实，用鼻子从落叶里拱出来","它的鼻子非常灵活，能像小象鼻一样四处转动，还能闻到树皮下的甲虫。雌兽和幼崽成群结队、吵吵闹闹地走，尾巴像旗子一样竖得笔直，谁也不会在灌木丛里走丢。"]],kinkaju:[["Kinkajú","Copas de la selva desde México hasta Brasil; casi nunca baja","Fruta madura, néctar y miel, que alcanza con una lengua de doce centímetros","Es pariente del mapache, pero tiene una cola prensil como un mono: se cuelga de ella cabeza abajo y coge fruta con las dos manos. Al beber néctar poliniza las flores, así que también cuida del bosque."],["蜜熊","从墨西哥到巴西的雨林树冠——它几乎从不下地","熟透的果实、花蜜和蜂蜜，用十二厘米长的舌头够到","它是浣熊的亲戚，却像猴子一样有能缠绕的尾巴——它用尾巴倒挂着，用两只手摘果子。喝花蜜时它还帮花传粉，所以它也在照料森林。"]],bazilisok:[["Basilisco verde","Arbustos y ramas sobre arroyos y ríos de la selva centroamericana","Insectos, pequeños lagartos, flores y fruta","Cuando se asusta, se levanta sobre las patas traseras y corre POR ENCIMA DEL AGUA: unas escamas en los dedos se abren y lo sostienen hasta veinte metros. Por eso lo llaman lagarto Jesucristo. Solo los machos tienen las altas crestas en la cabeza y la espalda."],["双冠蜥（绿双冠蜥）","中美洲森林里溪流和河流上方的灌木和树枝","昆虫、小蜥蜴、花和果实","受到惊吓时，它会用后腿站起来，从水面上飞奔过去——脚趾上的皮瓣展开，能托着它跑二十米远。所以人们叫它“耶稣蜥蜴”。只有雄性头上和背上有高高的冠。"]],pekaribiely:[["Pecarí labiado","Selva continua desde México hasta Argentina; necesita grandes territorios sin perturbar","Fruta caída, nueces y raíces; rompe incluso las duras nueces de palma","Se mueve en manadas de cien a trescientos que recorren el bosque como un río vivo; se les oye a cien metros por el castañeteo de sus dientes. Si se sienten amenazados, toda la manada se gira hacia el atacante, e incluso el jaguar retrocede."],["白唇西猯","从墨西哥到阿根廷连绵的雨林——它需要大片不受打扰的土地","掉落的果实、坚果和根；连坚硬的棕榈果也能咬碎","它们一百到三百只结成大群，像一条活的河流穿过森林，一百米外就能听到牙齿咔咔作响。遇到威胁时，整群一起转身面对敌人——连美洲豹都会退缩。"]],motylmodry:[["Morfo azul","Sotobosque y senderos de la selva desde México hasta Colombia","Jugo de fruta caída demasiado madura, no néctar de flores","Ese azul no es un pigmento: las alas tienen escamas transparentes que descomponen la luz como una pompa de jabón, así que el color cambia según el ángulo. Por debajo la mariposa es marrón con ocelos, así que con cada aleteo destella azul y vuelve a desaparecer."],["大蓝闪蝶","从墨西哥到哥伦比亚雨林的林下和林间小路","熟过头的落果汁液，而不是花蜜","那种蓝色不是色素——翅膀上透明的鳞片像肥皂泡一样把光分开，所以颜色随着角度变化。蝴蝶翅膀背面是棕色的，还有眼斑，所以每扇一下翅膀，它就闪一下蓝光，然后又消失了。"]],pekari:[["Pecarí de collar","Desde el suroeste de Estados Unidos hasta Argentina: matorrales, bosque seco y bordes de humedales","Raíces, fruta, cactus y tubérculos que desentierra con el hocico","Parece un cerdo, pero no lo es: solo tiene tres dedos en las patas traseras y unos colmillos rectos hacia abajo que afila como tijeras al castañetear. Con una glándula de olor en la espalda, toda la manada se frota entre sí hasta que todos huelen igual."],["领西猯","从美国西南部到阿根廷——灌木丛、干燥森林和湿地边缘","根、果实、仙人掌和块茎，用鼻子从地里拱出来","它看起来像猪，其实不是——它后脚只有三个脚趾，獠牙笔直向下，它咔咔地磨牙，把獠牙磨得像剪刀一样锋利。它背上有一个气味腺，整群互相蹭来蹭去，直到大家气味都一样。"]],vydraobrovska:[["Nutria gigante","Ríos lentos, lagos y bosques inundados de la Amazonia y el Pantanal","Peces: hasta tres kilos al día, sobre todo bagres y pirañas","Mide casi dos metros: es el miembro más largo de la familia de las comadrejas. La mancha blanca del cuello tiene una forma distinta en cada nutria, como una huella dactilar, y así se reconocen entre ellas."],["大水獭","亚马孙和潘塔纳尔缓慢的河流、湖泊和被淹没的森林","鱼——每天多达三公斤，大多是鲶鱼和食人鱼","它身长将近两米，是鼬科中最长的动物。每只水獭喉部白斑的形状都不一样——就像指纹，它们靠这个互相认出对方。"]],hoacin:[["Hoatzín","Matorrales junto al agua en los bosques inundados del Amazonas y el Orinoco","Solo hojas, que fermenta en un buche enorme que funciona como el estómago de una vaca","El pollo tiene dos garras en cada ala: si una serpiente lo asusta, se deja caer al agua, nada y vuelve a trepar a la rama con esas garras. Tanto fermentar hace que huela mal, así que la gente lo llama pájaro apestoso y nadie lo caza."],["麝雉","亚马孙河和奥里诺科河被淹森林里的水边灌木丛","只吃树叶——在一个像牛胃一样的巨大嗉囊里发酵","雏鸟每只翅膀上有两个爪子：如果被蛇吓到，它就掉进水里游走，然后用这些爪子爬回树枝。发酵让它浑身发臭，当地人叫它“臭鸟”，谁也不猎它。"]],jaguarundi:[["Yaguarundí","Matorrales, orillas de ríos y bordes de bosque desde México hasta Argentina","Roedores, lagartos y aves que caza en el suelo de día","Un felino con forma de comadreja: cuerpo largo y bajo, patas cortas, cabeza pequeña y plana y una cola más larga que la mitad del cuerpo. Es el único felino americano que caza sobre todo de día, y su pariente más cercano es el puma."],["细腰猫","从墨西哥到阿根廷的灌木丛、河岸和森林边缘","白天在地面捕食的啮齿动物、蜥蜴和鸟","一种长得像黄鼠狼的猫：身体又长又低，腿短，头小而扁，尾巴比半个身子还长。它是美洲唯一主要在白天捕猎的猫，它最近的亲戚是美洲狮。"]],aguti:[["Agutí centroamericano","Selva y bordes del bosque desde el sur de México hasta el norte de Argentina","Fruta caída y nueces; lo que sobra lo entierra en escondites repartidos","Sus dientes son tan fuertes que rompen una nuez de Brasil, que casi nadie más puede abrir. Luego olvida algunos de sus escondites, y de ellos nacen árboles nuevos: el agutí planta el bosque sin darse cuenta."],["中美刺豚鼠","从墨西哥南部到阿根廷北部的雨林和森林边缘","掉落的果实和坚果；吃不完的就分散埋起来","它的牙齿非常有力，能咬开几乎没有别的动物能打开的巴西坚果。然后它会忘掉一些埋起来的储藏——那些就长成了新树，刺豚鼠就这样悄悄地种出了森林。"]],bonobo:[["Bonobo","Solo los bosques de llanura al sur del río Congo: en ningún otro lugar de la Tierra","Fruta, tallos, hongos y a veces algún insecto o mamífero pequeño","Hace millones de años el río Congo lo separó de los chimpancés y desde entonces sigue su propio camino. Una hembra vieja dirige el grupo, y las peleas se resuelven con abrazos y acicalamiento en vez de luchando. Es famoso por la raya en medio que divide el pelo de su cabeza."],["倭黑猩猩","只生活在刚果河以南的低地森林——地球上别处都没有","果实、茎、真菌，偶尔吃昆虫或小型哺乳动物","几百万年前，刚果河把它和黑猩猩隔开，从此它走上了自己的路。群体由一只年长的雌性带领，吵架时用拥抱和互相梳毛来解决，而不是打架。它头顶的毛发出名地从中间整齐地分开。"]],mandril:[["Mandril","Selvas de Camerún, Gabón, Guinea Ecuatorial y Congo","Fruta, semillas, raíces e insectos que rebusca en el suelo del bosque","Es el mamífero más colorido de la Tierra: un macho adulto tiene las mejillas azules con surcos y la nariz roja brillante. Cuanto más sano y fuerte está, más vivos son los colores, así que se le reconoce de lejos en la penumbra del bosque. Los mandriles viajan en los grupos más grandes de todos los primates."],["山魈","喀麦隆、加蓬、赤道几内亚和刚果的雨林","从林地上扒出来的果实、种子、根和昆虫","它是地球上色彩最鲜艳的哺乳动物——成年雄性脸颊是蓝色、带有褶皱，鼻子鲜红。越健康强壮，颜色越鲜艳，所以在昏暗的森林里老远就能看出它的实力。山魈结成的群是所有灵长类中最大的。"]],pangolin:[["Pangolín gigante","Selva y sabana húmeda del África ecuatorial","Solo hormigas y termitas, que lame con una lengua más larga que todo su cuerpo; no tiene ningún diente","Es el único mamífero de la Tierra cubierto de escamas, hechas de queratina, lo mismo que tus uñas. Cuando se asusta se enrosca en una bola que ni un león puede abrir. Y precisamente por esas escamas el pangolín es el mamífero con el que más se trafica en el mundo."],["大穿山甲","赤道非洲的雨林和湿润草原","只吃蚂蚁和白蚁，用比整个身体还长的舌头舔食；它一颗牙齿都没有","它是地球上唯一全身覆盖鳞片的哺乳动物，鳞片由角蛋白构成——和你的指甲一样。受到惊吓时，它会蜷成一个球，连狮子都打不开。可正是这些鳞片，让穿山甲成为世界上被走私最多的哺乳动物。"]],mangabej:[["Mangabey de mejillas grises","Las copas altas de la selva de África central; casi nunca baja","Fruta y sobre todo nueces duras que otros monos no pueden romper","Los machos tienen un saco de aire en la garganta y con él lanzan un sonido tan grave que se oye a más de un kilómetro de selva densa. Así los grupos se dicen dónde están sin llegar a encontrarse nunca."],["灰颊白眉猴","非洲中部雨林的高层树冠——它几乎从不下地","果实，尤其是别的猴子咬不开的硬坚果","雄猴喉咙里有一个气囊，能发出非常低沉的叫声，在茂密的森林里传出一公里多远。各个群体就这样互相告知自己的位置，却从不见面。"]],genetka:[["Gineta tigre","Bosques y matorrales de gran parte del África subsahariana, sobre todo en las ramas","Roedores, aves, insectos y fruta que caza de noche por las ramas","No es un gato, aunque lo parezca: es pariente de las civetas y las mangostas. Su cuerpo es tan delgado que pasa por cualquier sitio por donde quepa su cabeza, y su cola, con unos diez anillos negros, es más larga que el propio animal."],["红斑獛（锈斑獛）","撒哈拉以南非洲大部分地区的森林和灌木丛，主要在树枝上","夜里沿着树枝捕食的啮齿动物、鸟、昆虫和果实","它不是猫，虽然看起来很像——它和灵猫、獴是亲戚。它的身体非常细长，头能钻过的地方身体都能钻过去；尾巴上有大约十道黑环，比它的身体还长。"]],lednymedved:[["Oso polar","Hielo marino del Ártico: alrededor del Polo Norte, en Canadá, Groenlandia, Svalbard y Rusia. ¡No vive en la Antártida!","Sobre todo focas, que acecha junto a los agujeros para respirar del hielo; a veces morsas o ballenas muertas","Su pelo no es blanco: es transparente y hueco, y la piel de debajo es negra para captar el sol. Es el carnívoro terrestre más grande del mundo y un nadador excelente: uno nadó más de 600 kilómetros sin descansar."],["北极熊","北极的海冰——北极点周围、加拿大、格陵兰、斯瓦尔巴和俄罗斯。它不生活在南极洲！","主要是海豹，在冰上的呼吸孔旁伏击；有时也吃海象或鲸鱼的尸体","它的毛其实不是白色的——毛是透明的、空心的，下面的皮肤是黑色的，用来吸收阳光。它是地球上最大的陆地食肉动物，也是游泳高手：有一只曾不休息地游了600多公里。"]],liskapolarna:[["Zorro ártico","Tundra y hielo marino de todo el Ártico, desde Alaska y Groenlandia hasta Siberia","Lemmings y otros roedores, huevos de aves; en invierno sigue al oso polar para comer las sobras de las focas","Aguanta hasta cincuenta grados bajo cero. En invierno es blanco como la nieve y en verano gris pardo. Oye un lemming bajo la nieve y salta de cabeza dentro del ventisquero para atraparlo."],["北极狐","整个北极地区的苔原和海冰——从阿拉斯加经格陵兰到西伯利亚","旅鼠和其他啮齿动物、鸟蛋；冬天跟着北极熊吃剩下的海豹肉","它能忍受零下50摄氏度的严寒。冬天它雪白，夏天灰褐色。它能听到雪下的旅鼠，然后头朝下扎进雪堆把它抓住。"]],vlkpolarny:[["Lobo ártico","Las islas del Ártico canadiense y el norte de Groenlandia, donde el invierno trae unos cuatro meses de oscuridad","Bueyes almizcleros y liebres árticas; la manada caza en equipo","Conoce tan poco a las personas que muchas veces no les tiene ningún miedo. La manada aúlla tan fuerte que se oye a diez kilómetros, y cada lobo usa un tono distinto para que parezcan más."],["北极狼","加拿大北极群岛和格陵兰北部——冬天那里大约有四个月见不到太阳","麝牛和北极兔；狼群一起捕猎","它们很少见到人，所以常常一点也不怕人。狼群的嚎叫十公里外都能听到——每只狼唱不同的音调，让狼群听起来更大。"]],hranostaj:[["Armiño","Tundra y bosques del norte, desde el Ártico hasta Eslovaquia, incluidos los Tatras","Lemmings, topillos e incluso liebres mucho más grandes que él","En invierno se vuelve totalmente blanco, salvo la punta negra de la cola: un ave rapaz ataca ese punto negro y el armiño se escapa. Antiguamente los reyes llevaban mantos hechos con su piel de invierno."],["白鼬","苔原和北方森林——从北极一直到斯洛伐克，包括塔特拉山","旅鼠、田鼠，甚至比自己大得多的野兔","冬天它全身变白，只有尾巴尖还是黑的——猛禽会去扑那个黑点，白鼬就趁机逃走。从前国王们穿的披风就是用它冬天的皮毛做的。"]],sovasnezna:[["Búho nival","Tundra ártica; en invierno viaja al sur, a veces hasta Eslovaquia","Lemmings, hasta 1600 al año; también liebres y aves","A diferencia de la mayoría de los búhos, también caza de día, porque en el verano ártico el sol nunca se pone. Los machos son casi totalmente blancos y las hembras tienen más manchas negras."],["雪鸮","北极苔原；冬天往南迁徙——有时一直飞到斯洛伐克","旅鼠——一年多达1600只；也吃野兔和鸟","和大多数猫头鹰不同，它白天也捕猎，因为北极的夏天太阳根本不落山。雄鸟几乎全身雪白，雌鸟身上的黑斑更多。"]],tulengronsky:[["Foca arpa","Atlántico Norte y océano Ártico: Canadá, Groenlandia, mar de Barents","Peces y pequeños crustáceos","La cría nace sobre el hielo con un pelo blanco y esponjoso. En doce días bebe tanta leche que triplica su peso. Los adultos tienen en la espalda una mancha oscura en forma de arpa."],["竖琴海豹","北大西洋和北冰洋——加拿大、格陵兰、巴伦支海","鱼和小型甲壳动物","小海豹出生在冰上，长着蓬松雪白的毛——叫“白衣”。十二天里它喝下大量乳汁，体重增加到原来的三倍。成年海豹背上有一块像竖琴形状的深色斑纹。"]],uskatec:[["Lobo marino antártico","Islas alrededor de la Antártida, sobre todo Georgia del Sur","Kril, peces y calamares","Se distingue de una foca por sus orejas pequeñas y porque se pone de pie sobre las aletas delanteras y corre. Los cazadores casi lo exterminaron por su piel; hoy vuelve a haber más de dos millones."],["南极毛皮海狮","南极洲周围的岛屿——最多的是南乔治亚岛","磷虾、鱼和鱿鱼","它和海豹的区别是：它有小耳朵，还能用前鳍撑起身体奔跑。从前猎人为了毛皮几乎把它杀光；如今又有两百多万只了。"]],mroz:[["Morsa","Mares costeros poco profundos del Ártico: mar de Bering, Groenlandia, Svalbard","Almejas del fondo del mar, que encuentra con unos 450 bigotes sensibles y sorbe de la concha","Sus colmillos crecen toda la vida y pueden medir un metro. Los usa para subirse al hielo: su nombre científico (del griego) significa «el que camina con los dientes». Un macho puede pesar 1,5 toneladas."],["海象","北极的浅海沿岸——白令海、格陵兰、斯瓦尔巴","海底的蛤蜊——它用大约450根灵敏的胡须找到它们，再把肉从壳里吸出来","它的长牙一辈子都在长，可以长到一米。它用长牙把自己撑上冰面——它的学名（来自希腊语）意思是“用牙走路的动物”。一头雄海象能重达1.5吨。"]],tucniakcis:[["Pingüino emperador","Hielo marino alrededor de la Antártida. Los pingüinos viven en el hemisferio sur (salvo el de Galápagos): ¡ninguno en el Ártico!","Peces, kril y calamares; bucea hasta 500 metros","Durante más de dos meses el macho mantiene el huevo caliente sobre sus patas bajo un pliegue de piel, a oscuras y a cuarenta grados bajo cero. En total pasa casi cuatro meses sin comer. Los pingüinos se apiñan en un grupo enorme y se van turnando poco a poco para que nadie se congele en el borde."],["帝企鹅","南极洲周围的海冰。企鹅生活在南半球（加拉帕戈斯企鹅除外）——北极一只也没有！","鱼、磷虾和鱿鱼；能潜到500米深","雄企鹅要在零下40摄氏度的黑暗中，把蛋放在脚上、盖在肚皮的褶皱下，孵两个多月。算起来它将近四个月不吃东西。企鹅们挤成一大群，慢慢轮换位置，谁也不会在边缘被冻僵。"]],kosatka:[["Orca","Todos los océanos del mundo, del Ártico a la Antártida, sobre todo en mares fríos","Peces, focas, pingüinos e incluso ballenas: cada grupo tiene su presa favorita","Es el delfín más grande, y los delfines son cetáceos con dientes. Las orcas viven en familias dirigidas por la hembra más vieja, y cada familia tiene su propio «dialecto» de silbidos. La aleta dorsal de un macho puede medir 1,8 metros."],["虎鲸（逆戟鲸）","世界上所有的海洋——从北极到南极，最多在寒冷的海域","鱼、海豹、企鹅，甚至鲸鱼——每个群体都有自己最爱的猎物","它是最大的海豚——而海豚属于齿鲸。虎鲸以家族为单位生活，由最年长的雌性带领，每个家族都有自己的口哨“方言”。雄虎鲸的背鳍能长到1.8米高。"]]},STAV_PREKLAD={"Least concern":["Preocupación menor","无危"],"Near threatened":["Casi amenazado","近危"],Vulnerable:["Vulnerable","易危"],Endangered:["En peligro","濒危"],"Critically endangered":["En peligro crítico","极危"],"Data deficient":["Datos insuficientes","数据缺乏"]};function menoDruhu(e){if("sk"===LANG)return e.sk;if("en"===LANG)return e.en;const a=DRUHY_PREKLAD[e.id];return a&&a["es"===LANG?0:1][0]||e.en}function druheMeno(e){return"en"===LANG?e.sk:e.en}function faktyDruhu(e){if("sk"===LANG)return e.fsk;if("en"===LANG)return e.fen;const a="es"===LANG?0:1,o=DRUHY_PREKLAD[e.id];if(!o)return e.fen;const t=o[a],l=STAV_PREKLAD[e.fen.stat];return{live:t[1],eat:t[2],intr:t[3],stat:l?l[a]:e.fen.stat}}const eur=e=>(e||0).toLocaleString("sk-SK").replace(/ /g," ")+" €",CHARS=[{id:"adam",col:"#ffd97a",icon:"🎒",nm:()=>TX("Adamko","Adam"),role:()=>TX("Mladý objaviteľ","Young explorer"),desc:()=>TX("Učí sa rýchlejšie ako ostatní a za každý druh, ktorý fotí prvýkrát, dostane trojnásobok bodov.","Learns faster than the others and scores triple for every species photographed for the first time."),mod:{xpMul:1.25,firstMul:3}},{id:"nina",col:"#9fd8ff",icon:"🔭",nm:()=>TX("Nina","Nina"),role:()=>TX("Fotografka s ostrým okom","Sharp-eyed photographer"),desc:()=>TX("Vidí ďalej. Zvieratá zaostrí aj na veľkú vzdialenosť a obraz jej pri priblížení nemäkne.","Sees further. She can focus on distant animals and her image stays crisp at full zoom."),mod:{apMul:.55,afRange:1.6}},{id:"tomas",col:"#a8e6a0",icon:"🐾",nm:()=>TX("Tomáš","Tom"),role:()=>TX("Stopár","Tracker"),desc:()=>TX("Číta stopy. Na kompase mu svieti smer, odkiaľ prídu zvieratá, a objavujú sa častejšie.","Reads tracks. His compass shows where animals will come from, and they appear more often."),mod:{radar:!0,spawnMul:.7}},{id:"mia",col
